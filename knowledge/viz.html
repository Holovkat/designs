__OKF_DATA__ = [{"filepath":"architecture/design-standard-spec.md","content":"---\ntype: Architecture\ntitle: DESIGN.md Standard Specification\ndescription: The DESIGN.md format for describing visual identity to coding agents, with YAML tokens and markdown rationale\nresource: ./design-standard-v01/README.md\ntags: [designs, design-md, standard, tokens, yaml, frontend, identity]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# DESIGN.md Format\n\nThe DESIGN.md format is a self-contained, plain-text representation of a design system. It combines machine-readable design tokens (YAML front matter) with human-readable design rationale (markdown prose). Tokens give coding agents exact values; prose explains *why* those values exist and how to apply them.\n\n## File Structure\n\nA DESIGN.md file has two layers:\n\n1. **YAML front matter** - Machine-readable design tokens delimited by `---` fences at the top of the file.\n2. **Markdown body** - Human-readable design rationale organized into `##` sections.\n\nThe tokens are the normative values. The prose provides context for application.\n\n## Token Schema\n\n```yaml\nversion: \u003cstring>          # optional, current: \"alpha\"\nname: \u003cstring>\ndescription: \u003cstring>      # optional\ncolors:\n  \u003ctoken-name>: \u003cColor>    # \"#1A1C1E\" format (sRGB hex)\ntypography:\n  \u003ctoken-name>: \u003cTypography>  # fontFamily, fontSize, fontWeight, lineHeight, letterSpacing\nrounded:\n  \u003cscale-level>: \u003cDimension>  # number + unit (px, em, rem)\nspacing:\n  \u003cscale-level>: \u003cDimension | number>\ncomponents:\n  \u003ccomponent-name>:\n    \u003ctoken-name>: \u003cstring | token reference>\n```\n\n### Token Types\n\n| Type | Format | Example |\n|------|--------|---------|\n| Color | `#` + hex (sRGB) | `\"#1A1C1E\"` |\n| Dimension | number + unit | `48px`, `-0.02em` |\n| Token Reference | `{path.to.token}` | `{colors.primary}` |\n| Typography | object with fontFamily, fontSize, etc. | See schema above |\n\n### Component Tokens\n\nComponents map a name to sub-token properties: `backgroundColor`, `textColor`, `typography`, `rounded`, `padding`, `size`, `height`, `width`. Variants (hover, active) are expressed as separate component entries.\n\n## Section Order\n\nSections use `##` headings. They can be omitted but those present must appear in order:\n\n1. Overview (alias: Brand & Style)\n2. Colors\n3. Typography\n4. Layout (alias: Layout & Spacing)\n5. Elevation & Depth (alias: Elevation)\n6. Shapes\n7. Components\n8. Do's and Don'ts\n\n## CLI Tools\n\nThe `@google/design.md` npm package provides linting, diffing, and export:\n\n- **lint**: Validate structure, check broken refs, WCAG contrast, section order\n- **diff**: Compare two DESIGN.md files for token-level regressions\n- **export**: Convert tokens to Tailwind theme config or W3C DTCG format\n\n## Linting Rules\n\n| Rule | Severity | What it checks |\n|------|----------|----------------|\n| broken-ref | error | Token references that don't resolve |\n| missing-primary | warning | No `primary` color defined |\n| contrast-ratio | warning | Component color pairs below WCAG AA (4.5:1) |\n| orphaned-tokens | warning | Color tokens never referenced by components |\n| section-order | warning | Sections out of canonical order |\n\n## Status\n\nThe format is at version `alpha`. The spec, token schema, and CLI are under active development.\n\n## Related Concepts\n\n- [Templates Architecture](./templates-architecture.md)\n- [Design Tokens](../domain/design-tokens.md)\n- [UX Design Standards](../domain/ux-design-standards.md)\n- [OKF Standard Specification](./okf-standard-spec.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Architecture","title":"DESIGN.md Standard Specification","description":"The DESIGN.md format for describing visual identity to coding agents, with YAML tokens and markdown rationale","resource":"./design-standard-v01/README.md","tags":["designs","design-md","standard","tokens","yaml","frontend","identity"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# DESIGN.md Format\n\nThe DESIGN.md format is a self-contained, plain-text representation of a design system. It combines machine-readable design tokens (YAML front matter) with human-readable design rationale (markdown prose). Tokens give coding agents exact values; prose explains *why* those values exist and how to apply them.\n\n## File Structure\n\nA DESIGN.md file has two layers:\n\n1. **YAML front matter** - Machine-readable design tokens delimited by `---` fences at the top of the file.\n2. **Markdown body** - Human-readable design rationale organized into `##` sections.\n\nThe tokens are the normative values. The prose provides context for application.\n\n## Token Schema\n\n```yaml\nversion: \u003cstring>          # optional, current: \"alpha\"\nname: \u003cstring>\ndescription: \u003cstring>      # optional\ncolors:\n  \u003ctoken-name>: \u003cColor>    # \"#1A1C1E\" format (sRGB hex)\ntypography:\n  \u003ctoken-name>: \u003cTypography>  # fontFamily, fontSize, fontWeight, lineHeight, letterSpacing\nrounded:\n  \u003cscale-level>: \u003cDimension>  # number + unit (px, em, rem)\nspacing:\n  \u003cscale-level>: \u003cDimension | number>\ncomponents:\n  \u003ccomponent-name>:\n    \u003ctoken-name>: \u003cstring | token reference>\n```\n\n### Token Types\n\n| Type | Format | Example |\n|------|--------|---------|\n| Color | `#` + hex (sRGB) | `\"#1A1C1E\"` |\n| Dimension | number + unit | `48px`, `-0.02em` |\n| Token Reference | `{path.to.token}` | `{colors.primary}` |\n| Typography | object with fontFamily, fontSize, etc. | See schema above |\n\n### Component Tokens\n\nComponents map a name to sub-token properties: `backgroundColor`, `textColor`, `typography`, `rounded`, `padding`, `size`, `height`, `width`. Variants (hover, active) are expressed as separate component entries.\n\n## Section Order\n\nSections use `##` headings. They can be omitted but those present must appear in order:\n\n1. Overview (alias: Brand & Style)\n2. Colors\n3. Typography\n4. Layout (alias: Layout & Spacing)\n5. Elevation & Depth (alias: Elevation)\n6. Shapes\n7. Components\n8. Do's and Don'ts\n\n## CLI Tools\n\nThe `@google/design.md` npm package provides linting, diffing, and export:\n\n- **lint**: Validate structure, check broken refs, WCAG contrast, section order\n- **diff**: Compare two DESIGN.md files for token-level regressions\n- **export**: Convert tokens to Tailwind theme config or W3C DTCG format\n\n## Linting Rules\n\n| Rule | Severity | What it checks |\n|------|----------|----------------|\n| broken-ref | error | Token references that don't resolve |\n| missing-primary | warning | No `primary` color defined |\n| contrast-ratio | warning | Component color pairs below WCAG AA (4.5:1) |\n| orphaned-tokens | warning | Color tokens never referenced by components |\n| section-order | warning | Sections out of canonical order |\n\n## Status\n\nThe format is at version `alpha`. The spec, token schema, and CLI are under active development.\n\n## Related Concepts\n\n- [Templates Architecture](./templates-architecture.md)\n- [Design Tokens](../domain/design-tokens.md)\n- [UX Design Standards](../domain/ux-design-standards.md)\n- [OKF Standard Specification](./okf-standard-spec.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"architecture/hook-system.md","content":"---\ntype: Architecture\ntitle: Post-Commit Tier 1 Capture System\ndescription: Repository-local quality-guarded hook that writes one compact rationale-bearing Tier 1 record per ordinary commit\nresource: ./templates/okf/post-commit.sh\ntags: [capture-tier, git, hooks, inbox, okf, quality]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26, 27, 30]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-source\nevidence_refs: [templates/okf/post-commit.sh, templates/okf/tests/post-commit_test.sh]\n---\n\n# Boundary\n\nThe Bash post-commit hook resolves one Git root and writes one direct Inbox\nrecord for each ordinary non-merge commit. It skips `okf-capture:` and\n`okf-curation:` terminal commits, deduplicates by exact commit SHA, updates the\nInbox index/count, and chains one preserved predecessor hook. It does not list\nchanged files because Git is canonical.\n\nThe record captures safely quoted title/branch/timestamps, full SHA, issue refs,\nunique normalized tags, why/how, impact, `generated_at`, and\n`generated_by: okf-post-commit`. Subject-only messages retain explicit rationale\nor impact gaps.\n\n# Quality guard\n\nThe hook measures the prospective record against a 16 KiB boundary and detects\nraw credentials/private keys, binary encodings, stack traces, logs, payloads,\ntranscripts, database dumps, and bulk source. Unsafe, oversized, malformed, or\nrepeated low-signal content becomes a compact Git-reference record with\nmachine-readable `x_okf_capture_*` reasons. An explicit environment override may\nretain reviewed content but never bypass safe YAML/Markdown structure, unique\ntags, exact-SHA deduplication, or provenance.\n\nWarnings expose only stable reason codes, SHA, and output path—not the commit\nbody, title, payload, or detected secret. Failure never fails the Git commit.\n\n# Isolation\n\nThe hook canonicalizes the Git top level and writes only through physical,\nnon-symlink `knowledge/` and `knowledge/inbox/` directories. Symlinked or\ndangling inbox/root index targets stop capture before any external read or\nwrite. It has no viewer manifest, parent-workspace generator, curation\nnudge/launch, network, scheduler, Factory, child session, or cross-project\nbehavior.\n\n# Related concepts\n\n- [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md)\n- [Pre-Tiered Post-Commit Capture Model](../deprecation/pre-tiered-post-commit-capture-model.md)\n- [Inbox Quality and Retention Policy](../decisions/inbox-quality-and-retention-policy.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Architecture","title":"Post-Commit Tier 1 Capture System","description":"Repository-local quality-guarded hook that writes one compact rationale-bearing Tier 1 record per ordinary commit","resource":"./templates/okf/post-commit.sh","tags":["capture-tier","git","hooks","inbox","okf","quality"],"timestamp":"2026-08-08T00:00:00Z","status":"active","issue_refs":[26,27,30],"epic_refs":[26],"assertion_state":"proposed","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-source","evidence_refs":["templates/okf/post-commit.sh","templates/okf/tests/post-commit_test.sh"]},"body":"\n# Boundary\n\nThe Bash post-commit hook resolves one Git root and writes one direct Inbox\nrecord for each ordinary non-merge commit. It skips `okf-capture:` and\n`okf-curation:` terminal commits, deduplicates by exact commit SHA, updates the\nInbox index/count, and chains one preserved predecessor hook. It does not list\nchanged files because Git is canonical.\n\nThe record captures safely quoted title/branch/timestamps, full SHA, issue refs,\nunique normalized tags, why/how, impact, `generated_at`, and\n`generated_by: okf-post-commit`. Subject-only messages retain explicit rationale\nor impact gaps.\n\n# Quality guard\n\nThe hook measures the prospective record against a 16 KiB boundary and detects\nraw credentials/private keys, binary encodings, stack traces, logs, payloads,\ntranscripts, database dumps, and bulk source. Unsafe, oversized, malformed, or\nrepeated low-signal content becomes a compact Git-reference record with\nmachine-readable `x_okf_capture_*` reasons. An explicit environment override may\nretain reviewed content but never bypass safe YAML/Markdown structure, unique\ntags, exact-SHA deduplication, or provenance.\n\nWarnings expose only stable reason codes, SHA, and output path—not the commit\nbody, title, payload, or detected secret. Failure never fails the Git commit.\n\n# Isolation\n\nThe hook canonicalizes the Git top level and writes only through physical,\nnon-symlink `knowledge/` and `knowledge/inbox/` directories. Symlinked or\ndangling inbox/root index targets stop capture before any external read or\nwrite. It has no viewer manifest, parent-workspace generator, curation\nnudge/launch, network, scheduler, Factory, child session, or cross-project\nbehavior.\n\n# Related concepts\n\n- [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md)\n- [Pre-Tiered Post-Commit Capture Model](../deprecation/pre-tiered-post-commit-capture-model.md)\n- [Inbox Quality and Retention Policy](../decisions/inbox-quality-and-retention-policy.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"architecture/installer-design.md","content":"---\ntype: Architecture\ntitle: OKF Offline Installer Design\ndescription: Idempotent file-copy installer for the bundle, semantic tools, bounded operations, controls, hooks, viewer, and curator contracts\nresource: ./templates/okf/install-okf.sh\ntags: [bash, deployment, installer, offline, okf, setup]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-source\nevidence_refs: [templates/okf/install-okf.sh, templates/okf/tests/runtime-vendor_test.mjs]\n---\n\n# Installed surfaces\n\n`install-okf.sh \u003ctarget-root>` creates a missing knowledge structure while\npreserving existing concepts; copies the viewer/generator and portable Bash\nquery fallback; installs the quality-aware post-commit hook and chained\npredecessor; installs curator contracts; and copies the pinned YAML runtime,\nschema/generated validator, accepted `.okf/lib` modules, `.okf/bin` commands,\nand curation prompt template.\n\nThe command surface covers lint, status, semantic query, run planning, bounded\ncuration/cancellation/resume, triage, reversible archive/rollback, and manual\ncadence status/observation. Installed executables and canonical content are\nverified in a throwaway repository fixture.\n\n# Configuration preservation\n\nSource defaults map to `.okf/profile.json`, `.okf/cadence.json`, and\n`.okf/KILL_SWITCH` only when the destination is absent. Reinstall preserves\nexisting regular files, custom controls, and symlink presence rather than\nsilently replacing project-local policy.\n\n# Runtime and side-effect boundary\n\nInstallation is file-copy/configuration work only. It does not run Node/npm,\ninvoke any installed command or hook, start curation/archive/cadence, fetch a\ndependency, contact a network, install cron/launchd/service/queue/Factory state,\nor discover another project. The semantic command fails closed when its pinned\nlocal runtime is unavailable; portable basic search remains usable.\n\nThe explicit installation action may append the standard OKF section to\nAGENTS.md. Later curation/migration/status operations only report instruction\nalignment proposals and require separate approval to apply them.\n\n# Hook preservation\n\nThe installer uses local `.githooks/`, chains a non-OKF predecessor as\n`post-commit.pre-okf`, refuses an ambiguous collision, installs the canonical\nhook, makes it executable, and sets repository-local `core.hooksPath`. It does\nnot use or change a global hook path.\n\n# Related concepts\n\n- [Deploy OKF to a Project](../process/deploy-okf.md)\n- [Post-Commit Tier 1 Capture System](./hook-system.md)\n- [OKF Parser Runtime Distribution](../decisions/okf-parser-runtime-distribution.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Architecture","title":"OKF Offline Installer Design","description":"Idempotent file-copy installer for the bundle, semantic tools, bounded operations, controls, hooks, viewer, and curator contracts","resource":"./templates/okf/install-okf.sh","tags":["bash","deployment","installer","offline","okf","setu to apply them.\n\n# Hook preservation\n\nThe installer uses local `.githooks/`, chains a non-OKF predecessor as\n`post-commit.pre-okf`, refuses an ambiguous collision, installs the canonical\nhook, makes it executable, and sets repository-local `core.hooksPath`. It does\nnot use or change a global hook path.\n\n# Related concepts\n\n- [Deploy OKF to a Project](../process/deploy-okf.md)\n- [Post-Commit Tier 1 Capture System](./hook-system.md)\n- [OKF Parser Runtime Distribution](../decisions/okf-parser-runtime-distribution.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"architecture/okf-query-helper.md","content":"---\ntype: Architecture\ntitle: OKF Query Helper\ndescription: Portable grep fallback plus pinned local semantic queries for typed relationships, assertions, evidence, lifecycle, and validation state\nresource: ./templates/okf/okf-query.sh\ntags: [evidence, lifecycle, okf, query, relationships, search]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-source\nevidence_refs: [templates/okf/okf-query.sh, templates/okf/bin/okf-query.mjs, templates/okf/tests/query_test.mjs]\n---\n\n# Portable path\n\n`knowledge/okf-query.sh \u003cterms>` and `--decisions` use only shell search tools,\nrank frontmatter before body matches, and remain available without `.okf` or a\nNode parser. This is the minimum OKF-first discovery path.\n\n# Semantic path\n\nInstalled `.okf/bin/okf-query.mjs` requires one explicit physical Git root and\nthe pinned C7 parser. It supports predicate/target and related-to queries,\nassertion state, evidence presence/reference, lifecycle/status, and validation\nstatus (`strict`, `legacy-compatible`, or retained nonconformant), with\ndeterministic text or JSON.\n\nThe query surface distinguishes stored predicates, derived inverse matches,\nMarkdown citations, unresolved targets, lifecycle, assertion, and validation.\nIt reads only contained regular files, rejects escaping symlinks, uses no\nnetwork, and never mutates, validates into compliance, starts curation, or\nturns a result into execution authority.\n\nIf the local semantic runtime is missing, semantic filters fail closed with\nguidance while basic/decision search continues through the portable path.\n\n# Related concepts\n\n- [OKF-First Protocol](../decisions/okf-first-protocol.md)\n- [OKF Typed Viewer Architecture](./viewer-architecture.md)\n- [OKF Semantic Profile](../decisions/semantic-profile-and-semantic-web-scope.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Architecture","title":"OKF Query Helper","description":"Portable grep fallback plus pinned local semantic queries for typed relationships, assertions, evidence, lifecycle, and validation state","resource":"./templates/okf/okf-query.sh","tags":["evidence","lifecycle","okf","query","relationships","search"],"timestamp":"2026-08-08T00:00:00Z","status":"active","issue_refs":[26],"epic_refs":[26],"assertion_state":"proposed","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-source","evidence_refs":["templates/okf/okf-query.sh","templates/okf/bin/okf-query.mjs","templates/okf/tests/query_test.mjs"]},"body":"\n# Portable path\n\n`knowledge/okf-query.sh \u003cterms>` and `--decisions` use only shell search tools,\nrank frontmatter before body matches, and remain available without `.okf` or a\nNode parser. This is the minimum OKF-first discovery path.\n\n# Semantic path\n\nInstalled `.okf/bin/okf-query.mjs` requires one explicit physical Git root and\nthe pinned C7 parser. It supports predicate/target and related-to queries,\nassertion state, evidence presence/reference, lifecycle/status, and validation\nstatus (`strict`, `legacy-compatible`, or retained nonconformant), with\ndeterministic text or JSON.\n\nThe query surface distinguishes stored predicates, derived inverse matches,\nMarkdown citations, unresolved targets, lifecycle, assertion, and validation.\nIt reads only contained regular files, rejects escaping symlinks, uses no\nnetwork, and never mutates, validates into compliance, starts curation, or\nturns a result into execution authority.\n\nIf the local semantic runtime is missing, semantic filters fail closed with\nguidance while basic/decision search continues through the portable path.\n\n# Related concepts\n\n- [OKF-First Protocol](../decisions/okf-first-protocol.md)\n- [OKF Typed Viewer Architecture](./viewer-architecture.md)\n- [OKF Semantic Profile](../decisions/semantic-profile-and-semantic-web-scope.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"architecture/okf-standard-spec.md","content":"---\ntype: Architecture\ntitle: OKF Standard and Core Profile\ndescription: Git-canonical OKF v0.1 with the warning-first machine-checkable okf-core/1.0 semantic application profile\nresource: ./templates/okf/OKF-STANDARD.md\ntags: [concepts, frontmatter, okf, semantic-profile, specification, standard]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-contract\nevidence_refs: [templates/okf/OKF-STANDARD.md, templates/okf/schema/okf-core-1.0.schema.json]\n---\n\n# Canonical representation\n\nOKF remains repository-local Markdown with YAML frontmatter under Git. The v0.1\ndirectory/type convention, indexes, log, progressive disclosure, explicit\ndeprecation, OKF-first consumption, and two-tier capture remain the authoring\nmodel. An external graph, RDF store, JSON-LD processor, SHACL engine, remote\ncontext, or network service is not required.\n\n# Core 1.0 profile\n\n`okf-core/1.0` adds a versioned schema and shared parser/linter semantics for new\nor materially updated records. It requires descriptive metadata, controlled\ntype/lifecycle/tags/timestamps, conditional Inbox/Deprecation/provenance fields,\nstable project-local IDs for typed edges, and controlled predicates\n`depends_on`, `implements`, `supersedes`, `derived_from`, `contradicts`, and\n`blocked_by`.\n\nAssertion state (`verified`, `inferred`, `proposed`, `historical`, `stale`) is\nseparate from lifecycle and governance. Flat provenance/evidence fields record\ngeneration, authority, verification, validity, and staleness. Paths remain\nnavigation/context rather than semantic identity or proof.\n\n# Compatibility and validation\n\nRetained history is audited in warning/legacy mode and never normalized merely\nto silence findings. `strict-new` applies to new/updated records through author,\ncapture, and curator staging gates; `strict-bundle` requires a reviewed\nmigration manifest and rollback proof. Unknown fields are preserved and new\nportable extensions use `x_\u003cowner>_\u003cname>`.\n\nUnresolved/invalid relationships, legacy path-valued `supersedes`, assertion\nstates, and malformed profile records remain distinguishable. `A supersedes B`\nmeans A replaces B; the old record stays in `deprecation/` and consumers derive\n`superseded_by`.\n\n# Operations\n\nCapture quality is compact/reference-first for unsafe raw or oversized content.\nCuration and archive are explicit-root, locked, quota-bounded, validated,\ncancellable, observable, resumable, and recoverable. The approved cadence is\nmanual status/triage plus a separately requested batch; thresholds and warnings\nnever create execution authority.\n\n# Related concepts\n\n- [OKF Semantic Profile and Semantic-Web Scope](../decisions/semantic-profile-and-semantic-web-scope.md)\n- [OKF Bounded Curation Pass](../process/curation-pass.md)\n- [Post-Commit Tier 1 Capture System](./hook-system.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Architecture","title":"OKF Standard and Core Profile","description":"Git-canonical OKF v0.1 with the warning-first machine-checkable okf-core/1.0 semantic application profile","resource":"./templates/okf/OKF-STANDARD.md","tags":["concepts","frontmatter","okf","semantic-profile","specification","standard"],"timestamp":"2026-08-08T00:00:00Z","status":"active","issue_refs":[26],"epic_refs":[26],"assertion_state":"proposed","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-contract","evidence_refs":["templates/okf/OKF-STANDARD.md","templates/okf/schema/okf-core-1.0.schema.json"]},"body":"\n# Canonical representation\n\nOKF remains repository-local Markdown with YAML frontmatter under Git. The v0.1\ndirectory/type convention, indexes, log, progressive disclosure, explicit\ndeprecation, OKF-first consumption, and two-tier capture remain the authoring\nmodel. An external graph, RDF store, JSON-LD processor, SHACL engine, remote\ncontext, or network service is not required.\n\n# Core 1.0 profile\n\n`okf-core/1.0` adds a versioned schema and shared parser/linter semantics for new\nor materially updated records. It requires descriptive metadata, controlled\ntype/lifecycle/tags/timestamps, conditional Inbox/Deprecation/provenance fields,\nstable project-local IDs for typed edges, and controlled predicates\n`depends_on`, `implements`, `supersedes`, `derived_from`, `contradicts`, and\n`blocked_by`.\n\nAssertion state (`verified`, `inferred`, `proposed`, `historical`, `stale`) is\nseparate from lifecycle and governance. Flat provenance/evidence fields record\ngeneration, authority, verification, validity, and staleness. Paths remain\nnavigation/context rather than semantic identity or proof.\n\n# Compatibility and validation\n\nRetained history is audited in warning/legacy mode and never normalized merely\nto silence findings. `strict-new` applies to new/updated records through author,\ncapture, and curator staging gates; `strict-bundle` requires a reviewed\nmigration manifest and rollback proof. Unknown fields are preserved and new\nportable extensions use `x_\u003cowner>_\u003cname>`.\n\nUnresolved/invalid relationships, legacy path-valued `supersedes`, assertion\nstates, and malformed profile records remain distinguishable. `A supersedes B`\nmeans A replaces B; the old record stays in `deprecation/` and consumers derive\n`superseded_by`.\n\n# Operations\n\nCapture quality is compact/reference-first for unsafe raw or oversized content.\nCuration and archive are explicit-root, locked, quota-bounded, validated,\ncancellable, observable, resumable, and recoverable. The approved cadence is\nmanual status/triage plus a separately requested batch; thresholds and warnings\nnever create execution authority.\n\n# Related concepts\n\n- [OKF Semantic Profile and Semantic-Web Scope](../decisions/semantic-profile-and-semantic-web-scope.md)\n- [OKF Bounded Curation Pass](../process/curation-pass.md)\n- [Post-Commit Tier 1 Capture System](./hook-system.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"architecture/templates-architecture.md","content":"---\ntype: Architecture\ntitle: Templates Directory Architecture\ndescription: Organisation of the templates directory containing instructional documents, functional design, and UI/UX guidelines\nresource: ./templates/\ntags: [designs, templates, architecture, directory-structure, organisation]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Templates Directory Architecture\n\nThe `templates/` directory is the reusable planning and instructional library of the designs repository. It contains three main subdirectories plus a root-level AGENTS.md, a DESIGN.md template, and the TFD (Technical Functional Requirements Document) template.\n\n## Directory Structure\n\n```text\ntemplates/\n├── AGENTS.md                              Templates area agent instructions\n├── DESIGN.template.md                     Starter template for DESIGN.md files\n├── Frontend-Technical-Functional-Requirements-Document-TFD.md\n├── agile_pm_prompt.md                     (empty placeholder)\n├── architecture.md                        Core architecture sidecar model\n├── close_out_items_shipping.md            Closeout checklist\n├── convex-self-hosted-quickref.md         Convex quick reference\n├── convex-self-hosted-setup.md            Convex setup guide\n├── deployment-guide.md                    Deployment guide\n├── generate-claude-agents.md              CLAUDE.md generation guide\n├── generate_agents.md                     AGENTS.md generation guide\n├── github-usage-system-prompt.md          GitHub usage system prompt\n├── github-workflow.md                     Git stacking workflow guide\n├── index.md                               Templates index\n├── kickoff-requirements-spec.md           Kickoff requirements template\n├── okf/                                   OKF system templates\n├── project_management_prompt.md           (empty placeholder)\n├── stripe-payment-gateway.md              Stripe integration guide\n├── tailwind.md                            Tailwind CSS guide\n├── ui-ux-guidelines/                      UI/UX design pattern references\n├── upgrade-template.md                    Version upgrade template\n├── ux_design_standards.md                 shadcn/ui design system guidelines\n└── work-os-auth.md                        WorkOS authentication guide\n```\n\n## Subdirectories\n\n### instructional-documents/\n\nThe main instructional area with guides, commands, skills, hooks, scripts, and worktree guidance. Has its own AGENTS.md with Graphite stacking workflow instructions for documentation work. Contains:\n\n- **commands/** - Slash command templates (plan-feature, plan-bugfix, plan-github, plan-review, compliance-review, uat, end-session, join-session, next-phase, release-assess, kingmode)\n- **skills/** - Project-local skills (plan-review, release-assess, vibe-fix, worktree-session-lifecycle, worktree-toolkit-init)\n- **hooks/** - Git hooks (pre-commit, post-commit, post-edit-lint, code-review-checkpoint, sanity-check, pre-completion-build, batch-lint-check)\n- **scripts/** - Shell scripts (release-vector-assess, worktree session management, droid worktree)\n- **worktrees/** - Worktree session guidance and metadata\n- **install-session-workflows.sh** - Installer for refreshing commands, hooks, scripts, skills, and worktree guidance into another project\n\n### functional-design/\n\nPhased implementation checklist templates. The template baseline is preserved in `00-TEMPLATE-IMPLEMENTATION-CHECKLIST.md`, while `00-IMPLEMENTATION-CHECKLIST.md` tracks the live implementation status for the designs repo itself. Phased files range from `01-ARCHITECTURE-OVERVIEW.md` through `99-DEPLOYMENT-STRATEGY.md`.\n\n### ui-ux-guidelines/\n\nDesign token and interface pattern references with a machine-readable `design-tokens.json` for Figma/Style Dictionary. Contains pattern guides for components, forms, data display, interactive elements, and layouts.\n\n### okf/\n\nOKF system templates including the standard specification, deployment runbook, installer script, post-commit hook, viz generator, and viewer.\n\n## Related Concepts\n\n- [DESIGN.md Standard Specification](./design-standard-spec.md)\n- [Design Tokens](../domain/design-tokens.md)\n- [Component Patterns](../components/component-patterns.md)\n- [Planning Decomposition](../process/planning-decomposition.md)\n- [Implementation Checklist](../process/implementation-checklist.md)\n- [Install Session Workflows](../process/install-session-workflows.md)\n- [OKF Standard Specification](./okf-standard-spec.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Architecture","title":"Templates Directory Architecture","description":"Organisation of the templates directory containing instructional documents, functional design, and UI/UX guidelines","resource":"./templates/","tags":["designs","templates","architecture","directory-structure","organisation"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Templates Directory Architecture\n\nThe `temp
