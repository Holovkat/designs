or.md` with a new Phase 6 Audit: redundancy control (merge overlapping concepts), contradiction detection (concept vs concept, vs code, vs AGENTS.md), ambiguous reference resolution (all `resource` fields and cross-links must resolve), and an AGENTS.md alignment check that reports proposed edits and applies them only on approval.\n- Added an OKF-First Protocol to the okf skill, AGENTS-OKF-SECTION.md, designs AGENTS.md, and OKF-STANDARD onboarding: query the bundle before investigating, check decisions/ and deprecation/ for rejected paths before planning, cite reused concepts, verify freshness, and record rejected approaches in session syntheses.\n- Created `templates/okf/okf-query.sh`, a portable grep-based concept search (frontmatter-ranked, with a --decisions scope for prior/rejected paths), installed to `knowledge/okf-query.sh` by the installer.\n- Extended `post-commit.sh` (template and designs .githooks copy) with a curation nudge when unprocessed inbox items reach 5 (OKF_NUDGE_THRESHOLD overridable).\n- Extended `install-okf.sh` to install the curator to `.factory/droids/` (and `.claude/agents/` when present) and the query helper into `knowledge/`.\n- Updated OKF-STANDARD.md (audit phase as Phase 6, finalize renumbered to Phase 7, corrected two-phase capture wording), DEPLOYMENT-RUNBOOK.md (Phase 1 install outputs, Phase 6 audit steps, post-deployment loop), and the curation-pass process concept.\n- Extended `scripts/sync-skill-distro.sh` to sync the curator to pi-extensions/.factory/droids/ as a full per-harness copy; ran the sync and refreshed installed CLI skill roots.\n\n# Decisions Made\n\n- Curation cadence is a passive post-commit nudge at threshold 5, not a scheduled automation.\n- Curator contract is distributed as full copies per harness, kept in sync by `sync-skill-distro.sh`; canonical source is `templates/okf/agents/okf-curator.md`.\n- The curator never patches AGENTS.md directly: it reports precise proposals (current -> proposed text with reason) and offers to apply them on approval.\n- Rejected approaches are first-class knowledge: syntheses must record them so curation turns them into decision or deprecation lessons.\n\n# What Was Deprecated\n\n- The claim that the post-commit hook writes commit metadata to the inbox (removed from AGENTS-OKF-SECTION.md, designs AGENTS.md, OKF-STANDARD.md, DEPLOYMENT-RUNBOOK.md). The hook only refreshes the viewer manifest and nudges for curation; agents write syntheses before committing.\n- The pi-extensions-only curator (superseded by the canonical templates/okf/agents/ copy synced per harness).\n\n# Lessons Learned\n\n- Instruction docs drift from tooling silently: four documents still described the old inbox-writing hook after the hook changed. The AGENTS.md alignment check exists to catch exactly this class of contradiction.\n- `knowledge/architecture/hook-system.md` still describes the old metadata-writing hook (found via okf-query during this session). Next curation pass should update or deprecate it with lessons.\n\n# Current State\n\n- Curation contract with audit phase is live in templates and synced to pi-extensions; okf skill with OKF-first protocol is installed canonically in all CLI skill roots.\n- Drift check (`scripts/sync-skill-distro.sh --check`) reports in sync.\n- Known pending curation work: hook-system.md contradiction, and this inbox plus the prior session synthesis await a curation pass.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Inbox","title":"Session 2026-07-05 - OKF curation audit phase and OKF-first protocol","description":"Added an audit phase to curation (redundancy, contradictions, ambiguous refs, AGENTS.md alignment), an OKF-first consumption protocol, a portable query helper, and an inbox curation nudge","tags":["okf","curation","audit","agents-md","okf-first","memory","harness-integration"],"timestamp":"2026-07-05T12:30:00Z","branch":"main"},"body":"\n# What Was Done\n\n- Created the canonical okf-curator contract at `templates/okf/agents/okf-curator.md` with a new Phase 6 Audit: redundancy control (merge overlapping concepts), contradiction detection (concept vs concept, vs code, vs AGENTS.md), ambiguous reference resolution (all `resource` fields and cross-links must resolve), and an AGENTS.md alignment check that reports proposed edits and applies them only on approval.\n- Added an OKF-First Protocol to the okf skill, AGENTS-OKF-SECTION.md, designs AGENTS.md, and OKF-STANDARD onboarding: query the bundle before investigating, check decisions/ and deprecation/ for rejected paths before planning, cite reused concepts, verify freshness, and record rejected approaches in session syntheses.\n- Created `templates/okf/okf-query.sh`, a portable grep-based concept search (frontmatter-ranked, with a --decisions scope for prior/rejected paths), installed to `knowledge/okf-query.sh` by the installer.\n- Extended `post-commit.sh` (template and designs .githooks copy) with a curation nudge when unprocessed inbox items reach 5 (OKF_NUDGE_THRESHOLD overridable).\n- Extended `install-okf.sh` to install the curator to `.factory/droids/` (and `.claude/agents/` when present) and the query helper into `knowledge/`.\n- Updated OKF-STANDARD.md (audit phase as Phase 6, finalize renumbered to Phase 7, corrected two-phase capture wording), DEPLOYMENT-RUNBOOK.md (Phase 1 install outputs, Phase 6 audit steps, post-deployment loop), and the curation-pass process concept.\n- Extended `scripts/sync-skill-distro.sh` to sync the curator to pi-extensions/.factory/droids/ as a full per-harness copy; ran the sync and refreshed installed CLI skill roots.\n\n# Decisions Made\n\n- Curation cadence is a passive post-commit nudge at threshold 5, not a scheduled automation.\n- Curator contract is distributed as full copies per harness, kept in sync by `sync-skill-distro.sh`; canonical source is `templates/okf/agents/okf-curator.md`.\n- The curator never patches AGENTS.md directly: it reports precise proposals (current -> proposed text with reason) and offers to apply them on approval.\n- Rejected approaches are first-class knowledge: syntheses must record them so curation turns them into decision or deprecation lessons.\n\n# What Was Deprecated\n\n- The claim that the post-commit hook writes commit metadata to the inbox (removed from AGENTS-OKF-SECTION.md, designs AGENTS.md, OKF-STANDARD.md, DEPLOYMENT-RUNBOOK.md). The hook only refreshes the viewer manifest and nudges for curation; agents write syntheses before committing.\n- The pi-extensions-only curator (superseded by the canonical templates/okf/agents/ copy synced per harness).\n\n# Lessons Learned\n\n- Instruction docs drift from tooling silently: four documents still described the old inbox-writing hook after the hook changed. The AGENTS.md alignment check exists to catch exactly this class of contradiction.\n- `knowledge/architecture/hook-system.md` still describes the old metadata-writing hook (found via okf-query during this session). Next curation pass should update or deprecate it with lessons.\n\n# Current State\n\n- Curation contract with audit phase is live in templates and synced to pi-extensions; okf skill with OKF-first protocol is installed canonically in all CLI skill roots.\n- Drift check (`scripts/sync-skill-distro.sh --check`) reports in sync.\n- Known pending curation work: hook-system.md contradiction, and this inbox plus the prior session synthesis await a curation pass.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/agent-generation.md","content":"---\ntype: Process\ntitle: Agent Generation Guides\ndescription: Guides for generating hierarchical CLAUDE.md and AGENTS.md structures optimized for AI coding agents\nresource: ./templates/instructional-documents/generate-claude-agents.md\ntags: [designs, agents, claude, codex, generation, claude-md, agents-md, hierarchy]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Agent Generation Guides\n\n## Overview\n\nTwo guides provide structured processes for generating hierarchical instruction files optimized for AI coding agents:\n\n1. **generate-claude-agents.md** - For Claude Code's CLAUDE.md system\n2. **generate_agents.md** - For generic AGENTS.md hierarchy\n\n## CLAUDE.md Generation (Claude Code)\n\nClaude Code has unique capabilities: strict instruction hierarchy, hierarchical memory (reads CLAUDE.md recursively), hooks system, MCP integration, custom slash commands, subagents, and extended thinking.\n\n### Process Phases\n\n1. **Repository Analysis** - Architecture, tech stack, testing, CI/CD, directory structure for CLAUDE.md files, dangerous patterns, tool permissions\n2. **Root CLAUDE.md** (~200-400 lines) - Project identity, universal rules (MUST/SHOULD/MUST NOT), core commands, structure map, JIT find commands, security, git workflow, testing strategy, available tools, directory-specific pointers\n3. **Subdirectory CLAUDE.md** (100-200 lines each) - Package identity, setup/commands, architecture/patterns, key files, JIT search hints, common gotchas, testing, pre-PR validation\n4. **Claude Code Configuration** - Hooks (`.claude/settings.json`), custom slash commands (`.claude/commands/`), MCP server recommendations, subagent configurations\n\n### Quality Checklist\n\n- Root under 400 lines, all subdirectory files link back to root\n- Every DO has a real file example, every DON'T references an anti-pattern\n- Commands are copy-paste ready, hooks target specific patterns\n- JIT search commands use actual file patterns\n\n## AGENTS.md Generation (Generic)\n\n### Core Principles\n\n1. Root AGENTS.md is lightweight - only universal guidance, links to sub-files\n2. Nearest-wins hierarchy - agents read the closest AGENTS.md\n3. JIT indexing - provide paths/globs/commands, NOT full content\n4. Token efficiency - small, actionable guidance\n5. Sub-folder AGENTS.md files have more detail\n\n### Process Phases\n\n1. **Repository Analysis** - Type, tech stack, major directories, build system, testing, key patterns\n2. **Root AGENTS.md** (~100-200 lines max) - Project snapshot, root commands, universal conventions, security, JIT index/directory map, definition of done\n3. **Sub-folder AGENTS.md** - Package identity, setup/run, patterns/conventions (most important), touch points, JIT index hints, common gotchas, pre-PR checks\n4. **Special Considerations** - Design system, database, API, testing packages\n\n### Quality Checks\n\n- Root under 200 lines, links to all sub-files\n- Concrete examples with actual file paths\n- No duplication between root and sub-files\n- JIT hints use ripgrep/find/glob with actual patterns\n\n## Related Concepts\n\n- [Planning Agent Contracts](./planning-agent-contracts.md)\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Documentation-First Approach](../decisions/documentation-first-approach.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Agent Generation Guides","description":"Guides for generating hierarchical CLAUDE.md and AGENTS.md structures optimized for AI coding agents","resource":"./templates/instructional-documents/generate-claude-agents.md","tags":["designs","agents","claude","codex","generation","claude-md","agents-md","hierarchy"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Agent Generation Guides\n\n## Overview\n\nTwo guides provide structured processes for generating hierarchical instruction files optimized for AI coding agents:\n\n1. **generate-claude-agents.md** - For Claude Code's CLAUDE.md system\n2. **generate_agents.md** - For generic AGENTS.md hierarchy\n\n## CLAUDE.md Generation (Claude Code)\n\nClaude Code has unique capabilities: strict instruction hierarchy, hierarchical memory (reads CLAUDE.md recursively), hooks system, MCP integration, custom slash commands, subagents, and extended thinking.\n\n### Process Phases\n\n1. **Repository Analysis** - Architecture, tech stack, testing, CI/CD, directory structure for CLAUDE.md files, dangerous patterns, tool permissions\n2. **Root CLAUDE.md** (~200-400 lines) - Project identity, universal rules (MUST/SHOULD/MUST NOT), core commands, structure map, JIT find commands, security, git workflow, testing strategy, available tools, directory-specific pointers\n3. **Subdirectory CLAUDE.md** (100-200 lines each) - Package identity, setup/commands, architecture/patterns, key files, JIT search hints, common gotchas, testing, pre-PR validation\n4. **Claude Code Configuration** - Hooks (`.claude/settings.json`), custom slash commands (`.claude/commands/`), MCP server recommendations, subagent configurations\n\n### Quality Checklist\n\n- Root under 400 lines, all subdirectory files link back to root\n- Every DO has a real file example, every DON'T references an anti-pattern\n- Commands are copy-paste ready, hooks target specific patterns\n- JIT search commands use actual file patterns\n\n## AGENTS.md Generation (Generic)\n\n### Core Principles\n\n1. Root AGENTS.md is lightweight - only universal guidance, links to sub-files\n2. Nearest-wins hierarchy - agents read the closest AGENTS.md\n3. JIT indexing - provide paths/globs/commands, NOT full content\n4. Token efficiency - small, actionable guidance\n5. Sub-folder AGENTS.md files have more detail\n\n### Process Phases\n\n1. **Repository Analysis** - Type, tech stack, major directories, build system, testing, key patterns\n2. **Root AGENTS.md** (~100-200 lines max) - Project snapshot, root commands, universal conventions, security, JIT index/directory map, definition of done\n3. **Sub-folder AGENTS.md** - Package identity, setup/run, patterns/conventions (most important), touch points, JIT index hints, common gotchas, pre-PR checks\n4. **Special Considerations** - Design system, database, API, testing packages\n\n### Quality Checks\n\n- Root under 200 lines, links to all sub-files\n- Concrete examples with actual file paths\n- No duplication between root and sub-files\n- JIT hints use ripgrep/find/glob with actual patterns\n\n## Related Concepts\n\n- [Planning Agent Contracts](./planning-agent-contracts.md)\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Documentation-First Approach](../decisions/documentation-first-approach.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/builder-agent-contracts.md","content":"---\ntype: Process\ntitle: Builder Agent Contracts\ndescription: Codex global builder agent pack defining orchestrator, dev, reviewer, tester, compliance roles with warm continuity and task packets\nresource: ./templates/instructional-documents/codex-global-builder-agents.md\ntags: [designs, codex, builder, agents, orchestrator, dev, reviewer, tester, compliance, contracts]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Builder Agent Contracts\n\n## Overview\n\nThe v1 builder pack installed under `~/.codex/agents/` defines the governed build agents that begin from `/start-session` and stop at `ready-for-integration`.\n\n## Goals\n\n- Keep planning handoff separate from build execution\n- Use `start-session` as explicit entrypoint into isolated worktree execution\n- Preserve one warm writer session per task\n- Reuse orchestrator-mediated communication pattern from planning pack\n\n## Builder Roster\n\n| Agent | Sandbox | Responsibility | Final Publisher |\n|-------|---------|---------------|-----------------|\n| builder_orchestrator | workspace-write | Intake, task-packet reconstruction, lane routing, warm continuity, line-stop/replan | Yes |\n| dev | workspace-write | Sole durable writer for code, tests, fixtures, corrections | No |\n| reviewer | read-only | Diff-scoped correctness, acceptance, owned-surface review | No |\n| tester | read-only | Targeted verification against changed files, regression surface | No |\n| compliance | read-only | Requirement traceability and final ready-for-integration gate | No |\n\n## Ownership Boundaries\n\n- `builder_orchestrator` does not edit implementation code; it governs build flow.\n- `dev` is the only agent allowed to make durable edits in the task worktree.\n- `reviewer`, `tester`, `compliance` are read-only by design.\n- Builder v1 stops at `ready-for-integration`. UAT, QA, and production promotion are downstream.\n\n## Worktree Execution Model\n\n- `start-session` creates the isolated worktree and branch context\n- Default mode is sequential sprint mode: one shared sprint worktree for serial dependency chain\n- Separate task worktrees reserved for true parallel lanes, isolated replays, or explicit isolation\n\n## Task Packet\n\nEvery task starts from a frozen task packet reconstructed from GitHub issue content, checklist state, comments, and repo context.\n\n### Required Packet Fields\n\n`task_id`, `issue_refs`, `goal`, `inferred_intent`, `confidence`, `project_trajectory`, `active_vectors`, `current_scope`, `constraints`, `non_goals`, `owned_files`, `input_contracts`, `output_contracts`, `required_schema`, `required_test_data`, `required_artifacts`, `preload_steps`, `fixture_locations`, `acceptance_criteria`, `validators`, `validation_scope`, `regression_surface`, `release_vector_matrix`, `lessons_learned`, `open_findings`, `line_stop_conditions`.\n\n### Packet Freeze Rule\n\nNo parallel lane may start until the task packet is frozen. Missing substantial schema, data, or artifacts is a prerequisite planning failure that line-stops back to replanning.\n\n## Lane Sequence\n\n1. `start-session` creates shared sprint worktree\n2. `builder_orchestrator` reconstructs and freezes task packet\n3. `dev` starts warm implementation session\n4. `builder_orchestrator` captures narrow change snapshot\n5. `reviewer` and `tester` run from same stable snapshot\n6. `compliance` runs after correction loop is clean\n7. Findings route back into same warm `dev` session\n8. On success, task exits as `ready-for-integration`\n9. Next adjacent serial task reuses same sprint worktree\n\n## Warm Builder Continuity\n\nThe same `dev` session is reused across build, review-fix, test-fix, and compliance-fix loops. Reviewer, tester, and compliance remain stateless lanes.\n\n## Complexity Rules\n\n- Small task-local fixtures/mocks remain in `dev` lane\n- Large schema, data-shaping, or broad environment setup must be split into prerequisites\n- Hidden prerequisite discovery is a line-stop, not \"figure it out in dev\"\n\n## Related Concepts\n\n- [Planning Agent Contracts](./planning-agent-contracts.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Agent Generation](./agent-generation.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Builder Agent Contracts","description":"Codex global builder agent pack defining orchestrator, dev, reviewer, tester, compliance roles with warm continuity and task packets","resource":"./templates/instructional-documents/codex-global-builder-agents.md","tags":["designs","codex","builder","agents","orchestrator","dev","reviewer","tester","compliance","contracts"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Builder Agent Contracts\n\n## Overview\n\nThe v1 builder pack installed under `~/.codex/agents/` defines the governed build agents that begin from `/start-session` and stop at `ready-for-integration`.\n\n## Goals\n\n- Keep planning handoff separate from build execution\n- Use `start-session` as explicit entrypoint into isolated worktree execution\n- Preserve one warm writer session per task\n- Reuse orchestrator-mediated communication pattern from planning pack\n\n## Builder Roster\n\n| Agent | Sandbox | Responsibility | Final Publisher |\n|-------|---------|---------------|-----------------|\n| builder_orchestrator | workspace-write | Intake, task-packet reconstruction, lane routing, warm continuity, line-stop/replan | Yes |\n| dev | workspace-write | Sole durable writer for code, tests, fixtures, corrections | No |\n| reviewer | read-only | Diff-scoped correctness, acceptance, owned-surface review | No |\n| tester | read-only | Targeted verification against changed files, regression surface | No |\n| compliance | read-only | Requirement traceability and final ready-for-integration gate | No |\n\n## Ownership Boundaries\n\n- `builder_orchestrator` does not edit implementation code; it governs build flow.\n- `dev` is the only agent allowed to make durable edits in the task worktree.\n- `reviewer`, `tester`, `compliance` are read-only by design.\n- Builder v1 stops at `ready-for-integration`. UAT, QA, and production promotion are downstream.\n\n## Worktree Execution Model\n\n- `start-session` creates the isolated worktree and branch context\n- Default mode is sequential sprint mode: one shared sprint worktree for serial dependency chain\n- Separate task worktrees reserved for true parallel lanes, isolated replays, or explicit isolation\n\n## Task Packet\n\nEvery task starts from a frozen task packet reconstructed from GitHub issue content, checklist state, comments, and repo context.\n\n### Required Packet Fields\n\n`task_id`, `issue_refs`, `goal`, `inferred_intent`, `confidence`, `project_trajectory`, `active_vectors`, `current_scope`, `constraints`, `non_goals`, `owned_files`, `input_contracts`, `output_contracts`, `required_schema`, `required_test_data`, `required_artifacts`, `preload_steps`, `fixture_locations`, `acceptance_criteria`, `validators`, `validation_scope`, `regression_surface`, `release_vector_matrix`, `lessons_learned`, `open_findings`, `line_stop_conditions`.\n\n### Packet Freeze Rule\n\nNo parallel lane may start until the task packet is frozen. Missing substantial schema, data, or artifacts is a prerequisite planning failure that line-stops back to replanning.\n\n## Lane Sequence\n\n1. `start-session` creates shared sprint worktree\n2. `builder_orchestrator` reconstructs and freezes task packet\n3. `dev` starts warm implementation session\n4. `builder_orchestrator` captures narrow change snapshot\n5. `reviewer` and `tester` run from same stable snapshot\n6. `compliance` runs after correction loop is clean\n7. Findings route back into same warm `dev` session\n8. On success, task exits as `ready-for-integration`\n9. Next adjacent serial task reuses same sprint worktree\n\n## Warm Builder Continuity\n\nThe same `dev` session is reused across build, review-fix, test-fix, and compliance-fix loops. Reviewer, tester, and compliance remain stateless lanes.\n\n## Complexity Rules\n\n- Small task-local fixtures/mocks remain in `dev` lane\n- Large schema, data-shaping, or broad environment setup must be split into prerequisites\n- Hidden prerequisite discovery is a line-stop, not \"figure it out in dev\"\n\n## Related Concepts\n\n- [Planning Agent Contracts](./planning-agent-contracts.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Agent Generation](./agent-generation.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/closeout-process.md","content":"---\ntype: Process\ntitle: Closeout Process\ndescription: Post-enhancement ship flow for publishing branches, verifying from remote, summarizing state, cleanup, and global install\nresource: ./templates/instructional-documents/close_out_items_shipping.md\ntags: [designs, closeout, shipping, release, verification, cleanup]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Closeout Process\n\n## Prerequisites\n\n1. Confirm with requestor that pending changes are approved for shipping (no open TODOs, all reviews resolved)\n2. If the request explicitly says to perform close-out actions, do them without deflecting back\n3. If anything is unclear or unspecified, pause and ask, do not improvise\n4. Follow steps in order. Do not move to the next step if the previous could not be performed\n\n## Step 1: Publish the Branch and Tags\n\n- Fast-forward local `main` to contain approved enhancement commits\n- Push `main` to remote: `git push origin main`\n- Push the release tag: `git push origin [project_name]-vX.Y.Z`\n\n## Step 2: Verify from Remote Source of Truth\n\n- Create a fresh worktree from `origin/main`\n- Run the release build in the verification worktree\n- After build succeeds (and UAT signs off), remove the verification worktree\n\n## Step 3: Summarize Repository State\n\n- Report list of local branches still present\n- Confirm no staged or unstaged files\n- Record `origin/main` commit SHA and call out any divergence\n\n## Step 4: Cleanup (After Approval)\n\n- Remove temporary branches and worktrees created for the release\n\n## Step 5: Install the Released Binary Globally\n\n- Run `cargo install --path cli --bin [project_name]-agent` to update the user's default executable\n\n## Step 6: Document Release Metadata\n\n- List the latest five tags in reverse chronological order for stakeholder visibility\n\n## Key Rules\n\n- Do NOT continue if a step fails. Tell the user why and discuss how to plan the move forward.\n- Only ask follow-up questions when a detail is missing or ambiguous.\n- Steps must be followed sequentially.\n\n## Related Concepts\n\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [GitHub Workflow Guide](./github-workflow.md)\n- [Deployment Guide](./deployment-guide.md)\n- [Implementation Checklist](./implementation-checklist.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Closeout Process","description":"Post-enhancement ship flow for publishing branches, verifying from remote, summarizing state, cleanup, and global install","resource":"./templates/instructional-documents/close_out_items_shipping.md","tags":["designs","closeout","shipping","release","verification","cleanup"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Closeout Process\n\n## Prerequisites\n\n1. Confirm with requestor that pending changes are approved for shipping (no open TODOs, all reviews resolved)\n2. If the request explicitly says to perform close-out actions, do them without deflecting back\n3. If anything is unclear or unspecified, pause and ask, do not improvise\n4. Follow steps in order. Do not move to the next step if the previous could not be performed\n\n## Step 1: Publish the Branch and Tags\n\n- Fast-forward local `main` to contain approved enhancement commits\n- Push `main` to remote: `git push origin main`\n- Push the release tag: `git push origin [project_name]-vX.Y.Z`\n\n## Step 2: Verify from Remote Source of Truth\n\n- Create a fresh worktree from `origin/main`\n- Run the release build in the verification worktree\n- After build succeeds (and UAT signs off), remove the verification worktree\n\n## Step 3: Summarize Repository State\n\n- Report list of local branches still present\n- Confirm no staged or unstaged files\n- Record `origin/main` commit SHA and call out any divergence\n\n## Step 4: Cleanup (After Approval)\n\n- Remove temporary branches and worktrees created for the release\n\n## Step 5: Install the Released Binary Globally\n\n- Run `cargo install --path cli --bin [project_name]-agent` to update the user's default executable\n\n## Step 6: Document Release Metadata\n\n- List the latest five tags in reverse chronological order for stakeholder visibility\n\n## Key Rules\n\n- Do NOT continue if a step fails. Tell the user why and discuss how to plan the move forward.\n- Only ask follow-up questions when a detail is missing or ambiguous.\n- Steps must be followed sequentially.\n\n## Related Concepts\n\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [GitHub Workflow Guide](./github-workflow.md)\n- [Deployment Guide](./deployment-guide.md)\n- [Implementation Checklist](./implementation-checklist.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/convex-self-hosted.md","content":"---\ntype: Process\ntitle: Convex Self-Hosted Setup\ndescription: Self-hosted Convex infrastructure on Hetzner with Docker, dual environments, admin keys, and deployment workflows\nresource: ./templates/instructional-documents/convex-self-hosted-setup.md\ntags: [designs, convex, self-hosted, hetzner, docker, infrastructure, database, deployment]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Convex Self-Hosted Setup\n\n## Server Infrastructure\n\n- **Provider**: Hetzner Cloud (IP: 138.199.235.169)\n- **OS**: Linux with Docker\n- **Resources**: 7.5GB RAM, 75GB disk\n- **Services**: Convex (dev + prd), Supabase (dev + prd), N8N, Nginx\n\n## Environments\n\n| Environment | Backend URL | Dashboard URL |\n|-------------|-------------|---------------|\n| Development | dev.convex.macinations.au | dashboard.dev.convex.macinations.au |\n| Production | prd.convex.macinations.au | dashboard.prd.convex.macinations.au |\n\n## Docker Compose Configuration\n\nEach environment runs a Convex backend container and dashboard container. Key environment variables:\n- `POSTGRES_URL` - PostgreSQL connection to Supabase\n- `CONVEX_CLOUD_ORIGIN` / `CONVEX_SITE_ORIGIN` - Public URLs\n- `INSTANCE_SECRET` - 64-char hex for persistent admin keys\n\n### Port Mapping\n\n| Env | Service | Host Port | Container Port |\n|-----|---------|-----------|----------------|\n| Dev | Backend API | 16442 | 3210 |\n| Dev | HTTP Actions | 16444 | 3211 |\n| Dev | Dashboard | 16445 | 6791 |\n| Prd | Backend API | 16443 | 3210 |\n| Prd | HTTP Actions | 16447 | 3211 |\n| Prd | Dashboard | 16446 | 6791 |\n\nAll backend ports bound to `127.0.0.1` only; Nginx handles external access with SSL.\n\n## Admin Keys\n\nGenerated using `./generate_admin_key.sh` inside the backend container. Keys are persistent as long as `INSTANCE_SECRET` remains unchanged.\n\n## Database\n\nConvex uses a separate database called `convex_self_hosted` in each Supabase instance (not a schema in `postgres`). Internal tables: `documents`, `indexes`, `leases`, `persistence_globals`, `read_only`.\n\n## Local Development\n\n```bash\n# .env.local\nCONVEX_SELF_HOSTED_URL=https://dev.convex.macinations.au\nCONVEX_SELF_HOSTED_ADMIN_KEY=convex-self-hosted|01xxxxx...\nNEXT_PUBLIC_CONVEX_URL=https://dev.convex.macinations.au\n\n# Deploy\nnpx convex deploy\n\n# Deploy to prd\nCONVEX_SELF_HOSTED_URL=https://prd.convex.macinations.au \\\nCONVEX_SELF_HOSTED_ADMIN_KEY=\u003ckey> \\\nnpx convex deploy\n```\n\n## Vercel Integration\n\nNext.js frontend on Vercel connects to self-hosted Convex. Do NOT set `CONVEX_DEPLOYMENT` when using self-hosted Convex.\n\n## Stripe Webhooks\n\nStripe webhooks are handled by Convex HTTP actions (not Vercel/Next.js). Webhook URL: `https://prd.convex.macinations.au/stripe-webhook`\n\n## WorkOS Authentication\n\nRedirect URIs configured in WorkOS Dashboard for production and local dev. WorkOS env vars set in both Vercel and Convex.\n\n## Operations\n\n- Start/stop services via Docker Compose\n- View logs: `docker logs -f convex-dev-backend`\n- Health check: `curl -s https://dev.convex.macinations.au/version`\n- Data export/import: `npx convex export/import`\n- SSL via Certbot (Let's Encrypt), auto-renewed\n\n## Troubleshooting\n\n- WebSocket 1011 errors: deploy functions with `npx convex deploy`\n- Admin key invalid: check `INSTANCE_SECRET` in docker-compose\n- Server overload during import: trim large tables, stop non-essential services\n\n## Related Concepts\n\n- [Deployment Guide](./deployment-guide.md)\n- [Stripe Payment Integration](./stripe-payment-integration.md)\n- [WorkOS Auth Integration](./workos-auth-integration.md)\n- [GitHub Workflow Guide](./github-workflow.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Convex Self-Hosted Setup","description":"Self-hosted Convex infrastructure on Hetzner with Docker, dual environments, admin keys, and deployment workflows","resource":"./templates/instructional-documents/convex-self-hosted-setup.md","tags":["designs","convex","self-hosted","hetzner","docker","infrastructure","database","deployment"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Convex Self-Hosted Setup\n\n## Server Infrastructure\n\n- **Provider**: Hetzner Cloud (IP: 138.199.235.169)\n- **OS**: Linux with Docker\n- **Resources**: 7.5GB RAM, 75GB disk\n- **Services**: Convex (dev + prd), Supabase (dev + prd), N8N, Nginx\n\n## Environments\n\n| Environment | Backend URL | Dashboard URL |\n|-------------|-------------|---------------|\n| Development | dev.convex.macinations.au | dashboard.dev.convex.macinations.au |\n| Production | prd.convex.macinations.au | dashboard.prd.convex.macinations.au |\n\n## Docker Compose Configuration\n\nEach environment runs a Convex backend container and dashboard container. Key environment variables:\n- `POSTGRES_URL` - PostgreSQL connection to Supabase\n- `CONVEX_CLOUD_ORIGIN` / `CONVEX_SITE_ORIGIN` - Public URLs\n- `INSTANCE_SECRET` - 64-char hex for persistent admin keys\n\n### Port Mapping\n\n| Env | Service | Host Port | Container Port |\n|-----|---------|-----------|----------------|\n| Dev | Backend API | 16442 | 3210 |\n| Dev | HTTP Actions | 16444 | 3211 |\n| Dev | Dashboard | 16445 | 6791 |\n| Prd | Backend API | 16443 | 3210 |\n| Prd | HTTP Actions | 16447 | 3211 |\n| Prd | Dashboard | 16446 | 6791 |\n\nAll backend ports bound to `127.0.0.1` only; Nginx handles external access with SSL.\n\n## Admin Keys\n\nGenerated using `./generate_admin_key.sh` inside the backend container. Keys are persistent as long as `INSTANCE_SECRET` remains unchanged.\n\n## Database\n\nConvex uses a separate database called `convex_self_hosted` in each Supabase instance (not a schema in `postgres`). Internal tables: `documents`, `indexes`, `leases`, `persistence_globals`, `read_only`.\n\n## Local Development\n\n```bash\n# .env.local\nCONVEX_SELF_HOSTED_URL=https://dev.convex.macinations.au\nCONVEX_SELF_HOSTED_ADMIN_KEY=convex-self-hosted|01xxxxx...\nNEXT_PUBLIC_CONVEX_URL=https://dev.convex.macinations.au\n\n# Deploy\nnpx convex deploy\n\n# Deploy to prd\nCONVEX_SELF_HOSTED_URL=https://prd.convex.macinations.au \\\nCONVEX_SELF_HOSTED_ADMIN_KEY=\u003ckey> \\\nnpx convex deploy\n```\n\n## Vercel Integration\n\nNext.js frontend on Vercel connects to self-hosted Convex. Do NOT set `CONVEX_DEPLOYMENT` when using self-hosted Convex.\n\n## Stripe Webhooks\n\nStripe webhooks are handled by Convex HTTP actions (not Vercel/Next.js). Webhook URL: `https://prd.convex.macinations.au/stripe-webhook`\n\n## WorkOS Authentication\n\nRedirect URIs configured in WorkOS Dashboard for production and local dev. WorkOS env vars set in both Vercel and Convex.\n\n## Operations\n\n- Start/stop services via Docker Compose\n- View logs: `docker logs -f convex-dev-backend`\n- Health check: `curl -s https://dev.convex.macinations.au/version`\n- Data export/import: `npx convex export/import`\n- SSL via Certbot (Let's Encrypt), auto-renewed\n\n## Troubleshooting\n\n- WebSocket 1011 errors: deploy functions with `npx convex deploy`\n- Admin key invalid: check `INSTANCE_SECRET` in docker-compose\n- Server overload during import: trim large tables, stop non-essential services\n\n## Related Concepts\n\n- [Deployment Guide](./deployment-guide.md)\n- [Stripe Payment Integration](./stripe-payment-integration.md)\n- [WorkOS Auth Integration](./workos-auth-integration.md)\n- [GitHub Workflow Guide](./github-workflow.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/create-schema-diagrams.md","content":"---\ntype: Process\ntitle: Create Schema Diagrams\ndescription: How to create mermaid ER diagram concepts from database schema sources\nresource: ./templates/okf/DEPLOYMENT-RUNBOOK.md\ntags: [okf, schema, mermaid, er-diagram, database]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Create Schema Diagrams\n\nPhase 4 of the OKF deployment workflow. If the project has a database schema (SQL, SpacetimeDB, Prisma, etc.), create mermaid ER diagram concepts to document the data model.\n\n## Step 1: Read Schema Source\n\nIdentify and read the schema source files to determine all tables, columns, primary keys, foreign keys, and relationships. Also read any existing schema reference docs in `docs/` or `docs/design/`.\n\n## Step 2: Group Tables by Domain\n\nGroup tables into logical domains. For example:\n- **Planning:** planning_tables, route_tables, schedule_tables\n- **Orders:** order_tables, fulfillment_tables\n- **Users:** user_tables, auth_tables, profile_tables\n- **Inventory:** inventory_tables, stock_tables\n\n## Step 3: Create Domain Concepts\n\nFor each domain, create a concept file in `knowledge/domain/` with:\n\n- Type: `Domain`\n- A mermaid `erDiagram` code block showing all tables in that domain with key columns (PK, FK, business-critical fields)\n- Relationship lines within the domain\n- Table descriptions\n- Cross-domain relationship notes (mention but do not draw cross-domain lines)\n\n## Mermaid erDiagram Syntax\n\n```mermaid\nerDiagram\n    TABLE_A {\n        int id PK\n        string name\n        int table_b_id FK\n    }\n    TABLE_B {\n        int id PK\n        string description\n    }\n    TABLE_A ||--o{ TABLE_B : \"has many\"\n```\n\n### Relationship Line Types\n\n| Syntax | Meaning |\n|--------|---------|\n| `\\|\\|--o{` | One to many |\n| `\\|\\|--\\|\\|` | One to one |\n| `}o--o{` | Many to many |\n\n### Column Annotations\n\n- `PK` - Primary key\n- `FK` - Foreign key\n- Other columns listed by name and type\n\n## Step 4: Create Architecture Index Concept\n\nCreate an architecture concept that indexes all domain diagrams with a high-level domain relationship graph. This provides a top-level view of how domains relate to each other.\n\n## Step 5: Update Indexes and Log\n\n- Update `knowledge/domain/index.md` with the new domain concept rows.\n- Update `knowledge/architecture/index.md` with the schema index concept.\n- Update the root `index.md` with accurate counts.\n- Update `knowledge/log.md` with a schema diagram entry.\n\n## Viewer Rendering\n\nThe OKF viewer detects mermaid `erDiagram` code blocks in concept bodies and renders them inline using mermaid.js. The viewer scans for `\u003cpre>\u003ccode>` blocks whose content starts with `erDiagram`, replaces them with mermaid divs, and calls `mermaid.run()`. See [Viewer Architecture](../architecture/viewer-architecture.md).\n\n## Best Practices\n\n- Show only key columns (PK, FK, business-critical fields), not every column.\n- Keep diagram readability high; too many tables in one diagram becomes unreadable.\n- Use cross-domain notes to mention relationships that span domains without drawing them.\n- Include table descriptions as comments or text below the diagram.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Create Schema Diagrams","description":"How to create mermaid ER diagram concepts from database schema sources","resource":"./templates/okf/DEPLOYMENT-RUNBOOK.md","tags":["okf","schema","mermaid","er-diagram","database"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Create Schema Diagrams\n\nPhase 4 of the OKF deployment workflow. If the project has a database schema (SQL, SpacetimeDB, Prisma, etc.), create mermaid ER diagram concepts to document the data model.\n\n## Step 1: Read Schema Source\n\nIdentify and read the schema source files to determine all tables, columns, primary keys, foreign keys, and relationships. Also read any existing schema reference docs in `docs/` or `docs/design/`.\n\n## Step 2: Group Tables by Domain\n\nGroup tables into logical domains. For example:\n- **Planning:** planning_tables, route_tables, schedule_tables\n- **Orders:** order_tables, fulfillment_tables\n- **Users:** user_tables, auth_tables, profile_tables\n- **Inventory:** inventory_tables, stock_tables\n\n## Step 3: Create Domain Concepts\n\nFor each domain, create a concept file in `knowledge/domain/` with:\n\n- Type: `Domain`\n- A mermaid `erDiagram` code block showing all tables in that domain with key columns (PK, FK, business-critical fields)\n- Relationship lines within the domain\n- Table descriptions\n- Cross-domain relationship notes (mention but do not draw cross-domain lines)\n\n## Mermaid erDiagram Syntax\n\n```mermaid\nerDiagram\n    TABLE_A {\n        int id PK\n        string name\n        int table_b_id FK\n    }\n    TABLE_B {\n        int id PK\n        string description\n    }\n    TABLE_A ||--o{ TABLE_B : \"has many\"\n```\n\n### Relationship Line Types\n\n| Syntax | Meaning |\n|--------|---------|\n| `\\|\\|--o{` | One to many |\n| `\\|\\|--\\|\\|` | One to one |\n| `}o--o{` | Many to many |\n\n### Column Annotations\n\n- `PK` - Primary key\n- `FK` - Foreign key\n- Other columns listed by name and type\n\n## Step 4: Create Architecture Index Concept\n\nCreate an architecture concept that indexes all domain diagrams with a high-level domain relationship graph. This provides a top-level view of how domains relate to each other.\n\n## Step 5: Update Indexes and Log\n\n- Update `knowledge/domain/index.md` with the new domain concept rows.\n- Update `knowledge/architecture/index.md` with the schema index concept.\n- Update the root `index.md` with accurate counts.\n- Update `knowledge/log.md` with a schema diagram entry.\n\n## Viewer Rendering\n\nThe OKF viewer detects mermaid `erDiagram` code blocks in concept bodies and renders them inline using mermaid.js. The viewer scans for `\u003cpre>\u003ccode>` blocks whose content starts with `erDiagram`, replaces them with mermaid divs, and calls `mermaid.run()`. See [Viewer Architecture](../architecture/viewer-architecture.md).\n\n## Best Practices\n\n- Show only key columns (PK, FK, business-critical fields), not every column.\n- Keep diagram readability high; too many tables in one diagram becomes unreadable.\n- Use cross-domain notes to mention relationships that span domains without drawing them.\n- Include table descriptions as comments or text below the diagram.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/curation-pass.md","content":"---\ntype: Process\ntitle: OKF Bounded Curation Pass\ndescription: Explicit proposal-driven workflow with exact-root isolation, quotas, validation, checkpoints, recovery, and approval boundaries\nresource: ./templates/okf/agents/okf-curator.md\ntags: [okf, curation, inbox, validation, recovery, audit]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-contract\nevidence_refs: [templates/okf/agents/okf-curator.md, templates/okf/bin/okf-curate.mjs]\n---\n\n# Request and plan\n\nStatus and triage are explicit-root read-only evidence. They never trigger\ncuration. A separate operator request names the physical Git root and revision,\nidentity/reference, run ID, deterministic selected items and hashes, approved\ncontext, positive item/input/generated-byte/runtime ceilings, one session,\nexpected outcome, cancellation, and recovery.\n\nThe curator synthesizes only that bounded packet into an\n`okf-curation-proposal/1`. Every selected source is covered by at least one\nconcept output; outputs are uniquely sorted and include all affected type\nindexes, `knowledge/index.md`, `knowledge/inbox/index.md`, and\n`knowledge/log.md`, with source coverage, proposed content, expected target\nhashes, and generated provenance.\n\n# Execution\n\n`okf-curate --check-only` proves root/revision/containment, controls, source and\nproposal hashes, deterministic selection, quotas, and legacy preflight without\nmutating. `--execute` acquires one repository-local lock, stages and strictly\nvalidates concepts plus index/log maintenance, applies/checkpoints the complete\nbounded output set, postflights it, and only then moves selected source records\nto `inbox/processed/`. A stop during finalization restores any moved source and\nrolls every output back to retained recovery paths.\n\nAn active or stale lock, ambiguous kill switch, source/proposal drift, escaping\npath, quota, cancellation, or validation/reporting failure stops the run. Input,\nstaged/failed output, checkpoint, report, and backups remain recoverable. Resume\nis one new explicit request with the identical plan, hashes, proposal,\nroot/revision, allowlist, and limits; it is idempotent and never self-retries.\nPrior terminal reports are write-once; a later explicit attempt has a separate\nattempt identity.\n\n# Knowledge audit\n\nWithin the approved context, the curator consolidates redundancy, distinguishes\nhistorical/stale/proposed/inferred/verified assertions, preserves contradiction\nand rejected-path lessons, sharpens resources and citations, maintains stable\ntyped relationships, updates indexes/log, and reports AGENTS.md alignment as\nproposals. The replacement declares `supersedes` against the retained old\nconcept ID. The runner cannot patch AGENTS.md, invoke a network service, create\na schedule/Factory/child session, archive/delete sources, or traverse a parent\nworkspace.\n\n# Archive boundary\n\nArchive/compaction is a separate reversible manifest workflow with explicit\nselection, hashes, approval, destination receipts, index snapshots, rollback,\nwrite-once attempt reports, and no permanent-delete command. Its success does\nnot authorize curation or deletion.\n\n# Related concepts\n\n- [Bounded Curation Execution Safety](../decisions/bounded-curation-execution-safety.md)\n- [Curation Cadence and First Decision Gate](../decisions/curation-cadence-first-decision-gate.md)\n- [Inbox Quality and Retention Policy](../decisions/inbox-quality-and-retention-policy.md)\n- [Deploy OKF to a Project](./deploy-okf.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"OKF Bounded Curation
