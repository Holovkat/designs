md","content":"---\ntype: Domain\ntitle: OKF Index Structure\ndescription: How index.md files work at the root and in each subdirectory\nresource: ./templates/okf/templates/index.md\ntags: [okf, index, structure, navigation, progressive-disclosure]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# OKF Index Structure\n\nOKF uses index files at two levels to provide progressive disclosure: agents read the index first, then drill into specific concepts only when relevant.\n\n## Root Index (`knowledge/index.md`)\n\nThe root index lists all concept groups with counts and descriptions:\n\n```markdown\n# Project Knowledge Index\n\n> Last updated: 2026-06-29\n> OKF Version: 0.1\n\n## Concept Groups\n\n| Group | Count | Description |\n|-------|-------|-------------|\n| [Architecture](./architecture/index.md) | 5 | How the system is structured |\n| [Components](./components/index.md) | 12 | UI components and behavior |\n| [Domain](./domain/index.md) | 8 | Business logic and domain knowledge |\n| [Decisions](./decisions/index.md) | 3 | Architectural decisions and rationale |\n| [Process](./process/index.md) | 4 | How workflows operate |\n| [Deprecation](./deprecation/index.md) | 2 | Superseded concepts |\n| [State](./state/index.md) | 1 | Current state of play |\n| [Inbox](./inbox/index.md) | 3 | Items awaiting curation |\n\n## Quick Links\n\n- [Update Log](./log.md)\n- [Knowledge Graph Viewer](./viewer.html)\n- [OKF Standard](https://github.com/holovkat/designs/blob/main/templates/okf/OKF-STANDARD.md)\n```\n\nThe root index also records the OKF standard version and links to the viewer and log.\n\n## Subdirectory Index (`knowledge/\u003ctype>/index.md`)\n\nEach subdirectory has its own `index.md` listing all concepts in that directory:\n\n```markdown\n# Architecture Concepts\n\n| Title | Description | Tags | Status |\n|-------|-------------|------|--------|\n| [SpacetimeDB Tenant Model](./tenant-model.md) | Multi-tenant data isolation | [backend, spacetime-db] | active |\n| [Provider Hierarchy](./provider-hierarchy.md) | LLM provider abstraction | [llm, providers] | active |\n```\n\nEach row includes: title (as a link to the concept file), description, tags, and status. This allows agents to scan the index and decide which concepts to read without opening every file.\n\n## Inbox Index\n\nThe inbox index has a slightly different format to reflect inbox-specific fields:\n\n```markdown\n# Inbox\n\nSession syntheses awaiting curation.\n\n| Title | Timestamp | Tags | Issues |\n|-------|-----------|------|--------|\n```\n\n## Count Accuracy\n\nCounts in index files must match the actual number of concept files in each directory (excluding `index.md` itself). The [verification process](../process/verify-deployment.md) checks this by counting `.md` files per directory and comparing to the index.\n\n## When Indexes Are Updated\n\nIndexes must be updated whenever concepts are:\n- **Added:** New row in the subdirectory index, incremented count in the root index.\n- **Updated:** Description or tags may change; update the row.\n- **Removed/moved:** Remove the row, decrement the count. If moved to `deprecation/`, add a row in the deprecation index.\n- **Renamed:** Update the link path in the index.\n\nThe curation agent is responsible for keeping indexes current. See [Curation Pass](../process/curation-pass.md).\n\n## Log File (`knowledge/log.md`)\n\nThe log records knowledge updates in reverse chronological order:\n\n```markdown\n# Knowledge Update Log\n\n## 2026-06-29T14:00:00Z - Curation Cycle\n\n- **Added:** `architecture/tenant-model.md`\n- **Updated:** `state/current-state.md`\n- **Deprecated:** `deprecation/old-routing-engine.md`\n- **Processed inbox:** 3 items\n```\n\nThe log tracks bundle-level evolution. Git history provides file-level diff tracking.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Domain","title":"OKF Index Structure","description":"How index.md files work at the root and in each subdirectory","resource":"./templates/okf/templates/index.md","tags":["okf","index","structure","navigation","progressive-disclosure"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# OKF Index Structure\n\nOKF uses index files at two levels to provide progressive disclosure: agents read the index first, then drill into specific concepts only when relevant.\n\n## Root Index (`knowledge/index.md`)\n\nThe root index lists all concept groups with counts and descriptions:\n\n```markdown\n# Project Knowledge Index\n\n> Last updated: 2026-06-29\n> OKF Version: 0.1\n\n## Concept Groups\n\n| Group | Count | Description |\n|-------|-------|-------------|\n| [Architecture](./architecture/index.md) | 5 | How the system is structured |\n| [Components](./components/index.md) | 12 | UI components and behavior |\n| [Domain](./domain/index.md) | 8 | Business logic and domain knowledge |\n| [Decisions](./decisions/index.md) | 3 | Architectural decisions and rationale |\n| [Process](./process/index.md) | 4 | How workflows operate |\n| [Deprecation](./deprecation/index.md) | 2 | Superseded concepts |\n| [State](./state/index.md) | 1 | Current state of play |\n| [Inbox](./inbox/index.md) | 3 | Items awaiting curation |\n\n## Quick Links\n\n- [Update Log](./log.md)\n- [Knowledge Graph Viewer](./viewer.html)\n- [OKF Standard](https://github.com/holovkat/designs/blob/main/templates/okf/OKF-STANDARD.md)\n```\n\nThe root index also records the OKF standard version and links to the viewer and log.\n\n## Subdirectory Index (`knowledge/\u003ctype>/index.md`)\n\nEach subdirectory has its own `index.md` listing all concepts in that directory:\n\n```markdown\n# Architecture Concepts\n\n| Title | Description | Tags | Status |\n|-------|-------------|------|--------|\n| [SpacetimeDB Tenant Model](./tenant-model.md) | Multi-tenant data isolation | [backend, spacetime-db] | active |\n| [Provider Hierarchy](./provider-hierarchy.md) | LLM provider abstraction | [llm, providers] | active |\n```\n\nEach row includes: title (as a link to the concept file), description, tags, and status. This allows agents to scan the index and decide which concepts to read without opening every file.\n\n## Inbox Index\n\nThe inbox index has a slightly different format to reflect inbox-specific fields:\n\n```markdown\n# Inbox\n\nSession syntheses awaiting curation.\n\n| Title | Timestamp | Tags | Issues |\n|-------|-----------|------|--------|\n```\n\n## Count Accuracy\n\nCounts in index files must match the actual number of concept files in each directory (excluding `index.md` itself). The [verification process](../process/verify-deployment.md) checks this by counting `.md` files per directory and comparing to the index.\n\n## When Indexes Are Updated\n\nIndexes must be updated whenever concepts are:\n- **Added:** New row in the subdirectory index, incremented count in the root index.\n- **Updated:** Description or tags may change; update the row.\n- **Removed/moved:** Remove the row, decrement the count. If moved to `deprecation/`, add a row in the deprecation index.\n- **Renamed:** Update the link path in the index.\n\nThe curation agent is responsible for keeping indexes current. See [Curation Pass](../process/curation-pass.md).\n\n## Log File (`knowledge/log.md`)\n\nThe log records knowledge updates in reverse chronological order:\n\n```markdown\n# Knowledge Update Log\n\n## 2026-06-29T14:00:00Z - Curation Cycle\n\n- **Added:** `architecture/tenant-model.md`\n- **Updated:** `state/current-state.md`\n- **Deprecated:** `deprecation/old-routing-engine.md`\n- **Processed inbox:** 3 items\n```\n\nThe log tracks bundle-level evolution. Git history provides file-level diff tracking.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"domain/link-resolution.md","content":"---\ntype: Domain\ntitle: Link and Relationship Resolution in OKF\ndescription: Separation of stable semantic identifiers, typed relationships, Markdown citations, and resource navigation\nresource: ./templates/okf/viewer.html\ntags: [citations, identifiers, links, navigation, okf, relationships, viewer]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nid: okf-26000000-0000-4000-8000-000000000004\nassertion_state: verified\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: codex-epic-26\nsource_authority: repository-git\nevidence_refs: [templates/okf/viewer.html, templates/okf/generate-viz.js]\nverified_at: 2026-08-08T00:00:00Z\nverification_method: viewer-and-generator-review\nvalidity_basis: Current OKF viewer navigation and relationship model\n---\n\n# Link and Relationship Resolution in OKF\n\nOKF deliberately keeps three mechanisms separate:\n\n1. stable `id` values identify concepts across renames and file moves;\n2. typed frontmatter predicates assert semantic relationships by stable ID; and\n3. ordinary Markdown links provide citations and human navigation by path.\n\nFile paths remain repository locations, not semantic identities.\n\n## Typed Relationship Resolution\n\nThe generator parses accepted YAML with the pinned local runtime and builds an\nID map. It resolves `depends_on`, `implements`, `supersedes`, `derived_from`,\n`contradicts`, and `blocked_by` values against that map. The viewer renders each\npredicate and its inverse distinctly. Symmetric contradiction edges are\ndeduplicated.\n\nMissing targets, invalid target values, duplicate IDs, self-edges, cycles, and\nlegacy path-shaped values remain visible diagnostics. They are never silently\ndropped or converted into assertions.\n\n## Markdown Citations and Backlinks\n\nConcept bodies use normal relative Markdown links with `.md` extensions. The\nviewer resolves them relative to the source file, normalises `.` and `..`\nsegments within the knowledge bundle, and navigates to the matching concept\nfile. It separately computes a `Cited by` backlink list. These citations remain\nusable in ordinary Markdown and do not require the target to expose a stable ID.\n\n## Resource Navigation\n\nThe optional `resource` field may be a repository-root-relative file, issue, or\nexternal URI. Root-relative resources are resolved from the project root, not\nfrom the concept directory. Resource links do not become graph relationships.\n\n## Compatibility\n\nLegacy concepts without stable IDs remain browsable through an explicit\nfallback identity derived from their file location. The viewer marks that mode;\nnew strict concepts use stable IDs. This preserves gradual adoption without\nmaking legacy path identity the semantic contract.\n\nSee [Viewer Architecture](../architecture/viewer-architecture.md) and\n[OKF Semantic Query Helper](../architecture/okf-query-helper.md).\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Domain","title":"Link and Relationship Resolution in OKF","description":"Separation of stable semantic identifiers, typed relationships, Markdown citations, and resource navigation","resource":"./templates/okf/viewer.html","tags":["citations","identifiers","links","navigation","okf","relationships","viewer"],"timestamp":"2026-08-08T00:00:00Z","status":"active","id":"okf-26000000-0000-4000-8000-000000000004","assertion_state":"verified","generated_at":"2026-08-08T00:00:00Z","generated_by":"codex-epic-26","source_authority":"repository-git","evidence_refs":["templates/okf/viewer.html","templates/okf/generate-viz.js"],"verified_at":"2026-08-08T00:00:00Z","verification_method":"viewer-and-generator-review","validity_basis":"Current OKF viewer navigation and relationship model"},"body":"\n# Link and Relationship Resolution in OKF\n\nOKF deliberately keeps three mechanisms separate:\n\n1. stable `id` values identify concepts across renames and file moves;\n2. typed frontmatter predicates assert semantic relationships by stable ID; and\n3. ordinary Markdown links provide citations and human navigation by path.\n\nFile paths remain repository locations, not semantic identities.\n\n## Typed Relationship Resolution\n\nThe generator parses accepted YAML with the pinned local runtime and builds an\nID map. It resolves `depends_on`, `implements`, `supersedes`, `derived_from`,\n`contradicts`, and `blocked_by` values against that map. The viewer renders each\npredicate and its inverse distinctly. Symmetric contradiction edges are\ndeduplicated.\n\nMissing targets, invalid target values, duplicate IDs, self-edges, cycles, and\nlegacy path-shaped values remain visible diagnostics. They are never silently\ndropped or converted into assertions.\n\n## Markdown Citations and Backlinks\n\nConcept bodies use normal relative Markdown links with `.md` extensions. The\nviewer resolves them relative to the source file, normalises `.` and `..`\nsegments within the knowledge bundle, and navigates to the matching concept\nfile. It separately computes a `Cited by` backlink list. These citations remain\nusable in ordinary Markdown and do not require the target to expose a stable ID.\n\n## Resource Navigation\n\nThe optional `resource` field may be a repository-root-relative file, issue, or\nexternal URI. Root-relative resources are resolved from the project root, not\nfrom the concept directory. Resource links do not become graph relationships.\n\n## Compatibility\n\nLegacy concepts without stable IDs remain browsable through an explicit\nfallback identity derived from their file location. The viewer marks that mode;\nnew strict concepts use stable IDs. This preserves gradual adoption without\nmaking legacy path identity the semantic contract.\n\nSee [Viewer Architecture](../architecture/viewer-architecture.md) and\n[OKF Semantic Query Helper](../architecture/okf-query-helper.md).\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"domain/ux-design-standards.md","content":"---\ntype: Domain\ntitle: UX Design Standards\ndescription: shadcn/ui with Tailwind v4 design system guidelines enforcing 4 font sizes, 2 weights, 8pt grid, and 60/30/10 color rule\nresource: ./templates/instructional-documents/ux_design_standards.md\ntags: [designs, ux, standards, shadcn, tailwind-v4, typography, grid-system, color-rule]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# UX Design Standards\n\n## Core Design Principles\n\n### 1. Typography System: 4 Sizes, 2 Weights\n\n- **4 Font Sizes Only**: Size 1 (large headings), Size 2 (subheadings), Size 3 (body), Size 4 (small text/labels)\n- **2 Font Weights Only**: Semibold (headings/emphasis), Regular (body/general)\n- Maintain clear visual hierarchy with limited options\n\n### 2. 8pt Grid System\n\n- All spacing values must be divisible by 8 or 4\n- Examples: 24px (not 25px), 12px (not 11px), 16px (not 15px)\n- Creates visual harmony and predictable patterns\n\n### 3. 60/30/10 Color Rule\n\n- **60%**: Neutral color (white/light gray) - backgrounds, cards, containers\n- **30%**: Complementary color (dark gray/black) - text, icons, subtle UI\n- **10%**: Accent color (brand color) - CTAs, highlights, important indicators\n- Prevents visual stress while maintaining hierarchy\n\n### 4. Clean Visual Structure\n\n- Logical grouping of related elements\n- Deliberate spacing following the grid system\n- Proper alignment within containers\n- Simplicity over flashiness\n\n## Tailwind v4 Integration\n\n- Replace `@layer base` with `@theme` directive\n- Use `@import \"tailwindcss\"` instead of `@tailwind base`\n- Container queries built-in without plugins\n- OKLCH color format for better color perception\n\n## Component Architecture\n\n- 2-layered: Radix UI primitives (structure/behavior) + Tailwind CSS (style)\n- Class Variance Authority (CVA) for variant styling\n- `data-slot` attribute for styling component parts\n- New-York style is the default recommended style\n\n## Installation\n\n```bash\nnpx create-next-app@latest my-app\ncd my-app\nnpx shadcn-ui@latest init\n```\n\nAdd components individually: `npx shadcn-ui@latest add button`\n\n## Advanced Features\n\n### Dark Mode\n- OKLCH colors for better accessibility\n- Custom variant: `@custom-variant dark (&:is(.dark *))`\n\n### Container Queries\n- Built-in support without plugins\n- `@min-*` and `@max-*` variants for ranges\n\n### Data Visualization\n- Chart components with chart-1 through chart-5 variables\n- Consistent color patterns\n\n## Code Review Checklist\n\n- Typography: only 4 font sizes and 2 font weights\n- Spacing: all values divisible by 8 or 4\n- Colors: follows 60/30/10 distribution\n- OKLCH color variables used properly\n- `@theme` directive for variables\n- `data-slot` attribute implemented\n- CVA for variants\n- Dark mode consistent\n- Accessibility standards maintained\n\n## Common Issues to Flag\n\n- Too many font sizes (more than 4)\n- Inconsistent spacing (not divisible by 8 or 4)\n- Overuse of accent colors (exceeding 10%)\n- Random or inconsistent margins/padding\n- Insufficient contrast between text and background\n- Unnecessary custom CSS when Tailwind utilities suffice\n\n## Related Concepts\n\n- [Design Tokens](./design-tokens.md)\n- [Component Patterns](../components/component-patterns.md)\n- [Layout Patterns](../components/layout-patterns.md)\n- [DESIGN.md Standard Specification](../architecture/design-standard-spec.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Domain","title":"UX Design Standards","description":"shadcn/ui with Tailwind v4 design system guidelines enforcing 4 font sizes, 2 weights, 8pt grid, and 60/30/10 color rule","resource":"./templates/instructional-documents/ux_design_standards.md","tags":["designs","ux","standards","shadcn","tailwind-v4","typography","grid-system","color-rule"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# UX Design Standards\n\n## Core Design Principles\n\n### 1. Typography System: 4 Sizes, 2 Weights\n\n- **4 Font Sizes Only**: Size 1 (large headings), Size 2 (subheadings), Size 3 (body), Size 4 (small text/labels)\n- **2 Font Weights Only**: Semibold (headings/emphasis), Regular (body/general)\n- Maintain clear visual hierarchy with limited options\n\n### 2. 8pt Grid System\n\n- All spacing values must be divisible by 8 or 4\n- Examples: 24px (not 25px), 12px (not 11px), 16px (not 15px)\n- Creates visual harmony and predictable patterns\n\n### 3. 60/30/10 Color Rule\n\n- **60%**: Neutral color (white/light gray) - backgrounds, cards, containers\n- **30%**: Complementary color (dark gray/black) - text, icons, subtle UI\n- **10%**: Accent color (brand color) - CTAs, highlights, important indicators\n- Prevents visual stress while maintaining hierarchy\n\n### 4. Clean Visual Structure\n\n- Logical grouping of related elements\n- Deliberate spacing following the grid system\n- Proper alignment within containers\n- Simplicity over flashiness\n\n## Tailwind v4 Integration\n\n- Replace `@layer base` with `@theme` directive\n- Use `@import \"tailwindcss\"` instead of `@tailwind base`\n- Container queries built-in without plugins\n- OKLCH color format for better color perception\n\n## Component Architecture\n\n- 2-layered: Radix UI primitives (structure/behavior) + Tailwind CSS (style)\n- Class Variance Authority (CVA) for variant styling\n- `data-slot` attribute for styling component parts\n- New-York style is the default recommended style\n\n## Installation\n\n```bash\nnpx create-next-app@latest my-app\ncd my-app\nnpx shadcn-ui@latest init\n```\n\nAdd components individually: `npx shadcn-ui@latest add button`\n\n## Advanced Features\n\n### Dark Mode\n- OKLCH colors for better accessibility\n- Custom variant: `@custom-variant dark (&:is(.dark *))`\n\n### Container Queries\n- Built-in support without plugins\n- `@min-*` and `@max-*` variants for ranges\n\n### Data Visualization\n- Chart components with chart-1 through chart-5 variables\n- Consistent color patterns\n\n## Code Review Checklist\n\n- Typography: only 4 font sizes and 2 font weights\n- Spacing: all values divisible by 8 or 4\n- Colors: follows 60/30/10 distribution\n- OKLCH color variables used properly\n- `@theme` directive for variables\n- `data-slot` attribute implemented\n- CVA for variants\n- Dark mode consistent\n- Accessibility standards maintained\n\n## Common Issues to Flag\n\n- Too many font sizes (more than 4)\n- Inconsistent spacing (not divisible by 8 or 4)\n- Overuse of accent colors (exceeding 10%)\n- Random or inconsistent margins/padding\n- Insufficient contrast between text and background\n- Unnecessary custom CSS when Tailwind utilities suffice\n\n## Related Concepts\n\n- [Design Tokens](./design-tokens.md)\n- [Component Patterns](../components/component-patterns.md)\n- [Layout Patterns](../components/layout-patterns.md)\n- [DESIGN.md Standard Specification](../architecture/design-standard-spec.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"inbox/2026-07-08T06-03-52Z-agents-hierarchy-okf-alignment.md","content":"---\ntype: Inbox\ntitle: Session 2026-07-08 - AGENTS hierarchy and OKF alignment\ndescription: Session synthesis for adding DOX-style AGENTS hierarchy discipline without replacing OKF.\ntags: [agents, okf, hierarchy, governance, documentation]\ntimestamp: 2026-07-08T06:03:52Z\nbranch: main\nissue_refs: []\nepic_refs: []\n---\n\n# Session 2026-07-08 - AGENTS hierarchy and OKF alignment\n\n## What Was Done\n\nUpdated the root `AGENTS.md` to add an `AGENTS Hierarchy` section. The new guidance makes `AGENTS.md` files operational contracts for their subtrees, requires agents to read the root and nearest applicable child files before substantial edits, and clarifies that closer AGENTS files control local implementation details while root-level OKF, safety, and governance rules remain binding.\n\nThe closeout instructions were also expanded to require an `AGENTS.md` chain drift check before the OKF inbox synthesis step.\n\n## Decisions Made\n\nThe DOX-style hierarchy discipline was adopted as an additive routing and contract layer, not as a replacement for OKF. `AGENTS.md` now owns local workflow, ownership, verification, and child-index routing. OKF remains the durable knowledge system for product, system, architecture, process, decision, deprecation, and state knowledge.\n\n## What Was Deprecated\n\nNo files or concepts were deprecated. The session explicitly rejected replacing OKF with an AGENTS-only documentation model.\n\n## Lessons Learned\n\nThe strongest part of the DOX model is local path-chain discipline: identify the touched paths, read every applicable `AGENTS.md`, and keep parent-child instructions current. The strongest part of this repository's existing model is OKF's curated knowledge taxonomy. The combined model should keep AGENTS files concise and operational while using OKF for durable knowledge.\n\n## Current State\n\nRoot `AGENTS.md` now records the combined model. Child AGENTS files were not changed because this session only adjusted the root operating contract. Future work that changes local scope, workflow, ownership, verification, or child indexes should update the nearest owning `AGENTS.md`; future knowledge lessons should still go through OKF inbox and curation.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Inbox","title":"Session 2026-07-08 - AGENTS hierarchy and OKF alignment","description":"Session synthesis for adding DOX-style AGENTS hierarchy discipline without replacing OKF.","tags":["agents","okf","hierarchy","governance","documentation"],"timestamp":"2026-07-08T06:03:52Z","branch":"main","issue_refs":[],"epic_refs":[]},"body":"\n# Session 2026-07-08 - AGENTS hierarchy and OKF alignment\n\n## What Was Done\n\nUpdated the root `AGENTS.md` to add an `AGENTS Hierarchy` section. The new guidance makes `AGENTS.md` files operational contracts for their subtrees, requires agents to read the root and nearest applicable child files before substantial edits, and clarifies that closer AGENTS files control local implementation details while root-level OKF, safety, and governance rules remain binding.\n\nThe closeout instructions were also expanded to require an `AGENTS.md` chain drift check before the OKF inbox synthesis step.\n\n## Decisions Made\n\nThe DOX-style hierarchy discipline was adopted as an additive routing and contract layer, not as a replacement for OKF. `AGENTS.md` now owns local workflow, ownership, verification, and child-index routing. OKF remains the durable knowledge system for product, system, architecture, process, decision, deprecation, and state knowledge.\n\n## What Was Deprecated\n\nNo files or concepts were deprecated. The session explicitly rejected replacing OKF with an AGENTS-only documentation model.\n\n## Lessons Learned\n\nThe strongest part of the DOX model is local path-chain discipline: identify the touched paths, read every applicable `AGENTS.md`, and keep parent-child instructions current. The strongest part of this repository's existing model is OKF's curated knowledge taxonomy. The combined model should keep AGENTS files concise and operational while using OKF for durable knowledge.\n\n## Current State\n\nRoot `AGENTS.md` now records the combined model. Child AGENTS files were not changed because this session only adjusted the root operating contract. Future work that changes local scope, workflow, ownership, verification, or child indexes should update the nearest owning `AGENTS.md`; future knowledge lessons should still go through OKF inbox and curation.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"inbox/2026-07-13T03-35-53Z-skill-governance-and-staged-verification.md","content":"---\ntype: Inbox\ntitle: Session 2026-07-13 - Skill governance and staged verification\ndescription: Central documentation alignment for deterministic skill governance and the Dev UAT versus QA application-readiness boundary.\ntags: [skills, governance, verification, dev-uat, qa, ci, quarantine, documentation]\ntimestamp: 2026-07-13T03:35:53Z\nbranch: main\nissue_refs: []\nepic_refs: []\n---\n\n# Session 2026-07-13 - Skill governance and staged verification\n\n## What Was Done\n\nAdded a central skill-governance reference defining ownership across designs, agent-skill-distro, project repositories, and installed harness roots. Updated the delivery lifecycle, testing template, README, rendered workflow guide, skill canonicalisation decision, distribution process, indexes, and current-state documentation.\n\nThe documented verification model now uses T1 targeted development checks, T2 sprint checkpoints, T3 Dev UAT for completed sprint or epic functionality, T4 full QA application-readiness regression, and T5 governed release verification.\n\n## Decisions Made\n\nDesigns remains canonical for reusable workflow content explicitly authored and mapped here. Agent-skill-distro is canonical for distribution topology, harness overlays, deterministic auditing, reversible quarantine, and skill CI. Project repositories remain authoritative for local acceptance criteria, canonical environments, risk-specific commands, and the nearest AGENTS contract.\n\nDev UAT and QA are separate gates. Dev UAT proves the delivered sprint or epic functionality in canonical Dev. QA application readiness runs the full repository and end-to-end regression after approved deployment to canonical QA.\n\nRepeatable structural checks should be scripts. The model selects the applicable path and interprets evidence; it should not repeatedly improvise stable validation mechanics.\n\n## What Was Deprecated\n\nThe documentation supersedes mandatory whole-application regression after every small edit, combined QA/UAT terminology, fixed retired phase agents with per-phase full QA, globally forced verification plugins that override project staging, and persistent compressed-language modes that can reduce operational clarity.\n\n## Lessons Learned\n\nCalling designs the source of every skill was too broad. It created ambiguity for distro-native policy and runtime adapters. Canonical ownership must be declared per asset.\n\nEfficient delivery does not mean removing tests. It means testing changed behavior immediately, expanding verification at coherent boundaries, and reserving full regression for the QA application-readiness gate.\n\n## Current State\n\nThe central operating model now matches the live skill distro implemented by commits `7ef1581` and `e744271`. The distro has a strict cross-runtime audit, behavioral tests, reversible quarantine, and a GitHub Actions gate. Installed skill discovery still requires a new harness session after plugin or catalogue changes.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Inbox","title":"Session 2026-07-13 - Skill governance and staged verification","description":"Central documentation alignment for deterministic skill governance and the Dev UAT versus QA application-readiness boundary.","tags":["skills","governance","verification","dev-uat","qa","ci","quarantine","documentation"],"timestamp":"2026-07-13T03:35:53Z","branch":"main","issue_refs":[],"epic_refs":[]},"body":"\n# Session 2026-07-13 - Skill governance and staged verification\n\n## What Was Done\n\nAdded a central skill-governance reference defining ownership across designs, agent-skill-distro, project repositories, and installed harness roots. Updated the delivery lifecycle, testing template, README, rendered workflow guide, skill canonicalisation decision, distribution process, indexes, and current-state documentation.\n\nThe documented verification model now uses T1 targeted development checks, T2 sprint checkpoints, T3 Dev UAT for completed sprint or epic functionality, T4 full QA application-readiness regression, and T5 governed release verification.\n\n## Decisions Made\n\nDesigns remains canonical for reusable workflow content explicitly authored and mapped here. Agent-skill-distro is canonical for distribution topology, harness overlays, deterministic auditing, reversible quarantine, and skill CI. Project repositories remain authoritative for local acceptance criteria, canonical environments, risk-specific commands, and the nearest AGENTS contract.\n\nDev UAT and QA are separate gates. Dev UAT proves the delivered sprint or epic functionality in canonical Dev. QA application readiness runs the full repository and end-to-end regression after approved deployment to canonical QA.\n\nRepeatable structural checks should be scripts. The model selects the applicable path and interprets evidence; it should not repeatedly improvise stable validation mechanics.\n\n## What Was Deprecated\n\nThe documentation supersedes mandatory whole-application regression after every small edit, combined QA/UAT terminology, fixed retired phase agents with per-phase full QA, globally forced verification plugins that override project staging, and persistent compressed-language modes that can reduce operational clarity.\n\n## Lessons Learned\n\nCalling designs the source of every skill was too broad. It created ambiguity for distro-native policy and runtime adapters. Canonical ownership must be declared per asset.\n\nEfficient delivery does not mean removing tests. It means testing changed behavior immediately, expanding verification at coherent boundaries, and reserving full regression for the QA application-readiness gate.\n\n## Current State\n\nThe central operating model now matches the live skill distro implemented by commits `7ef1581` and `e744271`. The distro has a strict cross-runtime audit, behavioral tests, reversible quarantine, and a GitHub Actions gate. Installed skill discovery still requires a new harness session after plugin or catalogue changes.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"inbox/2026-08-06-002348-activate-tier-1-capture-hook-27.md","content":"---\ntype: Inbox\ntitle: activate Tier 1 capture hook #27\ndescription: Commit capture for 374104e\ntags: [okf, okf]\ntimestamp: 2026-08-06T00:23:48Z\ncommit_sha: 374104e24bf3edab627a730b4d14a034c10ba1bf\nbranch: main\nissue_refs: [27]\ncapture_tier: commit\n---\n\n# Why And How\n\nThe active hook path still used the re ile decision\ntags: [okf, capture-tier, curation, hooks, skills, governance, semantic-profile]\ntimestamp: 2026-08-06T07:59:19Z\nsession_id: 019fd470-7afa-7023-bdbd-0d971652dacf\ncommit_sha: [374104e24bf3edab627a730b4d14a034c10ba1bf, 44e72a088209ecb52138ac60658c05dd83254dc6, e575f34dc720dbfead37fef55827186ecf8c3b4e, 4c9aa397fb1be50adf30724b6b52ec5babf3a7e8, 5015ffa3fdef8b89ca76c349aae7cdebd5144842, ecb76f8, 20acf252fb92a7b4da26dd058738102b96487a92, 0d572f1e477782fa8599358786b309063e3a8c95, e5ab653c22e0bc2e7134f64415adadf494a758f3, c0c46f39b8e81a6c5613792aeb45620aeb38b52f, e0d4c15ab9e3b26945014981307f2f776a5aec69, be07530fdde907745a79b6689d38b6ec2859586c, 8262c9be5655e382a8721cbe504b72e00d3383b3, 1dc02c2740028e574c9f6833f78d8b39b71042af, 241d4c77d395730dbb42b6586f4a38219cd03d20, 83249e95d058b5f3c63c57baea1a9759257b31a7, 85fe8fe85519e0bc6fe3207ca666ea245776b083, 86a6bbcc9e312e4a3126095933825d565b2db0ac, 985623453265cefd55301825ce5ff3066aa2f08b, b578c43d74e63a7b173fbd7923216238c541a7dd]\nbranch: main\nissue_refs: [26, 27, 28, 29, 30, 31]\nepic_refs: [26]\ncapture_tier: session\n---\n\n# Decisions Made\n\n- The post-commit hook owns compact commit-local rationale; `end-session` owns\n  the single complementary session synthesis and capture persistence.\n- `okf-capture: persist session captures` is the terminal session-close subject,\n  while `okf-curation:` is reserved for bounded curator output. Both are loop\n  guards in the hook.\n- The hook may not invoke a parent-workspace manifest generator: `20acf25`\n  removed the cross-repository side effect and added an isolation fixture.\n- The operator approved the A4 warning-first retention policy and A5 explicit,\n  repository-scoped status-review model. This authorized Phase B design, not\n  scheduled or automatic curation.\n- The operator approved a portable native semantic profile, stable typed\n  relationships, and flat provenance/assertion metadata. JSON-LD/RDF/SHACL are\n  deferred pending a future namespace/consumer decision.\n- C1 adds the `okf-core/1.0` frontmatter schema, synthetic strict/legacy\n  fixtures, and deterministic Ajv evidence. It does not validate live records\n  or modify capture, curation, or scheduler behavior.\n- C7 adds a safe shared YAML frontmatter parser with separate envelope\n  diagnostics and raw-body preservation. It does not yet change consumers.\n- C2 adds the warning-first local linter on C1/C7, with deterministic\n  text/JSON diagnostics, path confinement, and synthetic fixtures. It does not\n  mutate a live bundle or trigger work.\n- C4/C5 add fixture-only, standard-library safety primitives for a future\n  separately approved bounded run: exact-root/revision validation, explicit\n  caps, kill switch, atomic lock, bounded report/checkpoint, and resume checks.\n  They contain no executor, curator, scheduler, canary, or knowledge mutation.\n- The operator approved a narrow local parser-runtime distribution addendum for\n  installed C8/C9 consumers. It still forbids runtime dependency installation,\n  network access, and all curation/canary or semantic-web expansion.\n- The operator approved the C6 contract: a deterministic, explicit-root,\n  advisory-only inbox status report. It has no execution authority.\n- The approved `yaml@2.8.3` runtime is now vendored with a lockfile, integrity\n  record, local adapter, copy-only installer seam, and offline fixture proof.\n  It does not resolve a host package or install/fetch at use time.\n- C6 now provides an explicit-root inbox health report with fixed-clock tests,\n  advisory-only classifications, control-state reporting, and no write or\n  curation path.\n\n# What Was Deprecated\n\n- The active designs nudge-only hook and the unchained installer behavior are\n  superseded by canonical Tier 1 capture with preserved hook chaining.\n- The five-item curation nudge is retired; it was continuously noisy once every\n  ordinary commit produced a capture.\n- Parent-workspace manifest refresh is removed from the post-commit path; it\n  violated repository isolation.\n\n# Lessons Learned\n\n- `core.hooksPath` can silently disable hooks retained in `.git/hooks`; a\n  canonical hook must preserve and invoke a named predecessor.\n- Captures written after a commit need a terminal guarded persistence commit;\n  otherwise every session ends with a dirty knowledge tree.\n- A scheduling incident is a design constraint, not an invitation to rebuild\n  automation. Bounded, explicit operator action remains the only approved\n  curation path.\n- Hook code must be tested against an available parent-workspace script, not\n  merely its absence, to prove it cannot trigger cross-repository work.\n\n# Current State\n\n- Phase A0 is complete; P0 hook isolation is fixed and covered by the hook\n  suite. A1/A2 evidence and the approved A3/A4/A5 records are now canonical.\n- Canonical templates, the distributed `okf` skill, and the distributed\n  `end-session` skill share the two-tier cadence and terminal loop guard.\n- Phase B semantic-guardrail design and its B5 decision are operator-approved.\n  C1, C7, C2, C4, C5, C6, and the offline parser-runtime packaging are green at\n  T1. C8/C9 may now use the local runtime. C3 remains separately bounded by\n  A3/A4/A5. Any canary still needs named data, numeric limits, and separate\n  approval.\n- The historical inbox remains intentionally uncurated. This session did not\n  run curation, schedule work, launch Factory, or touch cross-project inboxes.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Inbox","title":"OKF Phase A gate and Phase B semantic design","description":"Session synthesis for the two-tier rollout, Phase A gate, and Phase B semantic-profile decision","tags":["okf","capture-tier","curation","hooks","skills","governance","semantic-profile"],"timestamp":"2026-08-06T07:59:19Z","session_id":"019fd470-7afa-7023-bdbd-0d971652dacf","commit_sha":["374104e24bf3edab627a730b4d14a034c10ba1bf","44e72a088209ecb52138ac60658c05dd83254dc6","e575f gger phrasing).\n- Added `scripts/sync-skill-distro.sh` (--check / --apply) to sync designs into agent-skill-distro, including okf into `shared/skills/` and the managed `workspace-projects/pi-extensions/skills/okf` source.\n- Ran the sync and the distro's update-skills refresh. OKF skill is now installed canonically in ~/.codex/skills, ~/.claude/skills, ~/.agents/skills, ~/.pi/agent/skills, and pi-extensions/skills.\n- Committed the 21 previously pending workflow/OKF files as-is before this work.\n\n# Decisions Made\n\n- The designs repo is the canonical source for workflow skills; agent-skill-distro syncs from it and distributes to CLI skill roots.\n- SKILL.md files are canonical; command files are thin pointers.\n- The OKF skill is globally distributed via distro `shared/skills/okf` with per-target symlinks (claude, codex, pi).\n\n# What Was Deprecated\n\n- The forked ~/.codex/skills/vibe-fix copy (backed up to ~/.skill-root-backups/20260705-103520 by the distro tooling, replaced with a managed symlink).\n- The divergent pi-extensions okf SKILL.md (replaced by the canonical copy via the distro's workspace-projects source).\n- Full duplicate bodies in commands/plan-review.md and commands/release-assess.md.\n\n# Lessons Learned\n\n- Skills without YAML frontmatter never trigger in CLI harnesses; the OKF skill had been undeployable since creation.\n- The distro's rsync --delete on managed roots silently reverts direct edits to live copies; always write to the distro source tree, not the live root.\n- Three-layer distribution (designs -> distro -> installed roots) drifts without an automated check; `sync-skill-distro.sh --check` now provides it.\n\n# Current State\n\n- Drift check reports \"In sync\" across designs, distro, and pi-extensions source.\n- agent-skill-distro and pi-extensions have uncommitted changes (synced files plus pre-existing in-flight work) awaiting the owner's commit.\n- design-standard-v01/ remains an untracked nested git clone in designs, intentionally not committed.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Inbox","title":"Session 2026-07-05 - Skill effectiveness review and canonicalisation","description":"Reviewed all project skills, fixed the OKF skill, de-duplicated commands vs skills, and made designs the canonical source with a sync script to agent-skill-distro","tags":["skills","okf","distribution","agent-skill-distro","workflow"],"timestamp":"2026-07-05T11:00:00Z","branch":"main"},"body":"\n# What Was Done\n\n- Effectiveness review of the 6 project skills in `templates/instructional-documents/skills/` plus the 12 workflow commands and the OKF system.\n- Fixed the OKF skill: added YAML frontmatter (name, description, trigger phrases), added a `\u003cdesigns>` repo-root resolution rule replacing machine-specific paths.\n- De-duplicated plan-review and release-assess: SKILL.md is now canonical (merged the richer command content in); `commands/plan-review.md` and `commands/release-assess.md` are thin pointers to the skills.\n- Enriched the vibe-fix description with trigger phrases from the drifted codex fork; the GitHub-issue-linked-to-epic behavior remains canonical.\n- Normalized frontmatter on worktree-session-lifecycle and worktree-toolkit-init (removed non-skill `model`/`tools` fields, added trigger phrasing).\n- Added `scripts/sync-skill-distro.sh` (--check / --apply) to sync designs into agent-skill-distro, including okf into `shared/skills/` and the managed `workspace-projects/pi-extensions/skills/okf` source.\n- Ran the sync and the distro's update-skills refresh. OKF skill is now installed canonically in ~/.codex/skills, ~/.claude/skills, ~/.agents/skills, ~/.pi/agent/skills, and pi-extensions/skills.\n- Committed the 21 previously pending workflow/OKF files as-is before this work.\n\n# Decisions Made\n\n- The designs repo is the canonical source for workflow skills; agent-skill-distro syncs from it and distributes to CLI skill roots.\n- SKILL.md files are canonical; command files
