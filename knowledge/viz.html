is better handled by the team's existing documentation practices.\n\n## Alternatives Considered\n\n- **Centralised knowledge store:** A single database or repository aggregating knowledge from all projects. Rejected because knowledge is project-specific, git is canonical, and centralisation adds infrastructure and access management complexity.\n- **Wiki or external system:** Use a wiki (e.g., Confluence, Notion) for project knowledge. Rejected because it violates the \"git is canonical\" principle and creates a dependency on external infrastructure.\n- **Per-team knowledge store:** One knowledge bundle per team, shared across the team's projects. Rejected because projects within a team may have different architectures and domain logic, leading to the same mixing problem as a centralised store.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/read-only-inbox-status-contract.md","content":"---\ntype: Decision\ntitle: Read-Only Inbox Status Contract\ndescription: Operator-approved A5/D1 support contract for explicit repository-local inbox health reporting without curation authority\nresource: docs/epic-26/c6-read-only-inbox-status-contract.md\ntags: [okf, inbox, status, curation-safety, read-only, triage]\ntimestamp: 2026-08-06T05:37:13Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\ndecision_status: operator-approved-a5-d1-contract-2026-08-06\n---\n\n# Decision\n\nThe operator approved this A5/D1 support surface as an explicit,\nrepository-local, read-only inbox\nstatus command. It measures a named bundle's direct pending inbox and reports\nadvisory quality, provenance, index, lock, and kill-switch facts. It neither\nstarts nor authorizes curation.\n\n# Constraints\n\nThe status command requires an absolute physical Git worktree root and rejects inferred roots,\nparent/home traversal, symlinks, and external scope. It has no execution,\nselector, quota, scheduling, notification, mutation, archive/delete, or\ncross-project behavior. Its findings remain warning-first report data; a status\nreport may not be interpreted as readiness, a queue, a trigger, or permission\nto run a curator.\n\nThe status command must reuse the approved C7 parser, C2-compatible diagnostics, and C4/C5\nread-only control-state readers. It must be distributed through the separately\napproved local parser-runtime packaging design and must not install/fetch\ndependencies at runtime or substitute an ad-hoc parser.\n\n# Approval Boundary\n\nThe `okf-inbox-status.mjs` command and its synthetic fixture evidence are\nimplemented in the canonical template. It remains a local read-only projection;\nno live-inbox canary has been run.\n\nThis decision authorizes A5/D1 status contract documentation and fixture-only\nimplementation work. It does not authorize a live-inbox canary, curator run,\nscheduler, hook integration, dependency refresh, archive/deletion, JSON-LD/RDF/\nSHACL, `AGENTS.md` changes, or cross-project rollout. Any future curation run\nstill needs its own named dataset, limits, success measures, stop/rollback plan,\nand explicit operator approval.\n\n# Task Label Correction\n\nThis record was originally labelled C6. Epic C6 means preflight, staging, and\npostflight validation inside the bounded curator and is implemented separately.\nThis read-only status surface belongs to the A5 manual cadence and supports D1\nclassification; the correction changes no authority or runtime behavior.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"Read-Only Inbox Status Contract","description":"Operator-approved A5/D1 support contract for explicit repository-local inbox health reporting without curation authority","resource":"docs/epic-26/c6-read-only-inbox-status-contract.md","tags":["okf","inbox","status","curation-safety","read-only","triage"],"timestamp":"2026-08-06T05:37:13Z","status":"active","issue_refs":[26],"epic_refs":[26],"decision_status":"operator-approved-a5-d1-contract-2026-08-06"},"body":"\n# Decision\n\nThe operator approved this A5/D1 support surface as an explicit,\nrepository-local, read-only inbox\nstatus command. It measures a named bundle's direct pending inbox and reports\nadvisory quality, provenance, index, lock, and kill-switch facts. It neither\nstarts nor authorizes curation.\n\n# Constraints\n\nThe status command requires an absolute physical Git worktree root and rejects inferred roots,\nparent/home traversal, symlinks, and external scope. It has no execution,\nselector, quota, scheduling, notification, mutation, archive/delete, or\ncross-project behavior. Its findings remain warning-first report data; a status\nreport may not be interpreted as readiness, a queue, a trigger, or permission\nto run a curator.\n\nThe status command must reuse the approved C7 parser, C2-compatible diagnostics, and C4/C5\nread-only control-state readers. It must be distributed through the separately\napproved local parser-runtime packaging design and must not install/fetch\ndependencies at runtime or substitute an ad-hoc parser.\n\n# Approval Boundary\n\nThe `okf-inbox-status.mjs` command and its synthetic fixture evidence are\nimplemented in the canonical template. It remains a local read-only projection;\nno live-inbox canary has been run.\n\nThis decision authorizes A5/D1 status contract documentation and fixture-only\nimplementation work. It does not authorize a live-inbox canary, curator run,\nscheduler, hook integration, dependency refresh, archive/deletion, JSON-LD/RDF/\nSHACL, `AGENTS.md` changes, or cross-project rollout. Any future curation run\nstill needs its own named dataset, limits, success measures, stop/rollback plan,\nand explicit operator approval.\n\n# Task Label Correction\n\nThis record was originally labelled C6. Epic C6 means preflight, staging, and\npostflight validation inside the bounded curator and is implemented separately.\nThis read-only status surface belongs to the A5 manual cadence and supports D1\nclassification; the correction changes no authority or runtime behavior.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/semantic-profile-and-semantic-web-scope.md","content":"---\ntype: Decision\ntitle: OKF Semantic Profile and Semantic-Web Scope\ndescription: Operator-approved portable native semantic profile with JSON-LD/RDF/SHACL deferred from the Phase C core\nresource: ./docs/epic-26/b5-semantic-web-scope-decision.md\ntags: [okf, semantic-profile, relationships, provenance, json-ld, rdf, shacl]\ntimestamp: 2026-08-06T04:06:20Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\ndecision_status: operator-approved-phase-c-core-2026-08-06\n---\n\n# Decision Status and Scope\n\nThe operator approved this Epic #26 B5 decision on 2026-08-06. Markdown/YAML\nand Git remain canonical. The approval authorizes only the scoped Phase C\nprofile/parser/linter/viewer/query packets defined below. It does not authorize\nan RDF store, JSON-LD exporter, SHACL engine, scheduler, curator run, canary,\narchive, deletion, cross-project rollout, or `AGENTS.md` change.\n\n# Proposed Decision\n\nAdopt `okf-core/1.0` as a portable native application-profile design, with\nwarning-first legacy compatibility and a flat strict core. Defer JSON-LD, RDF,\nand SHACL from the core scope until an explicit future consumer, durable\nnamespace/identity policy, and offline dependency plan are approved.\n\nThe profile uses one-line core scalars and flow arrays; preserves unknown fields;\nand reserves `x_\u003cowner>_\u003cname>` for portable extensions. Existing historical\nrecords remain retained with diagnostics rather than rewrite or removal.\n\n# Semantic Contract\n\n- Strict semantic relationship mode uses an opaque project-local\n  `okf-\u003clowercase-uuidv4>` `id` for permanent concepts that declare typed\n  relationships. IDs persist through rename, move, and deprecation; Markdown\n  links retain path-relative navigation.\n- Stored top-level flow-array predicates are `depends_on`, `implements`,\n  `supersedes`, `derived_from`, `contradicts`, and `blocked_by`. Targets are\n  project-local IDs; unresolved or invalid targets are visible warnings.\n- Under the new profile, `A supersedes B` means A replaces B. Existing\n  old-to-new path-valued `supersedes` records are retained as\n  `legacy-replaced-by-ambiguous`; no automatic conversion is authorized.\n- `assertion_state` is separate from lifecycle `status` and governance\n  `decision_status`. The controlled values are `verified`, `inferred`,\n  `proposed`, `historical`, and `stale`; legacy absence is a compatibility\n  classification. Initial provenance fields remain flat and record-level.\n- Local `resource` is repository-root-relative contextual metadata, not proof\n  or a JSON-LD identifier. Source authority is claim-scoped; external evidence\n  needs explicit repository identity and immutable locator.\n\n# JSON-LD/RDF/SHACL Scope\n\nThe isolated offline spike serialized a representative native record with an\nembedded temporary context twice to identical JSON bytes (SHA-256\n`378221e4aa3bd84c1c67039ea7d9eec17364aca05a0284ce036dc153e55636e7`).\nIt proves deterministic JSON serialization only. No JSON-LD/RDF/SHACL command\nor library was available, no dependency was installed, and no network was used.\n\nTherefore, do not add a remote context, RDF database, reasoner, SHACL engine,\nor semantic-web dependency in Phase C. Future export, if separately approved,\nmust use an embedded/pinned local context, explicit identity/namespace,\ndeterministic output, and no network requirement. DCMI and PROV-O are mapping\nevidence only; SKOS is limited to governed code lists; schema.org is\nconsumer-specific; FOAF and DBpedia are rejected without a concrete domain\nneed.\n\n# Phase C Boundary\n\nOn operator approval, C1 may create core-schema fixtures, C7 may establish the\nshared parser contract, C2 may add warning-first diagnostics, and C8/C9 may add\nlocal typed-relationship display/query after C7. All retain raw content and\navoid mutation, hooks, curators, schedules, external traversal, and RDF work.\n\nA3/A4/A5 still govern all curation-related work. This decision supplies neither\nper-run numeric quotas nor a named canary dataset, lock/checkpoint locations,\ncurator authority, or rollout approval.\n\n# Required Follow-up\n\nReconcile stale capture/manifest/nudge descriptions, legacy `supersedes`\nsemantics, resource resolution, parser limits, and curator gate wording before\nclaiming strict conformance. The complete B1–B5 evidence and fixture list are\nin `docs/epic-26/`.\n\n# Approval Boundary\n\nThe operator approved the scoped Phase C profile, parser, linter, viewer, and\nquery packets on 2026-08-06. Any JSON-LD/RDF/SHACL implementation or\ncuration/canary action still requires a separate approval.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"OKF Semantic Profile and Semantic-Web Scope","description":"Operator-approved portable native semantic profile with JSON-LD/RDF/SHACL deferred from the Phase C core","resource":"./docs/epic-26/b5-semantic-web-scope-decision.md","tags":["okf","semantic-profile","relationships","provenance","json-ld","rdf","shacl"],"timestamp":"2026-08-06T04:06:20Z","status":"active","issue_refs":[26],"epic_refs":[26],"decision_status":"operator-approved-phase-c-core-2026-08-06"},"body":"\n# Decision Status and Scope\n\nThe operator approved this Epic #26 B5 decision on 2026-08-06. Markdown/YAML\nand Git remain canonical. The approval authorizes only the scoped Phase C\nprofile/parser/linter/viewer/query packets defined below. It does not authorize\nan RDF store, JSON-LD exporter, SHACL engine, scheduler, curator run, canary,\narchive, deletion, cross-project rollout, or `AGENTS.md` change.\n\n# Proposed Decision\n\nAdopt `okf-core/1.0` as a portable native application-profile design, with\nwarning-first legacy compatibility and a flat strict core. Defer JSON-LD, RDF,\nand SHACL from the core scope until an explicit future consumer, durable\nnamespace/identity policy, and offline dependency plan are approved.\n\nThe profile uses one-line core scalars and flow arrays; preserves unknown fields;\nand reserves `x_\u003cowner>_\u003cname>` for portable extensions. Existing historical\nrecords remain retained with diagnostics rather than rewrite or removal.\n\n# Semantic Contract\n\n- Strict semantic relationship mode uses an opaque project-local\n  `okf-\u003clowercase-uuidv4>` `id` for permanent concepts that declare typed\n  relationships. IDs persist through rename, move, and deprecation; Markdown\n  links retain path-relative navigation.\n- Stored top-level flow-array predicates are `depends_on`, `implements`,\n  `supersedes`, `derived_from`, `contradicts`, and `blocked_by`. Targets are\n  project-local IDs; unresolved or invalid targets are visible warnings.\n- Under the new profile, `A supersedes B` means A replaces B. Existing\n  old-to-new path-valued `supersedes` records are retained as\n  `legacy-replaced-by-ambiguous`; no automatic conversion is authorized.\n- `assertion_state` is separate from lifecycle `status` and governance\n  `decision_status`. The controlled values are `verified`, `inferred`,\n  `proposed`, `historical`, and `stale`; legacy absence is a compatibility\n  classification. Initial provenance fields remain flat and record-level.\n- Local `resource` is repository-root-relative contextual metadata, not proof\n  or a JSON-LD identifier. Source authority is claim-scoped; external evidence\n  needs explicit repository identity and immutable locator.\n\n# JSON-LD/RDF/SHACL Scope\n\nThe isolated offline spike serialized a representative native record with an\nembedded temporary context twice to identical JSON bytes (SHA-256\n`378221e4aa3bd84c1c67039ea7d9eec17364aca05a0284ce036dc153e55636e7`).\nIt proves deterministic JSON serialization only. No JSON-LD/RDF/SHACL command\nor library was available, no dependency was installed, and no network was used.\n\nTherefore, do not add a remote context, RDF database, reasoner, SHACL engine,\nor semantic-web dependency in Phase C. Future export, if separately approved,\nmust use an embedded/pinned local context, explicit identity/namespace,\ndeterministic output, and no network requirement. DCMI and PROV-O are mapping\nevidence only; SKOS is limited to governed code lists; schema.org is\nconsumer-specific; FOAF and DBpedia are rejected without a concrete domain\nneed.\n\n# Phase C Boundary\n\nOn operator approval, C1 may create core-schema fixtures, C7 may establish the\nshared parser contract, C2 may add warning-first diagnostics, and C8/C9 may add\nlocal typed-relationship display/query after C7. All retain raw content and\navoid mutation, hooks, curators, schedules, external traversal, and RDF work.\n\nA3/A4/A5 still govern all curation-related work. This decision supplies neither\nper-run numeric quotas nor a named canary dataset, lock/checkpoint locations,\ncurator authority, or rollout approval.\n\n# Required Follow-up\n\nReconcile stale capture/manifest/nudge descriptions, legacy `supersedes`\nsemantics, resource resolution, parser limits, and curator gate wording before\nclaiming strict conformance. The complete B1–B5 evidence and fixture list are\nin `docs/epic-26/`.\n\n# Approval Boundary\n\nThe operator approved the scoped Phase C profile, parser, linter, viewer, and\nquery packets on 2026-08-06. Any JSON-LD/RDF/SHACL implementation or\ncuration/canary action still requires a separate approval.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/skill-canonicalisation.md","content":"---\ntype: Decision\ntitle: Workflow Skill Canonicalisation\ndescription: Designs owns reusable workflow content while agent-skill-distro owns distribution policy, runtime overlays, deterministic auditing, quarantine, and skill CI\nresource: ./scripts/sync-skill-distro.sh\ntags: [skills, canonicalisation, distribution, agent-skill-distro, skill-md, commands, okf]\ntimestamp: 2026-07-13T03:35:53Z\nstatus: active\n---\n\n# Decision: Workflow Skill Canonicalisation\n\n## Context\n\nThe designs repo contains project-local skills in `templates/instructional-documents/skills/` and workflow commands in `templates/instructional-documents/commands/`. Some skills and commands overlapped in purpose (e.g., `plan-review` skill and `commands/plan-review.md`), leading to duplication and drift. Skills were also distributed manually to CLI skill roots (`~/.codex/skills`, `~/.claude/skills`, etc.), which was error-prone and led to divergent copies.\n\nA second issue: the OKF skill (`templates/instructional-documents/skills/okf/SKILL.md`) lacked YAML frontmatter (`name`, `description`, trigger phrases), which meant CLI harnesses could never auto-trigger it. It had been effectively undeployable since creation.\n\n## Decision\n\n1. **Designs is canonical for reusable workflow content authored here.** Skills under `templates/instructional-documents/skills/`, operating-model guidance, and reusable templates are edited in this repo and synced outward.\n2. **SKILL.md is canonical over command files.** Where a skill and a command cover the same workflow, the SKILL.md holds the full content and the command file is a thin pointer to the skill.\n3. **Agent-skill-distro is canonical for distribution mechanics and policy.** It owns shared and harness-specific roots, runtime adapters, deterministic audits, quarantine manifests, and skill CI. Distro-native skills do not need a duplicate source in designs.\n4. **Three-layer distribution model:** designs reusable content -> agent-skill-distro distribution and policy -> installed CLI roots. `scripts/sync-skill-distro.sh` manages only explicitly mapped assets.\n5. **Project repositories remain authoritative for local behavior.** Their nearest `AGENTS.md`, project skills, acceptance criteria, canonical environments, and risk-specific commands override generic workflow detail without weakening global safety or release authority.\n6. **The OKF skill is globally distributed** via the distro's `shared/skills/okf` with per-target symlinks.\n\n## Rationale\n\n- **Explicit source of truth:** Reusable content is edited in designs; runtime policy is edited in the distro; project-specific contracts stay with the project. This prevents circular copying and false claims that every skill must exist in all repositories.\n- **SKILL.md over commands:** Skills have richer metadata (YAML frontmatter with trigger phrases) and are auto-discoverable by CLI harnesses. Commands are invoked explicitly. Making SKILL.md canonical ensures the auto-triggerable version has the full content.\n- **Three-layer model:** Keeps the separation clean. Designs owns content, distro owns distribution, CLI roots are consumers. The `--check` mode of the sync script catches drift.\n- **Frontmatter is required for triggering:** Without `name` and `description` in YAML frontmatter, a skill is invisible to CLI harnesses. This is now enforced by the canonicalisation process.\n\n## What Was Done\n\n- Fixed the OKF skill: added YAML frontmatter (name, description, trigger phrases), added a `\u003cdesigns>` repo-root resolution rule replacing machine-specific paths.\n- De-duplicated `plan-review` and `release-assess`: SKILL.md is canonical (merged the richer command content in); `commands/plan-review.md` and `commands/release-assess.md` are thin pointers.\n- Enriched `vibe-fix` description with trigger phrases from the drifted codex fork.\n- Normalized frontmatter on `worktree-session-lifecycle` and `worktree-toolkit-init` (removed non-skill `model`/`tools` fields, added trigger phrasing).\n- Created `scripts/sync-skill-distro.sh` (`--check` / `--apply`) to sync designs into agent-skill-distro.\n- Ran the sync and the distro's update-skills refresh. OKF skill installed in `~/.codex/skills`, `~/.claude/skills`, `~/.agents/skills`, `~/.pi/agent/skills`, and `pi-extensions/skills`.\n\n### 2026-07-13 Governance Update\n\n- Defined the designs-versus-distro ownership boundary in `templates/instructional-documents/skill-governance.md`.\n- Adopted T1 development, T2 sprint checkpoint, T3 Dev UAT, T4 QA application readiness, and T5 release verification stages.\n- Recorded deterministic distro auditing, reversible quarantine, and CI enforcement as distribution-layer responsibilities.\n- Clarified that Dev UAT accepts changed sprint or epic functionality in Dev while full end-to-end regression belongs to QA application readiness.\n\n## What Was Deprecated\n\n- The forked `~/.codex/skills/vibe-fix` copy (backed up to `~/.skill-root-backups/`, replaced with a managed symlink).\n- The divergent `pi-extensions` OKF SKILL.md (replaced by the canonical copy via the distro's workspace-projects source).\n- Full duplicate bodies in `commands/plan-review.md` and `commands/release-assess.md` (now thin pointers).\n\n## Lessons Learned\n\n- Skills without YAML frontmatter never trigger in CLI harnesses; the OKF skill had been undeployable since creation.\n- The distro's `rsync --delete` on managed roots silently reverts direct edits to live copies; always write to the distro source tree, not the live root.\n- Three-layer distribution drifts without an automated check; `sync-skill-distro.sh --check` now provides it.\n- Treating designs as the source for every distro-native policy file creates a second form of drift. Ownership must be explicit per asset, not inferred from the word \"skill.\"\n\n## Alternatives Considered\n\n- **Single-layer distribution (designs directly to CLI roots):** Rejected because it couples content ownership with distribution mechanics and doesn't scale to multiple CLI harnesses.\n- **Commands as canonical over skills:** Rejected because commands lack the YAML frontmatter needed for auto-triggering and are not discoverable by CLI harnesses in the same way.\n- **No sync script, manual copying:** Rejected because manual copying is error-prone and leads to drift, as demonstrated by the divergent vibe-fix and OKF skill copies.\n\n## Related Concepts\n\n- [Skill Distribution Sync](../process/skill-distribution-sync.md) - The process for running the sync script\n- [OKF System Current State](../state/current-state.md) - Current deployment status\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"Workflow Skill Canonicalisation","description":"Designs owns reusable workflow content while agent-skill-distro owns distribution policy, runtime overlays, deterministic auditing, quarantine, and skill CI","resource":"./scripts/sync-skill-distro.sh","tags":["skills","canonicalisation","distribution","agent-skill-distro","skill-md","commands","okf"],"timestamp":"2026-07-13T03:35:53Z","status":"active"},"body":"\n# Decision: Workflow Skill Canonicalisation\n\n## Context\n\nThe designs repo contains project-local skills in `templates/instructional-documents/skills/` and workflow commands in `templates/instructional-documents/commands/`. Some skills and commands overlapped in purpose (e.g., `plan-review` skill and `commands/plan-review.md`), leading to duplication and drift. Skills were also distributed manually to CLI skill roots (`~/.codex/skills`, `~/.claude/skills`, etc.), which was error-prone and led to divergent copies.\n\nA second issue: the OKF skill (`templates/instructional-documents/skills/okf/SKILL.md`) lacked YAML frontmatter (`name`, `description`, trigger phrases), which meant CLI harnesses could never auto-trigger it. It had been effectively undeployable since creation.\n\n## Decision\n\n1. **Designs is canonical for reusable workflow content authored here.** Skills under `templates/instructional-documents/skills/`, operating-model guidance, and reusable templates are edited in this repo and synced outward.\n2. **SKILL.md is canonical over command files.** Where a skill and a command cover the same workflow, the SKILL.md holds the full content and the command file is a thin pointer to the skill.\n3. **Agent-skill-distro is canonical for distribution mechanics and policy s/plan-review.md` and `commands/release-assess.md` are thin pointers.\n- Enriched `vibe-fix` description with trigger phrases from the drifted codex fork.\n- Normalized frontmatter on `worktree-session-lifecycle` and `worktree-toolkit-init` (removed non-skill `model`/`tools` fields, added trigger phrasing).\n- Created `scripts/sync-skill-distro.sh` (`--check` / `--apply`) to sync designs into agent-skill-distro.\n- Ran the sync and the distro's update-skills refresh. OKF skill installed in `~/.codex/skills`, `~/.claude/skills`, `~/.agents/skills`, `~/.pi/agent/skills`, and `pi-extensions/skills`.\n\n### 2026-07-13 Governance Update\n\n- Defined the designs-versus-distro ownership boundary in `templates/instructional-documents/skill-governance.md`.\n- Adopted T1 development, T2 sprint checkpoint, T3 Dev UAT, T4 QA application readiness, and T5 release verification stages.\n- Recorded deterministic distro auditing, reversible quarantine, and CI enforcement as distribution-layer responsibilities.\n- Clarified that Dev UAT accepts changed sprint or epic functionality in Dev while full end-to-end regression belongs to QA application readiness.\n\n## What Was Deprecated\n\n- The forked `~/.codex/skills/vibe-fix` copy (backed up to `~/.skill-root-backups/`, replaced with a managed symlink).\n- The divergent `pi-extensions` OKF SKILL.md (replaced by the canonical copy via the distro's workspace-projects source).\n- Full duplicate bodies in `commands/plan-review.md` and `commands/release-assess.md` (now thin pointers).\n\n## Lessons Learned\n\n- Skills without YAML frontmatter never trigger in CLI harnesses; the OKF skill had been undeployable since creation.\n- The distro's `rsync --delete` on managed roots silently reverts direct edits to live copies; always write to the distro source tree, not the live root.\n- Three-layer distribution drifts without an automated check; `sync-skill-distro.sh --check` now provides it.\n- Treating designs as the source for every distro-native policy file creates a second form of drift. Ownership must be explicit per asset, not inferred from the word \"skill.\"\n\n## Alternatives Considered\n\n- **Single-layer distribution (designs directly to CLI roots):** Rejected because it couples content ownership with distribution mechanics and doesn't scale to multiple CLI harnesses.\n- **Commands as canonical over skills:** Rejected because commands lack the YAML frontmatter needed for auto-triggering and are not discoverable by CLI harnesses in the same way.\n- **No sync script, manual copying:** Rejected because manual copying is error-prone and leads to drift, as demonstrated by the divergent vibe-fix and OKF skill copies.\n\n## Related Concepts\n\n- [Skill Distribution Sync](../process/skill-distribution-sync.md) - The process for running the sync script\n- [OKF System Current State](../state/current-state.md) - Current deployment status\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"deprecation/paraffine-project-memory.md","content":"---\ntype: Deprecation\ntitle: Paraffine/AFFiNE Project Memory\ndescription: Retired external project-note workflow superseded by repository-native OKF knowledge bundles\nresource: ../../templates/instructional-documents/skill-governance.md\ntags: [okf, paraffine, affine, project-memory, skills, deprecated]\ntimestamp: 2026-07-13T03:54:51Z\nstatus: deprecated\nsupersedes: [affine-project-notes, paraffine]\ndeprecated_reason: OKF provides repository-native, typed, reviewable, and versioned project knowledge without a separate AFFiNE note path\ndeprecated_date: 2026-07-13\n---\n\n# What Was Retired\n\nThe Paraffine/AFFiNE project-memory workflow and its `affine-project-notes` skill are no longer active system capabilities. They previously stored project check-ins, lessons, alerts, and continuity notes in an external AFFiNE workspace.\n\n# Replacement\n\nUse the project's OKF `knowledge/` bundle:\n\n- query existing concepts before investigation;\n- write meaningful session syntheses to `knowledge/inbox/`;\n- curate durable knowledge into typed architecture, component, domain, decision, process, deprecation, and state concepts;\n- keep history reviewable with the project source in git.\n\nDo not recreate AFFiNE check-ins as a parallel completion requirement. Tracker evidence and repository-native OKF knowledge have distinct purposes and remain the authoritative paths.\n\n# Scope Boundary\n\nThis deprecation applies to project memory and agent workflow. The separate `para-organizer` skill classifies personal filesystem content using the PARA method; it is not a project-memory system and is not superseded by OKF.\n\n# Reintroduction Rule\n\nThe retired skill identities remain blocked by deterministic distro audit policy. Reintroduction requires an explicit owner decision, a non-overlapping use case that OKF cannot meet, and removal of the blocked identity from policy in the same reviewed change.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Deprecation","title":"Paraffine/AFFiNE Project Memory","description":"Retired external project-note workflow superseded by repository-native OKF knowledge bundles","resource":"../../templates/instructional-documents/skill-governance.md","tags":["okf","paraffine","affine","project-memory","skills","deprecated"],"timestamp":"2026-07-13T03:54:51Z","status":"deprecated","supersedes":["affine-project-notes","paraffine"],"deprecated_reason":"OKF provides repository-native, typed, reviewable, and versioned project knowledge without a separate AFFiNE note path","deprecated_date":"2026-07-13"},"body":"\n# What Was Retired\n\nThe Paraffine/AFFiNE project-memory workflow and its `affine-project-notes` skill are no longer active system capabilities. They previously stored project check-ins, lessons, alerts, and continuity notes in an external AFFiNE workspace.\n\n# Replacement\n\nUse the project's OKF `knowledge/` bundle:\n\n- query existing concepts before investigation;\n- write meaningful session syntheses to `knowledge/inbox/`;\n- curate durable knowledge into typed architecture, component, domain, decision, process, deprecation, and state concepts;\n- keep history reviewable with the project source in git.\n\nDo not recreate AFFiNE check-ins as a parallel completion requirement. Tracker evidence and repository-native OKF knowledge have distinct purposes and remain the authoritative paths.\n\n# Scope Boundary\n\nThis deprecation applies to project memory and agent workflow. The separate `para-organizer` skill classifies personal filesystem content using the PARA method; it is not a project-memory system and is not superseded by OKF.\n\n# Reintroduction Rule\n\nThe retired skill identities remain blocked by deterministic distro audit policy. Reintroduction requires an explicit owner decision, a non-overlapping use case that OKF cannot meet, and removal of the blocked identity from policy in the same reviewed change.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"deprecation/passive-nudge-curation-cadence.md","content":"---\ntype: Deprecation\nid: okf-0d7a8c1e-9b4f-4d21-8a3c-7e5f6012b934\ntitle: Passive Threshold Nudge Curation Cadence\ndescription: Historical five-item post-commit nudge replaced by explicit manual status review and bounded operator-requested curation\nresource: ./templates/okf/post-commit.sh\ntags: [cadence, curation, deprecated, nudge, okf]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: deprecated\ndeprecated_reason: Count-based hook nudges became noisy under per-commit capture and did not prevent backlog accumulation\ndeprecated_date: 2026-08-08\nissue_refs: [26, 31]\nepic_refs: [26]\nassertion_state: historical\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-contract\nevidence_refs: [knowledge/decisions/curation-cadence-first-decision-gate.md, templates/okf/post-commit.sh]\n---\n\n# What Was the Issue\n\nThe former hook counted pending items and printed a reminder at five. Once the\nhook began writing one Tier 1 item per ordinary commit, count became a noisy\nproxy for workload, while passive reminders still allowed large backlogs to\naccumulate.\n\n# Why It Was Deprecated\n\nEpic #26 selected explicit repository-scoped status/triage at a coherent\ncheckpoint and a separately requested bounded batch. The prior nudge neither\nprovided the required quality evidence nor safe execution authority.\n\n# Lessons Learned\n\nInbox count is a review signal, not a trigger. Age, bytes, quality,\nprovenance, duplicates, lock/kill-switch state, usefulness, and operator intent\nmatter more. Hooks should remain fast and repository-local.\n\n# When This Might Be Relevant Again\n\nA non-mutating reminder could be reconsidered only if measured operator need\nshows that explicit checkpoints are insufficient and the reminder cannot create\nnoise, sessions, scheduling, traversal, or execution authority.\n\n# What to Watch Out For\n\nDo not reintroduce `OKF_NUDGE_THRESHOLD`, a hook-launched curator, scheduler,\nqueue, polling loop, Factory action, or automatic retry. Any new reminder model\nneeds a separate decision and canary evidence.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Deprecation","id":"okf-0d7a8c1e-9b4f-4d21-8a3c-7e5f6012b934","title":"Passive Threshold Nudge Curation Cadence","description":"Historical five-item post-commit nudge replaced by explicit manual status review and bounded operator-requested curation","resource":"./templates/okf/post-commit.sh","tags":["cadence","curation","deprecated","nudge","okf"],"timestamp":"2026-08-08T00:00:00Z","status":"deprecated","deprecated_reason":"Count-based hook nudges became noisy under per-commit capture and did not prevent backlog accumulation","deprecated_date":"2026-08-08","issue_refs":[26,31],"epic_refs":[26],"assertion_state":"historical","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-contract","evidence_refs":["knowledge/decisions/curation-cadence-first-decision-gate.md","templates/okf/post-commit.sh"]},"body":"\n# What Was the Issue\n\nThe former hook counted pending items and printed a reminder at five. Once the\nhook began writing one Tier 1 item per ordinary commit, count became a noisy\nproxy for workload, while passive reminders still allowed large backlogs to\naccumulate.\n\n# Why It Was Deprecated\n\nEpic #26 selected explicit repository-scoped status/triage at a coherent\ncheckpoint and a separately requested bounded batch. The prior nudge neither\nprovided the required quality evidence nor safe execution authority.\n\n# Lessons Learned\n\nInbox count is a review signal, not a trigger. Age, bytes, quality,\nprovenance, duplicates, lock/kill-switch state, usefulness, and operator intent\nmatter more. Hooks should remain fast and repository-local.\n\n# When This Might Be Relevant Again\n\nA non-mutating reminder could be reconsidered only if measured operator need\nshows that explicit checkpoints are insufficient and the reminder cannot create\nnoise, sessions, scheduling, traversal, or execution authority.\n\n# What to Watch Out For\n\nDo not reintroduce `OKF_NUDGE_THRESHOLD`, a hook-launched curator, scheduler,\nqueue, polling loop, Factory action, or automatic retry. Any new reminder model\nneeds a separate decision and canary evidence.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"deprecation/post-commit-inbox-capture.md","content":"---\ntype: Deprecation\ntitle: Post-Commit Inbox Capture (Metadata Writing Hook)\ndescription: Historical low-signal metadata stub hook superseded by quality-guarded Tier 1 rationale capture and complementary Tier 2 synthesis\nresource: ./templates/okf/post-commit.sh\ntags: [okf, git, hooks, post-commit, inbox, capture, deprecated]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: deprecated\ndeprecated_reason: Changed-file metadata duplicated Git and lacked rationale; the current hook captures compact why/how and impact with quality/provenance guards\ndeprecated_date: 2026-07-05\n---\n\n# What Was the Issue\n\nThe original post-commit hook wrote a markdown file to `knowledge/inbox/` after every commit, containing the commit SHA, subject, author, branch, timestamp, changed files list, and issue refs extracted from the commit subject. This created several problems:\n\n- **Noise in the inbox:** Every commit, including minor ones (typos, formatting, curation commits), generated an inbox stub. The inbox filled with low-signal items that the curation agent then had to triage alongside richer agent-written syntheses.\n- **Loop risk:** Curation commits themselves triggered the hook, which would write a new inbox item about the curation commit, leading to an infinite cycle. This required a special-case skip for `okf-curation:` commit message prefixes.\n- **Low-quality material:** Commit metadata alone (what files changed, what the subject was) is insufficient for good curation. The curation agent needs decisions, rationale, lessons learned, and current state, which only agent-written session syntheses provide.\n- **Duplicate prevention complexity:** After rebases that replayed the same commit, the hook needed duplicate-prevention guard conditions to avoid writing the same inbox file twice.\n\n# Why It Was Deprecated\n\nDuring the 2026-07-05 OKF curation audit session, the hook was rewritten to a manifest-refresh + curation nudge model. The specific triggers were:\n\n1. The OKF-first protocol and curation audit phase were added, emphasising that agents must write rich session syntheses before committing. This made the hook's lightweight metadata stubs redundant, since agents now produce far better inbox material.\n2. Four documents (AGENTS.md, AGENTS-OKF-SECTION.md, OKF-STANDARD.md, DEPLOYMENT-RUNBOOK.md) still described the old inbox-writing hook after the hook changed, demonstrating that instruction docs drift from tooling silently. The contradiction was flagged for this curation pass.\n3. The `knowledge/architecture/hook-system.md` concept still described the old metadata-writing hook, contradicting the actual `post-commit.sh` implementation.\n\nThat 2026-07-05 replacement was itself later superseded. The current hook writes\none compact, rationale-bearing Tier 1 record per ordinary commit, while\n`end-session` writes one complementary Tier 2 synthesis. It performs no manifest\nrefresh or threshold nudge.\n\n# Lessons Learned\n\n- **Hooks should be minimal and stable.** A bounded local write can be useful\n  when it captures commit rationale, remains non-fatal, avoids file-list\n  duplication, and has loop/deduplication/quality guards.\n- **The tiers are complementary.** Commit bodies supply why/how and impact;\n  session syntheses supply decisions, deprecations, lessons, and current state.\n- **Instruction docs drift silently from tooling.** When a hook's behavior changes, every document that describes it becomes stale. The AGENTS.md alignment check in the curation audit phase exists to catch exactly this class of contradiction.\n- **Commit metadata stubs added curation overhead without proportional value.** The curation agent had to read and dismiss low-signal stubs alongside rich syntheses. Removing the stubs streamlines curation.\n\n# When This Might Be Relevant Again\n\n- A project where agents are not available (e.g., a human-only team) and some form of automated commit capture is needed as a fallback. In that case, the hook could write minimal stubs, but the team should be aware of the noise and loop risks.\n- A project that wants a dual-source inbox (hook stubs + agent syntheses) and is willing to manage the signal-to-noise tradeoff. The duplicate-prevention and loop-skip guard conditions would need to be re-implemented.\n\n# What to Watch Out For\n\n- **Loop prevention:** Any hook that writes to the inbox must skip its own curation commits (the `okf-curation:` prefix check) to avoid infinite loops.\n- **Duplicate prevention:** Rebases and amend operations replay commits; the hook must check whether the target inbox file already exists before writing.\n- **Documentation sync:** If this approach is re-adopted, every document that describes the hook (AGENTS.md, OKF-STANDARD.md, DEPLOYMENT-RUNBOOK.md, the hook-system architecture concept) must be updated simultaneously. The AGENTS.md alignment audit should verify this.\n- **Signal-to-noise:** Hook stubs are low-signal. Consider whether the curation overhead of processing them is worth it when agent-written syntheses are available.\n\nSee the current hook design at [Post-Commit Tier 1 Capture System](../architecture/hook-system.md) and [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md).\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Deprecation","title":"Post-Commit Inbox Capture (Metadata Writing Hook)","description":"Historical low-signal metadata stub hook superseded by quality-guarded Tier 1 rationale capture and complementary Tier 2 synthesis","resource":"./templates/okf/post-commit.sh","tags":["okf","git","hooks","post-commit","inbox","capture","deprecated"],"timestamp":"2026-08-08T00:00:00Z","status":"deprecated","deprecated_reason":"Changed-file metadata duplicated Git and lacked rationale; the current hook captures compact why/how and impact with quality/provenance guards","deprecated_date":"2026-07-05"},"body":"\n# What Was the Issue\n\nThe original post-commit hook wrote a markdown file to `knowledge/inbox/` after every commit, containing the commit SHA, subject, author, branch, timestamp, changed files list, and issue refs extracted from the commit subject. This created several problems:\n\n- **Noise in the inbox:** Every commit, including minor ones (typos, formatting, curation commits), generated an inbox stub. The inbox filled with low-signal items that the curation agent then had to triage alongside richer agent-written syntheses.\n- **Loop risk:** Curation commits themselves triggered the hook, which would write a new inbox item about the curation commit, leading to an infinite cycle. This required a special-case skip for `okf-curation:` commit message prefixes.\n- **Low-quality material:** Commit metadata alone (what files changed, what the subject was) is insufficient for good curation. The curation agent needs decisions, rationale, lessons learned, and current state, which only agent-written session syntheses provide.\n- **Duplicate prevention complexity:** After rebases that replayed the same commit, the hook needed duplicate-prevention guard conditions to avoid writing the same inbox file twice.\n\n# Why It Was Deprecated\n\nDuring the 2026-07-05 OKF curation audit session, the hook was rewritten to a manifest-refresh + curation nudge model. The specific triggers were:\n\n1. The OKF-first protocol and curation audit phase were added, emphasising that agents must write rich session syntheses before committing. This made the hook's lightweight metadata stubs redundant, since agents now produce far better inbox material.\n2. Four documents (AGENTS.md, AGENTS-OKF-SECTION.md, OKF-STANDARD.md, DEPLOYMENT-RUNBOOK.md) still described the old inbox-writing hook after the hook changed, demonstrating that instruction docs drift from tooling silently. The contradiction was flagged for this curation pass.\n3. The `knowledge/architecture/hook-system.md` concept still described the old metadata-writing hook, contradicting the actual `post-commit.sh` implementation.\n\nThat 2026-07-05 replacement was itself later superseded. The current hook writes\none compact, rationale-bearing Tier 1 record per ordinary commit, while\n`end-session` writes one complementary Tier 2 synthesis. It performs no manifest\nrefresh or threshold nudge.\n\n# Lessons Learned\n\n- **Hooks should be minimal and stable.** A bounded local write can be useful\n  when it captures commit rationale, remains non-fatal, avoids file-list\n  duplication, and has loop/deduplication/quality guards.\n- **The tiers are complementary.** Commit bodies supply why/how and impact;\n  session syntheses supply decisions, deprecations, lessons, and current state.\n- **Instruction docs drift silently from tooling.** When a hook's behavior changes, every document that describes it becomes stale. The AGENTS.md alignment check in the curation audit phase exists to catch exactly this class of contradiction.\n- **Commit metadata stubs added curation overhead without proportional value.** The curation agent had to read and dismiss low-signal stubs alongside rich syntheses. Removing the stubs streamlines curation.\n\n# When This Might Be Relevant Again\n\n- A project where agents are not available (e.g., a human-only team) and some form of automated commit capture is needed as a fallback. In that case, the hook could write minimal stubs, but the team should be aware of the noise and loop risks.\n- A project that wants a dual-source inbox (hook stubs + agent syntheses) and is willing to manage the signal-to-noise tradeoff. The duplicate-prevention and loop-skip guard conditions would need to be re-implemented.\n\n# What to Watch Out For\n\n- **Loop prevention:** Any hook that writes to the inbox must skip its own curation commits (the `okf-curation:` prefix check) to avoid infinite loops.\n- **Duplicate prevention:** Rebases and amend operations replay commits; the hook must check whether the target inbox file already exists before writing.\n- **Documentation sync:** If this approach is re-adopted, every document that describes the hook (AGENTS.md, OKF-STANDARD.md, DEPLOYMENT-RUNBOOK.md, the hook-system architecture concept) must be updated simultaneously. The AGENTS.md alignment audit should verify this.\n- **Signal-to-noise:** Hook stubs are low-signal. Consider whether the curation overhead of processing them is worth it when agent-written syntheses are available.\n\nSee the current hook design at [Post-Commit Tier 1 Capture System](../architecture/hook-system.md) and [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md).\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"deprecation/pre-tiered-post-commit-capture-model.md","content":"---\ntype: Deprecation\nid: okf-2a4f6c8e-1b3d-4e75-9a02-c6d8f103b547\ntitle: Pre-Tiered Post-Commit Capture Model\ndescription: Historical session-only and manifest-nudge model replaced by complementary Tier 1 commit capture and Tier 2 session synthesis\nresource: ./templates/okf/post-commit.sh\ntags: [capture, deprecated, hooks, inbox, okf]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: deprecated\ndeprecated_reason: Session-only capture and hook manifest nudges drifted from tooling and omitted compact per-commit rationale provenance\ndeprecated_date: 2026-08-08\nissue_refs: [26, 27, 28, 29, 30, 31]\nepic_refs: [26]\nassertion_state: historical\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-contract\nevidence_refs: [knowledge/process/two-tier-inbox-cadence.md, knowledge/decisions/capture-routing-and-curation-trigger.md]\n---\n\n# What Was the Issue\n\nThe old model alternated between hook metadata stubs and session syntheses while\nalso assigning the hook viewer-manifest and threshold-nudge duties. Documentation\nand live behavior diverged, and the model either lost commit rationale or\nduplicated low-signal data.\n\n# Why It Was Deprecated\n\nThe two-tier rollout established one compact rationale-bearing Tier 1 record per\nordinary commit and one complementary Tier 2 synthesis after committed work.\nTerminal `okf-capture:` and `okf-curation:` subjects prevent capture loops.\n\n# Lessons Learned\n\nGit is already the changed-file authority. Capture should preserve why/how,\nimpact, provenance, decisions, deprecations, lessons, and current state without\nrestating file lists. Capture mechanics and curation execution are separate.\n\n# When This Might Be Relevant Again\n\nA project without Git hooks may need a different Tier 1 transport, but it still\nneeds equivalent commit identity, safe quality handling, and complementary\nsession synthesis rather than metadata-only stubs.\n\n# What to Watch Out For\n\nDo not restore manifest refresh, parent-workspace scans, five-item nudges,\nsubject-only metadata stubs, or pre-commit session synthesis. Preserve one\nrecord per ordinary commit and explicit terminal persistence.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Deprecation","id":"okf-2a4f6c8e-1b3d-4e75-9a02-c6d8f103b547","title":"Pre-Tiered Post-Commit Capture Model","description":"Historical session-only and manifest-nudge model replaced by complementary Tier 1 commit capture and Tier 2 session synthesis","resource":"./templates/okf/post-commit.sh","tags":["capture","deprecated","hooks","inbox","okf"],"timestamp":"2026-08-08T00:00:00Z","status":"deprecated","deprecated_reason":"Session-only capture and hook manifest nudges drifted from tooling and omitted compact per-commit rationale provenance","deprecated_date":"2026-08-08","issue_refs":[26,27,28,29,30,31],"epic_refs":[26],"assertion_state":"historical","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-contract","evidence_refs":["knowledge/process/two-tier-inbox-cadence.md","knowledge/decisions/capture-routing-and-curation-trigger.md"]},"body":"\n# What Was the Issue\n\nThe old model alternated between hook metadata stubs and session syntheses while\nalso assigning the hook viewer-manifest and threshold-nudge duties. Documentation\nand live behavior diverged, and the model either lost commit rationale or\nduplicated low-signal data.\n\n# Why It Was Deprecated\n\nThe two-tier rollout established one compact rationale-bearing Tier 1 record per\nordinary commit and one complementary Tier 2 synthesis after committed work.\nTerminal `okf-capture:` and `okf-curation:` subjects prevent capture loops.\n\n# Lessons Learned\n\nGit is already the changed-file authority. Capture should preserve why/how,\nimpact, provenance, decisions, deprecations, lessons, and current state without\nrestating file lists. Capture mechanics and curation execution are separate.\n\n# When This Might Be Relevant Again\n\nA project without Git hooks may need a different Tier 1 transport, but it still\nneeds equivalent commit identity, safe quality handling, and complementary\nsession synthesis rather than metadata-only stubs.\n\n# What to Watch Out For\n\nDo not restore manifest refresh, parent-workspace scans, five-item nudges,\nsubject-only metadata stubs, or pre-commit session synthesis. Preserve one\nrecord per ordinary commit and explicit terminal persistence.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"domain/concept-types.md","content":"---\ntype: Domain\ntitle: OKF Concept Types\ndescription: Eight OKF record types, their directories, and their strict lifecycle responsibilities\nresource: ./templates/okf/OKF-STANDARD.md\ntags: [concepts, okf, taxonomy, types]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nid: okf-26000000-0000-4000-8000-000000000003\nassertion_state: verified\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: codex-epic-26\nsource_authority: repository-git\nevidence_refs: [templates/okf/OKF-STANDARD.md]\nverified_at: 2026-08-08T00:00:00Z\nverification_method: specification-review\nvalidity_basis: Current OKF Core 1.0 type contract\n---\n\n# OKF Concept Types\n\nOKF defines eight record types. Each permanent concept has one stable purpose\nand lives in the matching directory.\n\n| Type | Directory | Use |\n|---|---|---|\n| `Architecture` | `architecture/` | System structure, data models, infrastructure, and technical boundaries |\n| `Component` | `components/` | User-facing components and interaction behaviour |\n| `Domain` | `domain/` | Business entities, rules, vocabulary, and domain workflows |\n| `Decision` | `decisions/` | A choice, rationale, alternatives, and consequences |\n| `Process` | `process/` | Human or agent workflows, runbooks, gates, and operating procedures |\n| `Deprecation` | `deprecation/` | Retained history for a superseded concept or approach, including replacement and lessons |\n| `State` | `state/` | A dated current-state snapshot and its evidence boundary |\n| `Inbox` | `inbox/` | Tier 1 commit captures and Tier 2 session syntheses awaiting bounded curation |\n\n## Selection Rules\n\n- Prefer Decision when the durable value is why a choice was made; prefer\n  Architecture when it is the resulting structure.\n- Prefer Domain for problem-space rules and Process for how people or agents\n  perform work.\n- Prefer Component for visible interaction behaviour and Architecture for the\n  supporting system boundary.\n- State records are evidence-backed snapshots and should be refreshed or\n  superseded when facts change.\n- Never delete a superseded permanent concept. Retain it as Deprecation and\n  point `supersedes` from the new replacement's stable ID to the older ID.\n\n## Inbox Is Staging, Not a Permanent Concept Type\n\nTier 1 records are written after ordinary commits by the non-blocking local\nhook. Tier 2 records are written after committed work at session close. They\nhave different exact body contracts and are complementary. A successful,\nvalidated bounded run moves selected sources to `inbox/processed/`; an archive\nremains manifest-backed and reversible.\n\nSee [OKF Inbox Format](./inbox-format.md) and\n[OKF Frontmatter Schema](./frontmatter-schema.md).\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Domain","title":"OKF Concept Types","description":"Eight OKF record types, their directories, and their strict lifecycle responsibilities","resource":"./templates/okf/OKF-STANDARD.md","tags":["concepts","okf","taxonomy","types"],"timestamp":"2026-08-08T00:00:00Z","status":"active","id":"okf-26000000-0000-4000-8000-000000000003","assertion_state":"verified","generated_at":"2026-08-08T00:00:00Z","generated_by":"codex-epic-26","source_authority":"repository-git","evidence_refs":["templates/okf/OKF-STANDARD.md"],"verified_at":"2026-08-08T00:00:00Z","verification_method":"specification-review","validity_basis":"Current OKF Core 1.0 type contract"},"body":"\n# OKF Concept Types\n\nOKF defines eight record types. Each permanent concept has one stable purpose\nand lives in the matching directory.\n\n| Type | Directory | Use |\n|---|---|---|\n| `Architecture` | `architecture/` | System structure, data models, infrastructure, and technical boundaries |\n| `Component` | `components/` | User-facing components and interaction behaviour |\n| `Domain` | `domain/` | Business entities, rules, vocabulary, and domain workflows |\n| `Decision` | `decisions/` | A choice, rationale, alternatives, and consequences |\n| `Process` | `process/` | Human or agent workflows, runbooks, gates, and operating procedures |\n| `Deprecation` | `deprecation/` | Retained history for a superseded concept or approach, including replacement and lessons |\n| `State` | `state/` | A dated current-state snapshot and its evidence boundary |\n| `Inbox` | `inbox/` | Tier 1 commit captures and Tier 2 session syntheses awaiting bounded curation |\n\n## Selection Rules\n\n- Prefer Decision when the durable value is why a choice was made; prefer\n  Architecture when it is the resulting structure.\n- Prefer Domain for problem-space rules and Process for how people or agents\n  perform work.\n- Prefer Component for visible interaction behaviour and Architecture for the\n  supporting system boundary.\n- State records are evidence-backed snapshots and should be refreshed or\n  superseded when facts change.\n- Never delete a superseded permanent concept. Retain it as Deprecation and\n  point `supersedes` from the new replacement's stable ID to the older ID.\n\n## Inbox Is Staging, Not a Permanent Concept Type\n\nTier 1 records are written after ordinary commits by the non-blocking local\nhook. Tier 2 records are written after committed work at session close. They\nhave different exact body contracts and are complementary. A successful,\nvalidated bounded run moves selected sources to `inbox/processed/`; an archive\nremains manifest-backed and reversible.\n\nSee [OKF Inbox Format](./inbox-format.md) and\n[OKF Frontmatter Schema](./frontmatter-schema.md).\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"domain/design-tokens.md","content":"---\ntype: Domain\ntitle: Design Tokens System\ndescription: OKLCH-based design token system with CSS variables, Tailwind v4 integration, and Solar Dusk color palette\nresource: ./templates/ui-ux-guidelines/design-tokens.md\ntags: [designs, design-tokens, oklch, tailwind, css-variables, color-palette, solar-dusk]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Design Tokens System\n\n## Color System\n\nFMS-GLM uses OKLCH color space for perceptually uniform colors. The theme is a warm cream/orange palette called \"Solar Dusk\".\n\n### Color Palette\n\n| Token | Light Mode | Dark Mode |\n|-------|-----------|-----------|\n| background | Warm cream `oklch(0.9851 0.0009 67.81)` | Warm dark grey `oklch(0.2165 0.0032 67.66)` |\n| foreground | Dark warm grey `oklch(0.2710 0.0045 67.64)` | Cream `oklch(0.9625 0.0022 67.80)` |\n| primary | Burnt orange `oklch(0.6905 0.1939 42.48)` | Same burnt orange |\n| card | Pure white | Slightly lighter grey |\n| destructive | Red `oklch(0.6356 0.2082 25.38)` | Same red |\n\nThe burnt orange primary color remains consistent across modes for brand recognition.\n\n### Sidebar (Inverted in Light Mode)\n\nIn light mode, the sidebar uses a dark background for contrast:\n- Sidebar background: same as light foreground (dark warm grey)\n- Sidebar foreground: same as light background (warm cream)\n\n### Chart Colors\n\nFive chart color tokens (chart-1 through chart-5) in burnt orange, warm yellow, deep blue, teal, and bright yellow. Adjusted for dark mode visibility.\n\n## Tailwind v4 Integration\n\nCSS variables are mapped to Tailwind theme tokens via the `@theme inline` directive:\n\n```css\n@theme inline {\n  --color-background: var(--background);\n  --color-foreground: var(--foreground);\n  --color-card: var(--card);\n  --color-primary: var(--primary);\n  /* ... all semantic tokens mapped */\n}\n```\n\n## Semantic Color Usage\n\n| Token | Purpose |\n|-------|---------|\n| `bg-background` | Page/section backgrounds |\n| `bg-card` | Card surfaces |\n| `bg-muted` | Subtle backgrounds, hover states |\n| `bg-primary` | Primary actions, active states |\n| `bg-destructive` | Error/danger |\n| `text-foreground` | Primary text |\n| `text-muted-foreground` | Secondary text, descriptions |\n| `text-primary` | Accent text, links |\n| `border-border` | Standard borders |\n| `border-input` | Form input borders |\n\n## Typography\n\n| Property | Value |\n|----------|-------|\n| Sans | Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto |\n| Mono | JetBrains Mono, Menlo, Monaco, Consolas |\n| Serif | Georgia, serif |\n| Tracking | -0.01em (tighter for modern look) |\n\nText sizes range from `text-xs` (12px) to `text-2xl` (24px). Font weights: normal (400), medium (500), semibold (600).\n\n## Spacing System\n\nBase unit is `--spacing: 0.25rem` (4px). Standard values: 2px (0.5), 4px (1), 8px (2), 12px (3), 16px (4), 24px (6), 32px (8).\n\n## Border Radius\n\nBase `--radius: 0.5rem` (8px). Derived: sm (4px), md (6px), lg (8px), xl (12px), full (9999px).\n\n## Shadows\n\nWarm-tinted shadows in light mode, deeper blacks in dark mode. Scale from `shadow-2xs` to `shadow-2xl`.\n\n## Z-Index Scale\n\n| Value | Usage |\n|-------|-------|\n| z-0 | Base layer |\n| z-10 | Floating elements |\n| z-20 | Sidebar rails, sticky headers |\n| z-30 | Dropdowns |\n| z-40 | Modals, sheets |\n| z-50 | Full-screen overlays |\n\n## Animation Tokens\n\nCustom animations: `settle` (card drop into place) and `scanLine` (barcode scanner). Default transitions: 150ms (quick), 200ms (standard), 300ms (smooth).\n\n## Machine-Readable Tokens\n\nA `design-tokens.json` file is provided for Figma/Style Dictionary integration.\n\n## Related Concepts\n\n- [DESIGN.md Standard Specification](../architecture/design-standard-spec.md)\n- [UX Design Standards](./ux-design-standards.md)\n- [Component Patterns](../components/component-patterns.md)\n- [Layout Patterns](../components/layout-patterns.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Domain","title":"Design Tokens System","description":"OKLCH-based design token system with CSS variables, Tailwind v4 integration, and Solar Dusk color palette","resource":"./templates/ui-ux-guidelines/design-tokens.md","tags":["designs","design-tokens","oklch","tailwind","css-variables","color-palette","solar-dusk"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Design Tokens System\n\n## Color System\n\nFMS-GLM uses OKLCH color space for perceptually uniform colors. The theme is a warm cream/orange palette called \"Solar Dusk\".\n\n### Color Palette\n\n| Token | Light Mode | Dark Mode |\n|-------|-----------|-----------|\n| background | Warm cream `oklch(0.9851 0.0009 67.81)` | Warm dark grey `oklch(0.2165 0.0032 67.66)` |\n| foreground | Dark warm grey `oklch(0.2710 0.0045 67.64)` | Cream `oklch(0.9625 0.0022 67.80)` |\n| primary | Burnt orange `oklch(0.6905 0.1939 42.48)` | Same burnt orange |\n| card | Pure white | Slightly lighter grey |\n| destructive | Red `oklch(0.6356 0.2082 25.38)` | Same red |\n\nThe burnt orange primary color remains consistent across modes for brand recognition.\n\n### Sidebar (Inverted in Light Mode)\n\nIn light mode, the sidebar uses a dark background for contrast:\n- Sidebar background: same as light foreground (dark warm grey)\n- Sidebar foreground: same as light background (warm cream)\n\n### Chart Colors\n\nFive chart color tokens (chart-1 through chart-5) in burnt orange, warm yellow, deep blue, teal, and bright yellow. Adjusted for dark mode visibility.\n\n## Tailwind v4 Integration\n\nCSS variables are mapped to Tailwind theme tokens via the `@theme inline` directive:\n\n```css\n@theme inline {\n  --color-background: var(--background);\n  --color-foreground: var(--foreground);\n  --color-card: var(--card);\n  --color-primary: var(--primary);\n  /* ... all semantic tokens mapped */\n}\n```\n\n## Semantic Color Usage\n\n| Token | Purpose |\n|-------|---------|\n| `bg-background` | Page/section backgrounds |\n| `bg-card` | Card surfaces |\n| `bg-muted` | Subtle backgrounds, hover states |\n| `bg-primary` | Primary actions, active states |\n| `bg-destructive` | Error/danger |\n| `text-foreground` | Primary text |\n| `text-muted-foreground` | Secondary text, descriptions |\n| `text-primary` | Accent text, links |\n| `border-border` | Standard borders |\n| `border-input` | Form input borders |\n\n## Typography\n\n| Property | Value |\n|----------|-------|\n| Sans | Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto |\n| Mono | JetBrains Mono, Menlo, Monaco, Consolas |\n| Serif | Georgia, serif |\n| Tracking | -0.01em (tighter for modern look) |\n\nText sizes range from `text-xs` (12px) to `text-2xl` (24px). Font weights: normal (400), medium (500), semibold (600).\n\n## Spacing System\n\nBase unit is `--spacing: 0.25rem` (4px). Standard values: 2px (0.5), 4px (1), 8px (2), 12px (3), 16px (4), 24px (6), 32px (8).\n\n## Border Radius\n\nBase `--radius: 0.5rem` (8px). Derived: sm (4px), md (6px), lg (8px), xl (12px), full (9999px).\n\n## Shadows\n\nWarm-tinted shadows in light mode, deeper blacks in dark mode. Scale from `shadow-2xs` to `shadow-2xl`.\n\n## Z-Index Scale\n\n| Value | Usage |\n|-------|-------|\n| z-0 | Base layer |\n| z-10 | Floating elements |\n| z-20 | Sidebar rails, sticky headers |\n| z-30 | Dropdowns |\n| z-40 | Modals, sheets |\n| z-50 | Full-screen overlays |\n\n## Animation Tokens\n\nCustom animations: `settle` (card drop into place) and `scanLine` (barcode scanner). Default transitions: 150ms (quick), 200ms (standard), 300ms (smooth).\n\n## Machine-Readable Tokens\n\nA `design-tokens.json` file is provided for Figma/Style Dictionary integration.\n\n## Related Concepts\n\n- [DESIGN.md Standard Specification](../architecture/design-standard-spec.md)\n- [UX Design Standards](./ux-design-standards.md)\n- [Component Patterns](../components/component-patterns.md)\n- [Layout Patterns](../components/layout-patterns.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"domain/frontmatter-schema.md","content":"---\ntype: Domain\ntitle: OKF Frontmatter Schema\ndescription: OKF Core 1.0 fields, conditional requirements, semantic relationships, provenance, and compatibility modes\nresource: ./templates/okf/schema/okf-core-1.0.schema.json\ntags: [compatibility, frontmatter, metadata, okf, schema, yaml]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nid: okf-26000000-0000-4000-8000-000000000002\nassertion_state: verified\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: codex-epic-26\nsource_authority: repository-git\nevidence_refs: [templates/okf/schema/okf-core-1.0.schema.json, templates/okf/OKF-STANDARD.md]\nverified_at: 2026-08-08T00:00:00Z\nverification_method: schema-and-specification-review\nvalidity_basis: Current OKF Core 1.0 application profile\n---\n\n# OKF Frontmatter Schema\n\nOKF Markdown remains canonical. YAML frontmatter supplies the machine-checkable\nmetadata used by the shared parser, linter, curator, viewer, and semantic query\nhelper. The versioned JSON Schema is distributed locally; runtime validation\ndoes not require a network service or package download.\n\n## Core Record\n\nStrict durable concepts require:\n\n- one controlled `type` matching the containing concept directory;\n- non-empty `title` and `description`;\n- unique lowercase `tags`;\n- an RFC 3339 UTC `timestamp` and controlled lifecycle `status`; and\n- a stable project-local `id` in the `okf-\u003cuuid-v4>` form.\n\nConcepts created by the curator additionally require non-empty `generated_at`\nand `generated_by`. Inbox records have tier-specific capture/provenance fields\ninstead of a durable concept ID.\n\n## Typed Relationships\n\nThe six local predicates are `depends_on`, `implements`, `supersedes`,\n`derived_from`, `contradicts`, and `blocked_by`. Values are unique stable IDs,\nnever file paths. Empty arrays are valid. A replacement record points\n`supersedes` from the new concept to the older retained concept; a deprecation\nrecord is not required to reverse that edge.\n\nMarkdown links remain citations and navigation. They do not silently become\ntyped assertions.\n\n## Assertion and Evidence Fields\n\n`assertion_state` distinguishes `verified`, `inferred`, `proposed`,\n`historical`, and `stale` knowledge. Evidence-bearing records can state\n`source_authority`, immutable `evidence_refs`, `verified_at`,\n`verification_method`, and `validity_basis`. `generated_at` and `generated_by`\nidentify generated provenance; they do not by themselves make an assertion\nverified.\n\n## Type-Specific Rules\n\n- Decisions include rationale, alternatives, and consequences.\n- Deprecations include exactly one each of `# What Was the Issue`,\n  `# Why It Was Deprecated`, `# Lessons Learned`,\n  `# When This Might Be Relevant Again`, and `# What to Watch Out For` in that\n  order.\n- Tier 1 and Tier 2 Inbox records use their exact body contracts and full Git\n  identifiers.\n- Directory/type alignment and relationship target resolution are validated by\n  the repository linter because they require bundle context.\n\n## Extensions and Compatibility\n\nProject extensions use `x_`-prefixed fields unless registered by the profile.\nUnknown unprefixed fields are diagnostics. Validation has three retained\noutcomes: strict, legacy-compatible warning, and retained nonconformant. Warning\nmode audits existing bundles before opt-in enforcement; it does not rewrite or\ndiscard historical records.\n\nThe canonical details live in [OKF Standard](../../templates/okf/OKF-STANDARD.md)\nand the [OKF Core 1.0 schema](../../templates/okf/schema/okf-core-1.0.schema.json).\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Domain","title":"OKF Frontmatter Schema","description":"OKF Core 1.0 fields, conditional requirements, semantic relationships, provenance, and compatibility modes","resource":"./templates/okf/schema/okf-core-1.0.schema.json","tags":["compatibility","frontmatter","metadata","okf","schema","yaml"],"timestamp":"2026-08-08T00:00:00Z","status":"active","id":"okf-26000000-0000-4000-8000-000000000002","assertion_state":"verified","generated_at":"2026-08-08T00:00:00Z","generated_by":"codex-epic-26","source_authority":"repository-git","evidence_refs":["templates/okf/schema/okf-core-1.0.schema.json","templates/okf/OKF-STANDARD.md"],"verified_at":"2026-08-08T00:00:00Z","verification_method":"schema-and-specification-review","validity_basis":"Current OKF Core 1.0 application profile"},"body":"\n# OKF Frontmatter Schema\n\nOKF Markdown remains canonical. YAML frontmatter supplies the machine-checkable\nmetadata used by the shared parser, linter, curator, viewer, and semantic query\nhelper. The versioned JSON Schema is distributed locally; runtime validation\ndoes not require a network service or package download.\n\n## Core Record\n\nStrict durable concepts require:\n\n- one controlled `type` matching the containing concept directory;\n- non-empty `title` and `description`;\n- unique lowercase `tags`;\n- an RFC 3339 UTC `timestamp` and controlled lifecycle `status`; and\n- a stable project-local `id` in the `okf-\u003cuuid-v4>` form.\n\nConcepts created by the curator additionally require non-empty `generated_at`\nand `generated_by`. Inbox records have tier-specific capture/provenance fields\ninstead of a durable concept ID.\n\n## Typed Relationships\n\nThe six local predicates are `depends_on`, `implements`, `supersedes`,\n`derived_from`, `contradicts`, and `blocked_by`. Values are unique stable IDs,\nnever file paths. Empty arrays are valid. A replacement record points\n`supersedes` from the new concept to the older retained concept; a deprecation\nrecord is not required to reverse that edge.\n\nMarkdown links remain citations and navigation. They do not silently become\ntyped assertions.\n\n## Assertion and Evidence Fields\n\n`assertion_state` distinguishes `verified`, `inferred`, `proposed`,\n`historical`, and `stale` knowledge. Evidence-bearing records can state\n`source_authority`, immutable `evidence_refs`, `verified_at`,\n`verification_method`, and `validity_basis`. `generated_at` and `generated_by`\nidentify generated provenance; they do not by themselves make an assertion\nverified.\n\n## Type-Specific Rules\n\n- Decisions include rationale, alternatives, and consequences.\n- Deprecations include exactly one each of `# What Was the Issue`,\n  `# Why It Was Deprecated`, `# Lessons Learned`,\n  `# When This Might Be Relevant Again`, and `# What to Watch Out For` in that\n  order.\n- Tier 1 and Tier 2 Inbox records use their exact body contracts and full Git\n  identifiers.\n- Directory/type alignment and relationship target resolution are validated by\n  the repository linter because they require bundle context.\n\n## Extensions and Compatibility\n\nProject extensions use `x_`-prefixed fields unless registered by the profile.\nUnknown unprefixed fields are diagnostics. Validation has three retained\noutcomes: strict, legacy-compatible warning, and retained nonconformant. Warning\nmode audits existing bundles before opt-in enforcement; it does not rewrite or\ndiscard historical records.\n\nThe canonical details live in [OKF Standard](../../templates/okf/OKF-STANDARD.md)\nand the [OKF Core 1.0 schema](../../templates/okf/schema/okf-core-1.0.schema.json).\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"domain/inbox-format.md","content":"---\ntype: Domain\ntitle: OKF Inbox Format\ndescription: Complementary Tier 1 commit capture and Tier 2 session synthesis records awaiting bounded curation\nresource: ./templates/okf/OKF-STANDARD.md\ntags: [capture, inbox, okf, session-synthesis, tier-one, tier-two]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nid: okf-26000000-0000-4000-8000-000000000001\nassertion_state: verified\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: codex-epic-26\nsource_authority: repository-git\nevidence_refs: [templates/okf/OKF-STANDARD.md, templates/okf/post-commit.sh]\nverified_at: 2026-08-08T00:00:00Z\nverification_method: specification-and-hook-review\nvalidity_basis: Current canonical capture contract for the designs repository\n---\n\n# OKF Inbox Format\n\nInbox records are immutable staging material for a separately requested,\nrepository-scoped curation run. Two capture tiers are intentionally\ncomplementary: Tier 1 records ordinary commits compactly and Tier 2 records the\ndurable decisions and lessons from a meaningful session. Neither tier launches\ncuration, and neither is a substitute for curation.\n\n## Common Frontmatter\n\nBoth tiers use `type: Inbox` and strict-profile records include `title`,\n`description`, unique lowercase `tags`, an RFC 3339 UTC `timestamp`,\n`capture_tier`, `generated_at`, and `generated_by`. They may also carry\nrepository, branch, issue, and epic provenance. Inbox records do not declare a\ndurable concept `id` or typed semantic relationships.\n\n`commit_sha` uses full immutable Git identifiers: a string for Tier 1 and a\nnon-empty array for Tier 2. Legacy short SHAs and records without a tier remain\nretained and auditable in warning mode; they are not silently rewritten.\n\n## Tier 1 Commit Capture\n\nThe repository-local post-commit hook writes one `capture_tier: commit` record\nafter each ordinary commit. It deduplicates the exact commit SHA, normalises\ntags, escapes dynamic YAML/Markdown fields, and replaces oversized or raw-dump\ncontent with a compact Git reference. The source commit remains canonical.\n\nTier 1 bodies contain exactly these top-level sections in order:\n\n```markdown\n# Why And How\n\nWhy the commit was needed and how it was implemented.\n\n# Impact\n\nThe practical effect, risk, or follow-up.\n```\n\nA merge commit is not ordinary capture input. Capture warnings are non-fatal\nand do not disclose the rejected body. The explicit quality override may retain\nreviewed body content, but cannot reintroduce malformed YAML or duplicate tags.\n\n## Tier 2 Session Synthesis\n\nAt the close of a meaningful session, the `end-session` workflow writes one\n`capture_tier: session` synthesis after the work is committed. It references\nthe relevant full commit SHAs and has a UUID `session_id`. It records only\nknowledge that remains useful beyond the Tier 1 records and does not repeat a\ncompletion summary or file-by-file diff.\n\nTier 2 bodies contain exactly these top-level sections in order:\n\n```markdown\n# Decisions Made\n\n# What Was Deprecated\n\n# Lessons Learned\n\n# Current State\n```\n\n## Lifecycle\n\n1. A capture is written directly under `knowledge/inbox/` and indexed.\n2. Read-only status and triage may classify it without execution authority.\n3. An explicit bounded curator proposal covers selected sources by path, size,\n   and hash; validation must pass before finalisation.\n4. Successful curation moves each source byte-for-byte to\n   `knowledge/inbox/processed/` only after strict concept and maintenance\n   postflight validation. A stopped finalisation restores moved sources and the\n   prior output set before emitting terminal evidence.\n5. Operator-reviewed archive operations are manifest-backed and reversible;\n   no OKF path performs automatic permanent deletion.\n\nSee [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md),\n[Hook System](../architecture/hook-system.md), and\n[Curation Pass](../process/curation-pass.md).\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Domain","title":"OKF Inbox Format","description":"Complementary Tier 1 commit capture and Tier 2 session synthesis records awaiting bounded curation","resource":"./templates/okf/OKF-STANDARD.md","tags":["capture","inbox","okf","session-synthesis","tier-one","tier-two"],"timestamp":"2026-08-08T00:00:00Z","status":"active","id":"okf-26000000-0000-4000-8000-000000000001","assertion_state":"verified","generated_at":"2026-08-08T00:00:00Z","generated_by":"codex-epic-26","source_authority":"repository-git","evidence_refs":["templates/okf/OKF-STANDARD.md","templates/okf/post-commit.sh"],"verified_at":"2026-08-08T00:00:00Z","verification_method":"specification-and-hook-review","validity_basis":"Current canonical capture contract for the designs repository"},"body":"\n# OKF Inbox Format\n\nInbox records are immutable staging material for a separately requested,\nrepository-scoped curation run. Two capture tiers are intentionally\ncomplementary: Tier 1 records ordinary commits compactly and Tier 2 records the\ndurable decisions and lessons from a meaningful session. Neither tier launches\ncuration, and neither is a substitute for curation.\n\n## Common Frontmatter\n\nBoth tiers use `type: Inbox` and strict-profile records include `title`,\n`description`, unique lowercase `tags`, an RFC 3339 UTC `timestamp`,\n`capture_tier`, `generated_at`, and `generated_by`. They may also carry\nrepository, branch, issue, and epic provenance. Inbox records do not declare a\ndurable concept `id` or typed semantic relationships.\n\n`commit_sha` uses full immutable Git identifiers: a string for Tier 1 and a\nnon-empty array for Tier 2. Legacy short SHAs and records without a tier remain\nretained and auditable in warning mode; they are not silently rewritten.\n\n## Tier 1 Commit Capture\n\nThe repository-local post-commit hook writes one `capture_tier: commit` record\nafter each ordinary commit. It deduplicates the exact commit SHA, normalises\ntags, escapes dynamic YAML/Markdown fields, and replaces oversized or raw-dump\ncontent with a compact Git reference. The source commit remains canonical.\n\nTier 1 bodies contain exactly these top-level sections in order:\n\n```markdown\n# Why And How\n\nWhy the commit was needed and how it was implemented.\n\n# Impact\n\nThe practical effect, risk, or follow-up.\n```\n\nA merge commit is not ordinary capture input. Capture warnings are non-fatal\nand do not disclose the rejected body. The explicit quality override may retain\nreviewed body content, but cannot reintroduce malformed YAML or duplicate tags.\n\n## Tier 2 Session Synthesis\n\nAt the close of a meaningful session, the `end-session` workflow writes one\n`capture_tier: session` synthesis after the work is committed. It references\nthe relevant full commit SHAs and has a UUID `session_id`. It records only\nknowledge that remains useful beyond the Tier 1 records and does not repeat a\ncompletion summary or file-by-file diff.\n\nTier 2 bodies contain exactly these top-level sections in order:\n\n```markdown\n# Decisions Made\n\n# What Was Deprecated\n\n# Lessons Learned\n\n# Current State\n```\n\n## Lifecycle\n\n1. A capture is written directly under `knowledge/inbox/` and indexed.\n2. Read-only status and triage may classify it without execution authority.\n3. An explicit bounded curator proposal covers selected sources by path, size,\n   and hash; validation must pass before finalisation.\n4. Successful curation moves each source byte-for-byte to\n   `knowledge/inbox/processed/` only after strict concept and maintenance\n   postflight validation. A stopped finalisation restores moved sources and the\n   prior output set before emitting terminal evidence.\n5. Operator-reviewed archive operations are manifest-backed and reversible;\n   no OKF path performs automatic permanent deletion.\n\nSee [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md),\n[Hook System](../architecture/hook-system.md), and\n[Curation Pass](../process/curation-pass.md).\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"domain/index-structure.
