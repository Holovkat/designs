<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
<title>OKF Knowledge Viewer</title>
<script defer src="./viewer-assets/cytoscape-3.30.4.min.js"></script>
<script defer src="./viewer-assets/marked-12.0.2.min.js"></script>
<script defer src="./viewer-assets/dompurify-3.2.6.min.js"></script>
<script defer src="./viewer-assets/mermaid-11.4.1.min.js"></script>
<script defer src="./viewer-assets/okf-viewer.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
header { background: #161b22; padding: 10px 20px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
header .stats { font-size: 12px; color: #8b949e; }
nav { display: flex; gap: 2px; margin-left: 8px; }
nav button { background: none; border: none; color: #8b949e; padding: 6px 14px; cursor: pointer; font-size: 13px; border-radius: 6px; }
nav button:hover { color: #c9d1d9; background: #21262d; }
nav button.active { color: #f0f6fc; background: #21262d; font-weight: 600; }
#toolbar { display: flex; gap: 8px; align-items: center; margin-left: auto; }
#folder-btn { background: #238636; color: #fff; border: none; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; }
#folder-btn:hover { background: #2ea043; }
#folder-btn:disabled { background: #21262d; color: #484f58; cursor: default; }
#search { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 5px 10px; border-radius: 6px; font-size: 12px; width: 180px; }
#search:focus { outline: none; border-color: #58a6ff; }

/* Views */
#browse-view, #graph-view { display: none; flex: 1; overflow: hidden; }
#browse-view.active, #graph-view.active { display: flex; }

/* Browse: folder tree + detail */
#sidebar { width: 280px; background: #161b22; border-right: 1px solid #30363d; overflow-y: auto; flex-shrink: 0; }
#sidebar .tree-header { padding: 10px 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #484f58; letter-spacing: 0.5px; position: sticky; top: 0; background: #161b22; z-index: 1; }
.tree-dir { padding: 6px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: #c9d1d9; display: flex; align-items: center; gap: 6px; user-select: none; }
.tree-dir:hover { background: #21262d; }
.tree-dir .arrow { font-size: 10px; width: 12px; color: #636c76; transition: transform 0.15s; }
.tree-dir.collapsed .arrow { transform: rotate(-90deg); }
.tree-dir .dir-count { font-size: 11px; color: #484f58; font-weight: 400; margin-left: auto; }
.tree-dir .dir-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tree-files { overflow: hidden; }
.tree-files.collapsed { display: none; }
.tree-file { padding: 4px 14px 4px 34px; cursor: pointer; font-size: 12px; color: #8b949e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none; }
.tree-file:hover { color: #c9d1d9; background: #21262d; }
.tree-file.active { color: #58a6ff; background: #161b22; }
.tree-file .file-status { font-size: 10px; color: #f85149; margin-left: 4px; }

/* Detail panel (shared between browse and graph) */
.detail-panel { overflow-y: auto; flex: 1; background: #0d1117; }
.detail-panel .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #484f58; font-size: 14px; }
.detail-panel .content { padding: 24px 32px; }
.detail-panel h2 { font-size: 22px; margin-bottom: 8px; color: #f0f6fc; }
.detail-panel .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.detail-panel .badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: #21262d; border: 1px solid #30363d; }
.detail-panel .badge.type { font-weight: 600; }
.detail-panel .badge.type[data-type="Architecture"] { color: #58a6ff; border-color: #58a6ff44; }
.detail-panel .badge.type[data-type="Component"] { color: #f778ba; border-color: #f778ba44; }
.detail-panel .badge.type[data-type="Domain"] { color: #7ee787; border-color: #7ee78744; }
.detail-panel .badge.type[data-type="Decision"] { color: #d29922; border-color: #d2992244; }
.detail-panel .badge.type[data-type="Process"] { color: #bc8cff; border-color: #bc8cff44; }
.detail-panel .badge.type[data-type="Deprecation"] { color: #f85149; border-color: #f8514944; }
.detail-panel .badge.type[data-type="State"] { color: #79c0ff; border-color: #79c0ff44; }
.detail-panel .badge.type[data-type="Inbox"] { color: #ffa657; border-color: #ffa65744; }
.detail-panel .badge.status { color: #8b949e; }
.detail-panel .badge.status.deprecated { color: #f85149; }
.detail-panel .frontmatter { font-size: 12px; color: #8b949e; margin-bottom: 14px; font-family: monospace; }
.detail-panel .frontmatter div { margin-bottom: 2px; }
.detail-panel .body { font-size: 14px; line-height: 1.7; color: #c9d1d9; }
.detail-panel .body h1 { font-size: 22px; margin: 20px 0 10px; color: #f0f6fc; }
.detail-panel .body h2 { font-size: 18px; margin: 18px 0 8px; color: #f0f6fc; }
.detail-panel .body h3 { font-size: 15px; margin: 14px 0 6px; color: #f0f6fc; }
.detail-panel .body p { margin-bottom: 10px; }
.detail-panel .body ul, .detail-panel .body ol { margin: 10px 0 10px 24px; }
.detail-panel .body li { margin-bottom: 4px; }
.detail-panel .body code { background: #21262d; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
.detail-panel .body pre { background: #0d1117; border: 1px solid #30363d; padding: 14px; border-radius: 6px; overflow-x: auto; margin: 10px 0; }
.detail-panel .body pre code { background: none; padding: 0; }
.detail-panel .body a { color: #58a6ff; text-decoration: none; }
.detail-panel .body a:hover { text-decoration: underline; }
.detail-panel .body table { border-collapse: collapse; margin: 10px 0; width: 100%; }
.detail-panel .body th, .detail-panel .body td { border: 1px solid #30363d; padding: 6px 10px; text-align: left; font-size: 13px; }
.detail-panel .body th { background: #21262d; }
.detail-panel .backlinks { margin-top: 20px; padding-top: 14px; border-top: 1px solid #30363d; }
.detail-panel .backlinks h3 { font-size: 13px; color: #8b949e; margin-bottom: 6px; }
.detail-panel .backlinks a { display: block; font-size: 13px; color: #58a6ff; text-decoration: none; padding: 3px 0; cursor: pointer; }
.detail-panel .backlinks a:hover { text-decoration: underline; }
.detail-panel .relationships { margin-top: 20px; padding-top: 14px; border-top: 1px solid #30363d; }
.detail-panel .relationships h3 { font-size: 13px; color: #8b949e; margin-bottom: 8px; }
.detail-panel .relationship-entry { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: start; padding: 5px 0; font-size: 12px; }
.detail-panel .relationship-entry .predicate { font-family: monospace; font-weight: 600; }
.detail-panel .relationship-entry a { color: #58a6ff; text-decoration: none; cursor: pointer; }
.detail-panel .relationship-entry a:hover { text-decoration: underline; }
.detail-panel .relationship-entry code { color: #8b949e; overflow-wrap: anywhere; }
.detail-panel .relationship-entry.warning { color: #d29922; }
.detail-panel .relationship-entry.invalid { color: #f85149; }
.detail-panel .identity-note { color: #8b949e; }

/* Typed relationship diagnostics */
#warnings-panel { display: none; flex-shrink: 0; max-height: 180px; overflow: auto; background: #2d1f08; border-bottom: 1px solid #9e6a03; }
#warnings-panel.visible { display: block; }
#warnings-panel summary { position: sticky; top: 0; padding: 8px 20px; cursor: pointer; background: #2d1f08; color: #e3b341; font-size: 12px; font-weight: 600; z-index: 1; }
#warnings-list { padding: 0 20px 8px; }
.warning-row { width: 100%; display: grid; grid-template-columns: minmax(180px, 280px) 116px minmax(120px, 1fr) minmax(180px, 1fr); gap: 8px; padding: 5px 0; border: 0; border-top: 1px solid #9e6a0333; background: none; color: #c9d1d9; text-align: left; font-size: 11px; cursor: pointer; }
.warning-row:hover { background: #9e6a031a; }
.warning-row .warning-code { color: #e3b341; font-family: monospace; }
.warning-row .warning-target { color: #8b949e; font-family: monospace; overflow-wrap: anywhere; }
.warning-row .warning-source-id { display: block; color: #8b949e; font-family: monospace; overflow-wrap: anywhere; }

/* Graph view */
#graph-view { flex-direction: row; }
#graph-canvas { position: relative; flex: 1; min-width: 0; }
#cy { position: absolute; inset: 0; background: #0d1117; }
#cy .empty { display: flex; align-items: center; justify-content: center; height: 100%; padding: 24px; color: #8b949e; text-align: center; }
#graph-legend { position: absolute; left: 12px; bottom: 12px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 10px; max-width: calc(100% - 24px); padding: 7px 10px; background: #161b22e8; border: 1px solid #30363d; border-radius: 6px; font-size: 10px; color: #8b949e; pointer-events: none; }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-line { width: 20px; border-top: 2px solid var(--edge-color); }
.legend-line.dashed { border-top-style: dashed; }
.legend-line.dotted { border-top-style: dotted; }
#graph-detail { width: 480px; background: #161b22; border-left: 1px solid #30363d; overflow-y: auto; flex-shrink: 0; }
#graph-detail .empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #484f58; font-size: 14px; }
.filter-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-size: 11px; }
.filter-btn.active { border-color: currentColor; }
.filter-btn.active[data-type="Architecture"] { color: #58a6ff; }
.filter-btn.active[data-type="Component"] { color: #f778ba; }
.filter-btn.active[data-type="Domain"] { color: #7ee787; }
.filter-btn.active[data-type="Decision"] { color: #d29922; }
.filter-btn.active[data-type="Process"] { color: #bc8cff; }
.filter-btn.active[data-type="Deprecation"] { color: #f85149; }
.filter-btn.active[data-type="State"] { color: #79c0ff; }
.filter-btn.active[data-type="Inbox"] { color: #ffa657; }

#loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #161b22; border: 1px solid #30363d; padding: 20px 30px; border-radius: 8px; font-size: 14px; display: none; z-index: 100; }
#drop-zone { position: fixed; inset: 0; background: rgba(13,17,23,0.9); display: none; align-items: center; justify-content: center; z-index: 200; }
#drop-zone .text { font-size: 20px; color: #58a6ff; }
</style>
</head>
<body>
<header>
<h1>OKF Knowledge Viewer</h1>
<nav>
<button id="nav-browse" class="active">Browse</button>
<button id="nav-graph">Knowledge Graph</button>
</nav>
<span class="stats" id="stats"></span>
<div id="toolbar">
<input type="text" id="search" placeholder="Search concepts...">
<button id="folder-btn">Open Folder</button>
</div>
</header>

<details id="warnings-panel">
<summary id="warnings-summary">Relationship diagnostics</summary>
<div id="warnings-list"></div>
</details>

<div id="browse-view" class="active">
<div id="sidebar">
<div class="tree-header">Knowledge Bundle</div>
<div id="tree"></div>
</div>
<div id="detail" class="detail-panel"><div class="empty">Select a concept from the tree</div></div>
</div>

<div id="graph-view">
<div id="graph-canvas">
<div id="cy"></div>
<div id="graph-legend"></div>
</div>
<div id="graph-detail" class="detail-panel"><div class="empty">Click a node to view details</div></div>
</div>

<div id="loading">Loading...</div>
<div id="drop-zone"><div class="text">Drop the knowledge/ folder here</div></div>

<script id="okf-data" type="application/json">{"schema":"okf-viewer-data/1","policy":{"inbox":"excluded"},"asset_manifest":"viewer-assets/manifest.json","asset_hashes":{},"included_paths":[],"items":null}</script>
</body>
</html>
