ands, skills, hooks, scripts, and worktree guidance. Has its own AGENTS.md with Graphite stacking workflow instructions for documentation work. Contains:\n\n- **commands/** - Slash command templates (plan-feature, plan-bugfix, plan-github, plan-review, compliance-review, uat, end-session, join-session, next-phase, release-assess, kingmode)\n- **skills/** - Project-local skills (plan-review, release-assess, vibe-fix, worktree-session-lifecycle, worktree-toolkit-init)\n- **hooks/** - Git hooks (pre-commit, post-commit, post-edit-lint, code-review-checkpoint, sanity-check, pre-completion-build, batch-lint-check)\n- **scripts/** - Shell scripts (release-vector-assess, worktree session management, droid worktree)\n- **worktrees/** - Worktree session guidance and metadata\n- **install-session-workflows.sh** - Installer for refreshing commands, hooks, scripts, skills, and worktree guidance into another project\n\n### functional-design/\n\nPhased implementation checklist templates. The template baseline is preserved in `00-TEMPLATE-IMPLEMENTATION-CHECKLIST.md`, while `00-IMPLEMENTATION-CHECKLIST.md` tracks the live implementation status for the designs repo itself. Phased files range from `01-ARCHITECTURE-OVERVIEW.md` through `99-DEPLOYMENT-STRATEGY.md`.\n\n### ui-ux-guidelines/\n\nDesign token and interface pattern references with a machine-readable `design-tokens.json` for Figma/Style Dictionary. Contains pattern guides for components, forms, data display, interactive elements, and layouts.\n\n### okf/\n\nOKF system templates including the standard specification, deployment runbook, installer script, post-commit hook, viz generator, and viewer.\n\n## Related Concepts\n\n- [DESIGN.md Standard Specification](./design-standard-spec.md)\n- [Design Tokens](../domain/design-tokens.md)\n- [Component Patterns](../components/component-patterns.md)\n- [Planning Decomposition](../process/planning-decomposition.md)\n- [Implementation Checklist](../process/implementation-checklist.md)\n- [Install Session Workflows](../process/install-session-workflows.md)\n- [OKF Standard Specification](./okf-standard-spec.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"architecture/viewer-architecture.md","content":"---\ntype: Architecture\ntitle: OKF Typed Viewer Architecture\ndescription: Browse and graph viewer with stable semantic IDs, typed/inverse edges, Markdown citations, and visible relationship diagnostics\nresource: ./templates/okf/viewer.html\ntags: [graph, okf, relationships, semantics, viewer]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-source\nevidence_refs: [templates/okf/viewer.html, templates/okf/tests/viewer-relationships_test.mjs]\n---\n\n# Identity and parsing\n\nThe single-file viewer keeps filesystem paths for navigation and stable\n`okf-\u003cuuidv4>` frontmatter IDs for semantic identity. Embedded generation uses\nthe shared pinned C7 parser. Direct browser loading retains an explicit legacy\nfallback rather than inventing different strict YAML semantics.\n\n# Graph model\n\nAll six stored predicates—`depends_on`, `implements`, `supersedes`,\n`derived_from`, `contradicts`, and `blocked_by`—render with distinct labels and\nstyles. The viewer derives inspectable inverse edges, deduplicates symmetric\n`contradicts`, and keeps untyped Markdown citations/backlinks separate.\n\nUnresolved or malformed targets, duplicate IDs, self edges, forbidden cycles,\nallowed `blocked_by` deadlocks, redundant symmetric edges, and legacy path-valued\nrelationships remain visible diagnostics. The viewer never fetches, fabricates,\ndrops, or silently rewrites a target.\n\n# Navigation\n\nRelative Markdown links resolve from the source file path. Repository-root\nrelative `resource` paths resolve from the knowledge bundle's project root.\nTyped edges continue to resolve by stable ID across a file rename or move.\n\n# Loading and rendering\n\nEmbedded `viz.html`, folder picker, and drag/drop modes feed the same concept\nmodel. Browse, search/filter, Markdown, Mermaid, metadata, typed relationships,\ncitations, backlinks, and diagnostics remain inspectable without changing the\nsource bundle.\n\n# Related concepts\n\n- [Viz Generator Design](./viz-generator-design.md)\n- [Semantic Identifiers and Relationships](../decisions/semantic-profile-and-semantic-web-scope.md)\n- [Link Resolution](../domain/link-resolution.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Architecture","title":"OKF Typed Viewer Architecture","description":"Browse and graph viewer with stable semantic IDs, typed/inverse edges, Markdown citations, and visible relationship diagnostics","resource":"./templates/okf/viewer.html","tags":["graph","okf","relationships","semantics","viewer"],"timestamp":"2026-08-08T00:00:00Z","status":"active","issue_refs":[26],"epic_refs":[26],"assertion_state":"proposed","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-source","evidence_refs":["templates/okf/viewer.html","templates/okf/tests/viewer-relationships_test.mjs"]},"body":"\n# Identity and parsing\n\nThe single-file viewer keeps filesystem paths for navigation and stable\n`okf-\u003cuuidv4>` frontmatter IDs for semantic identity. Embedded generation uses\nthe shared pinned C7 parser. Direct browser loading retains an explicit legacy\nfallback rather than inventing different strict YAML semantics.\n\n# Graph model\n\nAll six stored predicates—`depends_on`, `implements`, `supersedes`,\n`derived_from`, `contradicts`, and `blocked_by`—render with distinct labels and\nstyles. The viewer derives inspectable inverse edges, deduplicates symmetric\n`contradicts`, and keeps untyped Markdown citations/backlinks separate.\n\nUnresolved or malformed targets, duplicate IDs, self edges, forbidden cycles,\nallowed `blocked_by` deadlocks, redundant symmetric edges, and legacy path-valued\nrelationships remain visible diagnostics. The viewer never fetches, fabricates,\ndrops, or silently rewrites a target.\n\n# Navigation\n\nRelative Markdown links resolve from the source file path. Repository-root\nrelative `resource` paths resolve from the knowledge bundle's project root.\nTyped edges continue to resolve by stable ID across a file rename or move.\n\n# Loading and rendering\n\nEmbedded `viz.html`, folder picker, and drag/drop modes feed the same concept\nmodel. Browse, search/filter, Markdown, Mermaid, metadata, typed relationships,\ncitations, backlinks, and diagnostics remain inspectable without changing the\nsource bundle.\n\n# Related concepts\n\n- [Viz Generator Design](./viz-generator-design.md)\n- [Semantic Identifiers and Relationships](../decisions/semantic-profile-and-semantic-web-scope.md)\n- [Link Resolution](../domain/link-resolution.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"architecture/viz-generator-design.md","content":"---\ntype: Architecture\ntitle: Viz Generator Design\ndescription: Deterministic repository-local generator that parses concepts with the pinned runtime and embeds their semantic model in viz.html\nresource: ./templates/okf/generate-viz.js\ntags: [generator, nodejs, okf, semantics, viewer, viz]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-source\nevidence_refs: [templates/okf/generate-viz.js, templates/okf/tests/viewer-relationships_test.mjs]\n---\n\n# Generation\n\n`node knowledge/generate-viz.js knowledge/` reads regular Markdown concepts\ninside the named knowledge directory, excludes structural/generated files, and\nuses the pinned C7 YAML parser to build deterministic path, frontmatter, body,\nidentity, and diagnostic records. It injects JSON-safe data into `viewer.html`\nand writes a self-contained `viz.html`.\n\nStable semantic IDs remain separate from filepaths. The generated model retains\nall six relationship predicates, legacy values, Markdown citations, and parse\ndiagnostics so the viewer can show unresolved/invalid edges instead of losing\nthem. When the local parser is deliberately unavailable, the documented legacy\nfallback remains read-only and visible.\n\nGeneration is an explicit repository-local command, not a post-commit or\nparent-workspace side effect. It does not scan sibling repositories, start\ncuration, or supply verification/rollout authority.\n\n# Related concepts\n\n- [OKF Typed Viewer Architecture](./viewer-architecture.md)\n- [Post-Commit Tier 1 Capture System](./hook-system.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Architecture","title":"Viz Generator Design","description":"Deterministic repository-local generator that parses concepts with the pinned runtime and embeds their semantic model in viz.html","resource":"./templates/okf/generate-viz.js","tags":["generator","nodejs","okf","semantics","viewer","viz"],"timestamp":"2026-08-08T00:00:00Z","status":"active","issue_refs":[26],"epic_refs":[26],"assertion_state":"proposed","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-source","evidence_refs":["templates/okf/generate-viz.js","templates/okf/tests/viewer-relationships_test.mjs"]},"body":"\n# Generation\n\n`node knowledge/generate-viz.js knowledge/` reads regular Markdown concepts\ninside the named knowledge directory, excludes structural/generated files, and\nuses the pinned C7 YAML parser to build deterministic path, frontmatter, body,\nidentity, and diagnostic records. It injects JSON-safe data into `viewer.html`\nand writes a self-contained `viz.html`.\n\nStable semantic IDs remain separate from filepaths. The generated model retains\nall six relationship predicates, legacy values, Markdown citations, and parse\ndiagnostics so the viewer can show unresolved/invalid edges instead of losing\nthem. When the local parser is deliberately unavailable, the documented legacy\nfallback remains read-only and visible.\n\nGeneration is an explicit repository-local command, not a post-commit or\nparent-workspace side effect. It does not scan sibling repositories, start\ncuration, or supply verification/rollout authority.\n\n# Related concepts\n\n- [OKF Typed Viewer Architecture](./viewer-architecture.md)\n- [Post-Commit Tier 1 Capture System](./hook-system.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"components/component-patterns.md","content":"---\ntype: Component\ntitle: UI Component Patterns\ndescription: Minimalist, borderless component conventions using shadcn/ui with progressive disclosure and opacity hierarchy\nresource: ./templates/ui-ux-guidelines/component-patterns.md\ntags: [designs, ui, components, shadcn, borderless, minimalist, patterns]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# UI Component Patterns\n\n## Design Philosophy: Minimalist and Borderless\n\nInspired by the **Notional** project, components follow these principles:\n\n1. **Borderless by default** - Cards use background color, not borders\n2. **Progressive disclosure** - Controls appear on hover\n3. **Opacity hierarchy** - Secondary elements use `opacity-30` -> `opacity-100`\n4. **Subtle elevation** - Prefer `shadow-sm` + `backdrop-blur` over heavy shadows\n5. **Generous whitespace** - Let content breathe\n\n## Key Patterns\n\n### Borderless Card\n\nCards use `bg-card rounded-lg hover:shadow-md` instead of borders. Controls appear via `opacity-0 group-hover:opacity-100`.\n\n### Ghost Element\n\nSubtle elements that become prominent on hover, used for \"Add New\" inline creation cards with dashed borders.\n\n### Watermark Branding\n\nUltra-light brand presence using `font-extralight opacity-20 pointer-events-none`.\n\n## Component Library: shadcn/ui\n\nUses shadcn/ui with the \"new-york\" style variant. Components are copied into `src/components/ui/` and customized. Available primitives include: Button, Card, Dialog, Sheet, Table, Tabs, Form, Input, Select, Checkbox, Switch, Badge, Avatar, Tooltip, DropdownMenu, Command, Skeleton, ScrollArea, Separator, Sidebar.\n\n## Tech Stack\n\n- **Framework**: Next.js 16 (App Router), React 19\n- **Styling**: Tailwind CSS v4 with CSS Variables (OKLCH)\n- **Icons**: Lucide React\n- **Fonts**: Inter (sans), JetBrains Mono (mono), Georgia (serif)\n- **State**: React hooks + Convex real-time database\n- **Theming**: next-themes (dark/light mode)\n- **Utilities**: class-variance-authority (cva), clsx, tailwind-merge\n\n## Core Principles\n\n1. Semantic color tokens - never use raw colors; use design tokens (`text-muted-foreground`, `bg-card`)\n2. Borderless first - default to no borders; add only when necessary\n3. Progressive reveal - hide secondary actions until hover/focus\n4. Dark mode first - design for dark mode, ensure light mode works\n5. Mobile responsive - all layouts adapt from mobile to desktop\n6. Accessibility - ARIA labels, keyboard navigation, focus management\n7. Reduced motion - respect `prefers-reduced-motion` preferences\n\n## Related Concepts\n\n- [Design Tokens](../domain/design-tokens.md)\n- [UX Design Standards](../domain/ux-design-standards.md)\n- [Form Patterns](./form-patterns.md)\n- [Data Display Patterns](./data-display-patterns.md)\n- [Interactive Patterns](./interactive-patterns.md)\n- [Layout Patterns](./layout-patterns.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Component","title":"UI Component Patterns","description":"Minimalist, borderless component conventions using shadcn/ui with progressive disclosure and opacity hierarchy","resource":"./templates/ui-ux-guidelines/component-patterns.md","tags":["designs","ui","components","shadcn","borderless","minimalist","patterns"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# UI Component Patterns\n\n## Design Philosophy: Minimalist and Borderless\n\nInspired by the **Notional** project, components follow these principles:\n\n1. **Borderless by default** - Cards use background color, not borders\n2. **Progressive disclosure** - Controls appear on hover\n3. **Opacity hierarchy** - Secondary elements use `opacity-30` -> `opacity-100`\n4. **Subtle elevation** - Prefer `shadow-sm` + `backdrop-blur` over heavy shadows\n5. **Generous whitespace** - Let content breathe\n\n## Key Patterns\n\n### Borderless Card\n\nCards use `bg-card rounded-lg hover:shadow-md` instead of borders. Controls appear via `opacity-0 group-hover:opacity-100`.\n\n### Ghost Element\n\nSubtle elements that become prominent on hover, used for \"Add New\" inline creation cards with dashed borders.\n\n### Watermark Branding\n\nUltra-light brand presence using `font-extralight opacity-20 pointer-events-none`.\n\n## Component Library: shadcn/ui\n\nUses shadcn/ui with the \"new-york\" style variant. Components are copied into `src/components/ui/` and customized. Available primitives include: Button, Card, Dialog, Sheet, Table, Tabs, Form, Input, Select, Checkbox, Switch, Badge, Avatar, Tooltip, DropdownMenu, Command, Skeleton, ScrollArea, Separator, Sidebar.\n\n## Tech Stack\n\n- **Framework**: Next.js 16 (App Router), React 19\n- **Styling**: Tailwind CSS v4 with CSS Variables (OKLCH)\n- **Icons**: Lucide React\n- **Fonts**: Inter (sans), JetBrains Mono (mono), Georgia (serif)\n- **State**: React hooks + Convex real-time database\n- **Theming**: next-themes (dark/light mode)\n- **Utilities**: class-variance-authority (cva), clsx, tailwind-merge\n\n## Core Principles\n\n1. Semantic color tokens - never use raw colors; use design tokens (`text-muted-foreground`, `bg-card`)\n2. Borderless first - default to no borders; add only when necessary\n3. Progressive reveal - hide secondary actions until hover/focus\n4. Dark mode first - design for dark mode, ensure light mode works\n5. Mobile responsive - all layouts adapt from mobile to desktop\n6. Accessibility - ARIA labels, keyboard navigation, focus management\n7. Reduced motion - respect `prefers-reduced-motion` preferences\n\n## Related Concepts\n\n- [Design Tokens](../domain/design-tokens.md)\n- [UX Design Standards](../domain/ux-design-standards.md)\n- [Form Patterns](./form-patterns.md)\n- [Data Display Patterns](./data-display-patterns.md)\n- [Interactive Patterns](./interactive-patterns.md)\n- [Layout Patterns](./layout-patterns.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"components/data-display-patterns.md","content":"---\ntype: Component\ntitle: Data Display Patterns\ndescription: Tables, cards, lists, and Kanban board conventions with inline creation and click-to-inspect philosophy\nresource: ./templates/ui-ux-guidelines/data-display-patterns.md\ntags: [designs, ui, data-display, tables, cards, kanban, patterns]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Data Display Patterns\n\n## Design Philosophy\n\nData display follows the minimalist approach:\n- **Inline creation** - \"Add new\" as a ghost card within lists, not a separate button\n- **Click-to-inspect** - Clicking a row/card opens a slide-out inspector panel\n- **Progressive disclosure** - Details revealed on selection, not cluttering the list\n- **No action buttons on cards** - Cards are for viewing/navigation only\n- **Vertical ellipsis for actions** - Edit, delete, and other actions hidden behind menu\n- **Badges and icons only** - Status indicators, counts, and icons are acceptable; buttons are not\n\n## Card Action Philosophy\n\nCards should be clean and scannable. The primary interaction is clicking to view/inspect.\n\n### Allowed on cards\n- Badges, counts, icons, status indicators\n- Metadata rows with icon + count pairs\n\n### Not allowed on cards\n- Edit, Delete, Archive buttons inline\n\n## Vertical Ellipsis Menu\n\nAll destructive and edit actions accessed via a vertical ellipsis menu that appears on hover:\n- `absolute top-2 right-2 opacity-0 group-hover:opacity-100`\n- Contains Edit, Delete, and other actions\n- Opens as a dropdown menu\n\n## Data Table Pattern\n\nUses shadcn/ui Table components with:\n- Column headers with sort indicators\n- Row click to open inspector\n- Pagination at bottom\n- Empty state with ghost \"Add New\" card\n- Loading state with Skeleton rows\n\n## List View Pattern\n\nLists use card grids or stacked cards:\n- `grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4`\n- Ghost \"Add New\" card at the end of the list\n- Cards show title, description, status badge, metadata\n\n## Kanban Board Pattern\n\nKanban boards use columns with draggable cards:\n- Column headers with count badges\n- Horizontal scroll for columns\n- `@dnd-kit` for drag and drop\n- Ghost \"Add New\" card at bottom of each column\n- Card click opens inspector\n\n## Inspector Panel Pattern\n\nClicking a card/row opens a slide-out inspector:\n- Uses shadcn/ui `Sheet` component\n- Shows full details\n- Contains action buttons (Edit, Delete) in the panel\n- Closes on escape or backdrop click\n\n## Empty State Pattern\n\nWhen no data exists:\n- Centered icon + message\n- Ghost \"Add New\" card or button\n- Encouraging copy\n\n## Related Concepts\n\n- [Component Patterns](./component-patterns.md)\n- [Form Patterns](./form-patterns.md)\n- [Interactive Patterns](./interactive-patterns.md)\n- [Layout Patterns](./layout-patterns.md)\n- [Design Tokens](../domain/design-tokens.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Component","title":"Data Display Patterns","description":"Tables, cards, lists, and Kanban board conventions with inline creation and click-to-inspect philosophy","resource":"./templates/ui-ux-guidelines/data-display-patterns.md","tags":["designs","ui","data-display","tables","cards","kanban","patterns"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Data Display Patterns\n\n## Design Philosophy\n\nData display follows the minimalist approach:\n- **Inline creation** - \"Add new\" as a ghost card within lists, not a separate button\n- **Click-to-inspect** - Clicking a row/card opens a slide-out inspector panel\n- **Progressive disclosure** - Details revealed on selection, not cluttering the list\n- **No action buttons on cards** - Cards are for viewing/navigation only\n- **Vertical ellipsis for actions** - Edit, delete, and other actions hidden behind menu\n- **Badges and icons only** - Status indicators, counts, and icons are acceptable; buttons are not\n\n## Card Action Philosophy\n\nCards should be clean and scannable. The primary interaction is clicking to view/inspect.\n\n### Allowed on cards\n- Badges, counts, icons, status indicators\n- Metadata rows with icon + count pairs\n\n### Not allowed on cards\n- Edit, Delete, Archive buttons inline\n\n## Vertical Ellipsis Menu\n\nAll destructive and edit actions accessed via a vertical ellipsis menu that appears on hover:\n- `absolute top-2 right-2 opacity-0 group-hover:opacity-100`\n- Contains Edit, Delete, and other actions\n- Opens as a dropdown menu\n\n## Data Table Pattern\n\nUses shadcn/ui Table components with:\n- Column headers with sort indicators\n- Row click to open inspector\n- Pagination at bottom\n- Empty state with ghost \"Add New\" card\n- Loading state with Skeleton rows\n\n## List View Pattern\n\nLists use card grids or stacked cards:\n- `grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4`\n- Ghost \"Add New\" card at the end of the list\n- Cards show title, description, status badge, metadata\n\n## Kanban Board Pattern\n\nKanban boards use columns with draggable cards:\n- Column headers with count badges\n- Horizontal scroll for columns\n- `@dnd-kit` for drag and drop\n- Ghost \"Add New\" card at bottom of each column\n- Card click opens inspector\n\n## Inspector Panel Pattern\n\nClicking a card/row opens a slide-out inspector:\n- Uses shadcn/ui `Sheet` component\n- Shows full details\n- Contains action buttons (Edit, Delete) in the panel\n- Closes on escape or backdrop click\n\n## Empty State Pattern\n\nWhen no data exists:\n- Centered icon + message\n- Ghost \"Add New\" card or button\n- Encouraging copy\n\n## Related Concepts\n\n- [Component Patterns](./component-patterns.md)\n- [Form Patterns](./form-patterns.md)\n- [Interactive Patterns](./interactive-patterns.md)\n- [Layout Patterns](./layout-patterns.md)\n- [Design Tokens](../domain/design-tokens.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"components/form-patterns.md","content":"---\ntype: Component\ntitle: Form Patterns\ndescription: Form field conventions using shadcn/ui, React Hook Form, Zod validation, and wizard patterns\nresource: ./templates/ui-ux-guidelines/form-patterns.md\ntags: [designs, ui, forms, react-hook-form, zod, validation, patterns]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Form Patterns\n\n## Form Field Anatomy\n\nStandard form fields use the shadcn/ui Form component wrapping React Hook Form:\n\n- `FormField` -> `FormItem` -> `FormLabel` + `FormControl` + `FormDescription` + `FormMessage`\n- Validation errors display via `FormMessage`\n- Helper text via `FormDescription`\n\n## Simple Form Pattern (useState)\n\nFor simpler forms without React Hook Form:\n- Use `useState` for field values\n- Manual validation with `toast.error()` for feedback\n- `isSaving` state for loading states\n- `toast.success()` on success, `toast.error()` on failure\n\n## React Hook Form Pattern\n\nFor complex forms:\n- `useForm` with Zod schema via `zodResolver`\n- Type-safe form values from Zod schema\n- `form.control` passed to `FormField` components\n- `form.handleSubmit(onSubmit)` for submission\n\n## Form Validation (Zod)\n\nZod schemas define validation rules:\n- Required fields: `z.string().min(1, \"Message\")`\n- Email: `z.string().email()`\n- Numbers: `z.number().min(0)` or `z.coerce.number()`\n- Enums: `z.enum([...])`\n- Optional: `.optional()` or `.nullable()`\n\n## Multi-Step Wizard Pattern\n\nWizards use a step-based approach:\n- `currentStep` state (1, 2, 3...)\n- Step validation before advancing\n- Progress indicator\n- Back/Next navigation\n- Final submission on last step\n\n## Form Layout Conventions\n\n- Forms use `space-y-4` or `space-y-6` for vertical spacing\n- Labels above inputs\n- Required fields marked with `*`\n- Helper text below inputs in `text-muted-foreground`\n- Error messages in `text-destructive`\n\n## Convex Mutation Integration\n\nForms typically submit via Convex mutations:\n- `useMutation(api.entities.create)` or `useMutation(api.entities.update)`\n- Optimistic updates where appropriate\n- `toast.success()` / `toast.error()` for feedback\n- Close dialog or navigate after success\n\n## Related Concepts\n\n- [Component Patterns](./component-patterns.md)\n- [Data Display Patterns](./data-display-patterns.md)\n- [Interactive Patterns](./interactive-patterns.md)\n- [Layout Patterns](./layout-patterns.md)\n- [Design Tokens](../domain/design-tokens.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Component","title":"Form Patterns","description":"Form field conventions using shadcn/ui, React Hook Form, Zod validation, and wizard patterns","resource":"./templates/ui-ux-guidelines/form-patterns.md","tags":["designs","ui","forms","react-hook-form","zod","validation","patterns"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Form Patterns\n\n## Form Field Anatomy\n\nStandard form fields use the shadcn/ui Form component wrapping React Hook Form:\n\n- `FormField` -> `FormItem` -> `FormLabel` + `FormControl` + `FormDescription` + `FormMessage`\n- Validation errors display via `FormMessage`\n- Helper text via `FormDescription`\n\n## Simple Form Pattern (useState)\n\nFor simpler forms without React Hook Form:\n- Use `useState` for field values\n- Manual validation with `toast.error()` for feedback\n- `isSaving` state for loading states\n- `toast.success()` on success, `toast.error()` on failure\n\n## React Hook Form Pattern\n\nFor complex forms:\n- `useForm` with Zod schema via `zodResolver`\n- Type-safe form values from Zod schema\n- `form.control` passed to `FormField` components\n- `form.handleSubmit(onSubmit)` for submission\n\n## Form Validation (Zod)\n\nZod schemas define validation rules:\n- Required fields: `z.string().min(1, \"Message\")`\n- Email: `z.string().email()`\n- Numbers: `z.number().min(0)` or `z.coerce.number()`\n- Enums: `z.enum([...])`\n- Optional: `.optional()` or `.nullable()`\n\n## Multi-Step Wizard Pattern\n\nWizards use a step-based approach:\n- `currentStep` state (1, 2, 3...)\n- Step validation before advancing\n- Progress indicator\n- Back/Next navigation\n- Final submission on last step\n\n## Form Layout Conventions\n\n- Forms use `space-y-4` or `space-y-6` for vertical spacing\n- Labels above inputs\n- Required fields marked with `*`\n- Helper text below inputs in `text-muted-foreground`\n- Error messages in `text-destructive`\n\n## Convex Mutation Integration\n\nForms typically submit via Convex mutations:\n- `useMutation(api.entities.create)` or `useMutation(api.entities.update)`\n- Optimistic updates where appropriate\n- `toast.success()` / `toast.error()` for feedback\n- Close dialog or navigate after success\n\n## Related Concepts\n\n- [Component Patterns](./component-patterns.md)\n- [Data Display Patterns](./data-display-patterns.md)\n- [Interactive Patterns](./interactive-patterns.md)\n- [Layout Patterns](./layout-patterns.md)\n- [Design Tokens](../domain/design-tokens.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"components/interactive-patterns.md","content":"---\ntype: Component\ntitle: Interactive Patterns\ndescription: Drag and drop, modals, slide-out panels, command palettes, and toast notifications\nresource: ./templates/ui-ux-guidelines/interactive-patterns.md\ntags: [designs, ui, interactive, drag-drop, modals, dnd-kit, patterns]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Interactive Patterns\n\n## Drag and Drop\n\nUses **@dnd-kit** for drag-and-drop interactions.\n\n### Basic DnD Setup\n\n- `DndContext` wrapper with sensors and collision detection\n- `PointerSensor` with 8px activation distance\n- `DragOverlay` for drag ghost rendering\n- `closestCenter` collision detection\n- Drag start/end/cancel handlers\n\n### Draggable Items\n\n- `useDraggable` hook from `@dnd-kit/core`\n- Data passed via `data.current` for identification\n- Visual feedback during drag (opacity, scale)\n- Drop zones use `useDroppable` hook\n\n### Sortable Lists\n\n- `useSortable` hook for reorderable lists\n- `SortableContext` with `verticalListSortingStrategy`\n- Reorder mutations to backend on drop\n\n## Modal Dialogs\n\nUses shadcn/ui `Dialog` component:\n- `DialogTrigger` opens the dialog\n- `DialogContent` contains the form/content\n- `DialogHeader` with title and description\n- `DialogFooter` with action buttons\n- Close on escape or backdrop click\n- Focus management handled by Radix\n\n## Slide-Out Panels (Sheets)\n\nUses shadcn/ui `Sheet` component:\n- `side=\"right\"` for right-side panels (default)\n- Inspector panels for detail views\n- `side=\"bottom\"` for mobile-friendly bottom sheets\n- Full-height content with scroll area\n\n## Command Palette\n\nUses shadcn/ui `Command` component:\n- Triggered by keyboard shortcut (Ctrl+K)\n- Fuzzy search across items\n- Grouped results (pages, actions, settings)\n- Keyboard navigation (arrow keys, enter)\n\n## Toast Notifications\n\nUses `sonner` or shadcn/ui `Toaster`:\n- `toast.success()` for success messages\n- `toast.error()` for error messages\n- `toast.loading()` for async operations\n- Auto-dismiss after timeout\n- Action buttons in toasts for undo\n\n## Keyboard Shortcuts\n\n- Ctrl+K: Open command palette\n- Esc: Close dialogs/sheets\n- Enter: Confirm in dialogs\n- Arrow keys: Navigate lists and command palette\n\n## Loading States\n\n- `Skeleton` components for content placeholders\n- `isPending` / `isLoading` states from Convex queries\n- Spinner for inline loading\n- Disabled state for buttons during async operations\n\n## Optimistic Updates\n\nConvex supports optimistic updates:\n- `withOPTIMISTIC_UPDATE` on mutations\n- Immediate UI feedback before server confirmation\n- Rollback on error\n\n## Related Concepts\n\n- [Component Patterns](./component-patterns.md)\n- [Form Patterns](./form-patterns.md)\n- [Data Display Patterns](./data-display-patterns.md)\n- [Layout Patterns](./layout-patterns.md)\n- [Design Tokens](../domain/design-tokens.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Component","title":"Interactive Patterns","description":"Drag and drop, modals, slide-out panels, command palettes, and toast notifications","resource":"./templates/ui-ux-guidelines/interactive-patterns.md","tags":["designs","ui","interactive","drag-drop","modals","dnd-kit","patterns"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Interactive Patterns\n\n## Drag and Drop\n\nUses **@dnd-kit** for drag-and-drop interactions.\n\n### Basic DnD Setup\n\n- `DndContext` wrapper with sensors and collision detection\n- `PointerSensor` with 8px activation distance\n- `DragOverlay` for drag ghost rendering\n- `closestCenter` collision detection\n- Drag start/end/cancel handlers\n\n### Draggable Items\n\n- `useDraggable` hook from `@dnd-kit/core`\n- Data passed via `data.current` for identification\n- Visual feedback during drag (opacity, scale)\n- Drop zones use `useDroppable` hook\n\n### Sortable Lists\n\n- `useSortable` hook for reorderable lists\n- `SortableContext` with `verticalListSortingStrategy`\n- Reorder mutations to backend on drop\n\n## Modal Dialogs\n\nUses shadcn/ui `Dialog` component:\n- `DialogTrigger` opens the dialog\n- `DialogContent` contains the form/content\n- `DialogHeader` with title and description\n- `DialogFooter` with action buttons\n- Close on escape or backdrop click\n- Focus management handled by Radix\n\n## Slide-Out Panels (Sheets)\n\nUses shadcn/ui `Sheet` component:\n- `side=\"right\"` for right-side panels (default)\n- Inspector panels for detail views\n- `side=\"bottom\"` for mobile-friendly bottom sheets\n- Full-height content with scroll area\n\n## Command Palette\n\nUses shadcn/ui `Command` component:\n- Triggered by keyboard shortcut (Ctrl+K)\n- Fuzzy search across items\n- Grouped results (pages, actions, settings)\n- Keyboard navigation (arrow keys, enter)\n\n## Toast Notifications\n\nUses `sonner` or shadcn/ui `Toaster`:\n- `toast.success()` for success messages\n- `toast.error()` for error messages\n- `toast.loading()` for async operations\n- Auto-dismiss after timeout\n- Action buttons in toasts for undo\n\n## Keyboard Shortcuts\n\n- Ctrl+K: Open command palette\n- Esc: Close dialogs/sheets\n- Enter: Confirm in dialogs\n- Arrow keys: Navigate lists and command palette\n\n## Loading States\n\n- `Skeleton` components for content placeholders\n- `isPending` / `isLoading` states from Convex queries\n- Spinner for inline loading\n- Disabled state for buttons during async operations\n\n## Optimistic Updates\n\nConvex supports optimistic updates:\n- `withOPTIMISTIC_UPDATE` on mutations\n- Immediate UI feedback before server confirmation\n- Rollback on error\n\n## Related Concepts\n\n- [Component Patterns](./component-patterns.md)\n- [Form Patterns](./form-patterns.md)\n- [Data Display Patterns](./data-display-patterns.md)\n- [Layout Patterns](./layout-patterns.md)\n- [Design Tokens](../domain/design-tokens.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"components/layout-patterns.md","content":"---\ntype: Component\ntitle: Layout Patterns\ndescription: Page layout structure, sidebar navigation, responsive design, and provider hierarchy\nresource: ./templates/ui-ux-guidelines/layout-patterns.md\ntags: [designs, ui, layout, sidebar, responsive, providers, patterns]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Layout Patterns\n\n## Root Layout\n\nThe app uses a global layout with nested providers:\n\n```tsx\n\u003chtml lang=\"en\" suppressHydrationWarning>\n  \u003cbody className={`${geistSans.variable} ${geistMono.variable} antialiased`}>\n    \u003cThemeProvider attribute=\"class\" defaultTheme=\"dark\" enableSystem>\n      \u003cAuthKitProvider>\n        \u003cConvexClientProvider>\n          \u003cOrganisationProvider>\n            \u003cPersonaProvider>\n              {children}\n              \u003cToaster />\n            \u003c/PersonaProvider>\n          \u003c/OrganisationProvider>\n        \u003c/ConvexClientProvider>\n      \u003c/AuthKitProvider>\n    \u003c/ThemeProvider>\n  \u003c/body>\n\u003c/html>\n```\n\n## Provider Hierarchy\n\nProviders wrap the app in this order:\n1. `ThemeProvider` (next-themes) - dark/light mode\n2. `AuthKitProvider` (WorkOS) - authentication\n3. `ConvexClientProvider` - real-time database\n4. `OrganisationProvider` - org context\n5. `PersonaProvider` - user persona context\n6. `Toaster` - toast notifications\n\n## Full-Height Layout\n\nFor pages that fill the viewport:\n- `h-full w-full overflow-hidden bg-background`\n- `min-h-svh flex flex-col` with sticky header and scrollable main\n\n## Sidebar Layout\n\nUses shadcn/ui Sidebar component:\n- `SidebarProvider` wraps the layout\n- `Sidebar` with `SidebarContent`, `SidebarHeader`, `SidebarFooter`\n- `SidebarInset` for the main content area\n- Collapsible sidebar with rail mode\n- Dark sidebar on light mode (inverted)\n\n## Responsive Breakpoints\n\n- Mobile: default (\u003c 768px)\n- Tablet: `md:` (768px+)\n- Desktop: `lg:` (1024px+)\n- Wide: `xl:` (1280px+)\n\n## Grid Patterns\n\n- Card grids: `grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4`\n- Two-column: `grid grid-cols-1 lg:grid-cols-2 gap-6`\n- Sidebar + content: flex with fixed sidebar and flexible main\n\n## Page Header Pattern\n\nStandard page header with title, description, and actions:\n- Title in `text-2xl font-semibold`\n- Description in `text-muted-foreground`\n- Actions (buttons) aligned right\n\n## Container Patterns\n\n- Full-width: no container, use `w-full`\n- Centered: `max-w-7xl mx-auto px-4`\n- Narrow content: `max-w-2xl mx-auto`\n\n## Sticky Header Pattern\n\n- `sticky top-0 z-20` with backdrop blur\n- `bg-background/80 backdrop-blur-sm`\n- Border bottom on scroll\n\n## Related Concepts\n\n- [Component Patterns](./component-patterns.md)\n- [Form Patterns](./form-patterns.md)\n- [Data Display Patterns](./data-display-patterns.md)\n- [Interactive Patterns](./interactive-patterns.md)\n- [Design Tokens](../domain/design-tokens.md)\n- [UX Design Standards](../domain/ux-design-standards.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Component","title":"Layout Patterns","description":"Page layout structure, sidebar navigation, responsive design, and provider hierarchy","resource":"./templates/ui-ux-guidelines/layout-patterns.md","tags":["designs","ui","layout","sidebar","responsive","providers","patterns"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Layout Patterns\n\n## Root Layout\n\nThe app uses a global layout with nested providers:\n\n```tsx\n\u003chtml lang=\"en\" suppressHydrationWarning>\n  \u003cbody className={`${geistSans.variable} ${geistMono.variable} antialiased`}>\n    \u003cThemeProvider attribute=\"class\" defaultTheme=\"dark\" enableSystem>\n      \u003cAuthKitProvider>\n        \u003cConvexClientProvider>\n          \u003cOrganisationProvider>\n            \u003cPersonaProvider>\n              {children}\n              \u003cToaster />\n            \u003c/PersonaProvider>\n          \u003c/OrganisationProvider>\n        \u003c/ConvexClientProvider>\n      \u003c/AuthKitProvider>\n    \u003c/ThemeProvider>\n  \u003c/body>\n\u003c/html>\n```\n\n## Provider Hierarchy\n\nProviders wrap the app in this order:\n1. `ThemeProvider` (next-themes) - dark/light mode\n2. `AuthKitProvider` (WorkOS) - authentication\n3. `ConvexClientProvider` - real-time database\n4. `OrganisationProvider` - org context\n5. `PersonaProvider` - user persona context\n6. `Toaster` - toast notifications\n\n## Full-Height Layout\n\nFor pages that fill the viewport:\n- `h-full w-full overflow-hidden bg-background`\n- `min-h-svh flex flex-col` with sticky header and scrollable main\n\n## Sidebar Layout\n\nUses shadcn/ui Sidebar component:\n- `SidebarProvider` wraps the layout\n- `Sidebar` with `SidebarContent`, `SidebarHeader`, `SidebarFooter`\n- `SidebarInset` for the main content area\n- Collapsible sidebar with rail mode\n- Dark sidebar on light mode (inverted)\n\n## Responsive Breakpoints\n\n- Mobile: default (\u003c 768px)\n- Tablet: `md:` (768px+)\n- Desktop: `lg:` (1024px+)\n- Wide: `xl:` (1280px+)\n\n## Grid Patterns\n\n- Card grids: `grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4`\n- Two-column: `grid grid-cols-1 lg:grid-cols-2 gap-6`\n- Sidebar + content: flex with fixed sidebar and flexible main\n\n## Page Header Pattern\n\nStandard page header with title, description, and actions:\n- Title in `text-2xl font-semibold`\n- Description in `text-muted-foreground`\n- Actions (buttons) aligned right\n\n## Container Patterns\n\n- Full-width: no container, use `w-full`\n- Centered: `max-w-7xl mx-auto px-4`\n- Narrow content: `max-w-2xl mx-auto`\n\n## Sticky Header Pattern\n\n- `sticky top-0 z-20` with backdrop blur\n- `bg-background/80 backdrop-blur-sm`\n- Border bottom on scroll\n\n## Related Concepts\n\n- [Component Patterns](./component-patterns.md)\n- [Form Patterns](./form-patterns.md)\n- [Data Display Patterns](./data-display-patterns.md)\n- [Interactive Patterns](./interactive-patterns.md)\n- [Design Tokens](../domain/design-tokens.md)\n- [UX Design Standards](../domain/ux-design-standards.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/bounded-curation-execution-safety.md","content":"---\ntype: Decision\ntitle: Bounded Curation Execution Safety Requirements\ndescription: Operator-approved fail-closed requirements and regression scenarios for any future OKF curator execution\nresource: https://github.com/Holovkat/designs/issues/26\ntags: [okf, curation, safety, scheduling, quotas, locking, cancellation, resumability]\ntimestamp: 2026-08-06T03:23:02Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\ndecision_status: operator-approved-parameters-pending-2026-08-06\n---\n\n# Decision Status and Scope\n\nThe operator approved this Epic #26 A3 safety contract on 2026-08-06. It\nconverts the known scheduler incident into a fail-closed contract for any future\ncurator executor. It does not approve a scheduler, cron entry, Factory\nconfiguration, curator run, canary, cross-project rollout, deletion, archive,\nor `AGENTS.md` change. Numeric ceilings and named canary data remain mandatory\nper-run parameters; no values are inferred by this approval.\n\nThe current baseline is explicit, repository-scoped operator curation only, as\nrecorded in [Capture Routing and Explicit Curation Trigger](./capture-routing-and-curation-trigger.md)\nand [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md).\nThis proposal constrains a future executor; it does not alter that baseline.\n\n# Verified Facts\n\n| Fact | Source and evidence boundary |\n|---|---|\n| Four former OKF cron entries were disabled after the incident. | Epic #26 Current Evidence. A3 did not inspect, alter, or reactivate cron. |\n| The incident consumed 57,595 Factory OKF-curator sessions and about 6.34 GiB. | Epic #26 Current Evidence; the 2026-08-06 audit comment repeats the Phase A0 scope guard. |\n| Factory was launched from `/Users/tonyholovka`, broadly scanned filesystem/session state, and sustained CPU use. | Epic #26 Current Evidence. A3 did not launch Factory or inspect its sessions. |\n| Canonical templates now prohibit schedules, cron, and Factory automation before the First Decision Gate, and require an explicit repository-scoped operator request. | `templates/okf/OKF-STANDARD.md`, `templates/okf/agents/okf-curator.md`, and the local Phase A0 commit history. |\n| The retained [Passive Threshold Nudge Curation Cadence](../deprecation/passive-nudge-curation-cadence.md) and [Pre-Tiered Post-Commit Capture Model](../deprecation/pre-tiered-post-commit-capture-model.md) are historical, not the current cadence. | The current canonical hook and Epic #26 evidence show Tier 1 capture replaced the nudge; both superseded models remain available as deprecation records. |\n\nThese incident measurements are reported evidence, not values remeasured by\nthis task. No other repository was inspected or mutated.\n\n# Assumptions and Open Parameters\n\n- A future executor is a new, separately approved component; no such runner is\n  created by A3.\n- A future run starts only from a named Git worktree that contains the target\n  `knowledge/` bundle. The repository root is a project boundary, never a\n  discovery hint for a home-directory scan.\n- `max_items`, byte ceilings, and `max_runtime_seconds` require positive,\n  operator-approved values in every C/D implementation or canary packet. The\n  First Decision Gate approved that requirement but selected no values.\n- One execution session is the hard maximum for a run. A resume is a new,\n  explicit operator request that must reacquire the lock; it may not\n  self-create a child session or evade the original plan's quotas.\n- The final lock, checkpoint, report, and kill-switch implementation mechanism\n  is still open, but each must be repository-local and must fail closed when it\n  cannot be validated.\n\n# Proposed Decision: Fail Closed Until a Bounded Manual Run Is Approved\n\nA curator executor may perform mutation only after every requirement below is\nmet. Missing approval, an unset ceiling, a failed preflight, a live lock, an\nunavailable cancellation path, or an unreportable terminal state is a stop\ncondition, not a reason to retry or broaden scope.\n\n## Hard Line-Stops\n\nThe following are prohibited before and after the First Decision Gate unless a\nlater explicit decision replaces this record:\n\n1. **Unbounded scheduling:** no cron, launchd agent, scheduled job, queue\n   consumer, timer, polling loop, self-reinvocation, Factory automation, or\n   automatic session creation may start curation. A status/check command may\n   describe a backlog but never launch work.\n2. **Home-directory or broad host traversal:** a run may not use `/Users`, a\n   home directory, `~`, `/`, or any ancestor of its validated repository root\n   as its target or search scope. Absolute inputs, `..` escapes, and symlinks\n   resolving outside the root are rejected.\n3. **Unbounded resource use:** a run without declared item, byte, runtime, and\n   session ceilings must not start. Reaching any ceiling stops intake and ends\n   the run as quota-exceeded or cancelled.\n4. **Concurrent mutation:** a run without a repository-scoped lock, or one\n   that finds a live lock or conflicting target mutation, must not mutate.\n5. **Irreversible handling:** a run may not delete inbox entries, knowledge,\n   reports, checkpoints, or artifacts. Archive or deletion remains subject to\n   the separately approved reversible/manifest workflow and operator approval.\n6. **Uncontrolled recovery:** stale-lock clearing, retry, resumption, and\n   widening a batch require explicit operator action and an auditable report;\n   they are never automatic.\n7. **Instruction self-modification and rollout:** no autonomous `AGENTS.md`\n   patch, cross-project action, deployment, or canary follows from this record.\n\n## Repository-Root Validation and Containment\n\nBefore enumerating an inbox or reading source context, a future executor must:\n\n1. receive one explicit repository-root argument and canonicalise it to a\n   physical path;\n2. run from that exact path, not a parent or child directory;\n3. prove that `git rev-parse --show-toplevel`, canonicalised to a physical\n   path, equals the supplied root and that the root contains `knowledge/`;\n4. reject the filesystem root, the user's home directory, `/Users`, and any\n   path that is an ancestor of the validated project root;\n5. construct a preflight manifest of only approved root-relative paths,\n   starting with the target inbox; reject absolute paths, `..`, and a symlink\n   whose resolved target leaves the repository; and\n6. record the canonical root, Git revision, declared path allowlist, and\n   operator request in the run report before mutation.\n\nRepository context reads must remain within that manifest. A generic recursive\nhost scan, discovery from `/Users/tonyholovka`, or follow-up scan outside the\nrepository is forbidden.\n\n## One-Run Locking\n\nA future executor must acquire one atomic, repository-local lock immediately\nafter root validation and before enumerating items. The lock records at least a\nrun identifier, canonical root, process/session identity, start time, selected\nlimits, and current phase.\n\n- A second invocation for the same root reports the existing lock metadata and\n  exits without reading or mutating the batch.\n- The lock has no reentrant or child-session mode. `max_sessions` is exactly\n  one for the active run.\n- Stale locks are reported, never silently removed. An operator may perform a\n  later, explicit recovery only after verifying the recorded owner is no longer\n  active; the recovery report preserves the old lock metadata.\n- Normal completion, cancellation, and recoverable failure release the lock\n  only after recording a terminal report or checkpoint. If that cannot happen,\n  the lock remains a safety block.\n\n## Quotas and Enforcement\n\nEvery run plan must declare positive, approved ceilings before it can acquire a\nmutation lock:\n\n| Dimension | Required ceiling and enforcement |\n|---|---|\n| Items | `max_items` bounds candidate items selected by the deterministic preflight manifest and items changed. Selection stops before item `max_items + 1`. |\n| Bytes | `max_input_bytes` bounds the summed bytes of selected source material before content processing. A separate `max_generated_bytes` bounds concepts, checkpoints, reports, logs, and temporary output so disk use cannot grow independently. |\n| Runtime | `max_runtime_seconds` is a wall-clock deadline, measured from lock acquisition. The executor checks it between every bounded unit of work and exits through cancellation/checkpoint handling when reached. |\n| Sessions | `max_sessions: 1` permits only the explicitly requested executor session. It must not launch Factory, child curators, background workers, or replacement sessions. |\n\nCounters are monotonic and observable. A warning may inform an operator but\nnever raises a cap. A cap breach fails closed, records the measured value and\nterminal reason, preserves source knowledge, and requires a new explicit plan;\nit must not automatically retry with a larger limit.\n\n## Cancellation and Kill Switch\n\nA future executor must expose an operator-controlled cancellation path before\nmutation begins. Cancellation must stop new reads and writes at the next safe\nunit of work, write a bounded checkpoint/report, preserve unprocessed source\nitems, and release the lock only after that record is durable.\n\nIt must also support a repository-local, operator-controlled kill switch that:\n\n- blocks every new execution before enumeration or session creation;\n- requests cancellation of the current run without spawning a helper session;\n- records who/what activated it, the time, and the terminal state; and\n- remains active until an explicit operator action clears it.\n\nA missing, unreadable, or ambiguous kill-switch state blocks the run. Killing a\nrun is not permission to delete partial output, clear a lock automatically, or\nrestart it.\n\n## Observability\n\nThe executor must make bounded, operator-readable evidence available without\nwriting raw inbox content or unbounded logs. Preflight, progress, and terminal\nreports must include:\n\n- run identifier; explicit operator request; canonical root and Git revision;\n- path allowlist and deterministic item identifiers/count; declared ceilings;\n- lock acquisition/release state; phase; elapsed runtime; input and generated\n  byte counters; active and maximum session counts; and last checkpoint;\n- terminal outcome (`completed`, `cancelled`, `quota-exceeded`, `blocked`, or\n  `failed`) with a concise reason and recovery instruction; and\n- whether any source item, concept, archive, or instruction file was changed.\n\nA report that cannot establish these fields is a failed run. Reports themselves\nare included in the generated-byte ceiling, remain repository-scoped, and are\nwrite-once: an explicit retry preserves the prior terminal report and uses a\nseparate attempt identity.\n\n## Resumability and Recovery\n\nBefore mutation, the executor must produce a deterministic, bounded plan with\nordered item identifiers, source hashes, root/Git identity, path allowlist, and\napproved limits. It checkpoints after each safe unit or phase without treating\nan item as processed until postflight validation and the required persistence\nstep succeed.\n\nAn explicit resume request may use a checkpoint only when the canonical root,\ninput hashes, path allowlist, and approved limits still match. If they differ,\nit must block and require a new dry-run plan. Resumption must be idempotent:\nreplaying a completed unit cannot duplicate a concept, move/delete an inbox\nitem twice, create another session, or exceed the plan's ceilings. Partial\nfailure leaves a manifest of untouched inputs and generated outputs for\noperator review.\n\n# Explicit Rejections\n\n- **Unbounded scheduled curation:** rejected. The documented 57,595-session,\n  6.34 GiB incident makes automatic recurrence unsafe; a numeric backlog\n  threshold is information, not execution authority.\n- **Factory launch from a home directory or broad filesystem discovery:**\n  rejected. It violates the repository boundary and recreates the incident's\n  broad scanning failure mode.\n- **Retry-until-success and auto-resume:** rejected. They hide cumulative\n  runtime, session, and disk growth and bypass operator approval.\n- **Lock-free “read-only” starts that can later mutate:** rejected. Scope,\n  quota, and concurrency checks must happen before enumeration and mutation.\n- **Cleanup-as-recovery:** rejected. Deleting artifacts or inbox items cannot\n  repair an unsafe run; recovery must be manifest-backed and approved.\n\n# Future Acceptance Criteria and Regression Test Matrix\n\nNo row below is executed by A3 because there is no runner. The rows are\nrequired T1 regression scenarios for C4/C5 implementation and must be repeated\nin the manual canaries owned by D3–D5. Fixtures must be throwaway Git\nrepositories; no test may use a home directory, live inbox, cron, or Factory.\n\n| Scenario | Fixture / stimulus | Required assertion |\n|---|---|---|\n| Explicit manual authority | Invocation missing an operator request, or marked scheduled/event-driven | Fails before root discovery, lock acquisition, or session creation. |\n| Root identity | Non-Git directory, child directory, parent directory, `/`, `$HOME`, and `/Users` | Each is rejected before enumeration; a valid worktree root is accepted only when its Git top level exactly matches. |\n| Containment | Root-relative `..`, absolute path, and symlink escaping a throwaway repo | Preflight rejects each path and records no outside-root read/write. |\n| No scheduler or Factory path | Static configuration scan plus a mocked launcher | No scheduler configuration is accepted and no Factory/child-session launcher is called. |\n| Live lock contention | Two concurrent attempts against one fixture root | First obtains one lock; second exits with lock metadata and changes no files. |\n| Stale-lock safety | Lock whose recorded owner is absent | Default run blocks; only a separately explicit recovery path can proceed and preserves prior lock evidence. |\n| Item and byte caps | Manifests at, below, and one unit above `max_items`, `max_input_bytes`, and `max_generated_bytes` | Over-limit plan fails before processing; at-limit plan never exceeds any counter or disk-output cap. |\n| Runtime and session caps | Controlled clock reaches deadline; mock requests a second/child session | Deadline checkpoints and terminates; `max_sessions: 1` rejects every additional session and no retry starts. |\n| Cancellation and kill switch | Cancel during a unit; activate the kill switch before and during a run | New runs remain blocked; active work reaches a safe checkpoint, preserves input, reports cancellation, and does not self-restart. |\n| Observability | Completed, blocked, quota-exceeded, cancelled, failed, and repeated-attempt fixtures | Each bounded report contains root, revision, limits, counters, lock state, checkpoint, terminal reason, and no raw inbox dump; a later attempt cannot overwrite prior terminal evidence. |\n| Deterministic resume | Interrupt after item _n_, then resume with matching and changed source hashes | Matching plan completes without duplicates; changed hashes block resume and require a new explicit plan. |\n| Non-destructive partial failure | Fail concept or maintenance postflight, or interrupt after a source move | Inputs and prior outputs are restored, processed state is not advanced, and a manifest identifies retained failed output; no deletion or `AGENTS.md` write occurs. |\n\n# Required Parameters Before Any Execution\n\nThe First Decision Gate approved this contract, but each execution-relevant\npacket must still select numeric ceilings, byte-accounting rules, canonical\nlock/checkpoint/report locations, kill-switch authority, named canary dataset,\nand success measures. C4 and C5 may implement the contract behind targeted\nfixture tests after their Phase B dependencies are accepted; D3–D5 may run only\nseparately approved bounded manual canaries. A5's cadence choice cannot weaken\nthese requirements, and no cadence or rollout is authorized by this A3 record.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"Bounded Curation Execution Safety Requirements","description":"Operator-approved fail-closed requirements and regression scenarios for any future OKF curator execution","resource":"https://github.com/Holovkat/designs/issues/26","tags":["okf","curation","safety","scheduling","quotas","locking","cancellation","resumability"],"timestamp":"2026-08-06T03:23:02Z","status":"active","issue_refs":[26],"epic_refs":[26],"decision_status":"operator-approved-parameters-pending-2026-08-06"},"body":"\n# Decision Status and Scope\n\nThe operator approved this Epic #26 A3 safety contract on 2026-08-06. It\nconverts the known scheduler incident into a fail-closed contract for any future\ncurator executor. It does not approve a scheduler, cron entry, Factory\nconfiguration, curator run, canary, cross-project rollout, deletion, archive,\nor `AGENTS.md` change. Numeric ceilings and named canary data remain mandatory\nper-run parameters; no values are inferred by this approval.\n\nThe current baseline is explicit, repository-scoped operator curation only, as\nrecorded in [Capture Routing and Explicit Curation Trigger](./capture-routing-and-curation-trigger.md)\nand [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md).\nThis proposal constrains a future executor; it does not alter that baseline.\n\n# Verified Facts\n\n| Fact | Source and evidence boundary |\n|---|---|\n| Four former OKF cron entries were disabled after the incident. | Epic #26 Current Evidence. A3 did not inspect, alter, or reactivate cron. |\n| The incident consumed 57,595 Factory OKF-curator sessions and about 6.34 GiB. | Epic #26 Current Evidence; the 2026-08-06 audit comment repeats the Phase A0 scope guard. |\n| Factory was launched from `/Users/tonyholovka`, broadly scanned filesyste  Rejections\n\n- **Unbounded scheduled curation:** rejected. The documented 57,595-session,\n  6.34 GiB incident makes automatic recurrence unsafe; a numeric backlog\n  threshold is information, not execution authority.\n- **Factory launch from a home directory or broad filesystem discovery:**\n  rejected. It violates the repository boundary and recreates the incident's\n  broad scanning failure mode.\n- **Retry-until-success and auto-resume:** rejected. They hide cumulative\n  runtime, session, and disk growth and bypass operator approval.\n- **Lock-free “read-only” starts that can later mutate:** rejected. Scope,\n  quota, and concurrency checks must happen before enumeration and mutation.\n- **Cleanup-as-recovery:** rejected. Deleting artifacts or inbox items cannot\n  repair an unsafe run; recovery must be manifest-backed and approved.\n\n# Future Acceptance Criteria and Regression Test Matrix\n\nNo row below is executed by A3 because there is no runner. The rows are\nrequired T1 regression scenarios for C4/C5 implementation and must be repeated\nin the manual canaries owned by D3–D5. Fixtures must be throwaway Git\nrepositories; no test may use a home directory, live inbox, cron, or Factory.\n\n| Scenario | Fixture / stimulus | Required assertion |\n|---|---|---|\n| Explicit manual authority | Invocation missing an operator request, or marked scheduled/event-driven | Fails before root discovery, lock acquisition, or session creation. |\n| Root identity | Non-Git directory, child directory, parent directory, `/`, `$HOME`, and `/Users` | Each is rejected before enumeration; a valid worktree root is accepted only when its Git top level exactly matches. |\n| Containment | Root-relative `..`, absolute path, and symlink escaping a throwaway repo | Preflight rejects each path and records no outside-root read/write. |\n| No scheduler or Factory path | Static configuration scan plus a mocked launcher | No scheduler configuration is accepted and no Factory/child-session launcher is called. |\n| Live lock contention | Two concurrent attempts against one fixture root | First obtains one lock; second exits with lock metadata and changes no files. |\n| Stale-lock safety | Lock whose recorded owner is absent | Default run blocks; only a separately explicit recovery path can proceed and preserves prior lock evidence. |\n| Item and byte caps | Manifests at, below, and one unit above `max_items`, `max_input_bytes`, and `max_generated_bytes` | Over-limit plan fails before processing; at-limit plan never exceeds any counter or disk-output cap. |\n| Runtime and session caps | Controlled clock reaches deadline; mock requests a second/child session | Deadline checkpoints and terminates; `max_sessions: 1` rejects every additional session and no retry starts. |\n| Cancellation and kill switch | Cancel during a unit; activate the kill switch before and during a run | New runs remain blocked; active work reaches a safe checkpoint, preserves input, reports cancellation, and does not self-restart. |\n| Observability | Completed, blocked, quota-exceeded, cancelled, failed, and repeated-attempt fixtures | Each bounded report contains root, revision, limits, counters, lock state, checkpoint, terminal reason, and no raw inbox dump; a later attempt cannot overwrite prior terminal evidence. |\n| Deterministic resume | Interrupt after item _n_, then resume with matching and changed source hashes | Matching plan completes without duplicates; changed hashes block resume and require a new explicit plan. |\n| Non-destructive partial failure | Fail concept or maintenance postflight, or interrupt after a source move | Inputs and prior outputs are restored, processed state is not advanced, and a manifest identifies retained failed output; no deletion or `AGENTS.md` write occurs. |\n\n# Required Parameters Before Any Execution\n\nThe First Decision Gate approved this contract, but each execution-relevant\npacket must still select numeric ceilings, byte-accounting rules, canonical\nlock/checkpoint/report locations, kill-switch authority, named canary dataset,\nand success measures. C4 and C5 may implement the contract behind targeted\nfixture tests after their Phase B dependencies are accepted; D3–D5 may run only\nseparately approved bounded manual canaries. A5's cadence choice cannot weaken\nthese requirements, and no cadence or rollout is authorized by this A3 record.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/capture-routing-and-curation-trigger.md","content":"---\ntype: Decision\nid: okf-b7e2d4c6-8a10-4f35-9c72-e1d3a5b70984\ntitle: Capture Routing and Explicit Curation Trigger\ndescription: Approved dirty-tree routing, loop-guard subjects, and bounded manual curation trigger for the two-tier inbox\nresource: https://github.com/Holovkat/designs/issues/31\ntags: [okf, inbox, capture-tier, curation, git-hooks, governance]\ntimestamp: 2026-08-06T01:06:33Z\nstatus: active\nissue_refs: [31]\nepic_refs: [26]\ndecision_status: operator-approved-2026-08-06\nsupersedes: [okf-2a4f6c8e-1b3d-4e75-9a02-c6d8f103b547]\n---\n\n# Context\n\nA Tier 1 post-commit capture intentionally writes its inbox item and index row\nafter the developer's commit. Without a routing convention, every ordinary\ncommit leaves a dirty tree and the final capture of a session can remain\nuncommitted. The former five-item nudge was removed because per-commit capture\nwould make it continuously noisy. Epic #26 records a prior cron/Factory runaway\nof 57,595 sessions and 6.34 GiB, so this decision must not restore schedules or\nunbounded automation.\n\n# Decision\n\n## Capture Persistence Owner and Subject Convention\n\n`end-session` owns capture persistence, not individual developers or the\npost-commit hook. At session close it must:\n\n1. collect the current session's ordinary commit SHAs;\n2. write one Tier 2 session synthesis that references those SHAs;\n3. stage only pending Tier 1 captures, their `knowledge/inbox/index.md` and\n   `knowledge/index.md` rows, and that Tier 2 item; and\n4. commit them with `okf-capture: persist session captures`.\n\nThe post-commit hook must skip both `okf-capture:` and `okf-curation:` subjects.\nThis makes the persistence commit terminal rather than generating another dirty\nTier 1 item. Curators continue to commit generated concepts under\n`okf-curation: \u003cbounded batch summary>` and receive the same loop guard.\n\n## Curation Trigger\n\nUse an **explicit operator-triggered, repository-scoped curation check** at a\ncoherent sprint checkpoint or epic close. A deterministic status command may\nreport inbox count, age, and size when the operator asks, but must not start a\ncurator, schedule work, traverse a home directory, or create sessions. The\noperator separately chooses whether to run one bounded curator batch.\n\nThis replaces the removed count nudge without treating a numeric threshold as\nautomation authority. Batch limits, locking, cancellation, resumability, and\ncanary evidence remain First Decision Gate work; this decision does not approve\nthem.\n\n# Alternatives Considered and Rejected\n\n- **Nightly cron or Factory scheduling:** rejected. Epic #26's 57,595-session,\n  6.34 GiB incident is a hard line-stop; no scheduler returns before bounded\n  canaries and explicit gate approval.\n- **Per-commit threshold nudge:** rejected. Tier 1 writes every ordinary\n  commit, so the old five-item rule becomes permanent noise rather than a useful\n  decision point.\n- **Hook commits its own capture:** rejected. A post-commit hook mutating the\n  repository cannot safely create a follow-on commit, conflicts with user work,\n  and obscures ownership.\n- **Every developer manually commits captures after each change:** rejected.\n  It is error-prone, makes normal work noisy, and still fails to provide a\n  terminal loop guard.\n- **Cross-project rollout:** rejected. This decision applies only to canonical\n  `designs` templates; the fms backlogs remain outside Phase A0.\n\n# Approved Implementation Contract\n\n## `templates/okf/OKF-STANDARD.md`\n\n**Current:** Tier 2 says it is written at session close by `end-session`, but\nit does not say who commits the hook-created dirty files or which commit\nsubjects are loop-guarded.\n\n**Approved implementation:**\n\n```md\n### Capture Persistence\n\nAt session close, `end-session` stages pending Tier 1 captures and their index\nrows with the one Tier 2 synthesis, then commits only those files as\n`okf-capture: persist session captures`. The post-commit hook skips both\n`okf-capture:` and `okf-curation:` subjects so this terminal persistence commit\ndoes not create another Tier 1 item. Curators use\n`okf-curation: \u003cbounded batch summary>` for concept commits.\n```\n\n**Current:** the standard says curation is an explicit operator action pending a\nbounded cadence, but gives no selected manual trigger.\n\n**Approved implementation:**\n\n```md\nAt a sprint checkpoint or epic close, an operator may run a repository-scoped\ninbox-status check and explicitly request one bounded curation batch. Count,\nage, and size inform that decision only; they never start curation, scheduling,\nor session creation.\n```\n\n## `templates/okf/agents/okf-curator.md`\n\n**Current:** the contract specifies Phase 3 processing and loop-prevention\nresponsibilities indirectly, but contains no commit-subject convention.\n\n**Approved after Phase 3 step 15:**\n\n```md\n16. Commit only the bounded curation output with\n    `okf-curation: \u003cbounded batch summary>`. This subject is a post-commit\n    loop guard; do not use it for ordinary work or capture persistence.\n```\n\n**Current:** the contract's Input section does not require a bounded,\noperator-requested invocation.\n\n**Approved implementation:**\n\n```md\nThe operator must explicitly request this repository-scoped curation run. Do\nnot schedule, self-reinvoke, traverse outside the supplied repository, or\ncreate additional sessions. Runtime, item, and byte ceilings are introduced\nonly after the Epic #26 First Decision Gate approves them.\n```\n\n## `templates/okf/post-commit.sh`\n\n**Current:**\n\n```bash\n# Skip curation commits to prevent loops\ncase \"$COMMIT_SUBJECT\" in\n    okf-curation:*) exit 0 ;;\nesac\n```\n\n**Approved implementation:**\n\n```bash\n# Skip terminal capture-persistence and curation commits to prevent loops.\ncase \"$COMMIT_SUBJECT\" in\n    okf-capture:*|okf-curation:*) exit 0 ;;\nesac\n```\n\n# Approval Boundary\n\nThe operator approved this decision on 2026-08-06. It authorizes the\nrepository-local hook guard, `end-session` capture persistence, and the listed\nstandard and curator-contract alignment. It does **not** authorize a scheduler,\ncron, Factory configuration, curator invocation, or cross-project rollout.\nRuntime ceilings, locking, cancellation, resumability, and canary evidence\nremain First Decision Gate work.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","id":"okf-b7e2d4c6-8a10-4f35-9c72-e1d3a5b70984","title":"Capture Routing and Explicit Curation Trigger","description":"Approved dirty-tree routing, loop-guard subjects, and bounded manual curation trigger for the two-tier inbox","resource":"https://github.com/Holovkat/designs/issues/31","tags":["okf","inbox","capture-tier","curation","git-hooks","governance"],"timestamp":"2026-08-06T01:06:33Z","status":"active","issue_refs":[31],"epic_refs":[26],"decision_status":"operator-approved-2026-08-06","supersedes":["okf-2a4f6c8e-1b3d-4e75-9a02-c6d8f103b547"]},"body":"\n# Context\n\nA Tier 1 post-commit capture intentionally writes its inbox item and index row\nafter the developer's commit. Without a routing convention, every ordinary\ncommit leaves a dirty tree and the final capture of a session can remain\nuncommitted. The former five-item nudge was removed because per-commit capture\nwould make it continuously noisy. Epic #26 records a prior cron/Factory runaway\nof 57,595 sessions and 6.34 GiB, so this ted. A post-commit hook mutating the\n  repository cannot safely create a follow-on commit, conflicts with user work,\n  and obscures ownership.\n- **Every developer manually commits captures after each change:** rejected.\n  It is error-prone, makes normal work noisy, and still fails to provide a\n  terminal loop guard.\n- **Cross-project rollout:** rejected. This decision applies only to canonical\n  `designs` templates; the fms backlogs remain outside Phase A0.\n\n# Approved Implementation Contract\n\n## `templates/okf/OKF-STANDARD.md`\n\n**Current:** Tier 2 says it is written at session close by `end-session`, but\nit does not say who commits the hook-created dirty files or which commit\nsubjects are loop-guarded.\n\n**Approved implementation:**\n\n```md\n### Capture Persistence\n\nAt session close, `end-session` stages pending Tier 1 captures and their index\nrows with the one Tier 2 synthesis, then commits only those files as\n`okf-capture: persist session captures`. The post-commit hook skips both\n`okf-capture:` and `okf-curation:` subjects so this terminal persistence commit\ndoes not create another Tier 1 item. Curators use\n`okf-curation: \u003cbounded batch summary>` for concept commits.\n```\n\n**Current:** the standard says curation is an explicit operator action pending a\nbounded cadence, but gives no selected manual trigger.\n\n**Approved implementation:**\n\n```md\nAt a sprint checkpoint or epic close, an operator may run a repository-scoped\ninbox-status check and explicitly request one bounded curation batch. Count,\nage, and size inform that decision only; they never start curation, scheduling,\nor session creation.\n```\n\n## `templates/okf/agents/okf-curator.md`\n\n**Current:** the contract specifies Phase 3 processing and loop-prevention\nresponsibilities indirectly, but contains no commit-subject convention.\n\n**Approved after Phase 3 step 15:**\n\n```md\n16. Commit only the bounded curation output with\n    `okf-curation: \u003cbounded batch summary>`. This subject is a post-commit\n    loop guard; do not use it for ordinary work or capture persistence.\n```\n\n**Current:** the contract's Input section does not require a bounded,\noperator-requested invocation.\n\n**Approved implementation:**\n\n```md\nThe operator must explicitly request this repository-scoped curation run. Do\nnot schedule, self-reinvoke, traverse outside the supplied repository, or\ncreate additional sessions. Runtime, item, and byte ceilings are introduced\nonly after the Epic #26 First Decision Gate approves them.\n```\n\n## `templates/okf/post-commit.sh`\n\n**Current:**\n\n```bash\n# Skip curation commits to prevent loops\ncase \"$COMMIT_SUBJECT\" in\n    okf-curation:*) exit 0 ;;\nesac\n```\n\n**Approved implementation:**\n\n```bash\n# Skip terminal capture-persistence and curation commits to prevent loops.\ncase \"$COMMIT_SUBJECT\" in\n    okf-capture:*|okf-curation:*) exit 0 ;;\nesac\n```\n\n# Approval Boundary\n\nThe operator approved this decision on 2026-08-06. It authorizes the\nrepository-local hook guard, `end-session` capture persistence, and the listed\nstandard and curator-contract alignment. It does **not** authorize a scheduler,\ncron, Factory configuration, curator invocation, or cross-project rollout.\nRuntime ceilings, locking, cancellation, resumability, and canary evidence\nremain First Decision Gate work.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/curation-cadence-first-decision-gate.md","content":"---\ntype: Decision\nid: okf-91c7e4a2-6d3f-4b85-9a10-2f6c8e73d541\ntitle: Curation Cadence and First Decision Gate\ndescription: Operator-approved explicit, repository-scoped, operator-requested status review and bounded manual curation model\nresource: https://github.com/Holovkat/designs/issues/26\ntags: [okf, curation, cadence, safety, operator-approval]\ntimestamp: 2026-08-06T03:19:40Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\ndecision_status: operator-approved-2026-08-06\nsupersedes: [okf-0d7a8c1e-9b4f-4d21-8a3c-7e5f6012b934]\n---\n\n# Decision Status and Scope\n\nThe operator approved this Epic #26 A5 decision on 2026-08-06. It selects the\ncurrent operating model and the First Decision Gate boundary. It does not enable\na scheduler, cron, launchd job, Factory task, curator run, canary, hook\ndeployment, cross-project rollout, archive, deletion, or `AGENTS.md` patch.\n\n# Evidence and Constraints\n\n- A1 identified a canonical hook call to a parent-workspace\n  `generate-all-viz.js --manifest`, which could scan sibling bundles and write\n  outside the repository. The designs-only remediation `20acf25` removed that\n  call; the hook fixture now proves a parent generator is not invoked. The\n  First Decision Gate must retain that repository-scoped verification.\n- A1 finds fms-glm and fmsroadie/fmsmercury drifted, with missing or legacy\n  hooks, absent Tier 2/curator deployment, and stale inbox counts. This is\n  inventory evidence, not cross-project rollout authority.\n- A2 finds the designs inbox is heterogeneous: 8 pending items contain one\n  current five-Tier-1-plus-one-Tier-2 group and two older legacy syntheses.\n  Count alone is not a useful execution signal. Historical yield is batch-level\n  only and does not measure knowledge usefulness.\n- A3 records the 57,595-session, 6.34 GiB cron/Factory incident and requires\n  fail-closed root validation, one-run locking, declared items/bytes/runtime/\n  session ceilings, cancellation, kill switch, observability, and resumability.\n- A0 approved terminal capture persistence and explicit repository-scoped\n  operator curation; neither approval authorizes an automatic cadence.\n\n# Options Considered\n\n| Model | Benefits | Failure and operating cost | Decision |\n|---|---|---|---|\n| Passive manual only, no status evidence | Lowest machinery and no automatic run | Backlogs remain invisible; no comparable health evidence or explicit queue | Rejected as insufficiently observable. |\n| Per-commit numeric nudge | Simple in the former model | Tier 1 writes on every ordinary commit, so a threshold becomes continuous noise; count is not workload; hook must remain fast | Rejected. |\n| Threshold queue/status report | Makes count, bytes, age, and quality visible without mutation | Can be misread as execution authority; requires clear operator boundary | Accepted only as an explicit status report, never an automatic trigger. |\n| Event-driven operator prompt at sprint checkpoint or epic close | Aligns review with coherent work and decision ownership | Depends on human action and a stable report contract | Accepted as the request point for status review. |\n| Scheduled cron/launchd/Factory or self-reinvocation | Could reduce manual reminders | Recreates the documented runaway risk; needs resource, path, and concurrency controls not yet proven | Rejected before bounded canaries and separate approval. |\n| Hybrid automatic queue plus scheduled curator | May reduce backlog age | Combines threshold noise with autonomous mutation and cumulative resource risk | Rejected. |\n\n# Recommended Current Cadence\n\nAdopt an **explicit, repository-scoped, operator-requested status review** at a\ncoherent sprint checkpoint or epic close. The review may run a deterministic\nread-only `inbox-status` command against one named repository root. It reports\npending count, bytes, age, capture-tier distribution, size/quality/duplicate\nwarnings, and current lock/kill-switch state if a bounded runner exists.\n\nThe report does not start curation. An operator must separately request one\nbounded manual curation batch, naming the repository/worktree, branch or\nsnapshot, item/byte/runtime/session ceilings, and the expected outcome. Until\nC4/C6 and D3 pass, the only approved current action is status review and\nmanual planning; there is no approved curator executor.\n\nA2's 30-day age and 10-item/16-KiB load boundaries are advisory report flags\nonly. They do not enqueue, schedule, notify repeatedly, create a session, or\nauthorize mutation.\n\n## Authority and Stop Conditions\n\nA valid future batch request must include the operator identity, target root,\nGit revision/worktree, selected items or deterministic selection rule, positive\nA3-aligned ceilings, cancellation path, kill-switch state, and a rollback or\nrecovery plan. It must stop before mutation when any of these is absent, when\nthe repository-scoped isolation preflight fails, when the root/lock/path\npreflight fails, when a quota is reached, or when reporting/checkpointing cannot\nbe made durable.\n\nNo request may use a home directory, `/Users`, a parent workspace, broad\nfilesystem discovery, a global hook path, or a cross-project selection. One\nrepository and one executor session are the maximum scope of a run.\n\n# First Decision Gate Record\n\nThe operator approved the following boundary before Phase B design work:\n\n1. A1 deployment audit plus the `20acf25` P0 remediation and its fixture proof\n   that the active canonical hook has no parent-workspace manifest call.\n2. A2 baseline and the approved quality/retention choices in A4.\n3. A3 safety contract: numeric item/input/generated-byte/runtime ceilings,\n   one-run lock, repository-local report/checkpoint paths, cancellation,\n   kill-switch authority, and recovery procedure.\n4. This cadence: status review is explicit and non-mutating; batch execution is\n   separately operator-requested, repository-scoped, bounded, and manual.\n5. Named canary datasets, isolated worktrees/snapshots, success measures, and\n   stop/rollback conditions for D3–D5.\n6. Confirmation that no external bundle deployment, scheduler, or Factory\n   configuration is included in the approval.\n\n# Proposed Text Changes — Not Applied\n\n## `templates/okf/post-commit.sh`\n\n**Current:** the hook writes Tier 1 captures with terminal\n`okf-capture:`/`okf-curation:` guards and has no parent-workspace manifest call\n(after `20acf25`).\n\n**Proposed:** pres
