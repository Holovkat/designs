resource: ./README.md\ntags: [designs, delivery, lifecycle, governance, verification, dev-uat, qa, regression, production, closeout]\ntimestamp: 2026-07-13T03:35:53Z\nstatus: active\n---\n\n# Delivery Lifecycle\n\n## Overview\n\nThe lifecycle keeps implementation fast by scaling verification at coherent boundaries. Changed behavior receives tests during development; affected subsystems are checked at sprint checkpoints; completed sprint or epic functionality is accepted in Dev; full application regression runs after approved deployment to canonical QA.\n\n## Lifecycle Stages\n\n1. **Planning approved** - Enter the governed build session with authoritative epic and sprint acceptance criteria.\n2. **Freeze task packet** - Lock the current task scope, contracts, risks, and evidence expectations.\n3. **T1 Development** - Implement the smallest clean change, add or update tests for changed behavior, and run targeted checks plus the narrowest relevant analyzer or build check.\n4. **T2 Sprint checkpoint** - After a coherent dependency or phase batch, run affected-subsystem checks and one combined code/specification review.\n5. **Compliance and DoD review** - Rank delivered scope and resolve missing requirements or accepted caveats.\n6. **T3 Dev UAT** - Validate the completed sprint or epic journeys, acceptance criteria, material failure paths, and relevant integration boundaries in canonical Dev.\n7. **Dev functionality accepted?** - Failure returns scoped evidence to implementation; success authorizes the governed QA path.\n8. **Project-defined QA deployment authority** - Produce the canonical QA build through the project-governed workflow.\n9. **T4 QA application readiness** - Run the full repository-required suite and end-to-end regression across applicable integrations, roles, supported devices, persistence/offline behavior, migrations, and operational failure paths.\n10. **QA application ready?** - Failure returns reproduction evidence for rework; success proceeds to explicit owner approval.\n11. **Production approval gate** - The owner names the production target and authorized release scope.\n12. **Governed production promotion** - Move the approved artifact through the project-defined path.\n13. **T5 Release verification** - Confirm active release vectors, artifact identity, canonical environment, and post-deployment smoke scenarios.\n14. **Final signoff and closeout** - Record evidence, residual risk, cleanup, documentation, and lessons learned.\n\n## Stage Gates\n\n| Gate | Decision point | Failure path |\n| --- | --- | --- |\n| T1 changed behavior | Targeted checks pass / fail | Fix the current change before advancing |\n| T2 sprint checkpoint | Affected subsystem coherent / not coherent | Return the batch for scoped rework |\n| DoD rank | Pass / conditional / fail | Conditional requires owner decision; failure returns to implementation |\n| T3 Dev UAT | Sprint or epic functionality accepted / rejected | Return changed flows and reproduction evidence |\n| T4 QA readiness | Full application regression passes / fails | Rework or replan, then repeat QA readiness |\n| Production approval | Explicitly approved / not approved | Stay at the gate |\n| T5 final signoff | Pass / fail | Rework, rollback, or replan through the governed path |\n\n## Key Principles\n\n- Do not run whole-application regression after every minor edit.\n- Do not defer tests for changed behavior until the end of the epic.\n- Dev UAT proves delivered functionality; QA proves application readiness.\n- High-risk changes may widen an earlier gate around the affected risk.\n- Evidence and completion language must name the highest stage actually proven.\n- Production promotion remains explicitly governed and never follows automatically from passing tests.\n\n## Related Concepts\n\n- [Planning Decomposition](./planning-decomposition.md)\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Closeout Process](./closeout-process.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Workflow Guide](./workflow-guide.md)\n- [Skill Distribution Sync](./skill-distribution-sync.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Delivery Lifecycle","description":"Efficient staged delivery from approved planning through targeted development checks, sprint checkpoints, Dev UAT, full QA application readiness, release approval, and closeout","resource":"./README.md","tags":["designs","delivery","lifecycle","governance","verification","dev-uat","qa","regression","production","closeout"],"timestamp":"2026-07-13T03:35:53Z","status":"active"},"body":"\n# Delivery Lifecycle\n\n## Overview\n\nThe lifecycle keeps implementation fast by scaling verification at coherent boundaries. Changed behavior receives tests during development; affected subsystems are checked at sprint checkpoints; completed sprint or epic functionality is accepted in Dev; full application regression runs after approved deployment to canonical QA.\n\n## Lifecycle Stages\n\n1. **Planning approved** - Enter the governed build session with authoritative epic and sprint acceptance criteria.\n2. **Freeze task packet** - Lock the current task scope, contracts, risks, and evidence expectations.\n3. **T1 Development** - Implement the smallest clean change, add or update tests for changed behavior, and run targeted checks plus the narrowest relevant analyzer or build check.\n4. **T2 Sprint checkpoint** - After a coherent dependency or phase batch, run affected-subsystem checks and one combined code/specification review.\n5. **Compliance and DoD review** - Rank delivered scope and resolve missing requirements or accepted caveats.\n6. **T3 Dev UAT** - Validate the completed sprint or epic journeys, acceptance criteria, material failure paths, and relevant integration boundaries in canonical Dev.\n7. **Dev functionality accepted?** - Failure returns scoped evidence to implementation; success authorizes the governed QA path.\n8. **Project-defined QA deployment authority** - Produce the canonical QA build through the project-governed workflow.\n9. **T4 QA application readiness** - Run the full repository-required suite and end-to-end regression across applicable integrations, roles, supported devices, persistence/offline behavior, migrations, and operational failure paths.\n10. **QA application ready?** - Failure returns reproduction evidence for rework; success proceeds to explicit owner approval.\n11. **Production approval gate** - The owner names the production target and authorized release scope.\n12. **Governed production promotion** - Move the approved artifact through the project-defined path.\n13. **T5 Release verification** - Confirm active release vectors, artifact identity, canonical environment, and post-deployment smoke scenarios.\n14. **Final signoff and closeout** - Record evidence, residual risk, cleanup, documentation, and lessons learned.\n\n## Stage Gates\n\n| Gate | Decision point | Failure path |\n| --- | --- | --- |\n| T1 changed behavior | Targeted checks pass / fail | Fix the current change before advancing |\n| T2 sprint checkpoint | Affected subsystem coherent / not coherent | Return the batch for scoped rework |\n| DoD rank | Pass / conditional / fail | Conditional requires owner decision; failure returns to implementation |\n| T3 Dev UAT | Sprint or epic functionality accepted / rejected | Return changed flows and reproduction evidence |\n| T4 QA readiness | Full application regression passes / fails | Rework or replan, then repeat QA readiness |\n| Production approval | Explicitly approved / not approved | Stay at the gate |\n| T5 final signoff | Pass / fail | Rework, rollback, or replan through the governed path |\n\n## Key Principles\n\n- Do not run whole-application regression after every minor edit.\n- Do not defer tests for changed behavior until the end of the epic.\n- Dev UAT proves delivered functionality; QA proves application readiness.\n- High-risk changes may widen an earlier gate around the affected risk.\n- Evidence and completion language must name the highest stage actually proven.\n- Production promotion remains explicitly governed and never follows automatically from passing tests.\n\n## Related Concepts\n\n- [Planning Decomposition](./planning-decomposition.md)\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Closeout Process](./closeout-process.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Workflow Guide](./workflow-guide.md)\n- [Skill Distribution Sync](./skill-distribution-sync.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/deploy-okf.md","content":"---\ntype: Process\ntitle: Deploy OKF to a Project\ndescription: Nine-phase warning-first deployment from offline install through bounded verification and canary review\nresource: ./templates/okf/DEPLOYMENT-RUNBOOK.md\ntags: [okf, deployment, runbook, install, workflow]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-contract\nevidence_refs: [templates/okf/DEPLOYMENT-RUNBOOK.md, templates/okf/install-okf.sh]\n---\n\n# Deployment contract\n\nThe canonical runbook defines nine phases: mechanical install, legacy seeding,\nepic processing, optional schema diagrams, AGENTS.md alignment review, bounded\ncuration, warning-first core-profile adoption, typed viewer generation, and\ncombined verification/canary review.\n\nThe installer copies the project-local knowledge structure, portable search,\nviewer/generator, quality-aware hook, curator contract, pinned YAML runtime,\nschema/generated validator, accepted libraries/commands, and control templates.\nIt preserves existing controls and installs no dependency, runtime process,\nnetwork fetch, schedule, queue, Factory task, or cross-project discovery path.\n\n# Existing projects\n\nExisting docs stay in place and concepts reference them through `resource`.\nRetained knowledge is audited in warning mode; new or materially updated records\nmay opt into `okf-core/1.0`. A strict-bundle migration requires a manifest and\nrollback proof. AGENTS.md differences are proposals unless the operator has\nexplicitly requested the installer to append the standard section.\n\n# Curation and verification\n\nCuration uses one exact physical Git root/revision, explicit selected sources,\npositive quotas, one lock/session, deterministic proposal, staged strict\nvalidation, postflight, checkpoints, bounded reports, cancellation, and\nrecoverable source handling. Final verification includes parser/schema/linter,\ncapture quality, typed viewer/query, runner failure/resume, triage,\narchive/rollback, cadence, runtime/installer, and isolated small/medium/large\ncanaries. A successful snapshot is not live rollout authority.\n\n# Related concepts\n\n- [OKF Curation Pass](./curation-pass.md)\n- [Verify OKF Deployment](./verify-deployment.md)\n- [Curation Cadence and First Decision Gate](../decisions/curation-cadence-first-decision-gate.md)\n- [Bounded Curation Execution Safety](../decisions/bounded-curation-execution-safety.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Deploy OKF to a Project","description":"Nine-phase warning-first deployment from offline install through bounded verification and canary review","resource":"./templates/okf/DEPLOYMENT-RUNBOOK.md","tags":["okf","deployment","runbook","install","workflow"],"timestamp":"2026-08-08T00:00:00Z","status":"active","issue_refs":[26],"epic_refs":[26],"assertion_state":"proposed","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-contract","evidence_refs":["templates/okf/DEPLOYMENT-RUNBOOK.md","templates/okf/install-okf.sh"]},"body":"\n# Deployment contract\n\nThe canonical runbook defines nine phases: mechanical install, legacy seeding,\nepic processing, optional schema diagrams, AGENTS.md alignment review, bounded\ncuration, warning-first core-profile adoption, typed viewer generation, and\ncombined verification/canary review.\n\nThe installer copies the project-local knowledge structure, portable search,\nviewer/generator, quality-aware hook, curator contract, pinned YAML runtime,\nschema/generated validator, accepted libraries/commands, and control templates.\nIt preserves existing controls and installs no dependency, runtime process,\nnetwork fetch, schedule, queue, Factory task, or cross-project discovery path.\n\n# Existing projects\n\nExisting docs stay in place and concepts reference them through `resource`.\nRetained knowledge is audited in warning mode; new or materially updated records\nmay opt into `okf-core/1.0`. A strict-bundle migration requires a manifest and\nrollback proof. AGENTS.md differences are proposals unless the operator has\nexplicitly requested the installer to append the standard section.\n\n# Curation and verification\n\nCuration uses one exact physical Git root/revision, explicit selected sources,\npositive quotas, one lock/session, deterministic proposal, staged strict\nvalidation, postflight, checkpoints, bounded reports, cancellation, and\nrecoverable source handling. Final verification includes parser/schema/linter,\ncapture quality, typed viewer/query, runner failure/resume, triage,\narchive/rollback, cadence, runtime/installer, and isolated small/medium/large\ncanaries. A successful snapshot is not live rollout authority.\n\n# Related concepts\n\n- [OKF Curation Pass](./curation-pass.md)\n- [Verify OKF Deployment](./verify-deployment.md)\n- [Curation Cadence and First Decision Gate](../decisions/curation-cadence-first-decision-gate.md)\n- [Bounded Curation Execution Safety](../decisions/bounded-curation-execution-safety.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/deployment-guide.md","content":"---\ntype: Process\ntitle: Deployment Guide\ndescription: Dual-environment deployment with Vercel for production demos and Dokku on Hetzner for UAT testing\nresource: ./templates/instructional-documents/deployment-guide.md\ntags: [designs, deployment, vercel, dokku, hetzner, docker, ci-cd]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Deployment Guide\n\n## Environments\n\n| Environment | Platform | Purpose | Trigger |\n|-------------|----------|---------|---------|\n| Production Demo | Vercel | Stakeholder demos, public access | Auto on main push |\n| UAT/Testing | Dokku on Hetzner | Personal testing, validation | Auto on main push |\n| PR Previews | Vercel | Review changes before merge | Auto on every PR |\n\n## Vercel Setup (Production Demo)\n\nVercel provides zero-config Next.js deployments with automatic preview URLs for every PR.\n\n- CLI setup: `vercel login`, `vercel` from project root\n- Environment variables set in Vercel Dashboard (CONVEX_DEPLOYMENT, NEXT_PUBLIC_CONVEX_URL, WORKOS keys)\n- Features: auto-deploy on main push, preview URLs per PR, one-click rollbacks, analytics\n\n## Dokku on Hetzner (UAT/Testing)\n\nDokku is a lightweight PaaS running on a Hetzner VPS.\n\n### Setup Steps\n1. Install Dokku on the server\n2. Create app: `dokku apps:create fms-glm`\n3. Set domain and environment variables\n4. Configure SSL with Let's Encrypt\n\n### Project Configuration\n- `next.config.ts` with `output: 'standalone'`\n- Multi-stage Dockerfile (builder + runner)\n- `.dockerignore` for node_modules, .next, .git\n- Optional `app.json` with healthchecks\n\n### Deployment\n- Manual: `git push dokku main`\n- Automatic: GitHub Actions workflow using `dokku/github-action`\n\n## Reverse Proxy Integration\n\nDokku uses nginx by default. Options:\n- Let Dokku manage its own proxy on a different port\n- Disable Dokku's proxy and use existing reverse proxy (nginx/Traefik)\n\n## Deployment Flow\n\n```\nGitHub main push\n  -> GitHub Actions -> Hetzner/Dokku (UAT)\n  -> Vercel webhook -> Vercel (Production)\n```\n\nPR creation triggers Vercel preview deploy with unique URL.\n\n## Security Considerations\n\n1. Never commit secrets - use environment variables\n2. Use SSH keys for Dokku deployments\n3. Enable SSL with Let's Encrypt on both platforms\n4. Rotate deployment keys periodically\n5. Use GitHub branch protection rules\n\n## Related Concepts\n\n- [GitHub Workflow Guide](./github-workflow.md)\n- [Convex Self-Hosted Setup](./convex-self-hosted.md)\n- [WorkOS Auth Integration](./workos-auth-integration.md)\n- [Stripe Payment Integration](./stripe-payment-integration.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Deployment Guide","description":"Dual-environment deployment with Vercel for production demos and Dokku on Hetzner for UAT testing","resource":"./templates/instructional-documents/deployment-guide.md","tags":["designs","deployment","vercel","dokku","hetzner","docker","ci-cd"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Deployment Guide\n\n## Environments\n\n| Environment | Platform | Purpose | Trigger |\n|-------------|----------|---------|---------|\n| Production Demo | Vercel | Stakeholder demos, public access | Auto on main push |\n| UAT/Testing | Dokku on Hetzner | Personal testing, validation | Auto on main push |\n| PR Previews | Vercel | Review changes before merge | Auto on every PR |\n\n## Vercel Setup (Production Demo)\n\nVercel provides zero-config Next.js deployments with automatic preview URLs for every PR.\n\n- CLI setup: `vercel login`, `vercel` from project root\n- Environment variables set in Vercel Dashboard (CONVEX_DEPLOYMENT, NEXT_PUBLIC_CONVEX_URL, WORKOS keys)\n- Features: auto-deploy on main push, preview URLs per PR, one-click rollbacks, analytics\n\n## Dokku on Hetzner (UAT/Testing)\n\nDokku is a lightweight PaaS running on a Hetzner VPS.\n\n### Setup Steps\n1. Install Dokku on the server\n2. Create app: `dokku apps:create fms-glm`\n3. Set domain and environment variables\n4. Configure SSL with Let's Encrypt\n\n### Project Configuration\n- `next.config.ts` with `output: 'standalone'`\n- Multi-stage Dockerfile (builder + runner)\n- `.dockerignore` for node_modules, .next, .git\n- Optional `app.json` with healthchecks\n\n### Deployment\n- Manual: `git push dokku main`\n- Automatic: GitHub Actions workflow using `dokku/github-action`\n\n## Reverse Proxy Integration\n\nDokku uses nginx by default. Options:\n- Let Dokku manage its own proxy on a different port\n- Disable Dokku's proxy and use existing reverse proxy (nginx/Traefik)\n\n## Deployment Flow\n\n```\nGitHub main push\n  -> GitHub Actions -> Hetzner/Dokku (UAT)\n  -> Vercel webhook -> Vercel (Production)\n```\n\nPR creation triggers Vercel preview deploy with unique URL.\n\n## Security Considerations\n\n1. Never commit secrets - use environment variables\n2. Use SSH keys for Dokku deployments\n3. Enable SSL with Let's Encrypt on both platforms\n4. Rotate deployment keys periodically\n5. Use GitHub branch protection rules\n\n## Related Concepts\n\n- [GitHub Workflow Guide](./github-workflow.md)\n- [Convex Self-Hosted Setup](./convex-self-hosted.md)\n- [WorkOS Auth Integration](./workos-auth-integration.md)\n- [Stripe Payment Integration](./stripe-payment-integration.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/github-workflow.md","content":"---\ntype: Process\ntitle: GitHub Workflow Guide\ndescription: Graphite-style stacking workflow with squash merge, branch chaining, and force-with-lease rebasing\nresource: ./templates/instructional-documents/github-workflow.md\ntags: [designs, github, workflow, graphite, stacking, squash-merge, git]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# GitHub Workflow Guide\n\n## Mandatory Requirements\n\n| Rule | Requirement |\n|------|-------------|\n| Merge Type | ALWAYS use squash merge, no exceptions |\n| Rebasing | MUST rebase regularly to keep stack in sync with main |\n| PR Size | Small, focused, ONE logical change per PR |\n| Tooling | Use `gh pr merge --squash --delete-branch` |\n\n## Core Concept: Stacking\n\nStacking means building chains of small, focused PRs where each depends on the previous:\n\n```\nmain \u003c- PR1 \u003c- PR2 \u003c- PR3 (chain of small PRs)\n```\n\nThis allows breaking large features into reviewable chunks, faster feedback, continuing work while waiting for reviews, and independent merging as PRs are approved.\n\n## Creating a Stack\n\n1. Create first branch from `origin/main`\n2. Each subsequent branch starts from the previous branch, not main\n3. PRs target their parent branch (not main), except the first PR targets main\n\n## Managing the Stack\n\n- View stack: `git branch -vv`, `git log --oneline --graph --all`\n- Update middle branch: commit, push `--force-with-lease`, then rebase all dependent branches\n- Use `--force-with-lease` instead of `--force` for safety\n\n## Squash Merge (Required)\n\nSquash merging creates a single atomic commit per PR, prevents intermediate broken states, keeps the dev server stable, and results in cleaner git history.\n\n```bash\ngh pr merge \u003cPR_NUMBER> --squash --delete-branch\ngit checkout main\ngit pull origin main\n```\n\n## After Bottom PR Merges\n\n1. Fetch updated main\n2. Rebase next branch onto `origin/main`\n3. Push `--force-with-lease`\n4. Change PR base to main on GitHub: `gh pr edit \u003cpr-number> --base main`\n\n## Best Practices\n\n- Keep PRs small (\u003c 30 min review time)\n- Name branches clearly: `feature/1-database-schema`, `feature/2-api-endpoints`\n- Include stack context in PR descriptions (Previous, Next PR numbers)\n- Use draft PRs until parent is approved\n- Limit stacks to 3-5 PRs\n\n## PR Description Template\n\nInclude: Part X of Y, This PR, Stack Context (Previous/Next), Implementation Details (files, API changes, breaking changes), Testing (unit, integration, manual), Documentation updates, Verification Checklist.\n\n## Automation Scripts\n\n- `rebase-stack.sh` - Rebase entire stack onto a base branch\n- `sync-stack.sh` - Sync all branches with `origin/main`\n\n## Troubleshooting\n\n- Diverged branch: check logs, force-with-lease if local is correct\n- Lost commits after rebase: use `git reflog` to recover\n- Circular dependencies: reset to main and recreate branches in correct order\n\n## Related Concepts\n\n- [Graphite Stacking for Docs](../decisions/graphite-stacking-for-docs.md)\n- [Deployment Guide](./deployment-guide.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [GitHub Usage System Prompt](https://github.com/holovkat/designs/blob/main/templates/instructional-documents/github-usage-system-prompt.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"GitHub Workflow Guide","description":"Graphite-style stacking workflow with squash merge, branch chaining, and force-with-lease rebasing","resource":"./templates/instructional-documents/github-workflow.md","tags":["designs","github","workflow","graphite","stacking","squash-merge","git"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# GitHub Workflow Guide\n\n## Mandatory Requirements\n\n| Rule | Requirement |\n|------|-------------|\n| Merge Type | ALWAYS use squash merge, no exceptions |\n| Rebasing | MUST rebase regularly to keep stack in sync with main |\n| PR Size | Small, focused, ONE logical change per PR |\n| Tooling | Use `gh pr merge --squash --delete-branch` |\n\n## Core Concept: Stacking\n\nStacking means building chains of small, focused PRs where each depends on the previous:\n\n```\nmain \u003c- PR1 \u003c- PR2 \u003c- PR3 (chain of small PRs)\n```\n\nThis allows breaking large features into reviewable chunks, faster feedback, continuing work while waiting for reviews, and independent merging as PRs are approved.\n\n## Creating a Stack\n\n1. Create first branch from `origin/main`\n2. Each subsequent branch starts from the previous branch, not main\n3. PRs target their parent branch (not main), except the first PR targets main\n\n## Managing the Stack\n\n- View stack: `git branch -vv`, `git log --oneline --graph --all`\n- Update middle branch: commit, push `--force-with-lease`, then rebase all dependent branches\n- Use `--force-with-lease` instead of `--force` for safety\n\n## Squash Merge (Required)\n\nSquash merging creates a single atomic commit per PR, prevents intermediate broken states, keeps the dev server stable, and results in cleaner git history.\n\n```bash\ngh pr merge \u003cPR_NUMBER> --squash --delete-branch\ngit checkout main\ngit pull origin main\n```\n\n## After Bottom PR Merges\n\n1. Fetch updated main\n2. Rebase next branch onto `origin/main`\n3. Push `--force-with-lease`\n4. Change PR base to main on GitHub: `gh pr edit \u003cpr-number> --base main`\n\n## Best Practices\n\n- Keep PRs small (\u003c 30 min review time)\n- Name branches clearly: `feature/1-database-schema`, `feature/2-api-endpoints`\n- Include stack context in PR descriptions (Previous, Next PR numbers)\n- Use draft PRs until parent is approved\n- Limit stacks to 3-5 PRs\n\n## PR Description Template\n\nInclude: Part X of Y, This PR, Stack Context (Previous/Next), Implementation Details (files, API changes, breaking changes), Testing (unit, integration, manual), Documentation updates, Verification Checklist.\n\n## Automation Scripts\n\n- `rebase-stack.sh` - Rebase entire stack onto a base branch\n- `sync-stack.sh` - Sync all branches with `origin/main`\n\n## Troubleshooting\n\n- Diverged branch: check logs, force-with-lease if local is correct\n- Lost commits after rebase: use `git reflog` to recover\n- Circular dependencies: reset to main and recreate branches in correct order\n\n## Related Concepts\n\n- [Graphite Stacking for Docs](../decisions/graphite-stacking-for-docs.md)\n- [Deployment Guide](./deployment-guide.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [GitHub Usage System Prompt](https://github.com/holovkat/designs/blob/main/templates/instructional-documents/github-usage-system-prompt.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/implementation-checklist.md","content":"---\ntype: Process\ntitle: Implementation Checklist\ndescription: Functional design implementation checklist template with phased steps from architecture overview through deployment strategy\nresource: ./templates/functional-design/00-TEMPLATE-IMPLEMENTATION-CHECKLIST.md\ntags: [designs, implementation, checklist, functional-design, sprints, tracking]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Implementation Checklist\n\n## Overview\n\nThe implementation checklist tracks the implementation status of a project's epics and features, organized into sprints. It should be updated as new design documents are created.\n\n## Template Structure\n\n### Sprint 1: Foundational Setup and User Onboarding\n\nCore infrastructure phase with tasks mapped to numbered design documents:\n\n| Doc | Topic |\n|-----|-------|\n| 01-ARCHITECTURE-OVERVIEW.md | Architecture overview |\n| 02-FOLDER-LAYOUT.md | Folder layout |\n| 03-SETTINGS-AND-CONFIG.md | Settings and config |\n| 04-WEB-UI-SETUP.md | Web UI setup |\n| 05-DATABASE-SETUP.md | Database setup |\n| 06-AUTHENTICATION-SETUP.md | Authentication setup |\n| 07-API-INTEGRATION.md | API integration strategy |\n| 08-INFRASTRUCTURE-SETUP.md | Infrastructure and containerization |\n| 09-VERSION-CONTROL-STRATEGY.md | Version control |\n| 10-CI-CD-PIPELINE.md | CI/CD pipeline |\n\nFeature phases (11+) follow, each with Design, Implementation, and Verification sub-tasks.\n\n### Post-Release Tasks\n\n- 98-TESTING-AND-VERIFICATION.md - Testing and verification\n- 99-DEPLOYMENT-STRATEGY.md - Deployment\n\n## Live vs Template\n\nThe designs repo maintains two versions:\n- **00-TEMPLATE-IMPLEMENTATION-CHECKLIST.md** - Archived template baseline\n- **00-IMPLEMENTATION-CHECKLIST.md** - Live implementation status for the designs repo itself\n\n## Live Repo Checklist\n\nThe live checklist tracks the Codex Global Planning Agent Pack and Codex Builder Agent Pack sprints with GitHub issue references, contract gates, shared status formats, and exit gates.\n\n### Exit Gates Include\n\n- Planning compliance >= 95/100 before sign-off\n- Frozen contract in place before parallel work\n- Global `~/.codex/agents` packs installed\n- Orchestrators remain governance-only\n- Specialists use fixed payload format\n- Built-in Codex activity shows delegation\n- Builder stops at `ready-for-integration`\n\n## Related Concepts\n\n- [Kickoff Requirements](./kickoff-requirements.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Planning Agent Contracts](./planning-agent-contracts.md)\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Implementation Checklist","description":"Functional design implementation checklist template with phased steps from architecture overview through deployment strategy","resource":"./templates/functional-design/00-TEMPLATE-IMPLEMENTATION-CHECKLIST.md","tags":["designs","implementation","checklist","functional-design","sprints","tracking"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Implementation Checklist\n\n## Overview\n\nThe implementation checklist tracks the implementation status of a project's epics and features, organized into sprints. It should be updated as new design documents are created.\n\n## Template Structure\n\n### Sprint 1: Foundational Setup and User Onboarding\n\nCore infrastructure phase with tasks mapped to numbered design documents:\n\n| Doc | Topic |\n|-----|-------|\n| 01-ARCHITECTURE-OVERVIEW.md | Architecture overview |\n| 02-FOLDER-LAYOUT.md | Folder layout |\n| 03-SETTINGS-AND-CONFIG.md | Settings and config |\n| 04-WEB-UI-SETUP.md | Web UI setup |\n| 05-DATABASE-SETUP.md | Database setup |\n| 06-AUTHENTICATION-SETUP.md | Authentication setup |\n| 07-API-INTEGRATION.md | API integration strategy |\n| 08-INFRASTRUCTURE-SETUP.md | Infrastructure and containerization |\n| 09-VERSION-CONTROL-STRATEGY.md | Version control |\n| 10-CI-CD-PIPELINE.md | CI/CD pipeline |\n\nFeature phases (11+) follow, each with Design, Implementation, and Verification sub-tasks.\n\n### Post-Release Tasks\n\n- 98-TESTING-AND-VERIFICATION.md - Testing and verification\n- 99-DEPLOYMENT-STRATEGY.md - Deployment\n\n## Live vs Template\n\nThe designs repo maintains two versions:\n- **00-TEMPLATE-IMPLEMENTATION-CHECKLIST.md** - Archived template baseline\n- **00-IMPLEMENTATION-CHECKLIST.md** - Live implementation status for the designs repo itself\n\n## Live Repo Checklist\n\nThe live checklist tracks the Codex Global Planning Agent Pack and Codex Builder Agent Pack sprints with GitHub issue references, contract gates, shared status formats, and exit gates.\n\n### Exit Gates Include\n\n- Planning compliance >= 95/100 before sign-off\n- Frozen contract in place before parallel work\n- Global `~/.codex/agents` packs installed\n- Orchestrators remain governance-only\n- Specialists use fixed payload format\n- Built-in Codex activity shows delegation\n- Builder stops at `ready-for-integration`\n\n## Related Concepts\n\n- [Kickoff Requirements](./kickoff-requirements.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Planning Agent Contracts](./planning-agent-contracts.md)\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/install-session-workflows.md","content":"---\ntype: Process\ntitle: Install Session Workflows\ndescription: Installer script for refreshing commands, hooks, scripts, skills, and worktree guidance into another project\nresource: ./templates/instructional-documents/install-session-workflows.sh\ntags: [designs, installer, session, workflows, commands, hooks, skills, scripts]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Install Session Workflows\n\n## Overview\n\nThe `install-session-workflows.sh` script refreshes commands, scripts, skills, hooks, and worktree guidance in an existing project. Safe to run multiple times, overwriting existing files with latest template versions.\n\n## Usage\n\n```bash\n./install-session-workflows.sh [OPTIONS]\n```\n\n### Options\n\n| Option | Description |\n|--------|-------------|\n| `--commands-only` | Only install commands + scripts/skills/worktrees, skip hooks |\n| `--hooks-only` | Only install hooks, skip commands + scripts/skills/worktrees |\n| `--no-settings` | Skip copying settings.json |\n| `--with-templates` | Also install design templates |\n| `--dry-run` | Show what would be copied without copying |\n| `--help` | Show help message |\n\n### Environment Overrides\n\n- `DESIGNS_WORKFLOW_SOURCE` - Source template directory when refreshing from a project copy\n- `WORKFLOW_COMMANDS_DIR` - Target command directory (default: `./commands`)\n- `WORKFLOW_HOOKS_DIR` - Target hook directory (default: `./hooks`)\n- `WORKFLOW_SETTINGS_FILE` - Target settings file (default: `./settings.json`)\n\n## What Gets Installed\n\n### Commands\nSlash command templates from `commands/`:\n- `/plan-feature`, `/plan-bugfix`, `/plan-github`, `/plan-review`\n- `/compliance-review`, `/uat`\n- `/end-session`, `/join-session`, `/next-phase`\n- `/release-assess`, `/kingmode`\n\n### Scripts\nShell scripts from `scripts/`:\n- `release-vector-assess.sh` - Release vector assessment\n- `start-droid-worktree.sh` - Droid worktree management\n- `worktree-session-*.sh` - Worktree session lifecycle (open, close, prepare, cleanup, lib)\n\n### Skills\nProject-local skills from `skills/`:\n- `worktree-toolkit-init` - Session tooling audit/update\n- `worktree-session-lifecycle` - Operational session flow\n- `plan-review` - Planning artifact review\n- `release-assess` - Release intent/confidence routing\n- `vibe-fix` - Small pragmatic behavior fix\n\n### Hooks\nGit hooks from `hooks/`:\n- `pre-commit-workflow.sh` - Pre-commit validation\n- `post-commit-push.sh` - Post-commit push\n- `post-edit-lint.sh` - Post-edit linting\n- `code-review-checkpoint.sh` - Code review checkpoint\n- `pre-completion-build.sh` - Pre-completion build check\n- `batch-lint-check.sh` - Batch lint check\n- `sanity-check.sh` - Sanity check\n\n### Worktrees\nWorktree guidance from `worktrees/`:\n- `AGENTS.md` - Worktree area agent instructions\n- `README.md` - Worktree guidance overview\n- `_meta/` - Metadata\n\n### Settings\n- `settings.json` - Basic settings\n- `settings-agent-aware.json` - Agent-aware settings\n\n## Source Detection\n\nThe script auto-detects whether it is running from the template source (has `commands/` and `hooks/` subdirectories) or from a project's command directory. When running from a project, it sources from `DESIGNS_WORKFLOW_SOURCE` or `$HOME/workspace/designs/templates/instructional-documents`.\n\n## Related Concepts\n\n- [Templates Architecture](../architecture/templates-architecture.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Workflow Guide](./workflow-guide.md)\n- [GitHub Workflow Guide](./github-workflow.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Install Session Workflows","description":"Installer script for refreshing commands, hooks, scripts, skills, and worktree guidance into another project","resource":"./templates/instructional-documents/install-session-workflows.sh","tags":["designs","installer","session","workflows","commands","hooks","skills","scripts"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body": `:\n- `pre-commit-workflow.sh` - Pre-commit validation\n- `post-commit-push.sh` - Post-commit push\n- `post-edit-lint.sh` - Post-edit linting\n- `code-review-checkpoint.sh` - Code review checkpoint\n- `pre-completion-build.sh` - Pre-completion build check\n- `batch-lint-check.sh` - Batch lint check\n- `sanity-check.sh` - Sanity check\n\n### Worktrees\nWorktree guidance from `worktrees/`:\n- `AGENTS.md` - Worktree area agent instructions\n- `README.md` - Worktree guidance overview\n- `_meta/` - Metadata\n\n### Settings\n- `settings.json` - Basic settings\n- `settings-agent-aware.json` - Agent-aware settings\n\n## Source Detection\n\nThe script auto-detects whether it is running from the template source (has `commands/` and `hooks/` subdirectories) or from a project's command directory. When running from a project, it sources from `DESIGNS_WORKFLOW_SOURCE` or `$HOME/workspace/designs/templates/instructional-documents`.\n\n## Related Concepts\n\n- [Templates Architecture](../architecture/templates-architecture.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Workflow Guide](./workflow-guide.md)\n- [GitHub Workflow Guide](./github-workflow.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/kickoff-requirements.md","content":"---\ntype: Process\ntitle: Kickoff Requirements Spec\ndescription: Requirements gathering and technical specification process for creating TFD documents and technical requirement shards\nresource: ./templates/instructional-documents/kickoff-requirements-spec.md\ntags: [designs, kickoff, requirements, tfd, specification, sharding, planning]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Kickoff Requirements Spec\n\n## Overview\n\nAn expert Technical Product Manager and System Architect process for gathering requirements to create a comprehensive Frontend Technical Functional Requirements Document (TFD) and break it down into actionable Technical Requirement Shards.\n\n## Phase 1: Requirements Gathering\n\n### Protocol\n\n1. **One question at a time** - Never ask multiple questions in a single turn\n2. **Multiple choice** - Provide numbered/lettered options, always allow \"Other/Custom\"\n3. **No ambiguities** - If answer is vague, ask follow-up clarifying question\n4. **Iterative validation** - After each section, summarize and confirm before moving on\n\n### Lines of Questioning\n\n1. **Project Overview** - Purpose, primary goals, target audience\n2. **Technical Stack** - Framework, state management, styling, routing\n3. **Design System** - Atomic design preferences, existing libraries or custom\n4. **Features and Phases** - High-level features, prioritization, desired phases\n5. **Navigation** - Routing structure, public vs protected routes\n6. **State Management** - Server state, global state, local state strategies\n7. **Integrations** - APIs, Auth, 3rd party services\n8. **Non-Functional** - Performance, Accessibility, SEO, Testing\n\n### Output\n\nGenerate the TFD file at `features/Frontend-TFD.md` or project root, using the template structure from `templates/instructional-documents/Frontend-Technical-Functional-Requirements-Document-TFD.md`.\n\n## Phase 2: Technical Sharding\n\n### Sharding Strategy\n\n- **Core Infrastructure** - Create/update standard setup files (01-10) as seen in `templates/functional-design`\n- **Features** - Create separate files for each major feature (11+), mapping to phases in TFD\n\n### Naming Convention\n\nFollow `templates/functional-design` convention:\n- `00-IMPLEMENTATION-CHECKLIST.md` (Master checklist)\n- `01-ARCHITECTURE-OVERVIEW.md`\n- `02-FOLDER-LAYOUT.md`\n- `11-FEATURE-[NAME].md`\n- `12-FEATURE-[NAME].md`\n\n### Output\n\nGenerate shard files in `features/` folder. Each shard contains:\n- Feature Goal\n- User Stories / Requirements\n- Technical Implementation Details (Components, APIs, State)\n- Verification Plan\n- Update `00-IMPLEMENTATION-CHECKLIST.md` to include all generated shards\n\n## Related Concepts\n\n- [Planning Decomposition](./planning-decomposition.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Kickoff Requirements Spec","description":"Requirements gathering and technical specification process for creating TFD documents and technical requirement shards","resource":"./templates/instructional-documents/kickoff-requirements-spec.md","tags":["designs","kickoff","requirements","tfd","specification","sharding","planning"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Kickoff Requirements Spec\n\n## Overview\n\nAn expert Technical Product Manager and System Architect process for gathering requirements to create a comprehensive Frontend Technical Functional Requirements Document (TFD) and break it down into actionable Technical Requirement Shards.\n\n## Phase 1: Requirements Gathering\n\n### Protocol\n\n1. **One question at a time** - Never ask multiple questions in a single turn\n2. **Multiple choice** - Provide numbered/lettered options, always allow \"Other/Custom\"\n3. **No ambiguities** - If answer is vague, ask follow-up clarifying question\n4. **Iterative validation** - After each section, summarize and confirm before moving on\n\n### Lines of Questioning\n\n1. **Project Overview** - Purpose, primary goals, target audience\n2. **Technical Stack** - Framework, state management, styling, routing\n3. **Design System** - Atomic design preferences, existing libraries or custom\n4. **Features and Phases** - High-level features, prioritization, desired phases\n5. **Navigation** - Routing structure, public vs protected routes\n6. **State Management** - Server state, global state, local state strategies\n7. **Integrations** - APIs, Auth, 3rd party services\n8. **Non-Functional** - Performance, Accessibility, SEO, Testing\n\n### Output\n\nGenerate the TFD file at `features/Frontend-TFD.md` or project root, using the template structure from `templates/instructional-documents/Frontend-Technical-Functional-Requirements-Document-TFD.md`.\n\n## Phase 2: Technical Sharding\n\n### Sharding Strategy\n\n- **Core Infrastructure** - Create/update standard setup files (01-10) as seen in `templates/functional-design`\n- **Features** - Create separate files for each major feature (11+), mapping to phases in TFD\n\n### Naming Convention\n\nFollow `templates/functional-design` convention:\n- `00-IMPLEMENTATION-CHECKLIST.md` (Master checklist)\n- `01-ARCHITECTURE-OVERVIEW.md`\n- `02-FOLDER-LAYOUT.md`\n- `11-FEATURE-[NAME].md`\n- `12-FEATURE-[NAME].md`\n\n### Output\n\nGenerate shard files in `features/` folder. Each shard contains:\n- Feature Goal\n- User Stories / Requirements\n- Technical Implementation Details (Components, APIs, State)\n- Verification Plan\n- Update `00-IMPLEMENTATION-CHECKLIST.md` to include all generated shards\n\n## Related Concepts\n\n- [Planning Decomposition](./planning-decomposition.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/migrate-agents-md.md","content":"---\ntype: Process\ntitle: Migrate AGENTS.md to OKF\ndescription: How to update a project's AGENTS.md to use OKF references instead of docs/AFFiNE\nresource: ./templates/okf/AGENTS-OKF-SECTION.md\ntags: [okf, agents-md, migration, affine, legacy]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Migrate AGENTS.md to OKF\n\nPhase 5 of the OKF deployment workflow. Update the project's `AGENTS.md` to use OKF references instead of `docs/`/AFFiNE references.\n\n## Replace AFFiNE References\n\n- Find any section referencing AFFiNE (project notes, change log, knowledge base).\n- Replace with OKF inbox/curation instructions: write to `knowledge/inbox/`, run `/okf-curate`.\n\n## Update Agent Delegation Section\n\n- Replace `docs/agents/\u003carea>/AGENTS.md` references with `knowledge/process/\u003cagent>.md` concept references.\n- Replace \"agent knowledge space under `docs/agents/`\" with \"OKF concept in `knowledge/process/`\".\n- Update specialist curation example paths to point to `knowledge/process/`.\n\n## Update JIT Index Table\n\n- Add a `knowledge/` row as the primary knowledge index.\n- Mark `docs/` row as legacy reference.\n- Remove `docs/agents/` row if present.\n\n## Update Specialist Agent Ownership Table\n\n- Rename \"Knowledge space\" column to \"OKF concept\".\n- Point each agent to its `knowledge/process/\u003cagent>.md` concept file.\n- Update \"when an agent area is missing\" to say: create an OKF concept in `knowledge/process/` using `knowledge/process/agent-space-standard.md`.\n\n## Add Legacy Documentation Alignment\n\nAdd a section explaining:\n- `docs/` files remain as detailed references.\n- OKF concepts in `knowledge/` are the agent-facing entry points.\n- Each concept's `resource` field links to the relevant `docs/` file.\n- When docs and OKF disagree, OKF is current.\n\nSee [Legacy Alignment Mode](../decisions/legacy-alignment-mode.md) for the rationale.\n\n## Update Inline References\n\n- Replace `docs/agents/release-process-contract.md` with `knowledge/process/release-process-contract.md`.\n- Replace `docs/design/SPACETIMEDB-V2-REFERENCE.md` with `knowledge/architecture/spacetimedb-v2-reference.md`.\n- Replace other `docs/design/` and `docs/agents/` inline references with their OKF concept equivalents.\n- For reference tables (like SpacetimeDB Documentation), restructure to show OKF concept to detailed doc mapping.\n\n## Preserve What Stays\n\n- `docs/` files are NOT deleted or moved. They remain as detailed references.\n- Sub-directory `AGENTS.md` files (e.g., `src/AGENTS.md`, `server/AGENTS.md`) are NOT changed.\n- JIT Index entries for `src/`, `spacetimedb/`, `tests/`, etc. are NOT changed.\n\n## Append OKF Section\n\nIf not already present, append the standard OKF Knowledge Bundle section from `templates/okf/AGENTS-OKF-SECTION.md`. This section includes:\n\n- Agent Onboarding steps (read `knowledge/index.md`, `knowledge/state/index.md`, `knowledge/deprecation/index.md`)\n- Legacy Documentation explanation (if the project has existing docs)\n- After Completing Work instructions (write to `knowledge/inbox/`)\n- Curation description (curation agent processes inbox into concepts)\n- Concept Types table\n- Rules (never delete, always update indexes, one concept per file, etc.)\n\nThe installer's Step 5 handles the initial append. This phase handles the full migration of existing references.\n\n## Verification\n\nAfter migration, verify:\n- No AFFiNE references remain: `grep -i affine AGENTS.md`\n- No `docs/agents/` references remain: `grep \"docs/agents/\" AGENTS.md`\n- OKF Knowledge Bundle section exists: `grep \"OKF Knowledge Bundle\" AGENTS.md`\n\nSee [Verify Deployment](./verify-deployment.md) for the full verification checklist.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Migrate AGENTS.md to OKF","description":"How to update a project's AGENTS.md to use OKF references instead of docs/AFFiNE","resource":"./templates/okf/AGENTS-OKF-SECTION.md","tags":["okf","agents-md","migration","affine","legacy"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Migrate AGENTS.md to OKF\n\nPhase 5 of the OKF deployment workflow. Update the project's `AGENTS.md` to use OKF references instead of `docs/`/AFFiNE references.\n\n## Replace AFFiNE References\n\n- Find any section referencing AFFiNE (project notes, change log, knowledge base).\n- Replace with OKF inbox/curation instructions: write to `knowledge/inbox/`, run `/okf-curate`.\n\n## Update Agent Delegation Section\n\n- Replace `docs/agents/\u003carea>/AGENTS.md` references with `knowledge/process/\u003cagent>.md` concept references.\n- Replace \"agent knowledge space under `docs/agents/`\" with \"OKF concept in `knowledge/process/`\".\n- Update specialist curation example paths to point to `knowledge/process/`.\n\n## Update JIT Index Table\n\n- Add a `knowledge/` row as the primary knowledge index.\n- Mark `docs/` row as legacy reference.\n- Remove `docs/agents/` row if present.\n\n## Update Specialist Agent Ownership Table\n\n- Rename \"Knowledge space\" column to \"OKF concept\".\n- Point each agent to its `knowledge/process/\u003cagent>.md` concept file.\n- Update \"when an agent area is missing\" to say: create an OKF concept in `knowledge/process/` using `knowledge/process/agent-space-standard.md`.\n\n## Add Legacy Documentation Alignment\n\nAdd a section explaining:\n- `docs/` files remain as detailed references.\n- OKF concepts in `knowledge/` are the agent-facing entry points.\n- Each concept's `resource` field links to the relevant `docs/` file.\n- When docs and OKF disagree, OKF is current.\n\nSee [Legacy Alignment Mode](../decisions/legacy-alignment-mode.md) for the rationale.\n\n## Update Inline References\n\n- Replace `docs/agents/release-process-contract.md` with `knowledge/process/release-process-contract.md`.\n- Replace `docs/design/SPACETIMEDB-V2-REFERENCE.md` with `knowledge/architecture/spacetimedb-v2-reference.md`.\n- Replace other `docs/design/` and `docs/agents/` inline references with their OKF concept equivalents.\n- For reference tables (like SpacetimeDB Documentation), restructure to show OKF concept to detailed doc mapping.\n\n## Preserve What Stays\n\n- `docs/` files are NOT deleted or moved. They remain as detailed references.\n- Sub-directory `AGENTS.md` files (e.g., `src/AGENTS.md`, `server/AGENTS.md`) are NOT changed.\n- JIT Index entries for `src/`, `spacetimedb/`, `tests/`, etc. are NOT changed.\n\n## Append OKF Section\n\nIf not already present, append the standard OKF Knowledge Bundle section from `templates/okf/AGENTS-OKF-SECTION.md`. This section includes:\n\n- Agent Onboarding steps (read `knowledge/index.md`, `knowledge/state/index.md`, `knowledge/deprecation/index.md`)\n- Legacy Documentation explanation (if the project has existing docs)\n- After Completing Work instructions (write to `knowledge/inbox/`)\n- Curation description (curation agent processes inbox into concepts)\n- Concept Types table\n- Rules (never delete, always update indexes, one concept per file, etc.)\n\nThe installer's Step 5 handles the initial append. This phase handles the full migration of existing references.\n\n## Verification\n\nAfter migration, verify:\n- No AFFiNE references remain: `grep -i affine AGENTS.md`\n- No `docs/agents/` references remain: `grep \"docs/agents/\" AGENTS.md`\n- OKF Knowledge Bundle section exists: `grep \"OKF Knowledge Bundle\" AGENTS.md`\n\nSee [Verify Deployment](./verify-deployment.md) for the full verification checklist.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/planning-agent-contracts.md","content":"---\ntype: Process\ntitle: Planning Agent Contracts\ndescription: Codex global planning agent pack defining orchestrator, specialist roles, shared brief, and delegation rules\nresource: ./templates/instructional-documents/codex-global-planning-agents.md\ntags: [designs, codex, planning, agents, orchestrator, specialists, contracts, delegation]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Planning Agent Contracts\n\n## Overview\n\nThe v1 planning pack installed under `~/.codex/agents/` defines the source-of-truth contract for global planning agents used by `/plan-feature`, `/plan-bugfix`, and `/plan-github`.\n\n## Goals\n\n- Keep planning orchestration separate from implementation work\n- Push lower-cost analysis into specialist agents\n- Reduce context repetition through a condensed shared brief\n- Keep delegated work observable through Codex subagent activity\n\n## Agent Roster\n\n| Agent | Sandbox | Responsibility | Final Publisher |\n|-------|---------|---------------|-----------------|\n| blueprint_orchestrator | workspace-write | Interview, delegate, synthesize, publish GitHub planning artifacts | Yes |\n| req-analyst | read-only | Requirement clarity, scope gaps, acceptance framing | No |\n| ux-analyst | read-only | Workflow, operator experience, screen impact | No |\n| scenario-analyst | read-only | Happy path, edge cases, regression scenarios | No |\n| tech-analyst | read-only | Constraints, dependencies, sequencing risks | No |\n| prd-writer | read-only | Draft issue-ready blueprint sections, acceptance criteria | No |\n\n## Operating Modes\n\n- `quick-fix`: minimize specialist calls, keep issue tree narrow\n- `standard`: normal planning path with smallest specialist set\n- `full-planning`: full multi-agent flow with canary validation\n\nConfidence policy: High = proceed; Medium = proceed with named assumptions; Low = ask one focused question.\n\n## Ownership Boundaries\n\n- `blueprint_orchestrator` is planning-only. May create/edit planning issues and checklist, but not implementation code.\n- Specialists are read-only. They report findings, may not publish issues, edit checklist, or code.\n- Planning handoff stops at GitHub issues plus checklist updates.\n\n## Shared Brief Fields\n\n`planning_command`, `goal`, `inferred_intent`, `confidence`, `project_trajectory`, `active_vectors`, `current_scope`, `constraints`, `non_goals`, `references`, `lessons_learned`, `open_questions`, `expected_output`.\n\n## Communication Protocol\n\nOrchestrator-mediated (no direct peer-to-peer):\n1. Orchestrator decides if specialist is needed\n2. Delegates with shared brief and clear ask\n3. Specialists return fixed payload\n4. Orchestrator relays blockers/questions into later delegations\n\n### Specialist Payload\n\nEvery response must include: `task_id`, `owner`, `status`, `deps`, `blockers`, `next`, `eta`, `evidence`.\n\n### Status Lifecycle\n\n`queued -> claimed -> working -> blocked | ready -> done`\n\n## Delegation Rules\n\n- Infer operating mode and confidence before choosing specialists\n- Reuse smallest specialist set necessary\n- Prefer serial delegation when output changes next ask\n- Prefer parallel delegation only when brief and payload are stable\n- When stalled, narrow the ask or split work\n\n## Validation Contract\n\n- Canary order: `/plan-feature` -> `/plan-bugfix` -> `/plan-github`\n- Lessons from each pass feed into next shared brief\n- v1 does not depend on retrieval MCPs or web research\n\n## Related Concepts\n\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Agent Generation](./agent-generation.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Planning Agent Contracts","description":"Codex global planning agent pack defining orchestrator, specialist roles, shared brief, and delegation rules","resource":"./templates/instructional-documents/codex-global-planning-agents.md","tags":["designs","codex","planning","agents","orchestrator","specialists","contracts","delegation"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Planning Agent Contracts\n\n## Overview\n\nThe v1 planning pack installed under `~/.codex/agents/` defines the source-of-truth contract for global planning agents used by `/plan-feature`, `/plan-bugfix`, and `/plan-github`.\n\n## Goals\n\n- Keep planning orchestration separate from implementation work\n- Push lower-cost analysis into specialist agents\n- Reduce context repetition through a condensed shared brief\n- Keep delegated work observable through Codex subagent activity\n\n## Agent Roster\n\n| Agent | Sandbox | Responsibility | Final Publisher |\n|-------|---------|---------------|-----------------|\n| blueprint_orchestrator | workspace-write | Interview, delegate, synthesize, publish GitHub planning artifacts | Yes |\n| req-analyst | read-only | Requirement clarity, scope gaps, acceptance framing | No |\n| ux-analyst | read-only | Workflow, operator experience, screen impact | No |\n| scenario-analyst | read-only | Happy path, edge cases, regression scenarios | No |\n| tech-analyst | read-only | Constraints, dependencies, sequencing risks | No |\n| prd-writer | read-only | Draft issue-ready blueprint sections, acceptance criteria | No |\n\n## Operating Modes\n\n- `quick-fix`: minimize specialist calls, keep issue tree narrow\n- `standard`: normal planning path with smallest specialist set\n- `full-planning`: full multi-agent flow with canary validation\n\nConfidence policy: High = proceed; Medium = proceed with named assumptions; Low = ask one focused question.\n\n## Ownership Boundaries\n\n- `blueprint_orchestrator` is planning-only. May create/edit planning issues and checklist, but not implementation code.\n- Specialists are read-only. They report findings, may not publish issues, edit checklist, or code.\n- Planning handoff stops at GitHub issues plus checklist updates.\n\n## Shared Brief Fields\n\n`planning_command`, `goal`, `inferred_intent`, `confidence`, `project_trajectory`, `active_vectors`, `current_scope`, `constraints`, `non_goals`, `references`, `lessons_learned`, `open_questions`, `expected_output`.\n\n## Communication Protocol\n\nOrchestrator-mediated (no direct peer-to-peer):\n1. Orchestrator decides if specialist is needed\n2. Delegates with shared brief and clear ask\n3. Specialists return fixed payload\n4. Orchestrator relays blockers/questions into later delegations\n\n### Specialist Payload\n\nEvery response must include: `task_id`, `owner`, `status`, `deps`, `blockers`, `next`, `eta`, `evidence`.\n\n### Status Lifecycle\n\n`queued -> claimed -> working -> blocked | ready -> done`\n\n## Delegation Rules\n\n- Infer operating mode and confidence before choosing specialists\n- Reuse smallest specialist set necessary\n- Prefer serial delegation when output changes next ask\n- Prefer parallel delegation only when brief and payload are stable\n- When stalled, narrow the ask or split work\n\n## Validation Contract\n\n- Canary order: `/plan-feature` -> `/plan-bugfix` -> `/plan-github`\n- Lessons from each pass feed into next shared brief\n- v1 does not depend on retrieval MCPs or web research\n\n## Related Concepts\n\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Planning Decomposition](./planning-decomposition.md)\n- [Agent Generation](./agent-generation.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/planning-decomposition.md","content":"---\ntype: Process\ntitle: Planning Decomposition Workflow\ndescription: Converting user requests or issues into issue-ready specifications through planning orchestrators and specialist analysis\nresource: ./README.md\ntags: [designs, planning, decomposition, orchestrator, requirements, workflow]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Planning Decomposition Workflow\n\n## Overview\n\nPlanning decomposition is the process of converting user requests or existing GitHub issues into issue-ready specifications through a planning orchestrator with specialist analysis.\n\n## Planning Entrypoints\n\n| Entrypoint | When to Use |\n|------------|-------------|\n| `/plan-feature` | New feature |\n| `/plan-bugfix` | Bug investigation |\n| `/plan-github` | Existing issue or PR |\n\n## Decomposition Flow\n\n1. **Planning entrypoint** - User request or existing issue enters the pipeline\n2. **Planning orchestrator** - Routes to specialist analysis\n3. **Specialist analysis** (parallel or serial):\n   - Requirements analysis - clarity, scope gaps, acceptance framing\n   - UX and workflow analysis - operator experience, screen impact\n   - Scenario and regression analysis - happy path, edge cases, exceptions\n   - Technical feasibility analysis - constraints, dependencies, sequencing\n4. **Issue-ready specification** - Synthesized output from specialists\n5. **Plan vs Q&A review** - Validate completeness\n6. **Approval** - Plan approved or gaps found (return to orchestrator)\n7. **Epic or parent issue** - Created on approval\n8. **Phase/sprint issue** - Decomposed from epic\n9. **Task issues** - With acceptance criteria\n10. **Local checklist** - Mirrors issue numbers\n11. **Planning approval** - Ready for build session or needs clarification\n\n## Mermaid Diagram\n\nThe README contains a mermaid flowchart visualizing this decomposition from \"User request or existing GitHub issue\" through to \"Ready for build session\".\n\n## Operating Modes\n\nThe planning orchestrator infers the operating mode from the user's wording, project trajectory, and risk:\n- `quick-fix`: Minimal specialist calls, narrow issue tree, smallest useful plan\n- `standard`: Normal planning path with smallest specialist set needed\n- `full-planning`: Full multi-agent planning flow with canary validation\n\n## Related Concepts\n\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Planning Agent Contracts](./planning-agent-contracts.md)\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Kickoff Requirements](./kickoff-requirements.md)\n- [Workflow Guide](./workflow-guide.md)\n- [GitHub Workflow Guide](./github-workflow.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Planning Decomposition Workflow","description":"Converting user requests or issues into issue-ready specifications through planning orchestrators and specialist analysis","resource":"./README.md","tags":["designs","planning","decomposition","orchestrator","requirements","workflow"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Planning Decomposition Workflow\n\n## Overview\n\nPlanning decomposition is the process of converting user requests or existing GitHub issues into issue-ready specifications through a planning orchestrator with specialist analysis.\n\n## Planning Entrypoints\n\n| Entrypoint | When to Use |\n|------------|-------------|\n| `/plan-feature` | New feature |\n| `/plan-bugfix` | Bug investigation |\n| `/plan-github` | Existing issue or PR |\n\n## Decomposition Flow\n\n1. **Planning entrypoint** - User request or existing issue enters the pipeline\n2. **Planning orchestrator** - Routes to specialist analysis\n3. **Specialist analysis** (parallel or serial):\n   - Requirements analysis - clarity, scope gaps, acceptance framing\n   - UX and workflow analysis - operator experience, screen impact\n   - Scenario and regression analysis - happy path, edge cases, exceptions\n   - Technical feasibility analysis - constraints, dependencies, sequencing\n4. **Issue-ready specification** - Synthesized output from specialists\n5. **Plan vs Q&A review** - Validate completeness\n6. **Approval** - Plan approved or gaps found (return to orchestrator)\n7. **Epic or parent issue** - Created on approval\n8. **Phase/sprint issue** - Decomposed from epic\n9. **Task issues** - With acceptance criteria\n10. **Local checklist** - Mirrors issue numbers\n11. **Planning approval** - Ready for build session or needs clarification\n\n## Mermaid Diagram\n\nThe README contains a mermaid flowchart visualizing this decomposition from \"User request or existing GitHub issue\" through to \"Ready for build session\".\n\n## Operating Modes\n\nThe planning orchestrator infers the operating mode from the user's wording, project trajectory, and risk:\n- `quick-fix`: Minimal specialist calls, narrow issue tree, smallest useful plan\n- `standard`: Normal planning path with smallest specialist set needed\n- `full-planning`: Full multi-agent planning flow with canary validation\n\n## Related Concepts\n\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Planning Agent Contracts](./planning-agent-contracts.md)\n- [Builder Agent Contracts](./builder-agent-contracts.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Kickoff Requirements](./kickoff-requirements.md)\n- [Workflow Guide](./workflow-guide.md)\n- [GitHub Workflow Guide](./github-workflow.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/process-github-epics.md","content":"---\ntype: Process\ntitle: Process GitHub Epics\ndescription: How to convert closed GitHub epics into OKF knowledge entries\nresource: ./templates/okf/DEPLOYMENT-RUNBOOK.md\ntags: [okf, github, epics, issues, gh-cli]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Process GitHub Epics\n\nPhase 3 of the OKF deployment workflow. Closed GitHub epics contain rich context (pre-approved directives, acceptance criteria, linked issues, reasoning) that should be captured as knowledge concepts.\n\n## Step 1: List Closed Epics\n\n```bash\ngh issue list --label epic --state closed --limit 100 --json number,title,closedAt\n```\n\nThis returns a JSON array of closed epics with their number, title, and closure date.\n\n## Step 2: Fetch Each Epic Body\n\n```bash\ngh issue view \u003cnumber> --json body,title,labels,closedAt\n```\n\nFetch the full issue body for each epic. The body typically contains the epic's scope, acceptance criteria, implementation notes, and outcome summary.\n\n## Step 3: Create Concept Entries\n\n### Recent Epics (Last 3-6 Months)\n\nCreate full Process or Domain concepts describing:\n- What was built\n- The outcome and current state\n- Key decisions made during the epic\n- Acceptance criteria and whether they were met\n\nInclude `issue_refs` in frontmatter to link back to the GitHub issue:\n\n```yaml\n---\ntype: Process\ntitle: Route Geometry Pipeline\ndescription: Epic #1495 - replaced old routing engine with geometry-based pipeline\nresource: ./docs/design/ROUTE-GEOMETRY.md\ntags: [routing, geometry, pipeline, epic]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\nissue_refs: [1495]\n---\n```\n\n### Older Epics\n\nCreate Deprecation entries with reasoning. These record what was built and why it was superseded or removed:\n\n```yaml\n---\ntype: Deprecation\ntitle: Old Routing Engine\ndescription: Epic #1200 - superseded by geometry-based pipeline in epic #1495\nresource: ./docs/design/OLD-ROUTING.md\ntags: [routing, deprecated, epic]\ntimestamp: 2026-03-15T10:00:00Z\nstatus: deprecated\nsupersedes: [route-geometry-pipeline.md]\nissue_refs: [1200]\n---\n```\n\nInclude `issue_refs` and `supersedes` where applicable.\n\n## Step 4: Update Indexes and Log\n\nAfter creating all epic concepts:\n- Update `index.md` files in the relevant directories with new concept rows.\n- Update the root `index.md` with accurate counts.\n- Update `knowledge/log.md` with an epic processing entry.\n\n## Enrichment During Curation\n\nThe curation agent also fetches GitHub issues referenced by `issue_refs` in inbox item frontmatter. During a [curation pass](./curation-pass.md), the agent uses `gh issue view \u003cnumber> --json body,title,labels,closedAt` to enrich concepts with full issue context. Issues contain pre-approved directives, acceptance criteria, linked epics, and full reasoning that goes beyond commit messages.\n\n## Relationship to Other Phases\n\nThis phase runs after [Seed From Existing Docs](./seed-from-existing-docs.md) (Phase 2) and before [Curation Pass](./curation-pass.md) (Phase 6). The epic concepts are integrated into the knowledge base and cross-linked during the curation pass.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Process GitHub Epics","description":"How to convert closed GitHub epics into OKF knowledge entries","resource":"./templates/okf/DEPLOYMENT-RUNBOOK.md","tags":["okf","github","epics","issues","gh-cli"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Process GitHub Epics\n\nPhase 3 of the OKF deployment workflow. Closed GitHub epics contain rich context (pre-approved directives, acceptance criteria, linked issues, reasoning) that should be captured as knowledge concepts.\n\n## Step 1: List Closed Epics\n\n```bash\ngh issue list --label epic --state closed --limit 100 --json number,title,closedAt\n```\n\nThis returns a JSON array of closed epics with their number, title, and closure date.\n\n## Step 2: Fetch Each Epic Body\n\n```bash\ngh issue view \u003cnumber> --json body,title,labels,closedAt\n```\n\nFetch the full issue body for each epic. The body typically contains the epic's scope, acceptance criteria, implementation notes, and outcome summary.\n\n## Step 3: Create Concept Entries\n\n### Recent Epics (Last 3-6 Months)\n\nCreate full Process or Domain concepts describing:\n- What was built\n- The outcome and current state\n- Key decisions made during the epic\n- Acceptance criteria and whether they were met\n\nInclude `issue_refs` in frontmatter to link back to the GitHub issue:\n\n```yaml\n---\ntype: Process\ntitle: Route Geometry Pipeline\ndescription: Epic #1495 - replaced old routing engine with geometry-based pipeline\nresource: ./docs/design/ROUTE-GEOMETRY.md\ntags: [routing, geometry, pipeline, epic]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\nissue_refs: [1495]\n---\n```\n\n### Older Epics\n\nCreate Deprecation entries with reasoning. These record what was built and why it was superseded or removed:\n\n```yaml\n---\ntype: Deprecation\ntitle: Old Routing Engine\ndescription: Epic #1200 - superseded by geometry-based pipeline in epic #1495\nresource: ./docs/design/OLD-ROUTING.md\ntags: [routing, deprecated, epic]\ntimestamp: 2026-03-15T10:00:00Z\nstatus: deprecated\nsupersedes: [route-geometry-pipeline.md]\nissue_refs: [1200]\n---\n```\n\nInclude `issue_refs` and `supersedes` where applicable.\n\n## Step 4: Update Indexes and Log\n\nAfter creating all epic concepts:\n- Update `index.md` files in the relevant directories with new concept rows.\n- Update the root `index.md` with accurate counts.\n- Update `knowledge/log.md` with an epic processing entry.\n\n## Enrichment During Curation\n\nThe curation agent also fetches GitHub issues referenced by `issue_refs` in inbox item frontmatter. During a [curation pass](./curation-pass.md), the agent uses `gh issue view \u003cnumber> --json body,title,labels,closedAt` to enrich concepts with full issue context. Issues contain pre-approved directives, acceptance criteria, linked epics, and full reasoning that goes beyond commit messages.\n\n## Relationship to Other Phases\n\nThis phase runs after [Seed From Existing Docs](./seed-from-existing-docs.md) (Phase 2) and before [Curation Pass](./curation-pass.md) (Phase 6). The epic concepts are integrated into the knowledge base and cross-linked during the curation pass.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/seed-from-existing-docs.md","content":"---\ntype: Process\ntitle: Seed Knowledge From Existing Docs\ndescription: How to create OKF concepts from a project's existing documentation\nresource: ./templates/okf/DEPLOYMENT-RUNBOOK.md\ntags: [okf, seeding, docs, legacy, concepts]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Seed Knowledge From Existing Docs\n\nPhase 2 of the OKF deployment workflow. This is the most important phase because it establishes the knowledge baseline. The agent reads the project's existing documentation and creates OKF concepts for each significant topic.\n\n## Source Material Priority\n\nRead in this order:\n\n1. `AGENTS.md` (root) - extract architecture decisions, agent definitions, conventions, deployment gates, key patterns.\n2. `docs/` - read all markdown files, extracting design decisions, architecture patterns, runbooks.\n3. `docs/design/` - architecture docs, reference docs, pattern docs.\n4. `docs/agents/` - agent knowledge spaces, specialist curation.\n5. `README.md` - project overview, setup commands.\n6. Any `src/AGENTS.md` or sub-directory `AGENTS.md` files.\n\n## Concept Creation Rules\n\n- One concept per file. Do not mix topics.\n- Use the correct concept type for each file. See [Concept Types](../domain/concept-types.md).\n- Every concept must have YAML frontmatter with at minimum: `type`, `title`, `description`, `tags`, `timestamp`, `status`.\n- The `resource` field should point to the source doc or code file that the concept summarises. Use relative paths from the project root (e.g., `./docs/design/ARCHITECTURE.md`).\n- Do NOT duplicate the full content of existing docs into concepts. The concept is a typed, searchable summary. The `resource` field links to the full doc.\n- For docs that describe multiple topics, create separate concepts for each significant topic.\n- Use consistent, lowercase tags across all concepts.\n\n## Concept Type Assignment\n\n| Source material | Concept type | Directory |\n|----------------|-------------|-----------|\n| System architecture, data models, infrastructure | Architecture | `architecture/` |\n| UI components, interaction patterns, HUD layouts | Component | `components/` |\n| Business logic, domain entities, workflows | Domain | `domain/` |\n| Architectural decisions, rationale, trade-offs | Decision | `decisions/` |\n| Workflows, sprint flow, deployment gates, runbooks, agent definitions | Process | `process/` |\n| Superseded patterns, removed features | Deprecation | `deprecation/` |\n| Current state of play | State | `state/` |\n\n## Volume Guidance\n\n- Expect 40-80 concepts for a mature project with substantial docs.\n- Do not create trivial concepts (e.g., \"project uses TypeScript\"). Focus on knowledge that helps an agent understand the system, make decisions, and avoid mistakes.\n- Every concept should answer: \"What would an agent need to know about this topic to work effectively?\"\n\n## Legacy Alignment\n\nFor projects with existing docs, concepts reference the source doc via the `resource` field rather than duplicating content. The concept provides a structured summary, tags, and type classification. The source doc provides the full content. See [Legacy Alignment Mode](../decisions/legacy-alignment-mode.md).\n\nA concept that references an existing doc should contain:\n- A summary of the doc's key content (not a copy, a synthesis)\n- The most important decisions, patterns, or rules from the doc\n- Tags that make it discoverable\n- The `resource` field pointing to the source doc path\n\n## After Seeding\n\nUpdate all `index.md` files with the new concepts and accurate counts. See [Index Structure](../domain/index-structure.md). Update `knowledge/log.md` with a seeding entry.\n\n## Relationship to Other Phases\n\nThis phase feeds into [Process GitHub Epics](./process-github-epics.md) (Phase 3), [Create Schema Diagrams](./create-schema-diagrams.md) (Phase 4), and [Curation Pass](./curation-pass.md) (Phase 6). The seeded concepts form the baseline that later phases enrich and the curation pass aligns.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Seed Knowledge From Existing Docs","description":"How to create OKF concepts from a project's existing documentation","resource":"./templates/okf/DEPLOYMENT-RUNBOOK.md","tags":["okf","seeding","docs","legacy","concepts"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Seed Knowledge From Existing Docs\n\nPhase 2 of the OKF deployment workflow. This is the most important phase because it establishes the knowledge baseline. The agent reads the project's existing documentation and creates OKF concepts for each significant topic.\n\n## Source Material Priority\n\nRead in this order:\n\n1. `AGENTS.md` (root) - extract architecture decisions, agent definitions, conventions, deployment gates, key patterns.\n2. `docs/` - read all markdown files, extracting design decisions, architecture patterns, runbooks.\n3. `docs/design/` - architecture docs, reference docs, pattern docs.\n4. `docs/agents/` - agent knowledge spaces, specialist curation.\n5. `README.md` - project overview, setup commands.\n6. Any `src/AGENTS.md` or sub-directory `AGENTS.md` files.\n\n## Concept Creation Rules\n\n- One concept per file. Do not mix topics.\n- Use the correct concept type for each file. See [Concept Types](../domain/concept-types.md).\n- Every concept must have YAML frontmatter with at minimum: `type`, `title`, `description`, `tags`, `timestamp`, `status`.\n- The `resource` field should point to the source doc or code file that the concept summarises. Use relative paths from the project root (e.g., `./docs/design/ARCHITECTURE.md`).\n- Do NOT duplicate the full content of existing docs into concepts. The concept is a typed, searchable summary. The `resource` field links to the full doc.\n- For docs that describe multiple topics, create separate concepts for each significant topic.\n- Use consistent, lowercase tags across all concepts.\n\n## Concept Type Assignment\n\n| Source material | Concept type | Directory |\n|----------------|-------------|-----------|\n| System architecture, data models, infrastructure | Architecture | `architecture/` |\n| UI components, interaction patterns, HUD layouts | Component | `components/` |\n| Business logic, domain entities, workflows | Domain | `domain/` |\n| Architectural decisions, rationale, trade-offs | Decision | `decisions/` |\n| Workflows, sprint flow, deployment gates, runbooks, agent definitions | Process | `process/` |\n| Superseded patterns, removed features | Deprecation | `deprecation/` |\n| Current state of play | State | `state/` |\n\n## Volume Guidance\n\n- Expect 40-80 concepts for a mature project with substantial docs.\n- Do not create trivial concepts (e.g., \"project uses TypeScript\"). Focus on knowledge that helps an agent understand the system, make decisions, and avoid mistakes.\n- Every concept should answer: \"What would an agent need to know about this topic to work effectively?\"\n\n## Legacy Alignment\n\nFor projects with existing docs, concepts reference the source doc via the `resource` field rather than duplicating content. The concept provides a structured summary, tags, and type classification. The source doc provides the full content. See [Legacy Alignment Mode](../decisions/legacy-alignment-mode.md).\n\nA concept that references an existing doc should contain:\n- A summary of the doc's key content (not a copy, a synthesis)\n- The most important decisions, patterns, or rules from the doc\n- Tags that make it discoverable\n- The `resource` field pointing to the source doc path\n\n## After Seeding\n\nUpdate all `index.md` files with the new concepts and accurate counts. See [Index Structure](../domain/index-structure.md). Update `knowledge/log.md` with a seeding entry.\n\n## Relationship to Other Phases\n\nThis phase feeds into [Process GitHub Epics](./process-github-epics.md) (Phase 3), [Create Schema Diagrams](./create-schema-diagrams.md) (Phase 4), and [Curation Pass](./curation-pass.md) (Phase 6). The seeded concepts form the baseline that later phases enrich and the curation pass aligns.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/skill-distribution-sync.md","content":"---\ntype: Process\ntitle: Skill Distribution Sync\ndescription: Ownership-aware workflow for syncing mapped designs assets into agent-skill-distro and validating distro policy before refreshing installed roots\nresource: ./scripts/sync-skill-distro.sh\ntags: [skills, distribution, sync, agent-skill-distro, cli-roots, canonical, workflow]\ntimestamp: 2026-08-08T06:38:00Z\nstatus: active\n---\n\n# Skill Distribution Sync\n\nThe designs repo is the canonical source for reusable workflow assets explicitly mapped by `scripts/sync-skill-distro.sh`. The `agent-skill-distro` repo owns distribution policy, runtime adapters, deterministic auditing, quarantine, and CI before refreshing installed roots. See [Workflow Skill Canonicalisation](../decisions/skill-canonicalisation.md) and `templates/instructional-documents/skill-governance.md`.\n\n## Three-Layer Model\n\n```\ndesigns (source of truth)\n  -> agent-skill-distro (distribution layer)\n    -
