erve that repository-local boundary. Add no count threshold,\nqueue start, curation launch, scheduler invocation, external manifest refresh,\nor another parent/workspace side effect. A future explicit repository-local\nviewer-generation command may be designed separately; it is not a post-commit\nside effect.\n\n## `templates/okf/OKF-STANDARD.md`\n\n**Current:** it permits an operator to run a repository-scoped inbox-status\ncheck at a sprint checkpoint or epic close and separately request one bounded\nbatch, while noting count/age/size are not execution authority.\n\n**Proposed:** add the A3 preflight requirements and the A4 warning-only quality\nsignals; state that `inbox-status` is read-only and accepts one validated root;\nmake the P0 no-parent-workspace rule an installation verification prerequisite;\nand explicitly defer batch execution until First Decision Gate and canary\napproval.\n\n## `templates/okf/agents/okf-curator.md`\n\n**Current:** it requires an explicit operator request and prohibits scheduling,\nself-reinvocation, traversal outside the supplied repository, and additional\nsessions.\n\n**Proposed:** require a run-plan record with target root/revision, item/byte/\nruntime/session ceilings, lock preflight, kill-switch/cancellation state,\ndeterministic selection, and terminal report/checkpoint. Refuse every mutation\nwhen P0 isolation, root validation, lock, quota, or reportability fails.\n\n## `templates/okf/okf-query.sh`\n\n**Current:** it offers free-text and `--decisions` search only.\n\n**Proposed:** add an opt-in `--inbox-status` mode that reads only the selected\nrepository's `knowledge/inbox/` and indexes. It emits deterministic count,\nbytes, oldest age, capture-tier distribution, and A4 quality flags; it neither\nwrites files nor invokes a hook, curator, scheduler, network service, or\nanother repository.\n\n## `templates/okf/DEPLOYMENT-RUNBOOK.md`\n\n**Current:** Post-Deployment says agents write pre-commit session syntheses and\nthe hook refreshes a viewer manifest and nudges at five unprocessed items.\n\n**Proposed:** document Tier 1 hook capture, one Tier 2 `end-session` synthesis,\nterminal `okf-capture:` persistence, an explicit non-mutating status review,\nand separate operator authorization for a bounded batch. Phase 1/8 verification\nmust resolve the absolute active hook path, compare it to canonical content,\nverify chained predecessors, reject parent-workspace calls, and compare actual\ninbox count to its index.\n\n# Rejected Paths\n\n- Any cron, launchd, Factory, polling, queue-consumer, self-reinvoking, or\n  automatic retry cadence.\n- Automatic curation because a count, age, size, duplicate, or malformed-item\n  threshold is met.\n- A global or parent-workspace hook path, manifest scan, or viewer refresh.\n- Cross-project deployment or backlog processing based on the A1 inventory.\n- A canary before the First Decision Gate approves A3 controls and datasets.\n\n# Approval Boundary\n\nThe A1 P0 hook-isolation finding is remediated by `20acf25` and its parent-\ngenerator fixture. The approved gate permits Phase B design work. Each scoped\nPhase C implementation packet still needs an accepted Phase B contract, and\nD3 planning still needs its separate named dataset, numeric ceilings, success\nmetrics, and stop/rollback approval. The gate does not permit a scheduler,\nbroad rollout, or automatic curation.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","id":"okf-91c7e4a2-6d3f-4b85-9a10-2f6c8e73d541","title":"Curation Cadence and First Decision Gate","description":"Operator-approved explicit, repository-scoped, operator-requested status review and bounded manual curation model","resource":"https://github.com/Holovkat/designs/issues/26","tags":["okf","curation","cadence","safety","operator-approval"],"timestamp":"2026-08-06T03:19:40Z","status":"active","issue_refs":[26],"epic_refs":[26],"decision_status":"operator-approved-2026-08-06","supersedes":["okf-0d7a8c1e-9b4f-4d21-8a3c-7e5f6012b934"]},"body":"\n# Decision Status and Scope\n\nThe operator approved this Epic #26 A5 decision on 2026-08-06. It selects the\ncurrent operating model and the First Decision Gate boundary. It does not enable\na scheduler, cron, launchd job, Factory task, curator run, canary, hook\ndeployment, cross-project rollout, archive, deletion, or `AGENTS.md` patch.\n\n# Evidence and Constraints\n\n- A1 identified a canonical hook call to a parent-workspace\n  `generate-all-viz.js --manifest`, which could scan sibling bundles and write\n  outside the repository. The designs-only remediation `20acf25` removed that\n  call; the hook fixture now proves a parent generator is not invoked. The\n  First Decision Gate must retain that repository-scoped verification.\n- A1 finds fms-glm and fmsroadie/fmsmercury drifted, with missing or legacy\n  hooks, absent Tier 2/curator deployment, and stale inbox counts. This is\n  inventory evidence, not cross-project rollout authority.\n- A2 finds the designs inbox is heterogeneous: 8 pending items contain one\n  current five-Tier-1-plus-one-Tier-2 group and two older legacy syntheses.\n  Count alone is not a useful execution signal. Historical yield is batch-level\n  only and does not measure knowledge usefulness.\n- A3 records the 57,595-session, 6.34 GiB cron/Factory incident and requires\n  fail-closed root validation, one-run locking, declared items/bytes/runtime/\n  session ceilings, cancellation, kill switch, observability, and resumability.\n- A0 approved terminal capture persistence and explicit repository-scoped\n  operator curation; neither approval authorizes an automatic cadence.\n\n# Options Considered\n\n| Model | Benefits | Failure and operating cost | Decision |\n|---|---|---|---|\n| Passive manual only, no status evidence | Lowest machinery and no automatic run | Backlogs remain invisible; no comparable health evidence or explicit queue | Rejected as insufficiently observable. |\n| Per-commit numeric nudge | Simple in the former model | Tier 1 writes on every ordinary commit, so a threshold becomes continuous noise; count is not workload; hook must remain fast | Rejected. |\n| Threshold queue/status report | Makes count, bytes, age, and quality visible without mutation | Can be misread as execution authority; requires clear operator boundary | Accepted only as an explicit status report, never an automatic trigger. |\n| Event-driven operator prompt at sprint checkpoint or epic close | Aligns review with coherent work and decision ownership | Depends on human action and a stable report contract | Accepted as the request point for status review. |\n| Scheduled cron/launchd/Factory or self-reinvocation | Could reduce manual reminders | Recreates the documented runaway risk; needs resource, path, and concurrency controls not yet proven | Rejected before bounded canaries and separate approval. |\n| Hybrid automatic queue plus scheduled curator | May reduce backlog age | Combines threshold noise with autonomous mutation and cumulative resource risk | Rejected. |\n\n# Recommended Current Cadence\n\nAdopt an **explicit, repository-scoped, operator-requested status review** at a\ncoherent sprint checkpoint or epic close. The review may run a deterministic\nread-only `inbox-status` command against one named repository root. It reports\npending count, bytes, age, capture-tier distribution, size/quality/duplicate\nwarnings, and current lock/kill-switch state if a bounded runner exists.\n\nThe report does not start curation. An operator must separately request one\nbounded manual curation batch, naming the repository/worktree, branch or\nsnapshot, item/byte/runtime/session ceilings, and the expected outcome. Until\nC4/C6 and D3 pass, the only approved current action is status review and\nmanual planning; there is no approved curator executor.\n\nA2's 30-day age and 10-item/16-KiB load boundaries are advisory report flags\nonly. They do not enqueue, schedule, notify repeatedly, create a session, or\nauthorize mutation.\n\n## Authority and Stop Conditions\n\nA valid future batch request must include the operator identity, target root,\nGit revision/worktree, selected items or deterministic selection rule, positive\nA3-aligned ceilings, cancellation path, kill-switch state, and a rollback or\nrecovery plan. It must stop before mutation when any of these is absent, when\nthe repository-scoped isolation preflight fails, when the root/lock/path\npreflight fails, when a quota is reached, or when reporting/checkpointing cannot\nbe made durable.\n\nNo request may use a home directory, `/Users`, a parent workspace, broad\nfilesystem discovery, a global hook path, or a cross-project selection. One\nrepository and one executor session are the maximum scope of a run.\n\n# First Decision Gate Record\n\nThe operator approved the following boundary before Phase B design work:\n\n1. A1 deployment audit plus the `20acf25` P0 remediation and its fixture proof\n   that the active canonical hook has no parent-workspace manifest call.\n2. A2 baseline and the approved quality/retention choices in A4.\n3. A3 safety contract: numeric item/input/generated-byte/runtime ceilings,\n   one-run lock, repository-local report/checkpoint paths, cancellation,\n   kill-switch authority, and recovery procedure.\n4. This cadence: status review is explicit and non-mutating; batch execution is\n   separately operator-requested, repository-scoped, bounded, and manual.\n5. Named canary datasets, isolated worktrees/snapshots, success measures, and\n   stop/rollback conditions for D3–D5.\n6. Confirmation that no external bundle deployment, scheduler, or Factory\n   configuration is included in the approval.\n\n# Proposed Text Changes — Not Applied\n\n## `templates/okf/post-commit.sh`\n\n**Current:** the hook writes Tier 1 captures with terminal\n`okf-capture:`/`okf-curation:` guards and has no parent-workspace manifest call\n(after `20acf25`).\n\n**Proposed:** preserve that repository-local boundary. Add no count threshold,\nqueue start, curation launch, scheduler invocation, external manifest refresh,\nor another parent/workspace side effect. A future explicit repository-local\nviewer-generation command may be designed separately; it is not a post-commit\nside effect.\n\n## `templates/okf/OKF-STANDARD.md`\n\n**Current:** it permits an operator to run a repository-scoped inbox-status\ncheck at a sprint checkpoint or epic close and separately request one bounded\nbatch, while noting count/age/size are not execution authority.\n\n**Proposed:** add the A3 preflight requirements and the A4 warning-only quality\nsignals; state that `inbox-status` is read-only and accepts one validated root;\nmake the P0 no-parent-workspace rule an installation verification prerequisite;\nand explicitly defer batch execution until First Decision Gate and canary\napproval.\n\n## `templates/okf/agents/okf-curator.md`\n\n**Current:** it requires an explicit operator request and prohibits scheduling,\nself-reinvocation, traversal outside the supplied repository, and additional\nsessions.\n\n**Proposed:** require a run-plan record with target root/revision, item/byte/\nruntime/session ceilings, lock preflight, kill-switch/cancellation state,\ndeterministic selection, and terminal report/checkpoint. Refuse every mutation\nwhen P0 isolation, root validation, lock, quota, or reportability fails.\n\n## `templates/okf/okf-query.sh`\n\n**Current:** it offers free-text and `--decisions` search only.\n\n**Proposed:** add an opt-in `--inbox-status` mode that reads only the selected\nrepository's `knowledge/inbox/` and indexes. It emits deterministic count,\nbytes, oldest age, capture-tier distribution, and A4 quality flags; it neither\nwrites files nor invokes a hook, curator, scheduler, network service, or\nanother repository.\n\n## `templates/okf/DEPLOYMENT-RUNBOOK.md`\n\n**Current:** Post-Deployment says agents write pre-commit session syntheses and\nthe hook refreshes a viewer manifest and nudges at five unprocessed items.\n\n**Proposed:** document Tier 1 hook capture, one Tier 2 `end-session` synthesis,\nterminal `okf-capture:` persistence, an explicit non-mutating status review,\nand separate operator authorization for a bounded batch. Phase 1/8 verification\nmust resolve the absolute active hook path, compare it to canonical content,\nverify chained predecessors, reject parent-workspace calls, and compare actual\ninbox count to its index.\n\n# Rejected Paths\n\n- Any cron, launchd, Factory, polling, queue-consumer, self-reinvoking, or\n  automatic retry cadence.\n- Automatic curation because a count, age, size, duplicate, or malformed-item\n  threshold is met.\n- A global or parent-workspace hook path, manifest scan, or viewer refresh.\n- Cross-project deployment or backlog processing based on the A1 inventory.\n- A canary before the First Decision Gate approves A3 controls and datasets.\n\n# Approval Boundary\n\nThe A1 P0 hook-isolation finding is remediated by `20acf25` and its parent-\ngenerator fixture. The approved gate permits Phase B design work. Each scoped\nPhase C implementation packet still needs an accepted Phase B contract, and\nD3 planning still needs its separate named dataset, numeric ceilings, success\nmetrics, and stop/rollback approval. The gate does not permit a scheduler,\nbroad rollout, or automatic curation.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/documentation-first-approach.md","content":"---\ntype: Decision\ntitle: Documentation-First Approach\ndescription: Decision to make the designs repo documentation-first with README as GitHub index and HTML guide as canonical operating model\nresource: ./README.md\ntags: [designs, decision, documentation-first, readme, html-guide, operating-model]\ntimestamp: 2026-07-13T03:35:53Z\nstatus: active\n---\n\n# Documentation-First Approach\n\n## Decision\n\nThe designs repository is documentation-first. The README is the GitHub index. The detailed workflow meta and stage-gate guidance lives in the HTML guide under `docs/workflow-guide/`.\n\n## Rationale\n\n1. **No build pipeline** - This repo contains no application code, only templates and documentation. A build pipeline would add unnecessary complexity.\n2. **GitHub Pages as delivery** - The rendered Pages site provides a polished, navigable experience for stakeholders without requiring a build step.\n3. **README as index** - The README serves as the entry point on GitHub, linking to the rendered Pages site and the template directories.\n4. **HTML guide as canonical** - The workflow guide HTML is the source of truth for the operating model, providing a richer experience than markdown alone.\n\n## Implementation\n\n- README links to: rendered Pages site, workflow guide, install guide, command pack, project skills, workflow installer, functional design templates, instructional documents, UI/UX guidelines\n- README contains mermaid diagrams for Planning Decomposition and Delivery Lifecycle\n- The HTML guide covers planning, plan review, Definition of Done ranking, T1/T2 implementation verification, T3 Dev UAT, T4 QA application readiness, CI/CD authority, production approval, T5 release verification, closeout, installation, and project-specific overlays\n- Validation is lightweight: `git diff --check` and reviewing changed markdown links\n\n## Alternatives Considered\n\n- **Full static site generator (Docusaurus, Astro)**: Rejected as overkill for a documentation-only repo. The HTML guide is hand-crafted.\n- **Markdown-only (no HTML guide)**: Rejected because the workflow guide benefits from interactive navigation, theming, and structured layout that HTML provides.\n- **Wiki or external docs platform**: Rejected because the repo should be self-contained and version-controlled.\n\n## Consequences\n\n- The HTML guide must be maintained alongside markdown docs\n- No CI/CD pipeline needed for this repo\n- GitHub Pages provides free hosting\n- Changes to the workflow guide require opening `docs/workflow-guide/index.html` locally to verify\n\n## Related Concepts\n\n- [Workflow Guide](../process/workflow-guide.md)\n- [Planning Decomposition](../process/planning-decomposition.md)\n- [Delivery Lifecycle](../process/delivery-lifecycle.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n- [Graphite Stacking for Docs](./graphite-stacking-for-docs.md)\n- [Legacy Alignment Mode](./legacy-alignment-mode.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"Documentation-First Approach","description":"Decision to make the designs repo documentation-first with README as GitHub index and HTML guide as canonical operating model","resource":"./README.md","tags":["designs","decision","documentation-first","readme","html-guide","operating-model"],"timestamp":"2026-07-13T03:35:53Z","status":"active"},"body":"\n# Documentation-First Approach\n\n## Decision\n\nThe designs repository is documentation-first. The README is the GitHub index. The detailed workflow meta and stage-gate guidance lives in the HTML guide under `docs/workflow-guide/`.\n\n## Rationale\n\n1. **No build pipeline** - This repo contains no application code, only templates and documentation. A build pipeline would add unnecessary complexity.\n2. **GitHub Pages as delivery** - The rendered Pages site provides a polished, navigable experience for stakeholders without requiring a build step.\n3. **README as index** - The README serves as the entry point on GitHub, linking to the rendered Pages site and the template directories.\n4. **HTML guide as canonical** - The workflow guide HTML is the source of truth for the operating model, providing a richer experience than markdown alone.\n\n## Implementation\n\n- README links to: rendered Pages site, workflow guide, install guide, command pack, project skills, workflow installer, functional design templates, instructional documents, UI/UX guidelines\n- README contains mermaid diagrams for Planning Decomposition and Delivery Lifecycle\n- The HTML guide covers planning, plan review, Definition of Done ranking, T1/T2 implementation verification, T3 Dev UAT, T4 QA application readiness, CI/CD authority, production approval, T5 release verification, closeout, installation, and project-specific overlays\n- Validation is lightweight: `git diff --check` and reviewing changed markdown links\n\n## Alternatives Considered\n\n- **Full static site generator (Docusaurus, Astro)**: Rejected as overkill for a documentation-only repo. The HTML guide is hand-crafted.\n- **Markdown-only (no HTML guide)**: Rejected because the workflow guide benefits from interactive navigation, theming, and structured layout that HTML provides.\n- **Wiki or external docs platform**: Rejected because the repo should be self-contained and version-controlled.\n\n## Consequences\n\n- The HTML guide must be maintained alongside markdown docs\n- No CI/CD pipeline needed for this repo\n- GitHub Pages provides free hosting\n- Changes to the workflow guide require opening `docs/workflow-guide/index.html` locally to verify\n\n## Related Concepts\n\n- [Workflow Guide](../process/workflow-guide.md)\n- [Planning Decomposition](../process/planning-decomposition.md)\n- [Delivery Lifecycle](../process/delivery-lifecycle.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n- [Graphite Stacking for Docs](./graphite-stacking-for-docs.md)\n- [Legacy Alignment Mode](./legacy-alignment-mode.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/graphite-stacking-for-docs.md","content":"---\ntype: Decision\ntitle: Graphite Stacking for Documentation Work\ndescription: Decision to use Graphite-style stacking workflow for managing dependent documentation changes\nresource: ./templates/instructional-documents/AGENTS.md\ntags: [designs, decision, graphite, stacking, documentation, git, workflow]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Graphite Stacking for Documentation Work\n\n## Decision\n\nWhen updating documentation, use the Graphite-style stacking workflow to manage dependent documentation changes. This is documented in the AGENTS.md files for both the templates area and the instructional-documents area.\n\n## Rationale\n\n1. **Dependent changes** - Documentation updates often depend on each other (e.g., updating a workflow guide depends on updating templates, which depends on updating reference docs). Stacking manages these dependencies naturally.\n2. **Small, focused PRs** - Each documentation change is reviewable independently, with clear scope.\n3. **Continue while waiting** - Authors can continue working on dependent docs while earlier PRs are under review.\n4. **Squash merge keeps history clean** - Each documentation change becomes a single atomic commit.\n\n## Implementation\n\n### Documentation Stack Workflow\n\n```bash\n# Base documentation update\ngit checkout main && git pull origin main\ngit checkout -b docs/update-workflow-guide\n\n# Dependent documentation updates\ngit checkout -b docs/update-related-templates\n# Target PR to docs/update-workflow-guide\n\n# Documentation that depends on templates\ngit checkout -b docs/update-example-guides\n# Target PR to docs/update-related-templates\n```\n\n### Branch Naming for Documentation\n\n- Workflow updates: `docs/update-workflow-name`\n- Technical guides: `docs/update-technology-name`\n- Templates: `docs/update-template-name`\n- Reference docs: `docs/update-reference-area`\n- Corrections: `docs/fix-documentation-issue`\n\n### Documentation Commit Messages\n\n```\ndocs(workflow): update GitHub workflow guide with new stack management\ndocs(template): enhance TFD template with validation examples\ndocs(guide): add WorkOS authentication integration steps\nfix(docs): correct broken links in architecture guide\nrefactor(docs): consolidate related authentication documentation\n```\n\n### Stack Management\n\nRebase documentation stack regularly to keep in sync with main. Use `--force-with-lease` for safety. When base documentation merges, update dependent branches by rebasing onto main and changing PR targets.\n\n## Alternatives Considered\n\n- **Single large PR for all doc changes**: Rejected because large PRs are harder to review and slower to merge.\n- **Sequential PRs (no stacking)**: Rejected because it blocks work on dependent changes while waiting for reviews.\n- **Direct commits to main**: Rejected because documentation changes still benefit from review.\n\n## Consequences\n\n- All documentation PRs must use squash merge\n- Stacks should be limited to 3-5 PRs\n- Authors need to manage rebasing when parent PRs merge\n- Force-with-lease is required instead of force push\n\n## Related Concepts\n\n- [GitHub Workflow Guide](../process/github-workflow.md)\n- [Documentation-First Approach](./documentation-first-approach.md)\n- [Workflow Guide](../process/workflow-guide.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"Graphite Stacking for Documentation Work","description":"Decision to use Graphite-style stacking workflow for managing dependent documentation changes","resource":"./templates/instructional-documents/AGENTS.md","tags":["designs","decision","graphite","stacking","documentation","git","workflow"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Graphite Stacking for Documentation Work\n\n## Decision\n\nWhen updating documentation, use the Graphite-style stacking workflow to manage dependent documentation changes. This is documented in the AGENTS.md files for both the templates area and the instructional-documents area.\n\n## Rationale\n\n1. **Dependent changes** - Documentation updates often depend on each other (e.g., updating a workflow guide depends on updating templates, which depends on updating reference docs). Stacking manages these dependencies naturally.\n2. **Small, focused PRs** - Each documentation change is reviewable independently, with clear scope.\n3. **Continue while waiting** - Authors can continue working on dependent docs while earlier PRs are under review.\n4. **Squash merge keeps history clean** - Each documentation change becomes a single atomic commit.\n\n## Implementation\n\n### Documentation Stack Workflow\n\n```bash\n# Base documentation update\ngit checkout main && git pull origin main\ngit checkout -b docs/update-workflow-guide\n\n# Dependent documentation updates\ngit checkout -b docs/update-related-templates\n# Target PR to docs/update-workflow-guide\n\n# Documentation that depends on templates\ngit checkout -b docs/update-example-guides\n# Target PR to docs/update-related-templates\n```\n\n### Branch Naming for Documentation\n\n- Workflow updates: `docs/update-workflow-name`\n- Technical guides: `docs/update-technology-name`\n- Templates: `docs/update-template-name`\n- Reference docs: `docs/update-reference-area`\n- Corrections: `docs/fix-documentation-issue`\n\n### Documentation Commit Messages\n\n```\ndocs(workflow): update GitHub workflow guide with new stack management\ndocs(template): enhance TFD template with validation examples\ndocs(guide): add WorkOS authentication integration steps\nfix(docs): correct broken links in architecture guide\nrefactor(docs): consolidate related authentication documentation\n```\n\n### Stack Management\n\nRebase documentation stack regularly to keep in sync with main. Use `--force-with-lease` for safety. When base documentation merges, update dependent branches by rebasing onto main and changing PR targets.\n\n## Alternatives Considered\n\n- **Single large PR for all doc changes**: Rejected because large PRs are harder to review and slower to merge.\n- **Sequential PRs (no stacking)**: Rejected because it blocks work on dependent changes while waiting for reviews.\n- **Direct commits to main**: Rejected because documentation changes still benefit from review.\n\n## Consequences\n\n- All documentation PRs must use squash merge\n- Stacks should be limited to 3-5 PRs\n- Authors need to manage rebasing when parent PRs merge\n- Force-with-lease is required instead of force push\n\n## Related Concepts\n\n- [GitHub Workflow Guide](../process/github-workflow.md)\n- [Documentation-First Approach](./documentation-first-approach.md)\n- [Workflow Guide](../process/workflow-guide.md)\n- [Templates Architecture](../architecture/templates-architecture.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/inbox-quality-and-retention-policy.md","content":"---\ntype: Decision\ntitle: Inbox Quality and Retention Policy\ndescription: Operator-approved warning-first, non-destructive quality, deduplication, retention, and archive rules for OKF inbox items\nresource: https://github.com/Holovkat/designs/issues/26\ntags: [okf, inbox, quality, retention, deduplication, provenance]\ntimestamp: 2026-08-06T03:19:40Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\ndecision_status: operator-approved-2026-08-06\n---\n\n# Decision Status and Scope\n\nThe operator approved this Epic #26 A4 policy on 2026-08-06. It is\nwarning-first and non-destructive: it authorizes no capture rejection, automatic\ncleanup, archive, delete, curation run, scheduler, cross-project rollout, or\n`AGENTS.md` change. It converts A1–A3 evidence into requirements for later\nvalidation, triage, and operator-reviewed archive work.\n\n# Verified Evidence Used\n\n- The A2 designs baseline measured 8 unprocessed and 2 processed inbox items,\n  10,937 B pending, 18,041 B retained, and a 3,918 B maximum retained item.\n  It found no malformed frontmatter, invalid `Inbox` types, required-body gaps,\n  exact-content duplicates, title duplicates, or inbox-index drift.\n- A2 found two legacy unprocessed records without `capture_tier`, five current\n  Tier 1 records with repeated `okf` tags, two pre-#30 filenames without the\n  ISO `T` separator, and one cross-repository short SHA (`ecb76f8`) that cannot\n  resolve in the designs object database. These are provenance-quality facts,\n  not deletion or rewrite authority.\n- A1 found external backlog/index drift and identified a P0 canonical hook\n  isolation failure. The designs-only remediation `20acf25` removed the\n  parent-workspace call and its fixture proves no parent generator is invoked.\n  External observations remain audit evidence only; this policy does not\n  authorize work in those repositories.\n- A3 requires bounded, fail-closed execution and rejects unbounded scheduling,\n  broad traversal, irreversible recovery, and automatic retries.\n\n# Proposed Policy\n\n## 1. Signal and Size\n\nInbox items must be concise knowledge captures, not storage for raw operational\nartifacts. A capture must summarize the decision or impact and point to the\ncanonical Git object, issue, log, build artifact, or external evidence instead\nof copying it.\n\nThe initial `max_inbox_item_bytes` is **16 KiB**. This is a warning-and-review\nboundary, not a hook rejection: an item above it remains in place, is marked\n`oversized` by future triage, and requires an explicit human decision before\nany rewrite, archive, or deletion. It is based on the 3,918 B A2 maximum and\nremains warning-only until a separately approved enforcement migration.\n\nProhibited content includes raw logs, stack-trace dumps, full API/database\npayloads, binary encodings, credentials, private keys, token values, bulk\nsource copies, and unbounded transcripts. A future capture check must warn\nwithout exposing such content in its own report; security-sensitive material\nfollows repository incident handling rather than normal inbox curation.\n\n## 2. Deduplication and Complementary Provenance\n\nDeduplication is classification before mutation. It must preserve every source\nitem until an operator approves a reversible archive action.\n\n| Record | Proposed primary key | Expected overlap / exemption | Review outcome |\n|---|---|---|---|\n| Tier 1 commit capture | Full `commit_sha` | A Tier 2 item may reference the same ordinary SHA; this is complementary provenance, not a duplicate. | Two active Tier 1 items for one full SHA are a duplicate candidate. |\n| Tier 2 session synthesis | `session_id` | Its SHA list overlaps the session's Tier 1 records by design. | A second active Tier 2 item for one non-empty session ID is a duplicate candidate. |\n| Legacy item | Content SHA-256 plus normalized title/timestamp when available | Missing `capture_tier` or session ID alone is historical lineage. | Flag `needs-human-review`; do not infer a duplicate from missing fields. |\n| Any item | Full-content SHA-256 | Identical raw content may still require provenance review. | Flag an exact-content duplicate candidate; retain both until archive approval. |\n\nFilename similarity, repeated title text, branch name, issue reference, or a\nshort SHA alone is insufficient to remove or merge an item. A historical\nnoncanonical filename is reported but never renamed by automated tooling.\n\n## 3. Structural and Provenance Quality\n\nFuture validation and triage must classify, not silently correct:\n\n- malformed YAML, non-`Inbox` type, missing applicable required fields, or\n  missing Tier 1/Tier 2 body sections → `malformed` with exact diagnostics;\n- subject-only Tier 1 rationale/impact markers → `low-signal`, retained for\n  human review rather than discarded;\n- legacy records without `capture_tier` → `legacy-unspecified`, valid history\n  unless another structural error exists;\n- timestamps conflicting with Git history or outside the accepted format →\n  `provenance-ambiguous`, not overwritten;\n- SHA unavailable in the local repository but plausibly belonging to a named\n  external repository → `provenance-unresolved`, with source authority noted;\n- repeated values in a tags array or a noncanonical filename → `quality-warning`.\n\nThe A2 repeated `okf` tags are a current quality-warning fixture. A future hook\nor linter may prevent new duplicate tags only after warning-mode evidence and\napproval; it must not rewrite historical captures.\n\n## 4. Age, Load, and Reporting\n\nA status report must show pending count, pending bytes, largest item, oldest\nitem age, capture-tier distribution, quality classifications, and duplicate\ncandidates. It must not start curation.\n\nThe following are **review signals only**, not execution triggers:\n\n- oldest pending item at or above 30 days;\n- pending load at or above 10 items and/or 16 KiB; and\n- any malformed, oversized, exact-content-duplicate, duplicated-session, or\n  unresolved-provenance classification.\n\nCount is deliberately not a standalone quality or cadence signal: A2's eight\nitems represent one six-record Tier 1/Tier 2 group plus two older legacy\nsyntheses. An operator decides whether status evidence warrants a bounded,\nrepository-scoped curation request under the separate A5 cadence decision.\n\n## 5. Retention, Archive, and Deletion\n\nUnprocessed inbox files remain authoritative source material until curation or\nan explicitly approved archive action. Processed items remain in\n`knowledge/inbox/processed/` as an audit trail. No age, size, duplicate, or\nquality classification deletes a file.\n\nThe future D2 archive workflow must require an operator-reviewed manifest with:\n\n- selected source paths, content hashes, frontmatter identity, classification,\n  and deterministic selection rule;\n- operator identity/approval, reason, timestamp, repository root, Git revision,\n  and destination paths;\n- all created/updated archive or replacement paths and their hashes;\n- rollback steps and a tested rollback result; and\n- a statement that no permanent deletion occurred.\n\nPermanent deletion is outside normal curation and requires a separate explicit\noperator approval that identifies every path and manifest, confirms rollback is\nno longer required, and is recorded in Git. No automated or batch policy can\nsupply that approval.\n\n# Parameters for Future Implementation Packets\n\nThe gate approved 16 KiB as the initial warning value and the 30-day and\ncount/bytes review signals. Before C/D implementation packets, define the\nsource-authority treatment for external SHAs; exact archive-manifest location\nand retention duration; security handling for captured sensitive material;\nwarning-to-enforcement migration criteria; and A3-aligned per-run ceilings,\nlock/checkpoint locations, and kill-switch mechanism. None is inferred by this\npolicy.\n\n# Rejected Paths\n\n- **Automatic threshold curation:** rejected; signals inform an operator only.\n- **Automatic duplicate deletion or compaction:** rejected; source material and\n  provenance remain recoverable until an approved manifest operation.\n- **Renaming or normalizing historical captures in place:** rejected; it changes\n  lineage without improving the underlying evidence.\n- **Treating every legacy field gap as malformed:** rejected; the two-tier\n  format must be warning-first for pre-adoption history.\n- **Using a local Git object database as sole external-SHA authority:** rejected;\n  cross-repository provenance must be classified, not erased.\n\n# Implementation Boundary\n\nC1/C2 may implement warning-mode schema/linter fixtures from this policy after\nthe accepted Phase B profile defines compatible fields. C3 may add non-blocking\ncapture-time warnings; D1 may classify; D2 may implement the reversible archive\nworkflow. None may start curation, schedule work, mutate another project, or\ndelete material based on this policy alone.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"Inbox Quality and Retention Policy","description":"Operator-approved warning-first, non-destructive quality, deduplication, retention, and archive rules for OKF inbox items","resource":"https://github.com/Holovkat/designs/issues/26","tags":["okf","inbox","quality","retention","deduplication","provenance"],"timestamp":"2026-08-06T03:19:40Z","status":"active","issue_refs":[26],"epic_refs":[26],"decision_status":"operator-approved-2026-08-06"},"body":"\n# Decision Status and Scope\n\nThe operator approved this Epic #26 A4 policy on 2026-08-06. It is\nwarning-first and non-destructive: it authorizes no capture rejection, automatic\ncleanup, archive, delete, curation run, scheduler, cross-project rollout, or\n`AGENTS.md` change. It converts A1–A3 evidence into requirements for later\nvalidation, triage, and operator-reviewed archive work.\n\n# Verified Evidence Used\n\n- The A2 designs baseline measured 8 unprocessed and 2 processed inbox items,\n  10,937 B pending, 18,041 B retained, and a 3,918 B maximum retained item.\n  It found no malformed frontmatter, invalid `Inbox` types, required-body gaps,\n  exact-content duplicates, title duplicates, or inbox-index drift.\n- A2 found two legacy unprocessed records without `capture_tier`, five current\n  Tier 1 records with repeated `okf` tags, two pre-#30 filenames without the\n  ISO `T` separator, and one cross-repository short SHA (`ecb76f8`) that cannot\n  resolve in the designs object database. These are provenance-quality facts,\n  not deletion or rewrite authority.\n- A1 found external backlog/index drift and identified a P0 canonical hook\n  isolation failure. The designs-only remediation `20acf25` removed the\n  parent-workspace call and its fixture proves no parent generator is invoked.\n  External observations remain audit evidence only; this policy does not\n  authorize work in those repositories.\n- A3 requires bounded, fail-closed execution and rejects unbounded scheduling,\n  broad traversal, irreversible recovery, and automatic retries.\n\n# Proposed Policy\n\n## 1. Signal and Size\n\nInbox items must be concise knowledge captures, not storage for raw operational\nartifacts. A capture must summarize the decision or impact and point to the\ncanonical Git object, issue, log, build artifact, or external evidence instead\nof copying it.\n\nThe initial `max_inbox_item_bytes` is **16 KiB**. This is a warning-and-review\nboundary, not a hook rejection: an item above it remains in place, is marked\n`oversized` by future triage, and requires an explicit human decision before\nany rewrite, archive, or deletion. It is based on the 3,918 B A2 maximum and\nremains warning-only until a separately approved enforcement migration.\n\nProhibited content includes raw logs, stack-trace dumps, full API/database\npayloads, binary encodings, credentials, private keys, token values, bulk\nsource copies, and unbounded transcripts. A future capture check must warn\nwithout exposing such content in its own report; security-sensitive material\nfollows repository incident handling rather than normal inbox curation.\n\n## 2. Deduplication and Complementary Provenance\n\nDeduplication is classification before mutation. It must preserve every source\nitem until an operator approves a reversible archive action.\n\n| Record | Proposed primary key | Expected overlap / exemption | Review outcome |\n|---|---|---|---|\n| Tier 1 commit capture | Full `commit_sha` | A Tier 2 item may reference the same ordinary SHA; this is complementary provenance, not a duplicate. | Two active Tier 1 items for one full SHA are a duplicate candidate. |\n| Tier 2 session synthesis | `session_id` | Its SHA list overlaps the session's Tier 1 records by design. | A second active Tier 2 item for one non-empty session ID is a duplicate candidate. |\n| Legacy item | Content SHA-256 plus normalized title/timestamp when available | Missing `capture_tier` or session ID alone is historical lineage. | Flag `needs-human-review`; do not infer a duplicate from missing fields. |\n| Any item | Full-content SHA-256 | Identical raw content may still require provenance review. | Flag an exact-content duplicate candidate; retain both until archive approval. |\n\nFilename similarity, repeated title text, branch name, issue reference, or a\nshort SHA alone is insufficient to remove or merge an item. A historical\nnoncanonical filename is reported but never renamed by automated tooling.\n\n## 3. Structural and Provenance Quality\n\nFuture validation and triage must classify, not silently correct:\n\n- malformed YAML, non-`Inbox` type, missing applicable required fields, or\n  missing Tier 1/Tier 2 body sections → `malformed` with exact diagnostics;\n- subject-only Tier 1 rationale/impact markers → `low-signal`, retained for\n  human review rather than discarded;\n- legacy records without `capture_tier` → `legacy-unspecified`, valid history\n  unless another structural error exists;\n- timestamps conflicting with Git history or outside the accepted format →\n  `provenance-ambiguous`, not overwritten;\n- SHA unavailable in the local repository but plausibly belonging to a named\n  external repository → `provenance-unresolved`, with source authority noted;\n- repeated values in a tags array or a noncanonical filename → `quality-warning`.\n\nThe A2 repeated `okf` tags are a current quality-warning fixture. A future hook\nor linter may prevent new duplicate tags only after warning-mode evidence and\napproval; it must not rewrite historical captures.\n\n## 4. Age, Load, and Reporting\n\nA status report must show pending count, pending bytes, largest item, oldest\nitem age, capture-tier distribution, quality classifications, and duplicate\ncandidates. It must not start curation.\n\nThe following are **review signals only**, not execution triggers:\n\n- oldest pending item at or above 30 days;\n- pending load at or above 10 items and/or 16 KiB; and\n- any malformed, oversized, exact-content-duplicate, duplicated-session, or\n  unresolved-provenance classification.\n\nCount is deliberately not a standalone quality or cadence signal: A2's eight\nitems represent one six-record Tier 1/Tier 2 group plus two older legacy\nsyntheses. An operator decides whether status evidence warrants a bounded,\nrepository-scoped curation request under the separate A5 cadence decision.\n\n## 5. Retention, Archive, and Deletion\n\nUnprocessed inbox files remain authoritative source material until curation or\nan explicitly approved archive action. Processed items remain in\n`knowledge/inbox/processed/` as an audit trail. No age, size, duplicate, or\nquality classification deletes a file.\n\nThe future D2 archive workflow must require an operator-reviewed manifest with:\n\n- selected source paths, content hashes, frontmatter identity, classification,\n  and deterministic selection rule;\n- operator identity/approval, reason, timestamp, repository root, Git revision,\n  and destination paths;\n- all created/updated archive or replacement paths and their hashes;\n- rollback steps and a tested rollback result; and\n- a statement that no permanent deletion occurred.\n\nPermanent deletion is outside normal curation and requires a separate explicit\noperator approval that identifies every path and manifest, confirms rollback is\nno longer required, and is recorded in Git. No automated or batch policy can\nsupply that approval.\n\n# Parameters for Future Implementation Packets\n\nThe gate approved 16 KiB as the initial warning value and the 30-day and\ncount/bytes review signals. Before C/D implementation packets, define the\nsource-authority treatment for external SHAs; exact archive-manifest location\nand retention duration; security handling for captured sensitive material;\nwarning-to-enforcement migration criteria; and A3-aligned per-run ceilings,\nlock/checkpoint locations, and kill-switch mechanism. None is inferred by this\npolicy.\n\n# Rejected Paths\n\n- **Automatic threshold curation:** rejected; signals inform an operator only.\n- **Automatic duplicate deletion or compaction:** rejected; source material and\n  provenance remain recoverable until an approved manifest operation.\n- **Renaming or normalizing historical captures in place:** rejected; it changes\n  lineage without improving the underlying evidence.\n- **Treating every legacy field gap as malformed:** rejected; the two-tier\n  format must be warning-first for pre-adoption history.\n- **Using a local Git object database as sole external-SHA authority:** rejected;\n  cross-repository provenance must be classified, not erased.\n\n# Implementation Boundary\n\nC1/C2 may implement warning-mode schema/linter fixtures from this policy after\nthe accepted Phase B profile defines compatible fields. C3 may add non-blocking\ncapture-time warnings; D1 may classify; D2 may implement the reversible archive\nworkflow. None may start curation, schedule work, mutate another project, or\ndelete material based on this policy alone.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/legacy-alignment-mode.md","content":"---\ntype: Decision\ntitle: Legacy Alignment Mode\ndescription: Keep existing docs in place rather than migrating content into OKF; concepts reference docs via resource field\nresource: ./templates/okf/OKF-STANDARD.md\ntags: [okf, legacy, docs, alignment, migration]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Decision: Legacy Alignment Mode\n\n## Context\n\nMany projects have substantial existing documentation in `docs/`, `docs/design/`, `docs/agents/`, and other directories. When deploying OKF, a decision must be made: should existing docs be migrated into `knowledge/`, or should they remain in place?\n\n## Decision\n\nExisting documentation stays where it is. OKF works as a curated knowledge graph layer over existing documentation. OKF concept files in `knowledge/` reference existing docs via the `resource` field.\n\n## How It Works\n\n1. Existing docs stay where they are. They are not moved into `knowledge/`.\n2. OKF concept files in `knowledge/` reference existing docs via the `resource` field.\n3. Each concept provides a structured summary, tags, and type classification for the referenced doc.\n4. Agents read the OKF index to find relevant concepts, then follow the `resource` link to the full source doc.\n5. The OKF bundle acts as a navigable, typed, searchable index over the existing documentation.\n\n## Rationale\n\n- **Avoids duplication:** Moving docs into `knowledge/` would create two copies of the same content, requiring synchronisation.\n- **Preserves existing content:** Detailed docs often contain formatting, diagrams, and depth that would be lost in a migration.\n- **Provides typed searchable index:** OKF concepts add structure (type, tags, description) that makes existing docs discoverable by agents.\n- **Non-destructive:** The deployment can be done without touching existing docs, reducing risk.\n- **Progressive migration:** Teams can gradually create OKF concepts for new knowledge while referencing existing docs for old knowledge.\n\n## Concept Content for Referenced Docs\n\nA concept that references an existing doc should contain:\n- A summary of the doc's key content (not a copy, a synthesis)\n- The most important decisions, patterns, or rules from the doc\n- Tags that make it discoverable\n- The `resource` field pointing to the source doc path (relative to repo root)\n\n## Greenfield vs Legacy\n\n| Aspect | Greenfield (new projects) | Legacy (existing docs) |\n|--------|--------------------------|----------------------|\n| Knowledge location | All in `knowledge/` | Existing docs stay in place, `knowledge/` references them |\n| Content | Full concepts written directly | Summaries with `resource` links to source docs |\n| Curation | Creates new concepts from inbox + code | Also scans existing docs and creates reference concepts |\n| Agent onboarding | Read `knowledge/` only | Read `knowledge/` index, follow `resource` links to full docs |\n\n## Legacy Scan\n\nWhen initializing OKF on a legacy project, the install script detects `docs/` and advises running a legacy scan. The curation agent or `/okf-curate` command scans `docs/`, `docs/design/`, `docs/agents/`, and other documentation directories, creating a concept for each significant doc with the `resource` field pointing to the source. See [Seed From Existing Docs](../process/seed-from-existing-docs.md).\n\n## Conflict Resolution\n\nWhen docs and OKF disagree, OKF is current. OKF concepts are the agent-facing entry points; they are curated and maintained. The `docs/` files are detailed references that may be outdated. If a conflict is found, the OKF concept should be updated to reflect the current state, and the source doc should be flagged for review.\n\n## Alternatives Considered\n\n- **Full migration:** Move all docs into `knowledge/`. Rejected because of duplication risk and the loss of formatting/depth in existing docs.\n- **Ignore existing docs:** Create OKF concepts only from code and sessions. Rejected because it wastes existing knowledge and forces agents to rediscover documented decisions.\n- **Centralised knowledge store:** Maintain a separate knowledge repository. Rejected in favour of [per-project bundles](./per-project-bundles.md).\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"Legacy Alignment Mode","description":"Keep existing docs in place rather than migrating content into OKF; concepts reference docs via resource field","resource":"./templates/okf/OKF-STANDARD.md","tags":["okf","legacy","docs","alignment","migration"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Decision: Legacy Alignment Mode\n\n## Context\n\nMany projects have substantial existing documentation in `docs/`, `docs/design/`, `docs/agents/`, and other directories. When deploying OKF, a decision must be made: should existing docs be migrated into `knowledge/`, or should they remain in place?\n\n## Decision\n\nExisting documentation stays where it is. OKF works as a curated knowledge graph layer over existing documentation. OKF concept files in `knowledge/` reference existing docs via the `resource` field.\n\n## How It Works\n\n1. Existing docs stay where they are. They are not moved into `knowledge/`.\n2. OKF concept files in `knowledge/` reference existing docs via the `resource` field.\n3. Each concept provides a structured summary, tags, and type classification for the referenced doc.\n4. Agents read the OKF index to find relevant concepts, then follow the `resource` link to the full source doc.\n5. The OKF bundle acts as a navigable, typed, searchable index over the existing documentation.\n\n## Rationale\n\n- **Avoids duplication:** Moving docs into `knowledge/` would create two copies of the same content, requiring synchronisation.\n- **Preserves existing content:** Detailed docs often contain formatting, diagrams, and depth that would be lost in a migration.\n- **Provides typed searchable index:** OKF concepts add structure (type, tags, description) that makes existing docs discoverable by agents.\n- **Non-destructive:** The deployment can be done without touching existing docs, reducing risk.\n- **Progressive migration:** Teams can gradually create OKF concepts for new knowledge while referencing existing docs for old knowledge.\n\n## Concept Content for Referenced Docs\n\nA concept that references an existing doc should contain:\n- A summary of the doc's key content (not a copy, a synthesis)\n- The most important decisions, patterns, or rules from the doc\n- Tags that make it discoverable\n- The `resource` field pointing to the source doc path (relative to repo root)\n\n## Greenfield vs Legacy\n\n| Aspect | Greenfield (new projects) | Legacy (existing docs) |\n|--------|--------------------------|----------------------|\n| Knowledge location | All in `knowledge/` | Existing docs stay in place, `knowledge/` references them |\n| Content | Full concepts written directly | Summaries with `resource` links to source docs |\n| Curation | Creates new concepts from inbox + code | Also scans existing docs and creates reference concepts |\n| Agent onboarding | Read `knowledge/` only | Read `knowledge/` index, follow `resource` links to full docs |\n\n## Legacy Scan\n\nWhen initializing OKF on a legacy project, the install script detects `docs/` and advises running a legacy scan. The curation agent or `/okf-curate` command scans `docs/`, `docs/design/`, `docs/agents/`, and other documentation directories, creating a concept for each significant doc with the `resource` field pointing to the source. See [Seed From Existing Docs](../process/seed-from-existing-docs.md).\n\n## Conflict Resolution\n\nWhen docs and OKF disagree, OKF is current. OKF concepts are the agent-facing entry points; they are curated and maintained. The `docs/` files are detailed references that may be outdated. If a conflict is found, the OKF concept should be updated to reflect the current state, and the source doc should be flagged for review.\n\n## Alternatives Considered\n\n- **Full migration:** Move all docs into `knowledge/`. Rejected because of duplication risk and the loss of formatting/depth in existing docs.\n- **Ignore existing docs:** Create OKF concepts only from code and sessions. Rejected because it wastes existing knowledge and forces agents to rediscover documented decisions.\n- **Centralised knowledge store:** Maintain a separate knowledge repository. Rejected in favour of [per-project bundles](./per-project-bundles.md).\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/okf-first-protocol.md","content":"---\ntype: Decision\ntitle: OKF-First Protocol\ndescription: Knowledge bundle is the first source of truth; query before investigating, check decisions and deprecation before planning, cite concepts instead of re-deriving\nresource: ./templates/okf/AGENTS-OKF-SECTION.md\ntags: [okf, okf-first, protocol, decisions, deprecation, agents-md, onboarding, memory]\ntimestamp: 2026-07-05T13:00:00Z\nstatus: active\n---\n\n# Decision: OKF-First Protocol\n\n## Context\n\nWithout an explicit consumption protocol, agents routinely investigated the codebase before checking the knowledge bundle, re-derived answers that were already documented in `decisions/` or `deprecation/`, and failed to record rejected approaches. This led to:\n\n- **Repeated work:** Agents re-derived architectural decisions that were already captured.\n- **Re-introduced rejected patterns:** Agents proposed approaches that had been tried and abandoned, because they did not check `deprecation/` first.\n- **Lost lessons:** Rejected approaches evaluated during a session were not recorded, so the reasoning was lost when the session ended.\n- **Stale concept reliance:** Agents trusted concepts without verifying freshness against the codebase.\n\n## Decision\n\nEstablish an OKF-First Protocol in agent onboarding (AGENTS.md, AGENTS-OKF-SECTION.md, OKF-STANDARD.md, and the OKF skill) with four rules:\n\n1. **Query before investigating:** Before investigating the codebase, query the knowledge bundle for the topic (use `knowledge/okf-query.sh` when installed, or grep `knowledge/` directly).\n2. **Check decisions and deprecation before planning:** Before proposing a plan, check `decisions/` and `deprecation/` for paths already taken or rejected. Cite the concept instead of re-deriving the answer.\n3. **Verify freshness:** If a concept looks stale (old timestamp, `resource` file changed since), verify against code before relying on it and note the staleness in the session synthesis.\n4. **Record rejected approaches:** When an approach is evaluated and rejected during a session, record the rejection and reason in the inbox synthesis so curation can turn it into a decision or deprecation lesson.\n\n## Rationale\n\n- **Knowledge is only useful if it is consumed first.** A knowledge bundle that agents read after investigating the codebase provides no time savings and no protection against re-introducing rejected patterns.\n- **Rejected approaches are first-class knowledge.** Knowing what NOT to do is as valuable as knowing what to do. Recording rejections ensures curation captures them as decision or deprecation concepts.\n- **Citation over re-derivation:** Citing an existing concept is faster and more reliable than re-deriving the reasoning from scratch. It also keeps the knowledge graph connected.\n- **Freshness verification prevents stale reliance:** Concepts can drift from code reality. The protocol's freshness check ensures agents do not trust outdated information without verification.\n\n## What Was Done\n\n- Added the OKF-First Protocol to `AGENTS-OKF-SECTION.md`, the designs `AGENTS.md`, `OKF-STANDARD.md` onboarding section, and the OKF skill.\n- Created `templates/okf/okf-query.sh`, a portable grep-based concept search (frontmatter-ranked, with a `--decisions` scope for prior/rejected paths), installed to `knowledge/okf-query.sh` by the installer. See [OKF Query Helper](../architecture/okf-query-helper.md).\n- The OKF skill was fixed (frontmatter added) so it can actually trigger in CLI harnesses. See [Workflow Skill Canonicalisation](./skill-canonicalisation.md).\n\n## Alternatives Considered\n\n- **Mandatory pre-work bundle reading (read everything):** Rejected because it is too token-expensive and violates progressive disclosure. The protocol specifies targeted queries, not bulk reading.\n- **Automated staleness checks in the hook:** Rejected because staleness detection requires comparing concept timestamps to file modification times, which is too heavy for a post-commit hook. The protocol makes this an agent responsibility at consumption time.\n- **Scheduled curation only (no consumption protocol):** Rejected because curation produces knowledge, but the protocol ensures it is consumed. Both are needed.\n\n## Related Concepts\n\n- [OKF Query Helper](../architecture/okf-query-helper.md) - The portable search tool for querying the bundle\n- [Curation Pass](../process/curation-pass.md) - The bounded audit and validation workflow that catches contradictions the protocol relies on\n- [Curation Pass](../process/curation-pass.md) - The curation workflow that processes inbox items into concepts\n- [OKF Inbox Format](../domain/inbox-format.md) - Where rejected approaches are recorded before curation\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"OKF-First Protocol","description":"Knowledge bundle is the first source of truth; query before investigating, check decisions and deprecation before planning, cite concepts instead of re-deriving","resource":"./templates/okf/AGENTS-OKF-SECTION.md","tags":["okf","okf-first","protocol","decisions","deprecation","agents-md","onboarding","memory"],"timestamp":"2026-07-05T13:00:00Z","status":"active"},"body":"\n# Decision: OKF-First Protocol\n\n## Context\n\nWithout an explicit consumption protocol, agents routinely investigated the codebase before checking the knowledge bundle, re-derived answers that were already documented in `decisions/` or `deprecation/`, and failed to record rejected approaches. This led to:\n\n- **Repeated work:** Agents re-derived architectural decisions that were already captured.\n- **Re-introduced rejected patterns:** Agents proposed approaches that had been tried and abandoned, because they did not check `deprecation/` first.\n- **Lost lessons:** Rejected approaches evaluated during a session were not recorded, so the reasoning was lost when the session ended.\n- **Stale concept reliance:** Agents trusted concepts without verifying freshness against the codebase.\n\n## Decision\n\nEstablish an OKF-First Protocol in agent onboarding (AGENTS.md, AGENTS-OKF-SECTION.md, OKF-STANDARD.md, and the OKF skill) with four rules:\n\n1. **Query before investigating:** Before investigating the codebase, query the knowledge bundle for the topic (use `knowledge/okf-query.sh` when installed, or grep `knowledge/` directly).\n2. **Check decisions and deprecation before planning:** Before proposing a plan, check `decisions/` and `deprecation/` for paths already taken or rejected. Cite the concept instead of re-deriving the answer.\n3. **Verify freshness:** If a concept looks stale (old timestamp, `resource` file changed since), verify against code before relying on it and note the staleness in the session synthesis.\n4. **Record rejected approaches:** When an approach is evaluated and rejected during a session, record the rejection and reason in the inbox synthesis so curation can turn it into a decision or deprecation lesson.\n\n## Rationale\n\n- **Knowledge is only useful if it is consumed first.** A knowledge bundle that agents read after investigating the codebase provides no time savings and no protection against re-introducing rejected patterns.\n- **Rejected approaches are first-class knowledge.** Knowing what NOT to do is as valuable as knowing what to do. Recording rejections ensures curation captures them as decision or deprecation concepts.\n- **Citation over re-derivation:** Citing an existing concept is faster and more reliable than re-deriving the reasoning from scratch. It also keeps the knowledge graph connected.\n- **Freshness verification prevents stale reliance:** Concepts can drift from code reality. The protocol's freshness check ensures agents do not trust outdated information without verification.\n\n## What Was Done\n\n- Added the OKF-First Protocol to `AGENTS-OKF-SECTION.md`, the designs `AGENTS.md`, `OKF-STANDARD.md` onboarding section, and the OKF skill.\n- Created `templates/okf/okf-query.sh`, a portable grep-based concept search (frontmatter-ranked, with a `--decisions` scope for prior/rejected paths), installed to `knowledge/okf-query.sh` by the installer. See [OKF Query Helper](../architecture/okf-query-helper.md).\n- The OKF skill was fixed (frontmatter added) so it can actually trigger in CLI harnesses. See [Workflow Skill Canonicalisation](./skill-canonicalisation.md).\n\n## Alternatives Considered\n\n- **Mandatory pre-work bundle reading (read everything):** Rejected because it is too token-expensive and violates progressive disclosure. The protocol specifies targeted queries, not bulk reading.\n- **Automated staleness checks in the hook:** Rejected because staleness detection requires comparing concept timestamps to file modification times, which is too heavy for a post-commit hook. The protocol makes this an agent responsibility at consumption time.\n- **Scheduled curation only (no consumption protocol):** Rejected because curation produces knowledge, but the protocol ensures it is consumed. Both are needed.\n\n## Related Concepts\n\n- [OKF Query Helper](../architecture/okf-query-helper.md) - The portable search tool for querying the bundle\n- [Curation Pass](../process/curation-pass.md) - The bounded audit and validation workflow that catches contradictions the protocol relies on\n- [Curation Pass](../process/curation-pass.md) - The curation workflow that processes inbox items into concepts\n- [OKF Inbox Format](../domain/inbox-format.md) - Where rejected approaches are recorded before curation\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/okf-parser-runtime-distribution.md","content":"---\ntype: Decision\ntitle: OKF Parser Runtime Distribution\ndescription: Operator-approved local parser-runtime packaging to unblock installed C8 and C9 consumers\ntags: [okf, parser, distribution, viewer, query, curation-safety]\ntimestamp: 2026-08-06T05:36:06Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\ndecision_status: operator-approved-distribution-addendum-2026-08-06\nresource: ./templates/okf/package.json\n---\n\n# Decision Status and Scope\n\nThe operator approved parser-runtime packaging on 2026-08-06 to unblock the\ninstalled C8 viewer and C9 query consumers. This addendum extends only their\nlocal distribution seam; Markdown/YAML and Git remain canonical. C3 remains\nseparately bounded by the A3/A4/A5 capture and execution controls.\n\n# Constraints\n\n- The packaged parser runtime must be pinned, repository-local, deterministic,\n  and usable without network access at use time.\n- It must not run `npm install`, fetch a dependency, inspect a parent/home\n  directory, invoke a hook or curator, schedule work, or mutate a knowledge\n  bundle merely by being installed or loaded.\n- It may use `yaml@2.8.3` only through a reviewed local distribution design.\n  The operator approved one focused runtime lockfile refresh and reviewed local\n  vendoring of that exact artifact on 2026-08-06. Any later dependency change,\n  lockfile refresh, or package addition remains a separate approval.\n- JSON-LD, RDF, SHACL, remote contexts, graph services, namespace export,\n  curation runs, canaries, archive/deletion, cross-project rollout, and\n  `AGENTS.md` changes remain outside this approval.\n\n# Outcome\n\nThe runtime package is now recorded under `templates/okf/runtime/` with its\nlockfile, integrity metadata, and fixture proof. C8, C9, and the approved A5/D1 status\ncontract may consume it through a narrowly reviewed local path. A deployed\nconsumer must fail closed or retain legacy read-only behavior when its packaged\nparser runtime is unavailable; it must not silently substitute an ad-hoc parser\nor acquire dependencies at runtime.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"OKF Parser Runtime Distribution","description":"Operator-approved local parser-runtime packaging to unblock installed C8 and C9 consumers","tags":["okf","parser","distribution","viewer","query","curation-safety"],"timestamp":"2026-08-06T05:36:06Z","status":"active","issue_refs":[26],"epic_refs":[26],"decision_status":"operator-approved-distribution-addendum-2026-08-06","resource":"./templates/okf/package.json"},"body":"\n# Decision Status and Scope\n\nThe operator approved parser-runtime packaging on 2026-08-06 to unblock the\ninstalled C8 viewer and C9 query consumers. This addendum extends only their\nlocal distribution seam; Markdown/YAML and Git remain canonical. C3 remains\nseparately bounded by the A3/A4/A5 capture and execution controls.\n\n# Constraints\n\n- The packaged parser runtime must be pinned, repository-local, deterministic,\n  and usable without network access at use time.\n- It must not run `npm install`, fetch a dependency, inspect a parent/home\n  directory, invoke a hook or curator, schedule work, or mutate a knowledge\n  bundle merely by being installed or loaded.\n- It may use `yaml@2.8.3` only through a reviewed local distribution design.\n  The operator approved one focused runtime lockfile refresh and reviewed local\n  vendoring of that exact artifact on 2026-08-06. Any later dependency change,\n  lockfile refresh, or package addition remains a separate approval.\n- JSON-LD, RDF, SHACL, remote contexts, graph services, namespace export,\n  curation runs, canaries, archive/deletion, cross-project rollout, and\n  `AGENTS.md` changes remain outside this approval.\n\n# Outcome\n\nThe runtime package is now recorded under `templates/okf/runtime/` with its\nlockfile, integrity metadata, and fixture proof. C8, C9, and the approved A5/D1 status\ncontract may consume it through a narrowly reviewed local path. A deployed\nconsumer must fail closed or retain legacy read-only behavior when its packaged\nparser runtime is unavailable; it must not silently substitute an ad-hoc parser\nor acquire dependencies at runtime.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"decisions/per-project-bundles.md","content":"---\ntype: Decision\ntitle: Per-Project Knowledge Bundles\ndescription: Each project maintains its own knowledge/ directory in git rather than a centralised store\nresource: ./templates/okf/OKF-STANDARD.md\ntags: [okf, architecture, bundling, git, per-project]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Decision: Per-Project Knowledge Bundles\n\n## Context\n\nWhen designing OKF, a decision must be made about where knowledge is stored. Should each project have its own `knowledge/` directory, or should there be a centralised knowledge store that aggregates knowledge from multiple projects?\n\n## Decision\n\nEach project maintains its own `knowledge/` directory stored in git alongside the project's code. There is no centralised knowledge store.\n\n## Rationale\n\n- **Knowledge is project-specific:** Architecture decisions, domain logic, and component behaviour are unique to each project. A centralised store would mix unrelated knowledge and require complex filtering.\n- **Git is canonical:** OKF's first design principle is \"Git is canonical.\" Storing knowledge in the project repo ensures it is versioned alongside the code it describes. Changes to knowledge are reviewed in the same PRs as changes to code.\n- **Co-location with code ensures relevance:** When knowledge lives next to the code, developers and agents naturally encounter it. A separate store would be forgotten or fall out of sync.\n- **Simplicity:** No infrastructure is needed. No database, no server, no API. Just markdown files in a directory.\n- **Access control follows repo permissions:** If a developer has access to the repo, they have access to the knowledge. No separate access management needed.\n- **Branching and merging:** Knowledge can be branched and merged alongside code. Feature branches can include knowledge updates that are reviewed before merging.\n\n## How It Works\n\nEach project repo gets a `knowledge/` directory created by `install-okf.sh`. The directory contains:\n- `index.md` - root index with concept group counts\n- `log.md` - chronological update history\n- `inbox/` - staging area for commit-time captures\n- `architecture/`, `components/`, `domain/`, `decisions/`, `process/`, `deprecation/`, `state/` - concept directories\n\nThe entire `knowledge/` directory is committed to git. Agents read it before starting work and write to it after completing work. See [OKF Standard Spec](../architecture/okf-standard-spec.md).\n\n## Cross-Project Knowledge\n\nOKF does not provide a built-in mechanism for sharing knowledge across projects. If a team wants to share patterns or decisions across projects, they can:\n- Create a shared \"patterns\" repo with its own OKF bundle.\n- Reference external OKF bundles via URLs in concept `resource` fields.\n- Copy relevant concepts between project bundles manually.\n\nThis is a deliberate non-feature: cross-project knowledge sharing adds complexity and is better handled by the team's existing documentation practices.\n\n## Alternatives Considered\n\n- **Centralised knowledge store:** A single database or repository aggregating knowledge from all projects. Rejected because knowledge is project-specific, git is canonical, and centralisation adds infrastructure and access management complexity.\n- **Wiki or external system:** Use a wiki (e.g., Confluence, Notion) for project knowledge. Rejected because it violates the \"git is canonical\" principle and creates a dependency on external infrastructure.\n- **Per-team knowledge store:** One knowledge bundle per team, shared across the team's projects. Rejected because projects within a team may have different architectures and domain logic, leading to the same mixing problem as a centralised store.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Decision","title":"Per-Project Knowledge Bundles","description":"Each project maintains its own knowledge/ directory in git rather than a centralised store","resource":"./templates/okf/OKF-STANDARD.md","tags":["okf","architecture","bundling","git","per-project"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Decision: Per-Project Knowledge Bundles\n\n## Context\n\nWhen designing OKF, a decision must be made about where knowledge is stored. Should each project have its own `knowledge/` directory, or should there be a centralised knowledge store that aggregates knowledge from multiple projects?\n\n## Decision\n\nEach project maintains its own `knowledge/` directory stored in git alongside the project's code. There is no centralised knowledge store.\n\n## Rationale\n\n- **Knowledge is project-specific:** Architecture decisions, domain logic, and component behaviour are unique to each project. A centralised
