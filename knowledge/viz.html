> ~/.codex/skills, ~/.claude/skills, ~/.agents/skills, ~/.pi/agent/skills (installed roots)\n```\n\n- **Layer 1 (designs):** Reusable skills and workflow documents mapped by the sync script are authored here.\n- **Layer 2 (agent-skill-distro):** The distro receives mapped content and owns all distribution-native policy, runtime overlays, quarantine manifests, strict auditing, and CI. The OKF skill goes into `shared/skills/okf` with per-target symlinks.\n- **Layer 3 (installed CLI roots):** The live skill directories that CLI harnesses (Claude, Codex, Pi, etc.) read from. These are managed by the distro's rsync and should never be edited directly.\n\n## Usage\n\n```bash\n# Check for drift between designs, distro, and pi-extensions source\nscripts/sync-skill-distro.sh --check\n\n# Apply sync (copies designs skills to distro and pi-extensions source)\nscripts/sync-skill-distro.sh --apply\n```\n\nAfter running `--apply`, run the distro's `update-skills` refresh to propagate to installed CLI roots.\n\nBefore applying, review the reported destinations. The sync is not authority to overwrite unrelated distro-native changes or a dirty target file without reconciliation.\n\n## What the Script Syncs\n\n- Project skills from `templates/instructional-documents/skills/` to the distro.\n- The OKF skill to `shared/skills/okf` in the distro and to the managed `workspace-projects/pi-extensions/skills/okf` source.\n- Only the OKF skill package is distributed to harness skill roots. The curator\n  contract remains canonical in `templates/okf/agents/okf-curator.md`, is staged\n  per repository at `.okf/agents/okf-curator.md` by the OKF installer, and is\n  integrated with a harness only through a separate governed,\n  operator-approved action.\n\n## Drift Detection\n\n`--check` mode compares the designs source against the distro and pi-extensions copies. If everything matches, it reports \"In sync\". If there is drift, it reports which files differ so they can be synced with `--apply`.\n\n## Distro Validation\n\nAfter reconciling mapped content in the distro, run:\n\n```bash\npython3 scripts/audit-skills.py --strict\npython3 -m unittest scripts.tests.test_audit_skills -v\nbash scripts/update-skills.sh\n```\n\nThe strict audit covers metadata, descriptions, runtime-local duplicate names, broken or untracked links, untracked active skills, quarantine enforcement, size and package-shape rules, and blocked machine-local plugins. Hosted CI runs the same repository checks with `--skip-codex-config` because it cannot inspect local plugin state.\n\n## Guard: rsync --delete\n\nThe distro's rsync uses `--delete` on managed roots, which means direct edits to live copies (e.g., editing `~/.codex/skills/vibe-fix/SKILL.md` directly) are silently reverted on the next refresh. Always edit in the designs source and sync, never in the live root.\n\nFor distro-native audit policy, runtime adapters, quarantine records, or CI, edit `agent-skill-distro` directly rather than creating a duplicate designs copy.\n\n## Related Concepts\n\n- [Workflow Skill Canonicalisation](../decisions/skill-canonicalisation.md) - The decision establishing designs as canonical source\n- [OKF System Current State](../state/current-state.md) - Current deployment status\n- [Install Session Workflows](./install-session-workflows.md) - Related installer for session workflow assets\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Skill Distribution Sync","description":"Ownership-aware workflow for syncing mapped designs assets into agent-skill-distro and validating distro policy before refreshing installed roots","resource":"./scripts/sync-skill-distro.sh","tags":["skills","distribution","sync","agent-skill-distro","cli-roots","canonical","workflow"],"timestamp":"2026-08-08T06:38:00Z","status":"active"},"body":"\n# Skill Distribution Sync\n\nThe designs repo is the canonical source for reusable workflow assets explicitly mapped by `scripts/sync-skill-distro.sh`. The `agent-skill-distro` repo owns distribution policy, runtime adapters, deterministic auditing, quarantine, and CI before refreshing installed roots. See [Workflow Skill Canonicalisation](../decisions/skill-canonicalisation.md) and `templates/instructional-documents/skill-governance.md`.\n\n## Three-Layer Model\n\n```\ndesigns (source of truth)\n  -> agent-skill-distro (distribution layer)\n    -> ~/.codex/skills, ~/.claude/skills, ~/.agents/skills, ~/.pi/agent/skills (installed roots)\n```\n\n- **Layer 1 (designs):** Reusable skills and workflow documents mapped by the sync script are authored here.\n- **Layer 2 (agent-skill-distro):** The distro receives mapped content and owns all distribution-native policy, runtime overlays, quarantine manifests, strict auditing, and CI. The OKF skill goes into `shared/skills/okf` with per-target symlinks.\n- **Layer 3 (installed CLI roots):** The live skill directories that CLI harnesses (Claude, Codex, Pi, etc.) read from. These are managed by the distro's rsync and should never be edited directly.\n\n## Usage\n\n```bash\n# Check for drift between designs, distro, and pi-extensions source\nscripts/sync-skill-distro.sh --check\n\n# Apply sync (copies designs skills to distro and pi-extensions source)\nscripts/sync-skill-distro.sh --apply\n```\n\nAfter running `--apply`, run the distro's `update-skills` refresh to propagate to installed CLI roots.\n\nBefore applying, review the reported destinations. The sync is not authority to overwrite unrelated distro-native changes or a dirty target file without reconciliation.\n\n## What the Script Syncs\n\n- Project skills from `templates/instructional-documents/skills/` to the distro.\n- The OKF skill to `shared/skills/okf` in the distro and to the managed `workspace-projects/pi-extensions/skills/okf` source.\n- Only the OKF skill package is distributed to harness skill roots. The curator\n  contract remains canonical in `templates/okf/agents/okf-curator.md`, is staged\n  per repository at `.okf/agents/okf-curator.md` by the OKF installer, and is\n  integrated with a harness only through a separate governed,\n  operator-approved action.\n\n## Drift Detection\n\n`--check` mode compares the designs source against the distro and pi-extensions copies. If everything matches, it reports \"In sync\". If there is drift, it reports which files differ so they can be synced with `--apply`.\n\n## Distro Validation\n\nAfter reconciling mapped content in the distro, run:\n\n```bash\npython3 scripts/audit-skills.py --strict\npython3 -m unittest scripts.tests.test_audit_skills -v\nbash scripts/update-skills.sh\n```\n\nThe strict audit covers metadata, descriptions, runtime-local duplicate names, broken or untracked links, untracked active skills, quarantine enforcement, size and package-shape rules, and blocked machine-local plugins. Hosted CI runs the same repository checks with `--skip-codex-config` because it cannot inspect local plugin state.\n\n## Guard: rsync --delete\n\nThe distro's rsync uses `--delete` on managed roots, which means direct edits to live copies (e.g., editing `~/.codex/skills/vibe-fix/SKILL.md` directly) are silently reverted on the next refresh. Always edit in the designs source and sync, never in the live root.\n\nFor distro-native audit policy, runtime adapters, quarantine records, or CI, edit `agent-skill-distro` directly rather than creating a duplicate designs copy.\n\n## Related Concepts\n\n- [Workflow Skill Canonicalisation](../decisions/skill-canonicalisation.md) - The decision establishing designs as canonical source\n- [OKF System Current State](../state/current-state.md) - Current deployment status\n- [Install Session Workflows](./install-session-workflows.md) - Related installer for session workflow assets\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/stripe-payment-integration.md","content":"---\ntype: Process\ntitle: Stripe Payment Integration\ndescription: Stripe payment gateway setup with Payment Intents, Checkout Sessions, webhooks, and Convex-specific integration lessons\nresource: ./templates/instructional-documents/stripe-payment-gateway.md\ntags: [designs, stripe, payments, webhooks, convex, integration, checkout]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# Stripe Payment Integration\n\n## Overview\n\nGuide for integrating Stripe as a payment gateway with support for credit cards, digital wallets, and subscription management.\n\n## Initial Setup\n\n1. Create Stripe account and get API keys (publishable `pk_` and secret `sk_`)\n2. Install: `npm install stripe @stripe/stripe-js`\n3. Use test keys during development, live keys only in production\n\n## Integration Options\n\n### Payment Intents API (Recommended)\n- Modern API handling complex payment flows including authentication\n- Server creates PaymentIntent, returns `client_secret` to frontend\n- Frontend uses `@stripe/react-stripe-js` to collect payment\n\n### Checkout Sessions (Hosted)\n- Pre-built hosted payment page, faster to implement\n- Server creates session with line items, returns URL\n- Redirect user to Stripe-hosted checkout\n\n## Webhook Handler (Critical for Production)\n\nWebhooks notify server about payment events. Must verify signature:\n- `payment_intent.succeeded`, `payment_intent.payment_failed`\n- `checkout.session.completed`\n\n## Convex Integration Lessons\n\n### Use `constructEventAsync` NOT `constructEvent`\n\nConvex uses SubtleCrypto which only supports async operations. Using the sync version fails with \"SubtleCryptoProvider cannot be used in synchronous context\".\n\n### Self-Hosted Convex Webhook Setup\n\n- HTTP routes on different port (3211 vs 3210 for functions)\n- Use Stripe CLI for local testing: `stripe listen --forward-to http://localhost:3211/stripe-webhook`\n- Set webhook secret without trailing whitespace\n\n### Payment Method Types\n\nStripe Checkout may create `card` or `link` payment method types. Handle both:\n- Card: has brand, last4, exp_month, exp_year\n- Link: accelerated checkout, no card details\n\n### Payment Methods May Not Be Listed on Customer\n\nAfter checkout, payment method might be on customer OR only on subscription's `default_payment_method`. Always check both locations.\n\n### Stripe SDK Property Names\n\nThe Stripe Node SDK uses **snake_case** for properties regardless of API version:\n- `subscription.current_period_start` (correct)\n- `subscription.currentPeriodStart` (TypeScript error)\n\n### Checkout Session Metadata\n\nPass custom data through checkout using `metadata` on both session and `subscription_data`. Access in webhook via `session.metadata?.organisationId`.\n\n### Convex HTTP Action Structure\n\nWebhook handler defined in `convex/http.ts` using `httpAction` and `httpRouter`. Runs on Convex backend infrastructure, not Vercel.\n\n## Summary Checklist\n\n- Use correct API version matching SDK types\n- Use `constructEventAsync` for webhook verification\n- Handle multiple payment method types (card, link)\n- Check both customer and subscription for payment methods\n- Use snake_case for Stripe SDK properties\n- Pass metadata through checkout for webhook access\n- Use HTTP port 3211 for local Convex webhooks\n\n## Related Concepts\n\n- [Convex Self-Hosted Setup](./convex-self-hosted.md)\n- [WorkOS Auth Integration](./workos-auth-integration.md)\n- [Deployment Guide](./deployment-guide.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Stripe Payment Integration","description":"Stripe payment gateway setup with Payment Intents, Checkout Sessions, webhooks, and Convex-specific integration lessons","resource":"./templates/instructional-documents/stripe-payment-gateway.md","tags":["designs","stripe","payments","webhooks","convex","integration","checkout"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# Stripe Payment Integration\n\n## Overview\n\nGuide for integrating Stripe as a payment gateway with support for credit cards, digital wallets, and subscription management.\n\n## Initial Setup\n\n1. Create Stripe account and get API keys (publishable `pk_` and secret `sk_`)\n2. Install: `npm install stripe @stripe/stripe-js`\n3. Use test keys during development, live keys only in production\n\n## Integration Options\n\n### Payment Intents API (Recommended)\n- Modern API handling complex payment flows including authentication\n- Server creates PaymentIntent, returns `client_secret` to frontend\n- Frontend uses `@stripe/react-stripe-js` to collect payment\n\n### Checkout Sessions (Hosted)\n- Pre-built hosted payment page, faster to implement\n- Server creates session with line items, returns URL\n- Redirect user to Stripe-hosted checkout\n\n## Webhook Handler (Critical for Production)\n\nWebhooks notify server about payment events. Must verify signature:\n- `payment_intent.succeeded`, `payment_intent.payment_failed`\n- `checkout.session.completed`\n\n## Convex Integration Lessons\n\n### Use `constructEventAsync` NOT `constructEvent`\n\nConvex uses SubtleCrypto which only supports async operations. Using the sync version fails with \"SubtleCryptoProvider cannot be used in synchronous context\".\n\n### Self-Hosted Convex Webhook Setup\n\n- HTTP routes on different port (3211 vs 3210 for functions)\n- Use Stripe CLI for local testing: `stripe listen --forward-to http://localhost:3211/stripe-webhook`\n- Set webhook secret without trailing whitespace\n\n### Payment Method Types\n\nStripe Checkout may create `card` or `link` payment method types. Handle both:\n- Card: has brand, last4, exp_month, exp_year\n- Link: accelerated checkout, no card details\n\n### Payment Methods May Not Be Listed on Customer\n\nAfter checkout, payment method might be on customer OR only on subscription's `default_payment_method`. Always check both locations.\n\n### Stripe SDK Property Names\n\nThe Stripe Node SDK uses **snake_case** for properties regardless of API version:\n- `subscription.current_period_start` (correct)\n- `subscription.currentPeriodStart` (TypeScript error)\n\n### Checkout Session Metadata\n\nPass custom data through checkout using `metadata` on both session and `subscription_data`. Access in webhook via `session.metadata?.organisationId`.\n\n### Convex HTTP Action Structure\n\nWebhook handler defined in `convex/http.ts` using `httpAction` and `httpRouter`. Runs on Convex backend infrastructure, not Vercel.\n\n## Summary Checklist\n\n- Use correct API version matching SDK types\n- Use `constructEventAsync` for webhook verification\n- Handle multiple payment method types (card, link)\n- Check both customer and subscription for payment methods\n- Use snake_case for Stripe SDK properties\n- Pass metadata through checkout for webhook access\n- Use HTTP port 3211 for local Convex webhooks\n\n## Related Concepts\n\n- [Convex Self-Hosted Setup](./convex-self-hosted.md)\n- [WorkOS Auth Integration](./workos-auth-integration.md)\n- [Deployment Guide](./deployment-guide.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/two-tier-inbox-cadence.md","content":"---\ntype: Process\ntitle: Two-Tier Inbox Capture Cadence\ndescription: Complementary quality-guarded commit and session captures with explicit manual status and bounded curation\nresource: ./templates/okf/OKF-STANDARD.md\ntags: [okf, inbox, capture-tier, post-commit, session-synthesis, curation]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [28]\nepic_refs: [26]\n---\n\n# Purpose\n\nOKF records development context in two complementary inbox tiers. The tiers\nseparate commit-local rationale from session-level decisions so the inbox has\nuseful provenance without duplicating Git history or repeating summaries.\n\n# Tier 1: Commit Capture\n\nThe repository post-commit hook writes one `capture_tier: commit` item for each\nordinary commit. It extracts why/how and `Impact:` from the commit body, plus\ncommit SHA, branch, and issue references. Git remains authoritative for changed\nfiles. Commits with only a subject are retained with explicit missing-rationale\nor missing-impact markers. Tags and dynamic fields are normalized safely;\noversized, raw-dump, malformed, or repeated low-signal content is compacted to\na Git reference unless an operator explicitly retains reviewed content.\n\n# Tier 2: Session Synthesis\n\nAt session close, `end-session` writes one `capture_tier: session` item after\nthe session's work is committed. It references the session commit SHAs and\ncontains only Decisions Made, What Was Deprecated, Lessons Learned, and Current\nState. It does not repeat Tier 1 captures or include a completion-summary\nsection.\n\nTier 1 and the distributed `end-session` Tier 2 workflow are both implemented.\n\n# Curation Cadence Boundary\n\nCuration is an explicit, repository-scoped operator action. The\nformer five-item post-commit nudge was removed because per-commit capture would\nmake it continuously noisy. No scheduler, cron/launchd entry, hook launch,\nqueue, polling, Factory/child session, automatic retry, or cross-project rollout\nis part of the approved cadence. An operator may request read-only status or\ntriage, then separately request one exact-root, locked, quota-bounded,\nvalidated, resumable batch.\n\n# Related Sources\n\n- `templates/okf/OKF-STANDARD.md` defines both item formats.\n- `templates/okf/post-commit.sh` implements Tier 1 capture.\n- `templates/instructional-documents/skills/okf/SKILL.md` gives agent-facing\n  capture guidance.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Two-Tier Inbox Capture Cadence","description":"Complementary quality-guarded commit and session captures with explicit manual status and bounded curation","resource":"./templates/okf/OKF-STANDARD.md","tags":["okf","inbox","capture-tier","post-commit","session-synthesis","curation"],"timestamp":"2026-08-08T00:00:00Z","status":"active","issue_refs":[28],"epic_refs":[26]},"body":"\n# Purpose\n\nOKF records development context in two complementary inbox tiers. The tiers\nseparate commit-local rationale from session-level decisions so the inbox has\nuseful provenance without duplicating Git history or repeating summaries.\n\n# Tier 1: Commit Capture\n\nThe repository post-commit hook writes one `capture_tier: commit` item for each\nordinary commit. It extracts why/how and `Impact:` from the commit body, plus\ncommit SHA, branch, and issue references. Git remains authoritative for changed\nfiles. Commits with only a subject are retained with explicit missing-rationale\nor missing-impact markers. Tags and dynamic fields are normalized safely;\noversized, raw-dump, malformed, or repeated low-signal content is compacted to\na Git reference unless an operator explicitly retains reviewed content.\n\n# Tier 2: Session Synthesis\n\nAt session close, `end-session` writes one `capture_tier: session` item after\nthe session's work is committed. It references the session commit SHAs and\ncontains only Decisions Made, What Was Deprecated, Lessons Learned, and Current\nState. It does not repeat Tier 1 captures or include a completion-summary\nsection.\n\nTier 1 and the distributed `end-session` Tier 2 workflow are both implemented.\n\n# Curation Cadence Boundary\n\nCuration is an explicit, repository-scoped operator action. The\nformer five-item post-commit nudge was removed because per-commit capture would\nmake it continuously noisy. No scheduler, cron/launchd entry, hook launch,\nqueue, polling, Factory/child session, automatic retry, or cross-project rollout\nis part of the approved cadence. An operator may request read-only status or\ntriage, then separately request one exact-root, locked, quota-bounded,\nvalidated, resumable batch.\n\n# Related Sources\n\n- `templates/okf/OKF-STANDARD.md` defines both item formats.\n- `templates/okf/post-commit.sh` implements Tier 1 capture.\n- `templates/instructional-documents/skills/okf/SKILL.md` gives agent-facing\n  capture guidance.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/verify-deployment.md","content":"---\ntype: Process\ntitle: Verify OKF Deployment\ndescription: Combined profile, capture, semantic-tooling, curator, archive, cadence, installer, and canary verification\nresource: ./templates/okf/DEPLOYMENT-RUNBOOK.md\ntags: [okf, verification, deployment, canary, recovery]\ntimestamp: 2026-08-08T00:00:00Z\nstatus: active\nissue_refs: [26]\nepic_refs: [26]\nassertion_state: proposed\ngenerated_at: 2026-08-08T00:00:00Z\ngenerated_by: epic-26-implementation\nsource_authority: repository-contract\nevidence_refs: [templates/okf/package.json, templates/okf/DEPLOYMENT-RUNBOOK.md]\n---\n\n# Static install verification\n\nResolve the exact Git root and active hook, verify any chained predecessor,\ncompare installed artifacts and executable modes to the canonical template,\nconfirm parser/runtime/schema hashes and preserved controls, and prove no\nparent-workspace call, runtime fetch, scheduler, service, Factory task, or\nbackground artifact exists. Portable search must work without `.okf`; semantic\ncommands must fail closed when their local runtime is unavailable.\n\n# Combined contract suite\n\nRun the canonical aggregate suite serially. It covers schema and generated\nvalidator parity, parser, linter, capture quality/override, inbox status and\ntriage, bounded run safety, curator preflight/staging/postflight/failure/resume,\ntyped viewer, semantic query plus portable fallback, reversible archive and\nrollback, manual cadence observation, runtime packaging, and fresh/reinstall\ninstaller behavior.\n\nFailure scenarios include unsafe roots/symlinks, malformed YAML, duplicate IDs\nand tags, unresolved relationships, raw/oversized capture bodies, live/stale\nlocks, kill switch, quotas, cancellation, changed resume inputs, invalid staged\noutput, postflight failure, archive partial states, and parser-unavailable\nfallback. Reports and warnings must not copy raw secret-bearing input.\n\n# Operational canaries\n\nUse frozen tracked snapshots for small `designs`, medium active-project, and\nbounded large-backlog datasets. Record exact source revisions and hashes,\ndeclared ceilings, source preservation, strict validation, retrieval,\nusefulness/yield, runtime/CPU/disk/generated bytes, one session/concurrent run,\nfailure recovery, operator intervention, and live-root non-mutation. D7 then\nevaluates the hashed reports over a defined manual observation window. No\nsuccessful snapshot authorizes a live mutation or broader rollout.\n\n# Completion boundary\n\nDeployment is complete only when the aggregate suite, installer fixture,\noperational canaries, cadence observation, Git diff checks, and contract audit\nare green. Broader adoption is a separate explicit approve/revise/stop decision;\nno hosted deployment is implied.\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Verify OKF Deployment","description":"Combined profile, capture, semantic-tooling, curator, archive, cadence, installer, and canary verification","resource":"./templates/okf/DEPLOYMENT-RUNBOOK.md","tags":["okf","verification","deployment","canary","recovery"],"timestamp":"2026-08-08T00:00:00Z","status":"active","issue_refs":[26],"epic_refs":[26],"assertion_state":"proposed","generated_at":"2026-08-08T00:00:00Z","generated_by":"epic-26-implementation","source_authority":"repository-contract","evidence_refs":["templates/okf/package.json","templates/okf/DEPLOYMENT-RUNBOOK.md"]},"body":"\n# Static install verification\n\nResolve the exact Git root and active hook, verify any chained predecessor,\ncompare installed artifacts and executable modes to the canonical template,\nconfirm parser/runtime/schema hashes and preserved controls, and prove no\nparent-workspace call, runtime fetch, scheduler, service, Factory task, or\nbackground artifact exists. Portable search must work without `.okf`; semantic\ncommands must fail closed when their local runtime is unavailable.\n\n# Combined contract suite\n\nRun the canonical aggregate suite serially. It covers schema and generated\nvalidator parity, parser, linter, capture quality/override, inbox status and\ntriage, bounded run safety, curator preflight/staging/postflight/failure/resume,\ntyped viewer, semantic query plus portable fallback, reversible archive and\nrollback, manual cadence observation, runtime packaging, and fresh/reinstall\ninstaller behavior.\n\nFailure scenarios include unsafe roots/symlinks, malformed YAML, duplicate IDs\nand tags, unresolved relationships, raw/oversized capture bodies, live/stale\nlocks, kill switch, quotas, cancellation, changed resume inputs, invalid staged\noutput, postflight failure, archive partial states, and parser-unavailable\nfallback. Reports and warnings must not copy raw secret-bearing input.\n\n# Operational canaries\n\nUse frozen tracked snapshots for small `designs`, medium active-project, and\nbounded large-backlog datasets. Record exact source revisions and hashes,\ndeclared ceilings, source preservation, strict validation, retrieval,\nusefulness/yield, runtime/CPU/disk/generated bytes, one session/concurrent run,\nfailure recovery, operator intervention, and live-root non-mutation. D7 then\nevaluates the hashed reports over a defined manual observation window. No\nsuccessful snapshot authorizes a live mutation or broader rollout.\n\n# Completion boundary\n\nDeployment is complete only when the aggregate suite, installer fixture,\noperational canaries, cadence observation, Git diff checks, and contract audit\nare green. Broader adoption is a separate explicit approve/revise/stop decision;\nno hosted deployment is implied.\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/workflow-guide.md","content":"---\ntype: Process\ntitle: Workflow Guide\ndescription: HTML-based operating model for planning, staged verification, Dev UAT, QA application readiness, CI/CD authority, production approval, and closeout\nresource: ./docs/workflow-guide/index.html\ntags: [designs, workflow, guide, html, operating-model, planning, approvals, verification, dev-uat, ci-cd, qa]\ntimestamp: 2026-07-13T03:35:53Z\nstatus: active\n---\n\n# Workflow Guide\n\n## Overview\n\nThe workflow guide is a persistent HTML operating model hosted on GitHub Pages at `https://holovkat.github.io/designs/workflow-guide/`. It is the canonical detailed operating model for planning, staged T1-T5 verification, Dev UAT, QA application readiness, CI/CD authority, production approval, and closeout.\n\n## Structure\n\nThe guide is a single-page HTML application with:\n- Topbar with brand, navigation tabs (Workflow, Install, README, Source), theme toggle, and contents drawer\n- Sidebar drawer with section navigation cards\n- Main content area with scrollable sections\n\n## Sections\n\nThe guide covers these workflow areas:\n\n| Section | Description |\n|---------|-------------|\n| Overview | Generic operating model and document roles |\n| Installation | Install commands and skills globally or inside a project |\n| Commands | Reference workflow commands and expected outputs |\n| Intent Confidence | Infer the next step before asking process questions |\n| Planning Intake | Choose the planning entrypoint for the work type |\n| Planning Decomposition | Convert intent into issues, tasks, and checklist mirrors |\n| Approval Gates | (and subsequent sections for the full lifecycle) |\n| Dev UAT and QA Readiness | Separates sprint or epic functional acceptance in Dev from full application regression in canonical QA |\n\n## Related Pages\n\n- `install.html` - Instructions and common prompt for installing commands and skills\n- `assets/workflow.css` - Stylesheet\n- `assets/workflow.js` - JavaScript functionality\n\n## GitHub Pages\n\nThe README serves as the GitHub index. The rendered Pages site redirects to the workflow guide. The guide is the source of truth for the full operating model.\n\n## Related Concepts\n\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Install Session Workflows](./install-session-workflows.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Documentation-First Approach](../decisions/documentation-first-approach.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"Workflow Guide","description":"HTML-based operating model for planning, staged verification, Dev UAT, QA application readiness, CI/CD authority, production approval, and closeout","resource":"./docs/workflow-guide/index.html","tags":["designs","workflow","guide","html","operating-model","planning","approvals","verification","dev-uat","ci-cd","qa"],"timestamp":"2026-07-13T03:35:53Z","status":"active"},"body":"\n# Workflow Guide\n\n## Overview\n\nThe workflow guide is a persistent HTML operating model hosted on GitHub Pages at `https://holovkat.github.io/designs/workflow-guide/`. It is the canonical detailed operating model for planning, staged T1-T5 verification, Dev UAT, QA application readiness, CI/CD authority, production approval, and closeout.\n\n## Structure\n\nThe guide is a single-page HTML application with:\n- Topbar with brand, navigation tabs (Workflow, Install, README, Source), theme toggle, and contents drawer\n- Sidebar drawer with section navigation cards\n- Main content area with scrollable sections\n\n## Sections\n\nThe guide covers these workflow areas:\n\n| Section | Description |\n|---------|-------------|\n| Overview | Generic operating model and document roles |\n| Installation | Install commands and skills globally or inside a project |\n| Commands | Reference workflow commands and expected outputs |\n| Intent Confidence | Infer the next step before asking process questions |\n| Planning Intake | Choose the planning entrypoint for the work type |\n| Planning Decomposition | Convert intent into issues, tasks, and checklist mirrors |\n| Approval Gates | (and subsequent sections for the full lifecycle) |\n| Dev UAT and QA Readiness | Separates sprint or epic functional acceptance in Dev from full application regression in canonical QA |\n\n## Related Pages\n\n- `install.html` - Instructions and common prompt for installing commands and skills\n- `assets/workflow.css` - Stylesheet\n- `assets/workflow.js` - JavaScript functionality\n\n## GitHub Pages\n\nThe README serves as the GitHub index. The rendered Pages site redirects to the workflow guide. The guide is the source of truth for the full operating model.\n\n## Related Concepts\n\n- [Planning Decomposition](./planning-decomposition.md)\n- [Delivery Lifecycle](./delivery-lifecycle.md)\n- [Install Session Workflows](./install-session-workflows.md)\n- [Implementation Checklist](./implementation-checklist.md)\n- [Documentation-First Approach](../decisions/documentation-first-approach.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"process/workos-auth-integration.md","content":"---\ntype: Process\ntitle: WorkOS Auth Integration\ndescription: WorkOS authentication with SSO, AuthKit, OAuth, Magic Link, session management, and multi-tenant support\nresource: ./templates/instructional-documents/work-os-auth.md\ntags: [designs, workos, authentication, sso, oauth, authkit, session, multi-tenant]\ntimestamp: 2026-06-29T14:30:00Z\nstatus: active\n---\n\n# WorkOS Auth Integration\n\n## Overview\n\nWorkOS provides enterprise-ready authentication with support for SAML, OAuth, and Magic Link.\n\n## Setup\n\n1. Create WorkOS account and get API Key and Client ID\n2. Configure redirect URI (e.g., `http://localhost:3000/callback`)\n3. Set environment variables: `WORKOS_API_KEY`, `WORKOS_CLIENT_ID`, `WORKOS_REDIRECT_URI`\n4. Install: `npm install @workos-inc/node`\n\n## Backend Implementation\n\n### Authorization URL Endpoint\nGenerates SSO login URL with provider selection (authkit, GoogleOAuth, MicrosoftOAuth, etc.).\n\n### Callback Endpoint\nExchanges authorization code for user profile via `authenticateWithCode`. Stores user session with user ID and access token.\n\n### Logout Endpoint\nDestroys session and redirects to home.\n\n### Route Protection Middleware\n`requireAuth` middleware verifies access token and gets user. Applied to protected routes.\n\n## Frontend Implementation\n\n- Login button redirects to backend login endpoint\n- `getCurrentUser` fetches user with credentials included\n- Logout calls backend logout endpoint\n\n## SSO Connection Types\n\n- **Magic Link** (Passwordless): Enable in dashboard, configure email settings\n- **Google OAuth**: Enable, add Google OAuth credentials\n- **SAML SSO** (Enterprise): Create organization, add SAML connection, provide connection details\n\n## Session Management\n\n### Express Session\n- `express-session` with secure, httpOnly cookies\n- 24-hour max age\n- `secure: process.env.NODE_ENV === 'production'`\n\n### JWT Tokens\n- `jsonwebtoken` for stateless sessions\n- httpOnly cookie for token storage\n\n## Advanced Features\n\n### Multi-Tenant Support\nPass `organization` ID for specific tenant in authorization URL.\n\n### Role-Based Access Control (RBAC)\nCheck user roles from WorkOS. `requireRole` middleware for role-protected routes.\n\n### Webhooks for User Events\nHandle `user.created`, `user.deleted` events via WorkOS webhooks.\n\n## Security Best Practices\n\n1. Always use HTTPS in production\n2. Store API keys securely, never commit to version control\n3. Validate redirect URIs (whitelist allowed callbacks)\n4. Use httpOnly cookies for session tokens\n5. Implement CSRF protection for state parameters\n6. Set appropriate session timeouts\n7. Validate tokens on every request to protected routes\n\n## Production Checklist\n\n- Move from test to production API keys\n- Update redirect URIs to production URLs\n- Enable HTTPS\n- Set up proper session management\n- Configure webhook endpoints\n- Set up monitoring and error tracking\n- Test all SSO providers\n\n## Related Concepts\n\n- [Convex Self-Hosted Setup](./convex-self-hosted.md)\n- [Stripe Payment Integration](./stripe-payment-integration.md)\n- [Deployment Guide](./deployment-guide.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"Process","title":"WorkOS Auth Integration","description":"WorkOS authentication with SSO, AuthKit, OAuth, Magic Link, session management, and multi-tenant support","resource":"./templates/instructional-documents/work-os-auth.md","tags":["designs","workos","authentication","sso","oauth","authkit","session","multi-tenant"],"timestamp":"2026-06-29T14:30:00Z","status":"active"},"body":"\n# WorkOS Auth Integration\n\n## Overview\n\nWorkOS provides enterprise-ready authentication with support for SAML, OAuth, and Magic Link.\n\n## Setup\n\n1. Create WorkOS account and get API Key and Client ID\n2. Configure redirect URI (e.g., `http://localhost:3000/callback`)\n3. Set environment variables: `WORKOS_API_KEY`, `WORKOS_CLIENT_ID`, `WORKOS_REDIRECT_URI`\n4. Install: `npm install @workos-inc/node`\n\n## Backend Implementation\n\n### Authorization URL Endpoint\nGenerates SSO login URL with provider selection (authkit, GoogleOAuth, MicrosoftOAuth, etc.).\n\n### Callback Endpoint\nExchanges authorization code for user profile via `authenticateWithCode`. Stores user session with user ID and access token.\n\n### Logout Endpoint\nDestroys session and redirects to home.\n\n### Route Protection Middleware\n`requireAuth` middleware verifies access token and gets user. Applied to protected routes.\n\n## Frontend Implementation\n\n- Login button redirects to backend login endpoint\n- `getCurrentUser` fetches user with credentials included\n- Logout calls backend logout endpoint\n\n## SSO Connection Types\n\n- **Magic Link** (Passwordless): Enable in dashboard, configure email settings\n- **Google OAuth**: Enable, add Google OAuth credentials\n- **SAML SSO** (Enterprise): Create organization, add SAML connection, provide connection details\n\n## Session Management\n\n### Express Session\n- `express-session` with secure, httpOnly cookies\n- 24-hour max age\n- `secure: process.env.NODE_ENV === 'production'`\n\n### JWT Tokens\n- `jsonwebtoken` for stateless sessions\n- httpOnly cookie for token storage\n\n## Advanced Features\n\n### Multi-Tenant Support\nPass `organization` ID for specific tenant in authorization URL.\n\n### Role-Based Access Control (RBAC)\nCheck user roles from WorkOS. `requireRole` middleware for role-protected routes.\n\n### Webhooks for User Events\nHandle `user.created`, `user.deleted` events via WorkOS webhooks.\n\n## Security Best Practices\n\n1. Always use HTTPS in production\n2. Store API keys securely, never commit to version control\n3. Validate redirect URIs (whitelist allowed callbacks)\n4. Use httpOnly cookies for session tokens\n5. Implement CSRF protection for state parameters\n6. Set appropriate session timeouts\n7. Validate tokens on every request to protected routes\n\n## Production Checklist\n\n- Move from test to production API keys\n- Update redirect URIs to production URLs\n- Enable HTTPS\n- Set up proper session management\n- Configure webhook endpoints\n- Set up monitoring and error tracking\n- Test all SSO providers\n\n## Related Concepts\n\n- [Convex Self-Hosted Setup](./convex-self-hosted.md)\n- [Stripe Payment Integration](./stripe-payment-integration.md)\n- [Deployment Guide](./deployment-guide.md)\n","diagnostics":[],"hasFrontmatter":true}},{"filepath":"state/current-state.md","content":"---\ntype: State\nid: okf-6a9b0d2e-7f31-4c85-9a26-1d4e8b703c52\ntitle: OKF System Current State\ndescription: Current accepted OKF semantic guardrails, bounded curation tooling, manual cadence, distribution, and rollout boundary\nresource: templates/okf/OKF-STANDARD.md\ntags: [okf, state, semantic-guardrails, bounded-curation, validation, manual-cadence]\ntimestamp: 2026-08-08T08:21:55Z\nstatus: active\n---\n\n# OKF System Current State\n\n## Canonical Model\n\nOKF remains a repository-local Markdown/YAML knowledge system with Git as the\ncanonical history. The accepted `okf-core/1.0` application profile is additive:\nexisting bundles can be audited in warning mode, while new or curated outputs\ncan opt into strict enforcement. JSON-LD/RDF/SHACL remain deferred and no\nexternal knowledge service is required.\n\n## Accepted Tooling\n\n- A versioned JSON Schema, generated local validator, shared pinned YAML parser,\n  warning/strict migration modes, extension rules, stable concept IDs, six typed\n  relationship predicates, provenance, evidence, and assertion-state fields.\n- A linter that checks schema, frontmatter, directory/type alignment, body\n  sections, resources, relationship resolution, controlled lifecycle values,\n  project extensions, and physical confinement for both bundle roots and\n  existing local resource targets without rewriting retained records.\n- Tier 1 post-commit capture with normalized tags, generated provenance, one\n  record per ordinary commit, compact Git-reference notices for unsafe or\n  repeated content, physical knowledge/inbox/index confinement, and a\n  non-destructive explicit override.\n- A typed relationship viewer and semantic query command, both using the pinned\n  local parser, while preserving Markdown backlinks and the portable grep\n  fallback for basic search.\n- Read-only inbox status and triage commands plus a reversible archive workflow\n  with reviewed manifests, byte-preserving moves, receipts, exact index\n  snapshots, rollback, write-once attempt reports, and no permanent-delete path.\n- A repository-scoped curator with explicit sorted selection, item/input/control/\n  generated/runtime/session ceilings, physical-root confinement, locking, kill\n  switch, cancellation, checkpoints, deterministic planning, recoverable\n  staging, strict concept plus maintenance validation, transactional rollback,\n  and explicit resume.\n- A manual-explicit cadence status/observer. It never starts the curator,\n  schedules work, polls, retries, or grants execution authority.\n\n## Verification State\n\nThe complete schema/parser/linter/query/viewer/status/triage/archive/run-safety/\ncuration/cadence/installer/hook suite passed on 2026-08-08. Four isolated Epic\n#26 samples also passed:\n\n- D3 `designs`: one selected record produced one strict, retrievable concept.\n- D4 `fmsmercury`: deliberately invalid output stopped at staging and retained\n  its source; a new reviewed run completed.\n- D5 `fms-glm`: a controlled interruption after one source move restored the\n  pending source and bounded output set; explicit resume completed without\n  duplication and preserved all three inputs.\n- D7 control: an active repository-local kill switch blocked an identical\n  check-only request, restoration was byte-identical, and the request was then\n  permitted without starting a curator.\n\nThe evidence-bound observation processed five records into three useful\nconcepts (`curation_yield = 0.6`) with zero violations. Maxima were 5 seconds\nruntime, 945 ms CPU for one sample, 138,938 bytes disk growth, one session, and\none concurrent executor; the complete legacy-date audit found a 39-day oldest\ninbox age. Every live source repository fingerprint and every unselected\nsnapshot manifest remained unchanged. Version-1 evidence uses a closed field\nvocabulary, so an unexpected short or nested string cannot bypass the raw\ninbox-content boundary.\n\nThe generated 87-record viewer was also exercised in Chromium against its exact\nSHA-256. It visibly rendered all six predicate legend entries, two typed graph\nedges, relationship details and target navigation, 56 diagnostic rows, the\ninteractive graph canvas, and eight type filters without console, page, or\nrequest failures.\n\n## Distribution State\n\n`templates/okf/install-okf.sh` distributes the accepted offline command/library/\nschema/runtime/viewer/hook/curator surface, read-only canonical documentation,\nrepository-local control defaults, the curator contract, and an `AGENTS.md`\nreview proposal. It preserves existing project-local controls and instructions,\ndoes not install the operational canary harness, and does not create a scheduler\nor Factory/Claude harness.\n\nThe canonical OKF skill is synchronized through `agent-skill-distro`; shared,\nCodex, Claude, Pi, Agents, and installed copies matched the canonical SHA-256 on\n2026-08-08. The distribution audit reported zero skill errors or warnings. The\nexternal distro was already dirty on an unrelated branch, so its scoped commit\nremains a separate source-control handoff rather than an inferred mutation.\n\n## Current Operating Boundary\n\nThe approved cadence remains explicit, manual, and repository-scoped. A status\nreview cannot launch curation. Each mutating batch requires a separate operator\nrequest with an exact root, revision, selection, identity, limits, expected\noutcome, and recovery plan.\n\nThe pre-existing external cron-server path is also fail-closed: every configured\nOKF curator job is disabled, the unloaded LaunchAgent label is explicitly\ndisabled, no cron-server process exists, and the live crontab contains no OKF\nentry. The LaunchAgent file remains in place only as reversible historical\nconfiguration; it does not grant cadence authority.\n\nThe E5 cross-project review records **STOP broader live-project adoption**.\nFrozen canaries prove bounded behavior and recovery but do not measure sustained\npost-adoption inbox growth. No live external bundle, schedule, profile mode,\n`AGENTS.md`, or deployment was changed by the canaries. A future project rollout\nrequires its own warning-mode audit and explicit operator decision.\n\n## Related Concepts and Evidence\n\n- [Curation Cadence and First Decision Gate](../decisions/curation-cadence-first-decision-gate.md)\n- [Bounded Curation Execution Safety Requirements](../decisions/bounded-curation-execution-safety.md)\n- [Capture Routing and Explicit Curation Trigger](../decisions/capture-routing-and-curation-trigger.md)\n- [Two-Tier Inbox Capture Cadence](../process/two-tier-inbox-cadence.md)\n- [Epic #26 D7 Observation Report](../../docs/epic-26/evidence/d7-observation-report.json)\n- [Epic #26 E3 Distribution Sync Evidence](../../docs/epic-26/evidence/e3-distribution-sync.json)\n- [Epic #26 External Scheduler Disable Evidence](../../docs/epic-26/evidence/e5-scheduler-disable.json)\n- [Epic #26 C8 Real-Browser Viewer Evidence](../../docs/epic-26/evidence/c8-browser-viewer.json)\n- [Epic #26 Final Test Transcript](../../docs/epic-26/evidence/tests/full-suite-2026-08-08.txt)\n- [Epic #26 E5 Rollout Review](../../docs/epic-26/e5-cross-project-rollout-review.md)\n","parsed":{"parser":"okf-c7","frontmatter":{"type":"State","id":"okf-6a9b0d2e-7f31-4c85-9a26-1d4e8b703c52","title":"OKF System Current State","description":"Current accepted OKF semantic guardrails, bounded curation tooling, manual cadence, distribution, and rollout boundary","resource":"templates/okf/OKF-STANDARD.md","tags":["okf","state","semantic-guardrails","bounded-curation","validation","manual-cadence"],"timestamp":"2026-08-08T08:21:55Z","status":"active"},"body":"\n# OKF System Current State\n\n## Canonical Model\n\nOKF remains a repository-local Markdown/YAML knowledge system with Git as the\ncanonical history. The accepted `okf-core/1.0` application profile is additive:\nexisting bundles can be audited in warning mode, while new or curated outputs\ncan opt into strict enforcement. JSON-LD/RDF/SHACL remain deferred and no\nexternal knowledge service is required.\n\n## Accepted Tooling\n\n- A versioned JSON Schema, generated local validator, shared pinned YAML parser,\n  warning/strict migration modes, extension rules, stable concept IDs, six typed\n  relationship predicates, provenance, evidence, and assertion-state fields.\n- A linter that checks schema, frontmatter, directory/type alignment, body\n  sections, resources, relationship resolution, controlled lifecycle values,\n  project extensions, and physical confinement for both bundle roots and\n  existing local resource targets without rew state of the designs project's own content including templates, guides, UI/UX patterns, infrastructure docs, and skill distribution\nresource: ./README.md\ntags: [designs, state, content, templates, guides, ui-ux, infrastructure, skills, distribution]\ntimestamp: 2026-08-08T08:19:17Z\nstatus: active\n---\n\n# Designs Project Content State\n\n## Overview\n\nThe designs repository is a documentation-first collection of reusable project-design templates, agent workflow commands, project-local skills, and delivery operating model guidance. This concept documents the state of the project's own content (separate from the OKF system state).\n\n## What Exists\n\n### README and Top-Level\n- README.md with project overview, planning decomposition mermaid diagram, delivery lifecycle mermaid diagram, and repository structure\n- AGENTS.md with OKF knowledge bundle instructions\n- GitHub Pages site at `https://holovkat.github.io/designs/`\n\n### Workflow Guide (docs/workflow-guide/)\n- `index.html` - HTML operating model covering overview, installation, commands, intent confidence, planning, staged verification, Dev UAT, QA application readiness, approval gates, and release governance\n- `install.html` - Installation instructions page\n- `assets/workflow.css` and `assets/workflow.js` - Supporting assets\n- `docs/superpowers/` - Plans and specs subdirectories (minimal content)\n\n### Templates Area\n- **AGENTS.md** - Templates area agent instructions with DESIGN.md authoring guidance and Graphite stacking workflow\n- **DESIGN.template.md** - Starter template for spec-compliant DESIGN.md files\n- **Frontend-Technical-Functional-Requirements-Document-TFD.md** - TFD template and standards\n- **index.md** - Templates index\n\n### Instructional Documents (templates/instructional-documents/)\n- **AGENTS.md** - Area-specific agent instructions with DESIGN.md authoring guidance\n- **index.md** - Index of all instructional documents\n- **github-workflow.md** - Complete Graphite stacking workflow guide with squash merge requirements\n- **github-usage-system-prompt.md** - System prompt for Git/GitHub workflow\n- **deployment-guide.md** - Dual-environment deployment (Vercel + Dokku on Hetzner)\n- **architecture.md** - Core architecture \"sidecar\" model guide\n- **stripe-payment-gateway.md** - Stripe integration with Convex-specific lessons\n- **work-os-auth.md** - WorkOS authentication implementation guide\n- **tailwind.md** - Tailwind CSS v4 usage rules\n- **ux_design_standards.md** - shadcn/ui with Tailwind v4 design system guidelines\n- **upgrade-template.md** - Upstream release alignment template\n- **close_out_items_shipping.md** - Post-enhancement ship flow checklist\n- **kickoff-requirements-spec.md** - Requirements gathering and TFD creation process\n- **generate-claude-agents.md** - CLAUDE.md hierarchy generation guide\n- **generate_agents.md** - AGENTS.md hierarchy generation guide\n- **codex-global-planning-agents.md** - Planning agent pack contract\n- **codex-global-builder-agents.md** - Builder agent pack contract\n- **skill-governance.md** - Ownership boundary between designs, agent-skill-distro, projects, and installed roots; deterministic audit/quarantine policy; T1-T5 verification stages\n- **convex-self-hosted-quickref.md** - Convex self-hosted quick reference\n- **convex-self-hosted-setup.md** - Full Convex self-hosted infrastructure documentation\n- **commands/** - 18 slash command templates and scripts (plan-review and release-assess are now thin pointers to their canonical SKILL.md files)\n- **skills/** - 6 project-local skills (okf, plan-review, release-assess, vibe-fix, worktree-session-lifecycle, worktree-toolkit-init). See [Workflow Skill Canonicalisation](../decisions/skill-canonicalisation.md).\n- **hooks/** - 8 git hooks with settings.json files\n- **scripts/** - 10 shell scripts for release vectors, worktree session management, and skill distribution sync (`sync-skill-distro.sh`)\n- **worktrees/** - Worktree session guidan         } else if (seenTargets.has(targetValue)) {
          code = 'duplicate-relationship-target'; message = 'The same target is declared more than once for this predicate.';
        } else if (!PERMANENT_TYPES.has(source.type) || source.identityState !== 'valid') {
          code = 'invalid-relationship-source'; message = 'A typed edge requires one unique, valid stable ID on its source concept.';
        } else if (targetValue === source.stableId) {
          code = 'self-relationship'; message = 'Self-edges are invalid for OKF typed relationships.';
        } else {
          const matches = stableIdMap.get(targetValue) || [];
          if (matches.length === 0) { code = 'unresolved-relationship-target'; message = 'No concept in this bundle declares this target ID.'; }
          else if (matches.length > 1) { code = 'ambiguous-relationship-target'; message = 'More than one concept declares this target ID.'; }
          else if (!PERMANENT_TYPES.has(matches[0].type)) { code = 'invalid-relationship-target-type'; message = 'Inbox records are not permanent concept relationship targets.'; }
          else {
            relation.target = matches[0]; relation.state = 'resolved'; relation.resolution = 'resolved';
          }
        }
        seenTargets.add(typeof targetValue === 'string' ? targetValue : targetLiteral);
        if (code) {
          const legacyWarning = code === 'legacy-supersedes-ambiguous';
          relation.state = legacyWarning ? 'warning' : 'invalid'; relation.resolution = code;
          warnings.push(relationshipWarning(code, source, predicate, targetValue, message, legacyWarning ? 'warning' : 'error'));
        }
      }
    }
  }

  const contradictionPairs = new Map();
  for (const relation of typedRelationships.filter(item => item.state === 'resolved')) {
    if (relation.predicate === 'contradicts') {
      const pair = [relation.sourceStableId, relation.targetStableId].sort().join('|');
      if (contradictionPairs.has(pair)) {
        relation.state = 'warning'; relation.resolution = 'redundant-symmetric-relationship';
        warnings.push(relationshipWarning('redundant-symmetric-relationship', relation.source, relation.predicate, relation.targetStableId, 'contradicts is symmetric; the reverse declaration is redundant.', 'warning'));
        continue;
      }
      contradictionPairs.set(pair, relation);
    }
    graphTypedRelationships.push(relation);
  }

  for (const predicate of RELATIONSHIP_PREDICATES.filter(name => RELATIONSHIP_DEFINITIONS[name].cycle)) {
    const relations = graphTypedRelationships.filter(relation => relation.predicate === predicate);
    for (const component of cycleComponents(relations)) {
      const members = new Set(component);
      for (const relation of relations.filter(item => members.has(item.sourceStableId) && members.has(item.targetStableId))) {
        const isInvalid = RELATIONSHIP_DEFINITIONS[predicate].cycle === 'invalid';
        relation.state = isInvalid ? 'invalid' : 'warning';
        relation.resolution = isInvalid ? 'invalid-cycle' : 'blocked-by-cycle';
        warnings.push(relationshipWarning(relation.resolution, relation.source, predicate, relation.targetStableId, `Cycle includes ${component.join(' -> ')}.`, isInvalid ? 'error' : 'warning'));
      }
    }
  }

  for (const relation of graphTypedRelationships) relation.target.typedInbound.push(relation);

  const markdownLinks = [];
  const backlinks = new Map();
  for (const concept of concepts) {
    for (const link of concept.links) {
      const target = pathMap.get(link.targetPathId);
      if (target) {
        markdownLinks.push({ kind: 'citation', source: concept.graphId, target: target.graphId, sourceConcept: concept, targetConcept: target });
        if (!backlinks.has(target.pathId)) backlinks.set(target.pathId, []);
        backlinks.get(target.pathId).push(concept.pathId);
      }
    }
  }
  for (const concept of concepts) concept.backlinks = [...new Set(backlinks.get(concept.pathId) || [])].sort();

  const predicateOrder = new Map(RELATIONSHIP_PREDICATES.map((predicate, index) => [predicate, index]));
  warnings.sort((left, right) => left.sourcePath.localeCompare(right.sourcePath) ||
    (predicateOrder.get(left.predicate) ?? 99) - (predicateOrder.get(right.predicate) ?? 99) ||
    left.target.localeCompare(right.target) || left.code.localeCompare(right.code));
  const typedLinks = graphTypedRelationships.map(relation => ({ kind: 'typed', source: relation.source.graphId, target: relation.target.graphId, relation }));
  return { concepts, links: [...markdownLinks, ...typedLinks], warnings, typedRelationships };
}

function processConcepts(items) {
  const analysis = analyseConceptItems(items);
  allConcepts = analysis.concepts;
  allLinks = analysis.links;
  allWarnings = analysis.warnings;
  return analysis;
}

async function readDirectory(dirHandle, prefix = '') {
  const results = [];
  for await (const [name, handle] of dirHandle.entries()) {
    if (name === 'index.md' || name === 'log.md' || name.startsWith('.') || name.endsWith('.html') || name.endsWith('.js')) continue;
    const p = prefix ? prefix + '/' + name : name;
    if (handle.kind === 'directory') { results.push(...await readDirectory(handle, p)); }
    else if (name.endsWith('.md')) { results.push({ filepath: p, content: await (await handle.getFile()).text() }); }
  }
  return results;
}

async function loadFolder(dirHandle) {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('folder-btn').disabled = true;
  try {
    const items = await readDirectory(dirHandle);
    processConcepts(items);
    onDataLoaded();
  } catch (err) { alert('Error: ' + err.message); }
  finally { document.getElementById('loading').style.display = 'none'; }
}

function onDataLoaded() {
  renderTree();
  renderGraph();
  renderFilters();
  renderWarnings();
  renderGraphLegend();
  const citationCount = allLinks.filter(link => link.kind === 'citation').length;
  const typedCount = allLinks.filter(link => link.kind === 'typed').length;
  document.getElementById('stats').textContent = `${allConcepts.length} concepts | ${citationCount} citations | ${typedCount} typed edges${allWarnings.length ? ` | ${allWarnings.length} warnings` : ''}`;
  document.getElementById('folder-btn').textContent = allConcepts.length + ' loaded';
  document.getElementById('folder-btn').disabled = true;
}

function renderWarnings() {
  const panel = document.getElementById('warnings-panel');
  const list = document.getElementById('warnings-list');
  const summary = document.getElementById('warnings-summary');
  panel.classList.toggle('visible', allWarnings.length > 0);
  if (allWarnings.length === 0) { list.innerHTML = ''; return; }
  const errors = allWarnings.filter(warning => warning.severity === 'error').length;
  panel.open = errors > 0;
  summary.textContent = `Relationship and parser diagnostics (${allWarnings.length}; ${errors} invalid)`;
  list.innerHTML = allWarnings.map((warning, index) => `<button class="warning-row" data-warning-index="${index}">
    <span>${escapeHtml(warning.sourcePath)}<span class="warning-source-id">${escapeHtml(warning.sourceId)}</span></span>
    <span class="warning-code">${escapeHtml(warning.predicate || warning.code)}</span>
    <span class="warning-target">${escapeHtml(warning.target || '(no target)')}</span>
    <span><span class="warning-code">${escapeHtml(warning.code)}</span> — ${escapeHtml(warning.message)}</span>
  </button>`).join('');
  list.querySelectorAll('.warning-row').forEach(button => {
    button.onclick = () => {
      const warning = allWarnings[Number(button.dataset.warningIndex)];
      const concept = allConcepts.find(candidate => candidate.filepath === warning.sourcePath);
      if (!concept) return;
      const panelId = currentView === 'graph' ? 'graph-detail' : 'detail';
      showDetail(concept, panelId);
      if (cy) cy.getElementById(concept.graphId).select();
    };
  });
}

function renderGraphLegend() {
  const legend = document.getElementById('graph-legend');
  legend.innerHTML = [
    `<span class="legend-item"><span class="legend-line" style="--edge-color:#484f58"></span>citation</span>`,
    ...RELATIONSHIP_PREDICATES.map(predicate => {
      const definition = RELATIONSHIP_DEFINITIONS[predicate];
      return `<span class="legend-item"><span class="legend-line ${definition.lineStyle}" style="--edge-color:${definition.color}"></span>${predicate}</span>`;
    })
  ].join('');
}

/* ---- Folder Tree ---- */
function renderTree() {
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  const grouped = {};
  for (const c of allConcepts) {
    const dir = c.filepath.includes('/') ? c.filepath.split('/')[0] : 'root';
    if (!grouped[dir]) grouped[dir] = [];
    grouped[dir].push(c);
  }
  const search = document.getElementById('search').value.toLowerCase();
  for (const dir of DIR_ORDER) {
    const concepts = (grouped[dir] || []).filter(concept => conceptMatchesSearch(concept, search));
    if (concepts.length === 0) continue;
    const typeLabel = dir.charAt(0).toUpperCase() + dir.slice(1);
    const color = TYPE_COLORS[typeLabel] || '#8b949e';

    const dirEl = document.createElement('div');
    dirEl.className = 'tree-dir';
    dirEl.innerHTML = `<span class="arrow">▼</span><span class="dir-dot" style="background:${color}"></span>${typeLabel}<span class="dir-count">${concepts.length}</span>`;
    dirEl.onclick = () => {
      dirEl.classList.toggle('collapsed');
      filesEl.classList.toggle('collapsed');
    };

    const filesEl = document.createElement('div');
    filesEl.className = 'tree-files';
    for (const c of concepts.sort((a, b) => a.title.localeCompare(b.title))) {
      const fEl = document.createElement('div');
      fEl.className = 'tree-file';
      fEl.dataset.id = c.graphId;
      fEl.textContent = c.title;
      if (c.status === 'deprecated') {
        const marker = document.createElement('span');
        marker.className = 'file-status'; marker.textContent = '○'; fEl.appendChild(marker);
      }
      fEl.onclick = () => {
        document.querySelectorAll('.tree-file').forEach(e => e.classList.remove('active'));
        fEl.classList.add('active');
        showDetail(c, 'detail');
      };
      filesEl.appendChild(fEl);
    }
    tree.appendChild(dirEl);
    tree.appendChild(filesEl);
  }
}

/* ---- Detail Panel ---- */
function resourceLink(resource) {
  if (!resource) return { href: '', conceptPathId: '' };
  if (/^(?:[a-z]+:|#|\/)/i.test(resource)) return { href: resource, conceptPathId: '' };
  const rootRelative = resource.replace(/^\.\//, '');
  const conceptPathId = rootRelative.startsWith('knowledge/') && rootRelative.endsWith('.md')
    ? pathToId(rootRelative.slice('knowledge/'.length)) : '';
  return { href: `../${rootRelative}`, conceptPathId };
}

function relationshipEntry(relation, inverse = false) {
  const label = inverse ? relation.inverse : relation.predicate;
  const related = inverse ? relation.source : relation.target;
  const stateClass = relation.state === 'resolved' ? '' : relation.state;
  const relatedHtml = related
    ? `<a data-path-id="${escapeHtml(related.pathId)}">${escapeHtml(related.title)}</a> <code>${escapeHtml(related.stableId || related.pathId)}</code>`
    : `<code>${escapeHtml(relation.targetLiteral || '(missing)')}</code>`;
  const diagnostic = relation.state === 'resolved' ? '' : ` <span>(${escapeHtml(relation.resolution)})</span>`;
  return `<div class="relationship-entry ${stateClass}"><span class="predicate">${escapeHtml(label)}</span><span>${relatedHtml}${diagnostic}</span></div>`;
}

function typedRelationshipHtml(concept) {
  const outbound = concept.typedOutbound.length
    ? `<div class="relationships"><h3>Typed relationships (${concept.typedOutbound.length})</h3>${concept.typedOutbound.map(relation => relationshipEntry(relation)).join('')}</div>` : '';
  const inbound = concept.typedInbound.length
    ? `<div class="relationships"><h3>Typed backlinks (${concept.typedInbound.length})</h3>${concept.typedInbound.map(relation => relationshipEntry(relation, true)).join('')}</div>` : '';
  return outbound + inbound;
}

function showDetail(concept, targetId) {
  const el = document.getElementById(targetId);
  const fm = concept.frontmatter;
  const fmLines = [];
  if (concept.stableId) fmLines.push(`<div>id: ${escapeHtml(concept.stableId)}</div>`);
  else fmLines.push('<div class="identity-note">id: legacy filepath identity (typed targets cannot resolve to this alias)</div>');
  if (fm.resource) {
    const resolvedResource = resourceLink(concept.resource);
    fmLines.push(`<div>resource: <a href="${escapeHtml(resolvedResource.href)}"${resolvedResource.conceptPathId ? ` data-concept-path="${escapeHtml(resolvedResource.conceptPathId)}"` : ' target="_blank" rel="noopener"'}>${escapeHtml(concept.resource)}</a></div>`);
  }
  if (fm.timestamp) fmLines.push(`<div>timestamp: ${escapeHtml(literalValue(fm.timestamp))}</div>`);
  if (concept.issueRefs.length) fmLines.push(`<div>issue_refs: [${concept.issueRefs.map(escapeHtml).join(', ')}]</div>`);

  const badges = [`<span class="badge type" data-type="${escapeHtml(concept.type)}">${escapeHtml(concept.type)}</span>`];
  if (concept.status && concept.status !== 'active')
    badges.push(`<span class="badge status ${concept.status === 'deprecated' ? 'deprecated' : ''}">${escapeHtml(concept.status)}</span>`);
  if (concept.identityState !== 'valid') badges.push(`<span class="badge status ${concept.identityState === 'invalid' || concept.identityState === 'duplicate' ? 'deprecated' : ''}">${escapeHtml(concept.identityState)} identity</span>`);
  if (concept.parser === 'legacy') badges.push('<span class="badge status">legacy parser fallback</span>');
  if (concept.tags.length) badges.push(...concept.tags.map(tag => `<span class="badge">${escapeHtml(tag)}</span>`));

  const backlinkHtml = concept.backlinks.length ? `
    <div class="backlinks"><h3>Cited by (${concept.backlinks.length})</h3>
    ${concept.backlinks.map(pathId => { const citedBy = allConcepts.find(candidate => candidate.pathId === pathId); return citedBy ? `<a data-path-id="${escapeHtml(pathId)}">${escapeHtml(citedBy.title)}</a>` : ''; }).join('')}
    </div>` : '';

  const conceptWarnings = allWarnings.filter(warning => warning.sourcePath === concept.filepath);
  const diagnosticHtml = conceptWarnings.length ? `<div class="relationships"><h3>Diagnostics (${conceptWarnings.length})</h3>${conceptWarnings.map(warning =>
    `<div class="relationship-entry ${warning.severity === 'error' ? 'invalid' : 'warning'}"><span class="predicate">${escapeHtml(warning.code)}</span><span>${escapeHtml(warning.message)}${warning.target ? ` <code>${escapeHtml(warning.target)}</code>` : ''}</span></div>`).join('')}</div>` : '';

  const renderedBody = typeof marked !== 'undefined' ? marked.parse(concept.body) : `<pre>${escapeHtml(concept.body)}</pre>`;

  el.innerHTML = `<div class="content">
    <h2>${escapeHtml(concept.title)}</h2>
    <div class="meta">${badges.join('')}</div>
    ${fmLines.length ? `<div class="frontmatter">${fmLines.join('')}</div>` : ''}
    <div class="body">${renderedBody}</div>
    ${typedRelationshipHtml(concept)}
    ${backlinkHtml}
    ${diagnosticHtml}
  </div>`;

  // Attach relationship/backlink click handlers first (before mermaid, which can throw).
  el.querySelectorAll('[data-path-id], [data-concept-path]').forEach(a => {
    a.onclick = (e) => {
      e.preventDefault();
      const pathId = a.dataset.pathId || a.dataset.conceptPath;
      const related = allConcepts.find(candidate => candidate.pathId === pathId);
      if (related) { showDetail(related, targetId); if (cy) cy.getElementById(related.graphId).select(); }
    };
  });

  // Markdown remains filepath-relative navigation and is independent of stable IDs.
  el.querySelectorAll('.body a[href]').forEach(a => {
    const href = a.getAttribute('href');
    const resolvedPathId = resolveMarkdownPath(href, concept.filepath);
    const related = allConcepts.find(candidate => candidate.pathId === resolvedPathId);
    if (!related) return;
    a.onclick = (e) => {
      e.preventDefault();
      showDetail(related, targetId);
      if (cy) cy.getElementById(related.graphId).select();
    };
  });

  // Render mermaid diagrams (wrapped in try-catch so errors don't break navigation)
  try {
    el.querySelectorAll('pre code').forEach((codeEl, i) => {
      const text = codeEl.textContent.trim();
      if (text.startsWith('erDiagram') || text.startsWith('flowchart') || text.startsWith('graph') || text.startsWith('sequenceDiagram')) {
        const pre = codeEl.parentElement;
        const div = document.createElement('div');
        div.className = 'mermaid';
        div.id = 'mermaid-' + Date.now() + '-' + i;
        div.textContent = text;
        pre.replaceWith(div);
      }
    });
    const mermaidNodes = el.querySelectorAll('.mermaid');
    if (mermaidNodes.length > 0 && typeof mermaid !== 'undefined') {
      mermaid.run({ nodes: mermaidNodes }).catch(() => {});
    }
  } catch (e) { /* mermaid not loaded or render error - ignore */ }

  el.scrollTop = 0;
}

/* ---- Graph ---- */
function renderGraph() {
  if (typeof cytoscape === 'undefined') {
    document.getElementById('cy').innerHTML = '<div class="empty">Graph runtime unavailable. Browse, Markdown backlinks, typed relationships, and diagnostics remain readable.</div>';
    cy = null;
    return;
  }
  const nodes = allConcepts.map(concept => ({ data: {
    id: concept.graphId, label: concept.title.length > 28 ? concept.title.slice(0, 26) + '..' : concept.title,
    type: concept.type, color: TYPE_COLORS[concept.type] || '#8b949e', concept
  } }));
  const edges = allLinks.map((link, index) => {
    const relation = link.relation;
    const definition = relation ? RELATIONSHIP_DEFINITIONS[relation.predicate] : null;
    return { data: {
      id: `edge:${index}`, source: link.source, target: link.target, kind: link.kind,
      predicate: relation ? relation.predicate : 'citation', state: relation ? relation.state : 'resolved',
      color: definition ? definition.color : '#484f58', lineStyle: definition ? definition.lineStyle : 'solid'
    } };
  });
  if (cy) cy.destroy();
  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: [...nodes, ...edges],
    style: [
      { selector: 'node', style: { 'background-color': 'data(color)', 'label': 'data(label)', 'color': '#c9d1d9', 'font-size': '10px', 'text-valign': 'bottom', 'text-halign': 'center', 'text-margin-y': 4, 'width': 22, 'height': 22, 'border-width': 2, 'border-color': '#21262d', 'text-wrap': 'ellipsis', 'text-max-width': '120px' }},
      { selector: 'node:selected', style: { 'border-width': 3, 'border-color': '#f0f6fc', 'width': 28, 'height': 28 }},
      { selector: 'edge', style: { 'width': 1, 'line-color': 'data(color)', 'target-arrow-color': 'data(color)', 'target-arrow-shape': 'triangle', 'curve-style': 'bezier', 'arrow-scale': 0.6, 'line-style': 'data(lineStyle)' }},
      { selector: 'edge[kind = "typed"]', style: { 'width': 2, 'label': 'data(predicate)', 'font-size': '8px', 'color': '#8b949e', 'text-background-color': '#0d1117', 'text-background-opacity': 0.85, 'text-background-padding': 2, 'text-rotation': 'autorotate' }},
      { selector: 'edge[predicate = "contradicts"]', style: { 'target-arrow-shape': 'none' }},
      { selector: 'edge[state = "invalid"]', style: { 'line-color': '#f85149', 'target-arrow-color': '#f85149', 'line-style': 'dashed', 'width': 3 }},
      { selector: 'edge[state = "warning"]', style: { 'line-color': '#d29922', 'target-arrow-color': '#d29922', 'width': 3 }},
      { selector: '.deprecated', style: { 'border-style': 'dashed', 'opacity': 0.5 }}
    ],
    layout: { name: 'cose', animate: true, padding: 40, idealEdgeLength: 80, nodeRepulsion: 8000 }
  });
  cy.nodes().forEach(n => { if (n.data('concept').status === 'deprecated') n.addClass('deprecated'); });
  cy.on('tap', 'node', evt => showDetail(evt.target.data('concept'), 'graph-detail'));
}

function renderFilters() {
  const tb = document.getElementById('toolbar');
  document.querySelectorAll('.filter-btn').forEach(e => e.remove());
  for (const type of [...new Set(allConcepts.map(c => c.type))].sort()) {
    const btn = document.createElement('button');
    btn.className = 'filter-btn active'; btn.dataset.type = type; btn.textContent = type;
    btn.onclick = () => {
      if (activeFilters.has(type)) { activeFilters.delete(type); btn.classList.remove('active'); }
      else { activeFilters.add(type); btn.classList.add('active'); }
      applyFilters();
    };
    tb.insertBefore(btn, document.getElementById('search'));
  }
}

function applyFilters() {
  if (currentView !== 'graph' || !cy) return;
  const s = document.getElementById('search').value.toLowerCase();
  cy.nodes().forEach(n => {
    const c = n.data('concept');
    const tm = activeFilters.size === 0 || activeFilters.has(c.type);
    const sm = conceptMatchesSearch(c, s);
    n.style('display', (tm && sm) ? 'element' : 'none');
  });
  cy.edges().forEach(e => {
    e.style('display', (cy.getElementById(e.data('source')).style('display') !== 'none' && cy.getElementById(e.data('target')).style('display') !== 'none') ? 'element' : 'none');
  });
}

/* ---- Navigation ---- */
function switchView(view) {
  currentView = view;
  document.getElementById('nav-browse').classList.toggle('active', view === 'browse');
  document.getElementById('nav-graph').classList.toggle('active', view === 'graph');
  document.getElementById('browse-view').classList.toggle('active', view === 'browse');
  document.getElementById('graph-view').classList.toggle('active', view === 'graph');
  if (view === 'graph' && cy) cy.resize();
  if (view === 'browse') renderTree();
}

/* ---- Auto-load embedded data ---- */
function loadEmbeddedData() {
  if (typeof __OKF_DATA__ !== 'undefined' && __OKF_DATA__ && Array.isArray(__OKF_DATA__)) {
    processConcepts(__OKF_DATA__);
    onDataLoaded();
  }
}

function initializeViewer() {
  document.getElementById('nav-browse').onclick = () => switchView('browse');
  document.getElementById('nav-graph').onclick = () => switchView('graph');
  document.getElementById('search').oninput = () => {
    if (currentView === 'browse') renderTree();
    else applyFilters();
  };
  document.getElementById('folder-btn').onclick = async () => {
    try { await loadFolder(await window.showDirectoryPicker()); }
    catch (err) { if (err.name !== 'AbortError') alert('Error: ' + err.message); }
  };

  let dragCounter = 0;
  window.addEventListener('dragenter', (event) => { event.preventDefault(); dragCounter++; document.getElementById('drop-zone').style.display = 'flex'; });
  window.addEventListener('dragleave', (event) => { event.preventDefault(); dragCounter--; if (dragCounter === 0) document.getElementById('drop-zone').style.display = 'none'; });
  window.addEventListener('dragover', (event) => event.preventDefault());
  window.addEventListener('drop', async (event) => {
    event.preventDefault(); dragCounter = 0;
    document.getElementById('drop-zone').style.display = 'none';
    const items = event.dataTransfer.items;
    if (items && items.length > 0 && items[0].webkitGetAsEntry) {
      const entry = items[0].webkitGetAsEntry();
      if (entry.isDirectory) {
        try { const handle = await entry.getFilesystemHandle?.(); if (handle) await loadFolder(handle); } catch {}
      }
    }
  });
  loadEmbeddedData();
}

// Deterministic, DOM-free seam used by the fixture test. It is not a mutating API.
globalThis.__OKF_VIEWER_TEST__ = Object.freeze({
  analyseConceptItems, legacyParseFrontmatter, resolveMarkdownPath, resourceLink,
  relationshipPredicates: [...RELATIONSHIP_PREDICATES]
});

if (typeof document !== 'undefined' && typeof window !== 'undefined') initializeViewer();
</script>
